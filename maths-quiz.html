<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="gate.js" data-account></script>
<script type="module" src="src/account.js" data-account></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Maths Quest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e06a1b">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">

<title>Maths Quest: Grade 7 Exam Quiz</title>
<style>
:root{
  --ink:#1f2433; --muted:#626a80; --line:#e3e6ef; --bg:#f4f2ff;
  --g:#17935b; --gl:#e4f6ec; --o:#e06a1b; --ol:#fdeedf; --b:#2c66cf; --bl:#e5eefc;
  --p:#e06a1b; --pl:#fff1e6; --ok:#18a058; --okl:#e3f7ec; --bad:#e04848; --badl:#fde8e8; --y:#ffd84d;
}
*{box-sizing:border-box}
body{margin:0; font-family:"Avenir Next","Nunito","Segoe UI",system-ui,sans-serif; color:var(--ink); background:var(--bg); min-height:100vh;
  background-image:radial-gradient(circle at 10% 10%,#e3dcff 0,transparent 35%),radial-gradient(circle at 90% 80%,#d9ecff 0,transparent 40%)}
button{font:inherit; color:inherit; cursor:pointer}
.wrap{max-width:780px; margin:0 auto; padding:18px 16px 60px}
.hidden{display:none!important}

/* ---------- menu ---------- */
.hero{background:linear-gradient(135deg,#7a2e00,#e06a1b 55%,#f5a54a); color:#fff; border-radius:26px; padding:26px 26px 22px; position:relative; overflow:hidden}
.hero h1{margin:0; font-size:clamp(30px,6vw,46px); font-weight:800; letter-spacing:-.01em}
.hero p{margin:6px 0 0; opacity:.92; font-size:17px}
.hero .atom{position:absolute; right:-10px; top:-10px; font-size:120px; opacity:.12; transform:rotate(15deg)}
.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:18px}
.mode{border:none; text-align:left; border-radius:20px; padding:18px; color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.15); transition:transform .12s, box-shadow .12s; position:relative}
.mode:hover{transform:translateY(-3px); box-shadow:0 9px 0 rgba(0,0,0,.15)}
.mode:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.15)}
.mode .lv{font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.9}
.mode h3{margin:4px 0 4px; font-size:21px}
.mode .meta{font-size:14px; opacity:.95}
.mode .best{margin-top:10px; font-size:13px; font-weight:700; background:rgba(255,255,255,.22); display:inline-block; padding:3px 10px; border-radius:20px}
.mode .emo{position:absolute; right:14px; top:12px; font-size:34px}
.m4{background:linear-gradient(140deg,#17935b,#45c288)} .m5{background:linear-gradient(140deg,#e06a1b,#f5a54a)}
.m9{background:linear-gradient(140deg,#2c66cf,#5aa0f0)} .mb{background:linear-gradient(140deg,#b0207a,#6a45d8)}
.menu-foot{display:flex; justify-content:space-between; align-items:center; margin-top:16px; color:var(--muted); font-size:14px; flex-wrap:wrap; gap:10px}
.resume{margin-top:16px;background:#fff;border-radius:20px;padding:12px 16px 6px;box-shadow:0 6px 18px rgba(80,50,180,.08)}
.resume h3{margin:0 0 6px;font-size:17px;color:#4a2ea6}
.rrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:2px solid var(--line)}
.rrow .rt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.rrow .rt span{font-size:13.5px;color:var(--muted);font-weight:700}
.rrow .go{width:auto;margin:0;padding:10px 16px;font-size:16px;flex:none}
.rx{border:2px solid var(--line);background:#fff;border-radius:12px;width:40px;height:40px;font-weight:800;color:var(--muted);flex:none}
.pill{border:2px solid var(--line); background:#fff; border-radius:30px; padding:7px 14px; font-weight:700; font-size:14px}

/* ---------- HUD ---------- */
.hud{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.hud .home{background:#fff; border:2px solid var(--line); border-radius:14px; padding:6px 10px; font-weight:800}
.bar{flex:1; height:16px; background:#fff; border-radius:20px; overflow:hidden; border:2px solid var(--line)}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,#e06a1b,#f5a54a); border-radius:20px; transition:width .4s}
.stat{background:#fff; border:2px solid var(--line); border-radius:14px; padding:5px 10px; font-weight:800; font-size:15px; white-space:nowrap}
.streak.hot{background:#fff3d6; border-color:#f2b200; animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* ---------- card ---------- */
.card{background:#fff; border-radius:24px; padding:20px 20px 18px; box-shadow:0 10px 30px rgba(60,40,140,.10); position:relative}
.qtop{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.tag{font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:20px}
.t4{background:var(--gl); color:var(--g)} .t5{background:var(--ol); color:var(--o)} .t9{background:var(--bl); color:var(--b)}
.tt{background:var(--pl); color:var(--p)}
.qnum{margin-left:auto; color:var(--muted); font-weight:700; font-size:14px}
.prompt{font-size:21px; font-weight:700; line-height:1.35; margin:4px 0 6px}
.hint{color:var(--muted); font-size:14.5px; margin-bottom:12px}
.img{text-align:center; margin:6px 0 12px}
.img svg{max-width:100%; height:auto}

/* options */
.opts{display:grid; gap:10px}
.opts.grid2{grid-template-columns:1fr 1fr}
@media(max-width:560px){.opts.grid2.text{grid-template-columns:1fr}}
.opt{display:flex; align-items:center; gap:12px; text-align:left; background:#fff; border:2.5px solid var(--line); border-radius:16px; padding:12px 14px; font-size:17px; font-weight:600; transition:transform .1s, border-color .15s, background .15s; box-shadow:0 3px 0 var(--line)}
.opt:hover:not(:disabled){border-color:#b9a8f0; transform:translateY(-1px)}
.opt .k{flex:none; width:32px; height:32px; border-radius:10px; background:var(--pl); color:var(--p); display:flex; align-items:center; justify-content:center; font-weight:800}
.opt.sel{border-color:var(--p); background:var(--pl)}
.opt.ok{border-color:var(--ok); background:var(--okl); box-shadow:0 3px 0 #9fdcbb}
.opt.ok .k{background:var(--ok); color:#fff}
.opt.bad{border-color:var(--bad); background:var(--badl); box-shadow:0 3px 0 #f2b0b0; animation:shake .35s}
.opt.bad .k{background:var(--bad); color:#fff}
.opt.miss{border-style:dashed; border-color:var(--ok)}
.opt:disabled{cursor:default}
.opt.pic{flex-direction:column; justify-content:center; padding:10px}
.tf .opt{justify-content:center; font-size:22px; padding:18px}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* match */
.match{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px}
.mcol{display:flex; flex-direction:column; gap:9px}
.mi{border:2.5px solid var(--line); background:#fff; border-radius:14px; padding:10px 12px; font-size:15.5px; font-weight:600; text-align:left; min-height:48px; display:flex; align-items:center; gap:8px; box-shadow:0 3px 0 var(--line)}
.mi.sel{border-color:var(--p); background:var(--pl)}
.mi .dot{flex:none; width:14px; height:14px; border-radius:50%; background:var(--line)}
.mi.ok{border-color:var(--ok); background:var(--okl)} .mi.bad{border-color:var(--bad); background:var(--badl)}
.mi .fix{display:block; font-size:12.5px; color:var(--ok); font-weight:700}

/* sort */
.tray{display:flex; flex-wrap:wrap; gap:8px; min-height:54px; padding:10px; border:2.5px dashed var(--line); border-radius:16px; margin-bottom:12px; justify-content:center}
.chip{border:2.5px solid #cfc4f5; background:#fff; border-radius:30px; padding:8px 14px; font-weight:700; font-size:15.5px; box-shadow:0 3px 0 #ddd5fa; touch-action:none; user-select:none; -webkit-user-select:none}
.chip.sel{background:var(--p); color:#fff; border-color:var(--p)}
.chip.ok{border-color:var(--ok); background:var(--okl)} .chip.bad{border-color:var(--bad); background:var(--badl)}
.chip small{display:block; font-size:11px; color:var(--ok)}
.bins{display:grid; gap:12px}
.bin{border:3px solid; border-radius:18px; padding:10px; min-height:110px; transition:transform .15s, background .15s}
.bin h4{margin:0 0 8px; font-size:16px; text-align:center}
.bin .in{display:flex; flex-wrap:wrap; gap:7px; justify-content:center}
.bin.over{transform:scale(1.03)}
.bin.c0{border-color:#f5a54a; background:#fff8ef} .bin.c0 h4{color:var(--o)}
.bin.c1{border-color:#5aa0f0; background:#f2f7ff} .bin.c1 h4{color:var(--b)}
.bin.c2{border-color:#45c288; background:#effaf4} .bin.c2 h4{color:var(--g)}
.ghost{position:fixed; pointer-events:none; z-index:50; transform:translate(-50%,-50%) rotate(-4deg); box-shadow:0 10px 20px rgba(0,0,0,.2)}

/* fill */
.sent{font-size:18.5px; line-height:2.3}
.blank{display:inline-block; min-width:110px; border:none; border-bottom:3px solid #b9a8f0; background:var(--pl); border-radius:10px 10px 0 0; padding:0 10px; font-weight:800; color:var(--p); text-align:center; line-height:1.7}
.blank.active{background:#ffe9a8; border-color:#f2b200}
.blank.ok{background:var(--okl); color:var(--ok); border-color:var(--ok)}
.blank.bad{background:var(--badl); color:var(--bad); border-color:var(--bad); text-decoration:line-through}
.fixw{color:var(--ok); font-weight:800; font-size:15px; margin-left:4px}
.bank{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; justify-content:center}

/* footer / feedback */
.actions{display:flex; justify-content:flex-end; margin-top:16px; gap:10px}
.go{border:none; border-radius:16px; padding:13px 26px; font-size:18px; font-weight:800; color:#fff; background:var(--p); box-shadow:0 5px 0 #b4500f; transition:transform .1s}
.go:active{transform:translateY(3px); box-shadow:0 2px 0 #b4500f}
.go:disabled{background:#c9c3df; box-shadow:0 5px 0 #aea7c9; cursor:not-allowed}
.go.green{background:var(--ok); box-shadow:0 5px 0 #0f7a41}
.fb{margin-top:14px; border-radius:18px; padding:14px 16px; animation:pop .3s}
.fb.ok{background:var(--okl); border:2.5px solid #9fdcbb}
.fb.bad{background:#fff4e5; border:2.5px solid #f6c37a}
.fb h3{margin:0 0 4px; font-size:20px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:#c26a00}
.fb p{margin:0; font-size:16px; line-height:1.45}
.plus{position:absolute; right:22px; top:16px; font-weight:800; color:var(--ok); font-size:22px; animation:float 1.1s forwards}
@keyframes float{to{transform:translateY(-40px); opacity:0}}

/* end */
.end{text-align:center}
.stars{font-size:64px; letter-spacing:8px; margin:6px 0}
.stars span{display:inline-block; animation:pop .5s backwards; filter:grayscale(1); opacity:.35}
.stars span.on{filter:none; opacity:1}
.bigscore{font-size:46px; font-weight:800; color:var(--p)}
.endgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0}
.endgrid div{background:#f7f6fd; border-radius:16px; padding:10px; font-weight:700; color:var(--muted); font-size:14px}
.endgrid b{display:block; font-size:26px; color:var(--ink)}
.endbtns{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.revise{background:#f7f6fd; border-radius:16px; padding:12px 14px; margin:0 0 16px; text-align:left}
.revise h4{margin:0 0 8px; font-size:16px}
.revise a{display:flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--line); border-radius:12px; padding:9px 12px; margin-top:6px; color:var(--ink); text-decoration:none; font-weight:700; font-size:15px}
.revise .n{flex:none; background:#fff1e6; color:#c4520e; border-radius:8px; padding:2px 8px; font-size:13px; font-weight:800}
.revise .c{margin-left:auto; flex:none; color:var(--muted); font-size:13px}
.ghostbtn{border:2.5px solid var(--line); background:#fff; border-radius:16px; padding:12px 20px; font-size:17px; font-weight:800; box-shadow:0 4px 0 var(--line)}
canvas#fx{position:fixed; inset:0; pointer-events:none; z-index:100}

/* Maths Quest additions */
.mode.soon{opacity:.5;cursor:default;filter:grayscale(.3)} .mode.soon:hover{transform:none}
.c2c{background:linear-gradient(140deg,#e06a1b,#f5a54a)} .c4c{background:linear-gradient(140deg,#2c66cf,#5aa0f0)} .c6c{background:linear-gradient(140deg,#17935b,#45c288)}
.c9c{background:linear-gradient(140deg,#6a45d8,#9b7cf0)} .c10c{background:linear-gradient(140deg,#d6336c,#f06595)} .mbc{background:linear-gradient(140deg,#7a2e00,#b0207a)}
.tc2{background:#fdeedf;color:#c4520e} .tc4{background:#e5eefc;color:#2c66cf} .tc6{background:#e4f6ec;color:#17935b} .tc9{background:#efe9ff;color:#6a45d8} .tc10{background:#fde4ec;color:#d6336c}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 .12em}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .15em}
/* typed answer + keypad */
.ansbox{display:flex;align-items:center;min-height:62px;border:3px dashed #f5a54a;border-radius:16px;background:#fffaf3;padding:6px 16px;font-size:30px;font-weight:800;color:#7a2e00;margin:4px 0 12px;word-break:break-all}
.ansbox .ph{font-size:16px;font-weight:700;color:#b39a85}
.ansbox .cur{display:inline-block;width:3px;height:32px;background:#e06a1b;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ansbox.ok{border-style:solid;border-color:var(--ok);background:var(--okl);color:#0f7a40} .ansbox.bad{border-style:solid;border-color:var(--bad);background:var(--badl);color:#b02a2a}
.unit{font-size:20px;color:#8a6a55;margin-left:8px}
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.kp button{height:50px;border:2.5px solid #f5a54a;border-radius:12px;background:#fff;font-size:22px;font-weight:800;color:#7a2e00;box-shadow:0 3px 0 #f7d3b5;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.kp button:active{transform:translateY(2px);box-shadow:0 1px 0 #f7d3b5}
.kp button.l{background:#fff1e6;font-style:italic;font-family:Georgia,serif}
.kp button.op{background:#fffaf3}
.kp button.del{background:#fde8e8;border-color:#f2a0a0;color:#b02a2a}
.kp button:disabled{opacity:.5}
@media(max-width:420px){.kp{gap:5px}.kp button{height:46px;font-size:20px}}
.nudge{margin-top:10px;background:#fff8e6;border:2.5px solid #f2c200;border-radius:14px;padding:10px 14px;font-weight:700;font-size:15.5px;animation:pop .3s}
.fb .not{margin:0 0 6px;font-weight:700}
/* build it (tiles) */
.slot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;min-height:66px;border:3px dashed #f5a54a;border-radius:16px;background:#fffaf3;padding:8px;margin-bottom:12px;font-size:28px;font-weight:800;color:#7a2e00}
.slot i{font-size:15px;font-style:normal;color:#b39a85;font-weight:700}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--okl)} .slot.bad{border-style:solid;border-color:var(--bad);background:var(--badl)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{min-width:58px;height:54px;padding:0 14px;border:3px solid #e06a1b;border-radius:14px;background:#fff;font-size:24px;font-weight:800;color:#7a2e00;box-shadow:0 4px 0 #f7d3b5}
/* number line */
.nl{display:block;margin:4px auto 6px;max-width:100%;height:auto;touch-action:manipulation}
.nl .tk{cursor:pointer}
.nlc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.nlc button{border:2.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 14px;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--line)}
.nlc button.on{border-color:#e06a1b;background:#fff1e6;color:#7a2e00}
/* put in order */
.ord{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.ord .row{display:flex;align-items:center;gap:10px;min-height:50px;border:2.5px dashed var(--line);border-radius:14px;padding:6px 12px;font-size:19px;font-weight:800}
.ord .row .n{flex:none;width:28px;height:28px;border-radius:8px;background:#fff1e6;color:#c4520e;display:flex;align-items:center;justify-content:center;font-size:15px}
.ord .row.ok{border-style:solid;border-color:var(--ok);background:var(--okl)} .ord .row.bad{border-style:solid;border-color:var(--bad);background:var(--badl)}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">

  <!-- MENU -->
  <section id="menu">
    <div class="hero">
      <div class="atom">🤖</div>
      <h1>Maths Quest</h1>
      <p>Grade 7 Cambridge 2nd Term review. Pick a chapter, type your answers, build streaks and collect stars!</p>
    </div>
    <div class="resume" id="resume"></div>
    <div class="modes" id="modes"></div>
    <div class="menu-foot">
      <a class="pill" href="maths.html" style="text-decoration:none;color:inherit">🏠 Maths lessons</a><span>💡 Every answer comes with the working.</span>
      <button class="pill" id="soundBtn">🔊 Sound: on</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden">
    <div class="hud">
      <button class="home" id="homeBtn" title="Back to menu">✕</button>
      <div class="bar"><i id="prog"></i></div>
      <div class="stat streak" id="streak">🔥 0</div>
      <div class="stat" id="score">⭐ 0</div>
    </div>
    <div class="card" id="card"></div>
  </section>

  <!-- END -->
  <section id="end" class="hidden">
    <div class="card end" id="endCard"></div>
  </section>
</div>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const frac=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;

/* ================= sound ================= */
let soundOn=store.get('sq_sound',true), actx=null;
function tone(f,t0,dur,type='sine',vol=.18){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime+t0;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.start(t);o.stop(t+dur);}catch(e){}}
const sfx={ok(){tone(660,0,.12,'triangle');tone(990,.1,.22,'triangle');},bad(){tone(200,0,.25,'sawtooth',.08);tone(150,.12,.3,'sawtooth',.08);},
  tap(){tone(520,0,.05,'sine',.08);},win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,'triangle'));}};

/* ================= confetti ================= */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[];
function resize(){cv.width=innerWidth;cv.height=innerHeight;}addEventListener('resize',resize);resize();
function confetti(n=80,x=innerWidth/2,y=innerHeight/3){const cols=['#e06a1b','#f5a54a','#2c66cf','#17935b','#ffd84d','#6a45d8'];
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*12,vy:Math.random()*-11-3,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.3,life:120});
  if(parts.length===n)requestAnimationFrame(loop);}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life--;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,Math.min(1,p.life/40));cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+40);if(parts.length)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height);}

/* ================= typed answers ================= */
/* An answer is typed on the on-screen keypad as text like "52−5y", "3/4", "−6" or "4b²".
   It is checked BY VALUE: the expression is evaluated at several values of its letters, so "2n+m" and "m+2n" both count.
   q.simplest: the answer must also be in simplest form (same terms as an accepted answer, in any order);
   an answer with the right value but not simplified gets a nudge and the question stays open. */
function toJS(s,vars){
  s=s.replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/×/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/³/g,'^3');
  if(!s||/[^0-9a-z.+\-*/()^]/.test(s))return null;
  for(const ch of s.match(/[a-z]/g)||[])if(!vars.includes(ch))return null;
  /* implicit multiplication: 3y, pq, 2(x+1), (a)(b), y(2) */
  s=s.replace(/(\d|[a-z]|\))(?=[a-z(])/g,'$1*').replace(/([a-z]|\))(?=\d)/g,'$1*');
  if(/[+\-*/^]{2,}|^[*/^]|[+\-*/^]$|\.\d*\./.test(s))return null;
  return s.replace(/\^/g,'**');}
function evalAt(js,vars,vals){try{const f=new Function(...vars.split(''),'return ('+js+');');const v=f(...vals);return Number.isFinite(v)?v:NaN;}catch(e){return NaN;}}
const PTS=[[3,7,2,5,11],[2.5,-4,9,1.5,6],[13,0.5,-3,8,2],[-6,5,1.25,-2,10]];
function sameValue(a,b,vars){const ja=toJS(a,vars),jb=toJS(b,vars);if(ja==null||jb==null)return false;
  return PTS.every(p=>{const x=evalAt(ja,vars,p),y=evalAt(jb,vars,p);return Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(x-y)<1e-9*Math.max(1,Math.abs(y));});}
/* the terms of an expression, as a sorted list (for "simplest form") */
function terms(s){s=s.replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/×/g,'*');let depth=0,cur='',out=[];
  for(const ch of s){if(ch==='(')depth++;if(ch===')')depth--;if((ch==='+'||ch==='-')&&depth===0&&cur!==''){out.push(cur);cur=ch==='-'?'-':'';}else cur+=ch==='+'&&cur===''?'':ch;}
  if(cur!=='')out.push(cur);return out.sort().join('|');}
/* nice display of what was typed */
const pretty=s=>s.replace(/-/g,'−').replace(/\*/g,'×');

  why:'Use the easy fact, then the place: 4 × 5 = 20, so 4 tenths × 5 = 20 tenths = 2. 8 × 3 = 24, so 8 × 3 hundredths = 0.24. Multiplying by 0.1 is the same as dividing by 10.'},
{id:'c4-14',ch:4,l:'m09',src:'Worksheet · Ex 4.3 · Q8 c)',type:'type',num:true,q:'Work out <b>0.78 × 41</b>. (Check: 0.8 × 40 = 32.)',
  ans:['31.98'],mist:{'319.8':`0.78 has <b>two</b> decimal places, so the answer has two. Your check says about 32.`,'3.198':`Too small: the check says about 32. 0.78 has two decimal places, not three.`},
  why:'Ignore the point: 78 × 41 = 3198. 0.78 has two decimal places, so <b>31.98</b>. Check: 0.8 × 40 = 32 ✔'},
{id:'c4-15',ch:4,l:'m09',src:'Worksheet · Ex 4.5 · Q2 a)',type:'mcq',q:'Work out <b>0.6 × 410</b>',
  o:['246','24.6','2460','240.6'],a:0,
  whyNot:{1:'too small: 0.6 is more than a half, and half of 410 is 205.',2:'too big: 0.6 is less than 1, so the answer is less than 410.',3:'one tenth of 410 is 41, and 6 × 41 = 246.'},
  why:'One tenth of 410 is 41. We want 6 tenths: 6 × 41 = 240 + 6 = <b>246</b>. Check: a bit more than half of 410 ✔'},
{id:'c4-16',ch:4,l:'m09',src:'Worksheet · Ex 4.5 · Q6 b)',type:'type',num:true,q:'Work out <b>4.7 × 9</b>. (Hint: 9 = 10 − 1)',
  ans:['42.3'],mist:{'51.7':`9 = 10 − 1, so take one 4.7 <b>away</b> from 47, not add it.`,'423':`Put the point back: 4.7 × 9 is about 5 × 9 = 45.`},
  why:'4.7 × 10 = 47. Take away one lot of 4.7: 47 − 4.7 = <b>42.3</b>. Check: 5 × 9 = 45, close ✔'},
{id:'c4-17',ch:4,l:'m09',type:'type',num:true,q:'Work out <b>5.3 × 7</b>',
  ans:['37.1'],mist:{'371':`Put the point back: 5.3 has one decimal place, so the answer has one.`,'35.21':`0.3 × 7 = 2.1, and 35 + 2.1 = 37.1. Add them, don't write them side by side.`},
  why:'Estimate: 5 × 7 = 35. Ignore the point: 53 × 7 = 371. One decimal place: <b>37.1</b> ✔'},
{id:'c4-18',ch:4,l:'m09',type:'type',num:true,q:'Work out <b>2.4 × 36</b>. Show how to check your answer.',
  ans:['86.4'],mist:{'864':`2.4 has one decimal place, so the answer has one. Check: 2 × 40 = 80.`,'8.64':`Too small: the check 2 × 40 = 80. 2.4 has only one decimal place.`},
  why:'Ignore the point: 24 × 36 = 720 + 144 = 864. One decimal place: <b>86.4</b>. Check: 2 × 40 = 80, close ✔'},
{id:'c4-19',ch:4,l:'m09',type:'mcq',q:'Work out <b>0.03 × 2400</b>',
  o:['72','7.2','720','0.72'],a:0,
  whyNot:{1:'one hundredth of 2400 is 24, and 3 × 24 = 72.',2:'that is 0.3 × 2400. 0.03 is 3 hundredths.',3:'far too small: one hundredth of 2400 is already 24.'},
  why:'One hundredth of 2400 is 24. We want 3 hundredths: 3 × 24 = <b>72</b>.'},
{id:'c4-20',ch:4,l:'m10',src:'Worksheet · Ex 4.3 · Q4',type:'type',num:true,unitL:'$',q:'In a supermarket, five chickens cost $18.25. What is the cost of one chicken? Give your answer in dollars.',
  ans:['3.65'],mist:{'36.5':`The decimal point goes straight up. Estimate: 20 ÷ 5 = 4 dollars.`,'91.25':`That multiplies. Share the cost: divide by 5.`},
  why:'18.25 ÷ 5: 18 ÷ 5 = 3 r 3, 32 ÷ 5 = 6 r 2, 25 ÷ 5 = 5. One chicken costs <b>$3.65</b>. Check: 3.65 × 5 = 18.25 ✔'},
{id:'c4-21',ch:4,l:'m10',src:'Worksheet · Ex 4.4 · Q2 b)',type:'type',num:true,q:'Work out <b>8.922 ÷ 6</b>',
  ans:['1.487'],mist:{'14.87':`The point goes straight up. Estimate: 9 ÷ 6 is about 1.5.`,'0.1487':`Too small: 8 ÷ 6 is more than 1. The point goes straight up.`},
  why:'8 ÷ 6 = 1 r 2, 29 ÷ 6 = 4 r 5, 52 ÷ 6 = 8 r 4, 42 ÷ 6 = 7. Answer <b>1.487</b>. Check: 9 ÷ 6 = 1.5, close ✔'},
{id:'c4-22',ch:4,l:'m10',src:'Worksheet · Ex 4.4 · Q6 c)',type:'mcq',q:'Complete this division: <b>782.825 ÷ 25</b>',
  o:['31.313','3.1313','313.13','31.33'],a:0,
  whyNot:{1:'too small: 750 ÷ 25 = 30. The point goes straight up.',2:'too big: 750 ÷ 25 = 30. The point goes straight up.',3:'a digit is missing: there are five steps, 78, 32, 78, 32, 75.'},
  why:'78 ÷ 25 = 3 r 3, 32 ÷ 25 = 1 r 7, 78 ÷ 25 = 3 r 3, 32 ÷ 25 = 1 r 7, 75 ÷ 25 = 3. Answer <b>31.313</b>. Estimate: 750 ÷ 25 = 30 ✔'},
{id:'c4-23',ch:4,l:'m10',type:'type',num:true,unitL:'$',q:'Four friends share a bill of $57.80 equally. How much does each pay? Give your answer in dollars.',
  ans:['14.45'],mist:{'144.5':`The point goes straight up. Estimate: 60 ÷ 4 = 15 dollars.`,'231.2':`That multiplies. Share the bill: divide by 4.`},
  why:'57.80 ÷ 4: 5 ÷ 4 = 1 r 1, 17 ÷ 4 = 4 r 1, 18 ÷ 4 = 4 r 2, 20 ÷ 4 = 5. Each pays <b>$14.45</b>. Check: 14.45 × 4 = 57.80 ✔'},
{id:'c4-24',ch:4,l:'m10',type:'type',num:true,q:'Work out <b>9.156 ÷ 4</b>',
  ans:['2.289'],mist:{'22.89':`The point goes straight up. Estimate: 8 ÷ 4 = 2.`,'0.2289':`Too small: 8 ÷ 4 = 2, so the answer is about 2. The point goes straight up.`},
  why:'9 ÷ 4 = 2 r 1, 11 ÷ 4 = 2 r 3, 35 ÷ 4 = 8 r 3, 36 ÷ 4 = 9. Answer <b>2.289</b>. Check: 2.289 × 4 = 9.156 ✔'},
{id:'c4-25',ch:4,l:'m10',type:'tf',q:'True or false? <b>19.44 ÷ 8 = 2.43</b>',o:['True','False'],a:0,
  whyNot:{1:'check by multiplying: 2.43 × 8 = 19.44, so it is right.'},
  why:'19 ÷ 8 = 2 r 3, 34 ÷ 8 = 4 r 2, 24 ÷ 8 = 3: <b>2.43</b>, so it is <b>true</b>. Check: 2.43 × 8 = 19.44 ✔'},
/* ---------- Chapter 6 · Collecting data ---------- */
{id:'c6-01',ch:6,l:'m11',src:'Worksheet · Ex 6.1 · Q1',type:'match',q:'Choose the correct word to describe the following: discrete, continuous or categorical.',
  pairs:[['The mass of a book','continuous'],['The colour of a book','categorical'],['The number of pages in a book','discrete']],
  why:'Mass is <b>measured</b>: continuous. Colour is a <b>word</b>: categorical. Pages are <b>counted</b>: discrete.'},
{id:'c6-02',ch:6,l:'m11',src:'Worksheet · Ex 6.1 · Q2 d)',type:'mcq',q:'Here are some facts about a person. Write down the type of data for this fact: time to travel to school.',
  o:['discrete','continuous','categorical'],a:1,
  whyNot:{0:'discrete data is counted. Time is measured, and it can be any value, like 12.5 minutes.',2:'categorical data is words or groups. Time is a number.'},
  why:'Time is <b>measured</b> and can be any value, like 12.5 minutes. It is <b>continuous</b>.'},
{id:'c6-03',ch:6,l:'m11',src:'Worksheet · Ch 6 Getting started · Q1 a)',type:'mcq',q:'What is a questionnaire?',
  o:['A set of questions used in a survey','The answer that comes up most often','A list of numbers put in order','A chart that shows the data'],a:0,
  whyNot:{1:'that is the mode, a kind of average.',2:'putting numbers in order is how you start finding the median.',3:'a chart shows data after it is collected; a questionnaire collects it.'},
  why:'A questionnaire is <b>a set of questions used in a survey</b>. Everyone answers the same questions, so you can compare their answers.'},
{id:'c6-04',ch:6,l:'m11',type:'mcq',q:'Which of these is <b>discrete</b> data?',
  o:['The mass of a cat','The number of pets in a house','Eye colour','The length of a pencil'],a:1,
  whyNot:{0:'mass is measured, so it is continuous.',2:'eye colour is a word, so it is categorical.',3:'length is measured, so it is continuous.'},
  why:'You <b>count</b> pets: 0, 1, 2, 3, with nothing in between. So <b>the number of pets</b> is discrete.'},
{id:'c6-05',ch:6,l:'m11',type:'tf',q:'True or false? The number of goals scored in a football match is <b>continuous</b> data.',o:['True','False'],a:1,
  whyNot:{0:'goals are counted (0, 1, 2…). You can\'t score 2.5 goals, so it is not continuous.'},
  why:'Goals are <b>counted</b>, so it is <b>discrete</b> data. The statement is <b>false</b>.'},
{id:'c6-06',ch:6,l:'m11',type:'tf',q:'True or false? The mode of <b>3, 8, 3, 5, 8, 8</b> is 3.',o:['True','False'],a:1,
  whyNot:{0:'3 appears twice, but 8 appears three times.'},
  why:'The mode is the value that appears <b>most often</b>. 3 appears 2 times and 8 appears 3 times, so the mode is <b>8</b>. The statement is <b>false</b>.'},
{id:'c6-07',ch:6,l:'m11',src:'Worksheet · Ch 6 Getting started · Q4 a)',type:'type',num:true,q:'Here are 20 test marks:<br><b>7 8 8 9 12 14 14 14 15 15 15 16 16 17 18 18 18 18 18 20</b><br>a) Which mark is the mode?',
  ans:['18'],mist:{'14':`14 appears 3 times, but 18 appears <b>5</b> times.`,'15':`15 is the <b>median</b> (the middle). The mode is the mark that appears most often.`,'20':`20 is the highest mark. The mode is the mark that appears <b>most often</b>.`},
  why:'Count each mark: 14 appears 3 times, 15 appears 3 times, 18 appears 5 times. The mode is <b>18</b>.'},
{id:'c6-08',ch:6,l:'m11',src:'Worksheet · Ch 6 Getting started · Q4 b)',type:'type',num:true,q:'Here are 20 test marks:<br><b>7 8 8 9 12 14 14 14 15 15 15 16 16 17 18 18 18 18 18 20</b><br>b) Which mark is the median?',
  ans:['15'],mist:{'18':`18 is the <b>mode</b> (most often). The median is the <b>middle</b> mark.`,'14.5':`14.5 is the <b>mean</b>. The median is the middle mark.`,'13.5':`That is halfway between the lowest and highest marks. The median is the middle of <b>all 20</b> marks.`,'30':`15 + 15 = 30, then divide by 2.`},
  why:'The marks are already in order. There are 20, so the middle is between the <b>10th</b> and <b>11th</b> marks: 15 and 15. (15 + 15) ÷ 2 = <b>15</b>.'},
{id:'c6-09',ch:6,l:'m11',src:'Worksheet · Ch 6 Getting started · Q4 c)',type:'type',num:true,q:'Here are 20 test marks:<br><b>7 8 8 9 12 14 14 14 15 15 15 16 16 17 18 18 18 18 18 20</b><br>c) The sum of the marks is 290. Which mark is the mean?',
  ans:['14.5'],mist:{'290':`290 is the total. Now share it between the 20 marks: 290 ÷ 20.`,'15':`15 is the <b>median</b>. The mean is total ÷ how many.`,'18':`18 is the <b>mode</b>. The mean is total ÷ how many.`,'29':`Divide by <b>20</b> (the number of marks), not 10.`},
  why:'Mean = total ÷ how many = 290 ÷ 20 = <b>14.5</b>. Check: 14.5 is between the lowest mark, 7, and the highest, 20 ✔'},
{id:'c6-10',ch:6,l:'m11',type:'type',num:true,q:'Find the <b>median</b> of: <b>12, 5, 15, 9, 7</b>',
  ans:['9'],mist:{'15':`15 is in the middle of the list as it is written. Put the numbers <b>in order</b> first.`,'9.6':`9.6 is the <b>mean</b>. The median is the middle number.`,'10':`That is halfway between the smallest and biggest. The median is the middle of <b>all</b> the numbers, in order.`},
  why:'Put them in order: 5, 7, <b>9</b>, 12, 15. The middle one is <b>9</b>.'},
{id:'c6-11',ch:6,l:'m11',type:'type',num:true,q:'Find the <b>median</b> of: <b>8, 3, 10, 5, 6, 12</b>',
  ans:['7'],mist:{'7.5':`10 and 5 are in the middle of the list as written. Put the numbers <b>in order</b> first.`,'14':`6 + 8 = 14, now divide by 2 to get halfway.`,'6':`There are 6 numbers, so there are <b>two</b> middle numbers: 6 and 8. Take halfway between them.`,'8':`There are 6 numbers, so there are <b>two</b> middle numbers: 6 and 8. Take halfway between them.`},
  why:'In order: 3, 5, <b>6, 8</b>, 10, 12. There are two middle numbers, 6 and 8. Halfway: (6 + 8) ÷ 2 = 14 ÷ 2 = <b>7</b>.'},
{id:'c6-12',ch:6,l:'m11',type:'type',num:true,unit:' minutes',q:'Sara\'s journeys to school took <b>12, 15, 9, 14</b> minutes. Work out the <b>mean</b> time.',
  ans:['12.5'],mist:{'50':`50 is the total. Now share it between the 4 journeys: 50 ÷ 4.`,'10':`There are <b>4</b> journeys, so divide by 4, not 5.`,'13':`13 is the <b>median</b> (halfway between 12 and 14). The mean is total ÷ how many.`},
  why:'Total: 12 + 15 + 9 + 14 = 50. There are 4 journeys: 50 ÷ 4 = <b>12.5 minutes</b>.'},
/* ---------- Chapter 9 · Sequences and functions ---------- */
{id:'c9-01',ch:9,l:'m12',src:'Worksheet · Ch 9 Getting started · Q1 c)',type:'type',num:true,q:'Work out: <b>−2 + 6</b>',
  ans:['4'],mist:{'−4':`Start at −2 and go <b>up</b> 6: −1, 0, 1, 2, 3, 4. The answer is positive.`,'−8':`Adding 6 moves <b>up</b> the number line, not down.`,'8':`It starts at <b>minus</b> 2, not 2.`},
  why:'Start at −2 on the number line and move 6 to the right: −2 → 0 is 2 steps, then 4 more. Answer <b>4</b>. Check: 6 − 2 = 4 ✔'},
{id:'c9-02',ch:9,l:'m12',src:'Worksheet · Ch 9 Getting started · Q3 g)',type:'type',num:true,q:'Use the correct order of operations: <b>−2 × 3 + 10</b>',
  ans:['4'],mist:{'−26':`That adds 3 + 10 first. Multiply first: −2 × 3 = −6.`,'−4':`−6 + 10: start at −6 and go up 10. You land on <b>4</b>, a positive number.`,'16':`−2 × 3 is <b>−6</b> (negative × positive is negative).`},
  why:'Multiply first: −2 × 3 = −6. Then −6 + 10 = <b>4</b>.'},
{id:'c9-03',ch:9,l:'m12',src:'Worksheet · Ch 9 Getting started · Q3 e)',type:'type',num:true,q:`Use the correct order of operations: ${frac(12,3)} + 9`,
  ans:['13'],mist:{'7':`That adds first: (12 + 9) ÷ 3. Here only 12 is over the 3, so divide first.`,'39':`Divide 12 by 3 first: that gives 4, then add 9.`,'21':`You still need to divide 12 by 3.`},
  why:`${frac(12,3)} means 12 ÷ 3 = 4. Then 4 + 9 = <b>13</b>.`},
{id:'c9-04',ch:9,l:'m12',src:'Worksheet · Ch 9 Getting started · Q3 h)',type:'type',num:true,q:`Use the correct order of operations: −5 − ${frac(10,5)}`,
  ans:['−7'],mist:{'−3':`That works out −5 − 10 first. Divide first: 10 ÷ 5 = 2.`,'3':`−5 − 2 goes further <b>down</b>: the answer is negative.`,'−35':`Only the 10 is over the 5. 10 ÷ 5 = 2, then −5 − 2.`},
  why:`Divide first: ${frac(10,5)} = 10 ÷ 5 = 2. Then −5 − 2 = <b>−7</b> (start at −5, go down 2).`},
{id:'c9-05',ch:9,l:'m12',type:'mcq',q:'Work out: 28 ÷ −4',o:['7','−7','24','−32'],a:1,
  whyNot:{0:'a positive divided by a negative gives a <b>negative</b> answer.',2:'that adds −4 instead of dividing.',3:'that takes away 4 instead of dividing.'},
  why:'28 ÷ 4 = 7. Positive ÷ negative is negative, so <b>−7</b>. Check: −7 × −4 = 28 ✔'},
{id:'c9-06',ch:9,l:'m12',type:'type',num:true,q:'Use the correct order of operations: <b>20 − 12 ÷ 4 × 2</b>',
  ans:['14'],mist:{'4':`That works from the left ignoring BIDMAS. Do ÷ and × first: 12 ÷ 4 × 2 = 6.`,'18.5':`× and ÷ are equal, so go <b>left to right</b>: 12 ÷ 4 = 3 first, then × 2.`,'17':`Don't forget the × 2: 12 ÷ 4 = 3, then 3 × 2 = 6.`},
  why:'÷ and × come before −, and they are equal, so left to right: 12 ÷ 4 = 3, then 3 × 2 = 6. Last: 20 − 6 = <b>14</b>.'},
{id:'c9-07',ch:9,l:'m12',src:'Worksheet · Ch 9 Getting started · Q2 f)',type:'type',num:true,q:'Complete the calculation: <b>10 − ? = −4</b>',
  ans:['14'],mist:{'6':`10 − 6 = 4, not −4. You need to go past 0, down to −4.`,'−14':`10 − −14 would be 24. Try a positive number bigger than 10.`,'−6':`10 − −6 would be 16. You need to go down from 10 to −4.`},
  why:'From 10 down to 0 is 10, then down to −4 is 4 more: 10 + 4 = <b>14</b>. Check: 10 − 14 = −4 ✔'},
{id:'c9-08',ch:9,l:'m12',type:'mcq',q:'Work out: (−3 + 8) × −2',o:['10','−19','−10','−16'],a:2,
  whyNot:{0:'5 × −2 is negative: positive × negative = negative.',1:'that multiplies first, but the brackets come first.',3:'that leaves out the −3: work out the whole bracket first.'},
  why:'Brackets first: −3 + 8 = 5. Then 5 × −2 = <b>−10</b>.'},
{id:'c9-09',ch:9,l:'m13',src:'Worksheet · Ex 9.1 · Q2 (i)',type:'match',q:'Match each sequence to its term-to-term rule.',
  pairs:[['2, 4, 6, 8, …','Add 2'],['1, 4, 7, 10, …','Add 3'],['5, 9, 13, 17, …','Add 4'],['3, 8, 13, 18, …','Add 5'],['30, 28, 26, 24, …','Subtract 2'],['17, 14, 11, 8, …','Subtract 3']],
  why:'Look at the gap from one term to the next. Going up means <b>add</b>, going down means <b>subtract</b>: e.g. 17 → 14 is subtract 3.'},
{id:'c9-10',ch:9,l:'m13',src:'Worksheet · Ex 9.1 · Q4 d)',type:'type',num:true,q:'Fill in the <b>first</b> missing term: 90, 82, ?, 66, ?, 50, ?',
  ans:['74'],mist:{'58':`58 is the <b>second</b> gap. The first gap comes straight after 82.`,'78':`The terms go down by 8 each time (90 − 82 = 8), so 82 − 8.`,'72':`90 − 82 = 8, so subtract 8: 82 − 8 = 74.`},
  why:'The rule is <b>subtract 8</b> (90 − 82 = 8). 82 − 8 = <b>74</b>. Check: 74 − 8 = 66 ✔'},
{id:'c9-11',ch:9,l:'m13',src:'Worksheet · Ex 9.1 · Q3 c)',type:'type',num:true,q:'A sequence has first term <b>6</b> and term-to-term rule <b>multiply by 2</b>. What is the <b>third</b> term?',
  ans:['24'],mist:{'12':`12 is the <b>second</b> term. Multiply by 2 once more.`,'10':`The rule is <b>multiply</b> by 2, not add 2.`,'18':`That adds 6 each time. Multiply by 2: 6, 12, 24.`},
  why:'6 × 2 = 12 (second term), 12 × 2 = <b>24</b> (third term). The sequence is 6, 12, 24.'},
{id:'c9-12',ch:9,l:'m13',src:'Worksheet · Ex 9.1 · Q5 d)',type:'tf',q:'Is this sequence finite or infinite?<br><b>100, 97, 94, 91, 88, …</b>',o:['Finite','Infinite'],a:1,
  whyNot:{0:'the dots ( … ) mean it carries on for ever, so it is not finite.'},
  why:'The <b>…</b> at the end means the sequence never stops, so it is <b>infinite</b>. A finite sequence has a last term.'},
{id:'c9-13',ch:9,l:'m13',src:'Worksheet · Ex 9.2 · Q2 d) (ii)',type:'type',num:true,q:'A pattern of squares has 5, 8, 11, 14, 17 squares in Patterns 1 to 5. How many squares in <b>Pattern 8</b>?',
  ans:['26'],mist:{'24':`8 × 3 = 24 is not quite it. Keep adding 3: Pattern 6 = 20, 7 = 23, 8 = 26.`,'23':`23 is Pattern 7. Add 3 once more.`,'40':`That is 5 × 8. Each pattern adds 3 squares, it doesn't multiply.`},
  why:'The rule is <b>add 3</b>. Pattern 6 = 17 + 3 = 20, Pattern 7 = 23, Pattern 8 = <b>26</b>.'},
{id:'c9-14',ch:9,l:'m13',type:'mcq',q:'What is the term-to-term rule for 50, 44, 38, 32, …?',o:['Add 6','Subtract 6','Subtract 4','Subtract 5'],a:1,
  whyNot:{0:'the terms are getting smaller, so it is subtract.',2:'check the gap: 50 − 44 = 6.',3:'check the gap: 50 − 44 = 6.'},
  why:'Each term is 6 less than the one before (50 − 44 = 6, 44 − 38 = 6): <b>subtract 6</b>.'},
{id:'c9-15',ch:9,l:'m13',type:'type',num:true,q:'What is the next term? <b>−7, −4, −1, 2, …</b>',
  ans:['5'],mist:{'−5':`The terms are going <b>up</b> by 3, not down.`,'6':`The gap is 3 (−7 → −4), so add 3, not 4.`,'4':`The gap is 3: 2 + 3 = 5.`},
  why:'The rule is <b>add 3</b> (−7 + 3 = −4, −4 + 3 = −1, −1 + 3 = 2). Next: 2 + 3 = <b>5</b>.'},
{id:'c9-16',ch:9,l:'m13',type:'order',q:'First term <b>80</b>, term-to-term rule <b>divide by 2</b>. Tap the first five terms in order.',
  items:['80','40','20','10','5'],
  why:'Start at 80 and halve each time: 80 → <b>40</b> → <b>20</b> → <b>10</b> → <b>5</b>.'},
{id:'c9-17',ch:9,l:'m14',src:'Worksheet · Ex 9.3 · Q2 b)',type:'type',vars:'n',simplest:true,q:'Work out the nth term rule for this sequence: <b>8, 16, 24, 32, 40, …</b>',
  ans:['8n'],mist:{'n+8':`n + 8 gives 9, 10, 11 … That is not this sequence. Each term is 8 × its position.`,'8':`The rule needs n in it: the 1st term is 8 × 1, the 2nd is 8 × 2 …`,'n+16':`Each term is 8 × its position number, so it is 8n.`},
  why:'Position 1 → 8, position 2 → 16, position 3 → 24: each term is 8 × the position. nth term = <b>8n</b>. Check: 8 × 5 = 40 ✔'},
{id:'c9-18',ch:9,l:'m14',src:'Worksheet · Ex 9.3 · Q3 (ii)',type:'type',num:true,q:'The sequence 15, 30, 45, 60, 75, … has nth term rule <b>15n</b>. Use it to work out the <b>20th</b> term.',
  ans:['300'],mist:{'35':`15n means 15 × n, not 15 + n.`,'1520':`15n means 15 × n: 15 × 20.`,'285':`That would be the 19th term. The 20th term is 15 × 20.`},
  why:'Put n = 20 into 15n: 15 × 20 = <b>300</b>.'},
{id:'c9-19',ch:9,l:'m14',src:'Worksheet · Ex 9.3 · Q5 c)',type:'tiles',q:'Build the nth term rule for this sequence: <b>22, 23, 24, 25, 26, …</b>',
  tiles:['n','+','21','22','×','1'],answers:[['n','+','21'],['21','+','n']],model:'n + 21',
  why:'The terms go up by 1, like n. Each term is 21 more than its position (1 + 21 = 22, 2 + 21 = 23), so the rule is <b>n + 21</b>.'},
{id:'c9-20',ch:9,l:'m14',src:'Worksheet · Ex 9.4 · Q2 b)',type:'type',num:true,q:'A function machine does <b>− 5</b>. The output is <b>10</b>. Use the inverse operation to work out the input.',
  ans:['15'],mist:{'5':`That takes 5 away again. The inverse of − 5 is <b>+ 5</b>.`,'50':`The inverse of − 5 is + 5, not × 5.`},
  why:'Work backwards with the inverse: + 5. 10 + 5 = <b>15</b>. Check: 15 − 5 = 10 ✔'},
{id:'c9-21',ch:9,l:'m14',src:'Worksheet · Ex 9.4 · Q4 b)',type:'mcq',q:'A function machine does × 8. What does its inverse machine do?',o:['× 8','÷ 8','− 8','+ 8'],a:1,

{id:'c10-07',ch:10,l:'m15',src:'Worksheet · Ex 10.2 · Q5 (iv)',type:'type',num:true,unit:' kg',q:`Work out <b>2.2%</b> of 600 kg.`,

/* ================= modes ================= */
const MODES=[
  {id:'c2',cls:'c2c',lv:'Level 1 · Chapter 2',name:'Expressions & Equations',emo:'✏️',pick:()=>BANK.filter(q=>q.ch===2)},
  {id:'c4',cls:'c4c',lv:'Level 2 · Chapter 4',name:'Decimals',emo:'🔍',pick:()=>BANK.filter(q=>q.ch===4)},
  {id:'c6',cls:'c6c',lv:'Level 3 · Chapter 6',name:'Collecting Data',emo:'📊',pick:()=>BANK.filter(q=>q.ch===6)},
  {id:'c9',cls:'c9c',lv:'Level 4 · Chapter 9',name:'Sequences & Functions',emo:'🔁',pick:()=>BANK.filter(q=>q.ch===9)},
  {id:'c10',cls:'c10c',lv:'Level 5 · Chapter 10',name:'Percentages',emo:'💯',pick:()=>BANK.filter(q=>q.ch===10)},
  {id:'mboss',cls:'mbc',lv:'Final Boss',name:'Mixed Challenge',emo:'👑',boss:true,
    pick:()=>{const ch=[...new Set(BANK.map(q=>q.ch))];const per=Math.ceil(25/ch.length);return shuffle(ch.flatMap(c=>shuffle(BANK.filter(q=>q.ch===c)).slice(0,per))).slice(0,25);}},
];
const RETRY='mretry'; /* "Practise my mistakes" (Science Quest uses 'retry') */
const MYMODES=new Set([...MODES.map(m=>m.id),RETRY]);
const TYPE={type:'⌨️ Type the answer',mcq:'🎯 Pick one',tf:'⚡ Quick fire',match:'🔗 Match up',tiles:'🧩 Build it',line:'📏 Number line',order:'🗂️ Put in order'};
const CHAP={2:'Ch 2 · Expressions',4:'Ch 4 · Decimals',6:'Ch 6 · Data',9:'Ch 9 · Sequences',10:'Ch 10 · Percentages'};
const PRAISE=['Brilliant!','Maths superstar! 🌟','Nailed it!','Awesome work!','You\'re on fire! 🔥','Genius move!','Spot on!','Big brain energy! 🧠'];
const OOPS=['Nearly! Here\'s the working:','Not quite. Here\'s how:','Good try! Here\'s why:','Oops! Learn this one:'];
const pickr=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- continuing a level ----------
   An unfinished level is saved after every answer (through src/account.js, so it follows the student between
   devices) and listed on the menu as "Continue where you left off". Only Maths Quest's own levels are listed here. */
function savedRuns(){try{const me=JSON.parse(localStorage.getItem('g7_me'));const all=JSON.parse(localStorage.getItem('g7_resume_'+me.username)).quizzes||{};
  return Object.fromEntries(Object.entries(all).filter(([m])=>MYMODES.has(m)));}catch(e){return{};}}
function saveRun(i){track('quizState',S.mode,{ids:S.qs.map(q=>q.id),i,score:S.score,streak:S.streak,best:S.best,right:S.right,wrong:S.wrong.map(q=>q.id)});}
function resumeRun(mode,st){const byId=Object.fromEntries(BANK.map(q=>[q.id,q]));const qs=st.ids.map(id=>byId[id]).filter(Boolean);if(!qs.length)return;
  S={mode,qs,i:Math.min(st.i,qs.length),score:st.score,streak:st.streak,best:st.best,right:st.right,wrong:st.wrong.map(id=>byId[id]).filter(Boolean)};
  if(S.i>=qs.length){endGame();return;}show('game');renderQ();}
const modeName=id=>{const m=MODES.find(x=>x.id===id);return m?`${m.emo} ${m.lv}: ${m.name}`:'🔁 Practise my mistakes';};
function renderResume(){const box=$('#resume'),runs=Object.entries(savedRuns()).sort((a,b)=>(b[1].at||0)-(a[1].at||0));box.innerHTML='';
  if(!runs.length){box.style.display='none';return;}box.style.display='';
  box.appendChild(el('h3','','▶ Continue where you left off'));
  runs.forEach(([mode,st])=>{const n=(st.ids||[]).length;const row=el('div','rrow',`<div class="rt"><b>${modeName(mode)}</b><span>${st.i>=n?'All answered: see your results':`Question ${st.i+1} of ${n}`} · ${st.score} pts</span></div>`);
    const go=el('button','go','Continue ▶');go.onclick=()=>resumeRun(mode,st);
    const x=el('button','rx','✕');x.title='Forget this level';x.setAttribute('aria-label','Forget this unfinished level');x.onclick=()=>{track('quizState',mode,null);renderMenu();};
    row.appendChild(go);row.appendChild(x);box.appendChild(row);});}
addEventListener('g7-resume',()=>{if(!$('#menu').classList.contains('hidden'))renderMenu();});
function renderMenu(){
  renderResume();
  const box=$('#modes');box.innerHTML='';
  MODES.forEach(m=>{const qs=m.pick(),ready=m.boss?MODES.every(x=>x.boss||x.pick().length>0):qs.length>0;const n=m.boss?25:qs.length;const best=store.get('sq_best_'+m.id,null);
    const b=el('button','mode '+m.cls+(ready?'':' soon'),`<div class="emo">${m.emo}</div><div class="lv">${m.lv}</div><h3>${m.name}</h3><div class="meta">${ready?`${n} questions${m.boss?' from every chapter':''}`:m.boss?'Opens when every level is ready':'Coming soon'}</div>`+
      (best?`<div class="best">Best: ${'⭐'.repeat(best.stars)}${'☆'.repeat(3-best.stars)} · ${best.pct}%</div>`:''));
    if(ready)b.onclick=()=>start(m.id,m.boss?m.pick():shuffle(m.pick()));else b.disabled=true;box.appendChild(b);});
  $('#soundBtn').textContent=soundOn?'🔊 Sound: on':'🔇 Sound: off';
}
$('#soundBtn').onclick=()=>{soundOn=!soundOn;store.set('sq_sound',soundOn);renderMenu();};
$('#homeBtn').onclick=()=>{if(confirm('Leave this level? You can continue it later from the menu.'))show('menu');};
function show(id){['menu','game','end'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));if(id==='menu')renderMenu();scrollTo(0,0);}

/* ================= game state ================= */
let S;
/* Progress saving: handed to src/account.js, which may load after this script. */
function track(method,...args){(window.__track=window.__track||[]).push([method,args]);}
function start(mode,qs){S={mode,qs,i:0,score:0,streak:0,best:0,right:0,wrong:[]};saveRun(0);show('game');renderQ();}
function hud(){$('#prog').style.width=(S.i/S.qs.length*100)+'%';const st=$('#streak');st.textContent='🔥 '+S.streak;st.classList.toggle('hot',S.streak>=3);$('#score').textContent='⭐ '+S.score;}

function renderQ(){
  hud();const q=S.qs[S.i];const card=$('#card');card.innerHTML='';
  card.appendChild(el('div','qtop',`<span class="tag tc${q.ch}">${CHAP[q.ch]}</span><span class="tag tt">${TYPE[q.type]}</span><span class="qnum">${S.i+1} / ${S.qs.length}</span>`));
  if(q.src)card.appendChild(el('div','hint',`📄 ${q.src}`));
  card.appendChild(el('div','prompt',q.q));
  const body=el('div','body');card.appendChild(body);
  const actions=el('div','actions');const checkBtn=el('button','go','Check ✔');actions.appendChild(checkBtn);card.appendChild(actions);
  let api=null;
  api=R[q.type](q,body,()=>{if(api)checkBtn.disabled=!api.ready();},(ok,note)=>finish(ok,note));
  checkBtn.disabled=!api.ready();
  if(api.instant)actions.classList.add('hidden');
  checkBtn.onclick=()=>{if(!api.ready())return;const r=api.check();if(r==null)return; /* null: a nudge, the question stays open */finish(r.ok,r.note);};
  function finish(ok,note){
    actions.classList.remove('hidden');checkBtn.disabled=false;
    if(api.lock)api.lock();
    if(ok){S.streak++;S.best=Math.max(S.best,S.streak);S.right++;const pts=100+Math.min(50,(S.streak-1)*10);S.score+=pts;sfx.ok();
      card.appendChild(el('div','plus','+'+pts));if(S.streak%5===0)confetti(70);else confetti(25,innerWidth/2,innerHeight/2);}
    else{S.streak=0;S.wrong.push(q);sfx.bad();}
    track('answer',{questionId:q.id,lessonId:q.l,source:'quiz',correct:ok});saveRun(S.i+1);
    hud();
    const fb=el('div','fb '+(ok?'ok':'bad'),`<h3>${ok?'✅ '+pickr(PRAISE):'💡 '+pickr(OOPS)}</h3>${!ok&&note?`<p class="not">❌ ${note}</p>`:''}<p>${q.why}</p>`);
    card.insertBefore(fb,actions);
    checkBtn.textContent=S.i===S.qs.length-1?'See my results 🏁':'Next ➜';checkBtn.classList.add('green');
    checkBtn.onclick=()=>{S.i++;if(S.i>=S.qs.length)endGame();else{renderQ();scrollTo({top:0,behavior:'smooth'});}};
    fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

/* ================= question renderers =================
   Each returns {ready(), check() -> {ok, note} | null, lock()?, instant?}; instant ones call done(ok, note) themselves. */
const R={};
R.mcq=(q,body,upd,done)=>{
  const tf=q.type==='tf';const box=el('div','opts'+(tf?' tf grid2':' text'));body.appendChild(box);
  const btns=q.o.map((t,i)=>{const b=el('button','opt',tf?t:`<span class="k">${'ABCD'[i]}</span><span>${t}</span>`);box.appendChild(b);return b;});
  btns.forEach((b,i)=>b.onclick=()=>{btns.forEach(x=>x.disabled=true);btns[q.a].classList.add('ok');if(i!==q.a)b.classList.add('bad');
    const w=q.whyNot&&q.whyNot[i];done(i===q.a,w?(tf?w:`<b>${'ABCD'[i]} is not right:</b> ${w}`):'');});
  return{instant:true,ready:()=>false};
};
R.tf=R.mcq;
/* typed answer on the on-screen keypad */
R.type=(q,body,upd)=>{
  const vars=q.vars||'';let txt='',locked=false;
  const box=el('div','ansbox');body.appendChild(box);
  const nudge=el('div','nudge hidden');
  /* calculator layout: digits on the left, operations on the right, the question's letters on the bottom row */
  const keys=q.num?[...'789','⌫',...'456','C',...'123','−','0','.','/','']
    :[...'789','(',')','⌫',...'456','+','−','C',...'123','×','÷','/','0','.',...vars.split(''),...(q.sq?['²']:[])];
  while(!q.num&&keys.length%6)keys.push('');
  const kp=el('div','kp');body.appendChild(kp);body.appendChild(nudge);
  keys.forEach(k=>{if(!k){kp.appendChild(el('span'));return;}const b=el('button',/[a-z]/.test(k)?'l':k==='⌫'||k==='C'?'del':/[0-9.]/.test(k)?'':'op',k);b.type='button';
    b.onclick=()=>{if(locked)return;sfx.tap();if(k==='⌫')txt=txt.slice(0,-1);else if(k==='C')txt='';else if(txt.length<24)txt+=k;nudge.classList.add('hidden');paint();upd();};kp.appendChild(b);});
  if(q.num)kp.style.gridTemplateColumns='repeat(4,1fr)';
  function paint(){box.innerHTML=(q.pre?`<span class="unit" style="margin:0 10px 0 0">${q.pre}</span>`:'')+(q.unitL&&txt?`<span>${q.unitL}</span>`:'')+(txt?`<span>${txt}</span>`:'<span class="ph">Tap the keys to type your answer</span>')+(locked?'':'<span class="cur"></span>')+(q.unit&&txt?`<span class="unit">${q.unit}</span>`:'');}
  paint();
  const V=q.num?'':vars;
  return{ready:()=>txt.length>0,lock(){locked=true;kp.querySelectorAll('button').forEach(b=>b.disabled=true);const c=box.querySelector('.cur');if(c)c.remove();},
    check(){
      if(toJS(txt,V)==null){nudge.innerHTML='🤔 I can\'t read that as maths yet. Check the signs and brackets, then press <b>Check</b> again.';nudge.classList.remove('hidden');return null;}
      const right=q.ans.find(a=>sameValue(txt,a,V));
      if(right!=null){
        if(q.simplest&&!q.ans.some(a=>terms(a)===terms(txt))){nudge.innerHTML='👍 That has the right value, but it is not in its <b>simplest form</b> yet. '+(q.num?'Divide the top and bottom by the same number':'Collect the like terms')+', then press <b>Check</b> again.';nudge.classList.remove('hidden');return null;}
        box.classList.add('ok');return{ok:true};}
      box.classList.add('bad');box.insertAdjacentHTML('beforeend',`<span class="unit" style="color:#0f7a40">✔ ${q.ans[0]}${q.unit?q.unit:''}</span>`);
      const m=Object.keys(q.mist||{}).find(k=>sameValue(txt,k,V));
      return{ok:false,note:m!=null?q.mist[m]:''};}};
};
/* tap tiles in order to build an expression */
R.tiles=(q,body,upd)=>{
  let seq=[],locked=false;const slot=el('div','slot');body.appendChild(slot);const tl=el('div','tiles');body.appendChild(tl);
  const paint=()=>{slot.innerHTML=seq.length?seq.map(t=>`<span>${t}</span>`).join(''):'<i>Tap the tiles in order to build your answer</i>';};
  shuffle(q.tiles).forEach(t=>{const b=el('button','tile',t);b.onclick=()=>{if(locked)return;sfx.tap();seq.push(t);paint();upd();};tl.appendChild(b);});
  const del=el('button','tile','⌫');del.onclick=()=>{if(locked)return;seq.pop();paint();upd();};tl.appendChild(del);paint();
  return{ready:()=>seq.length>0,lock(){locked=true;tl.querySelectorAll('button').forEach(b=>b.disabled=true);},
    check(){const n=a=>a.join('').replace(/\s+/g,'');const ok=q.answers.some(a=>n(a)===n(seq));slot.classList.add(ok?'ok':'bad');
      if(!ok)slot.insertAdjacentHTML('beforeend',`<span style="font-size:18px;color:#0f7a40;margin-left:10px">✔ ${q.model}</span>`);return{ok};}};
};
/* number line for an inequality: tap where the circle goes, pick open/closed and the arrow's direction */
R.line=(q,body,upd)=>{
  const lo=q.lo??-5,hi=q.hi??5,W=640,X=n=>40+(n-lo)*(W-80)/(hi-lo);let at=null,closed=null,dir=null,locked=false;
  const svg=el('div');body.appendChild(svg);
  const ctl=el('div','nlc',`<button data-c="0">○ Open circle</button><button data-c="1">● Closed circle</button><button data-d="-1">⬅ Arrow left</button><button data-d="1">Arrow right ➡</button>`);body.appendChild(ctl);
  body.appendChild(el('div','hint','Tap a number to put the circle there, then choose the circle and the arrow.'));
  function draw(show){let s=`<svg class="nl" viewBox="0 0 ${W} 120" width="${W}" height="120">`;
    if(show){at=q.at;closed=q.closed;dir=q.dir;} /* after a mistake: show the correct answer, in green */
    const col=show?'#18a058':'#e06a1b';
    if(at!=null&&dir!=null){const x2=dir>0?W-14:14;s+=`<line x1="${X(at)}" y1="50" x2="${x2}" y2="50" stroke="${col}" stroke-width="7"/><path d="M${x2},50 l${dir>0?-16:16},-11 v22 z" fill="${col}"/>`;}
    s+=`<line x1="20" y1="50" x2="${W-20}" y2="50" stroke="#1f2433" stroke-width="3"/>`;
    for(let n=lo;n<=hi;n++)s+=`<g class="tk" data-n="${n}"><rect x="${X(n)-22}" y="20" width="44" height="90" fill="transparent"/><line x1="${X(n)}" y1="40" x2="${X(n)}" y2="60" stroke="#1f2433" stroke-width="3"/><text x="${X(n)}" y="92" text-anchor="middle" font-size="20" font-weight="800" fill="#1f2433" font-family="sans-serif">${n<0?'−'+(-n):n}</text></g>`;
    if(at!=null)s+=`<circle cx="${X(at)}" cy="50" r="12" fill="${closed?col:'#fff'}" stroke="${col}" stroke-width="5"/>`;
    if(show)s+=`<text x="${W/2}" y="16" text-anchor="middle" font-size="17" font-weight="800" fill="#18a058" font-family="sans-serif">✔ The correct answer</text>`;
    svg.innerHTML=s+'</svg>';svg.querySelectorAll('.tk').forEach(g=>g.onclick=()=>{if(locked)return;sfx.tap();at=+g.dataset.n;paint();});}
  function paint(){draw(false);ctl.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',closed!=null&&+b.dataset.c===+closed));ctl.querySelectorAll('[data-d]').forEach(b=>b.classList.toggle('on',+b.dataset.d===dir));upd();}
  ctl.onclick=e=>{const b=e.target.closest('button');if(!b||locked)return;sfx.tap();if(b.dataset.c!=null)closed=b.dataset.c==='1';if(b.dataset.d!=null)dir=+b.dataset.d;paint();};
  paint();
  return{ready:()=>at!=null&&dir!=null&&closed!=null,lock(){locked=true;ctl.querySelectorAll('button').forEach(b=>b.disabled=true);},
    check(){const ok=at===q.at&&closed===q.closed&&dir===q.dir;draw(!ok);
      const note=ok?'':at!==q.at?`The circle goes at <b>${q.at<0?'−'+(-q.at):q.at}</b>, the number in the inequality.`:closed!==q.closed?(q.closed?'≤ and ≥ include the number, so the circle is <b>closed</b>.':'&lt; and &gt; do not include the number, so the circle is <b>open</b>.'):`The arrow points to the ${q.dir>0?'<b>bigger</b> numbers (right)':'<b>smaller</b> numbers (left)'}.`;
      return{ok,note};}};
};
const PAIRC=['#e06a1b','#6a45d8','#17935b','#2c66cf','#d4329a','#c9a000','#0aa5a5'];
R.match=(q,body,upd)=>{
  const wrap=el('div','match');body.appendChild(wrap);const L=el('div','mcol'),Rc=el('div','mcol');wrap.append(L,Rc);
  const lefts=q.pairs.map((p,i)=>({i,t:p[0]}));const rights=shuffle(q.pairs.map((p,i)=>({i,t:p[1]})));
  const link={};let selL=null;
  const lb=lefts.map(o=>{const b=el('button','mi',`<span class="dot"></span><span>${o.t}</span>`);L.appendChild(b);return b;});
  const rb=rights.map(o=>{const b=el('button','mi',`<span class="dot"></span><span>${o.t}</span>`);Rc.appendChild(b);return b;});
  function paint(){lb.forEach((b,li)=>{const linked=link[li]!=null;b.classList.toggle('sel',selL===li);b.querySelector('.dot').style.background=linked?PAIRC[li%PAIRC.length]:'';b.style.borderColor=linked?PAIRC[li%PAIRC.length]:'';});
    rb.forEach((b,ri)=>{const li=Object.keys(link).find(k=>link[k]===ri);b.querySelector('.dot').style.background=li!=null?PAIRC[li%PAIRC.length]:'';b.style.borderColor=li!=null?PAIRC[li%PAIRC.length]:'';});upd();}
  lb.forEach((b,li)=>b.onclick=()=>{sfx.tap();if(link[li]!=null&&selL!==li){delete link[li];}selL=selL===li?null:li;paint();});
  rb.forEach((b,ri)=>b.onclick=()=>{if(selL==null){const li=Object.keys(link).find(k=>link[k]===ri);if(li!=null){delete link[li];sfx.tap();paint();}return;}
    sfx.tap();Object.keys(link).forEach(k=>{if(link[k]===ri)delete link[k];});link[selL]=ri;
    selL=lb.findIndex((_,k)=>link[k]==null);if(selL<0)selL=null;paint();});
  selL=0;paint();
  return{ready:()=>Object.keys(link).length===lefts.length,
    lock(){lb.concat(rb).forEach(b=>b.disabled=true);},
    check(){let ok=true;lb.forEach((b,li)=>{const good=rights[link[li]].i===lefts[li].i;b.style.borderColor='';b.classList.remove('sel');b.classList.add(good?'ok':'bad');
      if(!good){ok=false;b.querySelector('span:last-child').insertAdjacentHTML('beforeend',`<span class="fix">✔ ${q.pairs[li][1]}</span>`);}});return{ok};}};
};
/* tap the items in order (smallest first) */
R.order=(q,body,upd)=>{
  let seq=[],locked=false;const ord=el('div','ord');body.appendChild(ord);const tl=el('div','tiles');body.appendChild(tl);
  const rows=q.items.map((_,i)=>{const r=el('div','row',`<span class="n">${i+1}</span><span class="v"></span>`);ord.appendChild(r);return r;});
  const btns=shuffle(q.items).map(t=>{const b=el('button','tile',t);b.onclick=()=>{if(locked||b.disabled)return;sfx.tap();seq.push(t);b.disabled=true;paint();upd();};tl.appendChild(b);return b;});
  const undo=el('button','tile','⌫');undo.onclick=()=>{if(locked||!seq.length)return;const t=seq.pop();btns.find(b=>b.textContent===t&&b.disabled).disabled=false;paint();upd();};tl.appendChild(undo);
  function paint(){rows.forEach((r,i)=>r.querySelector('.v').textContent=seq[i]||'');}
  return{ready:()=>seq.length===q.items.length,lock(){locked=true;tl.querySelectorAll('button').forEach(b=>b.disabled=true);},
    check(){let ok=true;rows.forEach((r,i)=>{const good=seq[i]===q.items[i];r.classList.add(good?'ok':'bad');if(!good){ok=false;r.insertAdjacentHTML('beforeend',`<span style="margin-left:auto;font-size:15px;color:#0f7a40">✔ ${q.items[i]}</span>`);}});return{ok};}};
};

/* ================= end ================= */
/* links to the lessons behind this level's mistakes, most mistakes first */
function revise(){const cnt={};S.wrong.forEach(q=>{if(LESSONS[q.l])cnt[q.l]=(cnt[q.l]||0)+1;});
  const ids=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b));if(!ids.length)return'';
  return `<div class="revise"><h4>📖 Lessons to revise</h4>`+ids.map(id=>`<a href="maths/${LESSONS[id][0]}.html"><span class="n">Lesson ${+id.slice(1)}</span>${LESSONS[id][1]}<span class="c">${cnt[id]} mistake${cnt[id]>1?'s':''}</span></a>`).join('')+'</div>';}
function endGame(){
  hud();const n=S.qs.length,pct=Math.round(S.right/n*100);const stars=pct>=90?3:pct>=70?2:pct>=40?1:0;
  track('quizRun',{mode:S.mode,right:S.right,total:n,score:S.score,stars});track('quizState',S.mode,null);
  const key='sq_best_'+S.mode;const prev=store.get(key,null);if(S.mode!==RETRY&&(!prev||pct>prev.pct))store.set(key,{pct,stars});
  const msg=stars===3?'Legendary! You\'re exam-ready! 🏆':stars===2?'Great job! A little more practice and you\'ll ace it!':stars===1?'Good start! Practise your mistakes to level up.':'Keep going, every try makes your brain stronger! 💪';
  const c=$('#endCard');c.innerHTML=`<div style="font-size:15px;font-weight:800;color:var(--muted);letter-spacing:.1em;text-transform:uppercase">Level complete</div>
    <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?'on':''}" style="animation-delay:${i*.2}s">⭐</span>`).join('')}</div>
    <div class="bigscore" style="color:#e06a1b">${S.score} pts</div><p style="font-size:18px;font-weight:700">${msg}</p>
    <div class="endgrid"><div><b>${S.right}/${n}</b>correct</div><div><b>${pct}%</b>accuracy</div><div><b>🔥 ${S.best}</b>best streak</div></div>
    ${revise()}<div class="endbtns"></div>`;
  const bt=c.querySelector('.endbtns');
  if(S.wrong.length){const r=el('button','go',`🔁 Practise my ${S.wrong.length} mistake${S.wrong.length>1?'s':''}`);r.onclick=()=>start(RETRY,shuffle(S.wrong));bt.appendChild(r);}
  const again=el('button','ghostbtn','▶ Play again');const mode=S.mode;again.onclick=()=>{const m=MODES.find(x=>x.id===mode);start(mode,m?(m.boss?m.pick():shuffle(m.pick())):shuffle(S.qs));};bt.appendChild(again);
  const home=el('button','ghostbtn','🏠 Menu');home.onclick=()=>show('menu');bt.appendChild(home);
  show('end');sfx.win();if(stars>=2){confetti(150);setTimeout(()=>confetti(120,innerWidth*.25,innerHeight*.4),400);setTimeout(()=>confetti(120,innerWidth*.75,innerHeight*.4),800);}
}
renderMenu();
</script>
