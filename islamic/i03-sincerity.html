<meta charset="utf-8">

<script type="module" src="../src/account.js" data-account></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b8862b">

<title>Sincerity, intention and Hijra</title>
<link rel="stylesheet" href="../lessons/engine.css">
<style>
/* the choices inside an "underline the right ending" question, with their sounds (🔤) */
.opt{border-radius:6px;padding:0 3px;background:linear-gradient(#e04848,#e04848) no-repeat right bottom/0% 5px;transition:background-size 1.1s ease-in-out}
body.snd-mode .ax:not(.en) .opt[data-tr]{padding-bottom:6px;display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;line-height:1.25}
body.snd-mode .ax:not(.en) .opt[data-tr]::after{content:attr(data-tr);direction:ltr;unicode-bidi:isolate;font-family:"Avenir Next","Nunito","Segoe UI",system-ui,sans-serif;
  font-size:max(12px,.45em);font-weight:800;color:#2c66cf;line-height:1.1}
.ul .ul-ans{background-size:100% 5px;color:#0f7a40}
.ul .ax.en .ul-ans{background-position:left bottom}
.ul .opt:not(.ul-ans){color:#a8a1b8}
</style>
</head>
<body>
<script src="../lessons/engine.js"></script>
<script src="islamic.js"></script>
<script>
/* Islamic Studies Lesson 3 · Hadith (الحديث وعلومه) · Worksheet Q3 (a) 1–4 and Q3 (b).
   Sincerity (الإخلاص), intention (النية), showing off (الرياء), the Hijra and the two conditions for a deed.
   Q3 (a) is "underline the right ending": the three choices sit inside the question and the right one is underlined. */
const WS='Worksheet · Q3 · ';
/* a choice inside the question; right = the one to underline */
const op=(t,tr,right)=>`<span class="opt${right?' ul-ans':''}"${tr?` data-tr="${escA(tr)}"`:''}>${t}</span>`;
const UL=['ضع خطا تحت','da\' khattan taht','underline the right choice'];
/* after the clue card: draw the underline under the right choice, right to left like a pen */
async function underline(w,c,text){c.classList.add('ul');beep(640,.08);point(c.querySelector('.ul-ans'));
  say(`On paper, draw a line <b>under</b> ${text}. Just one line, under the right choice.`);await w(2600);unpoint();}
const FRUITS=[
  {e:'✅',word:'Deeds',a:'صحة الأعمال',bl:[['صحة','sihhat','validity of'],['الأعمال','al-a\'maal','deeds']],en:'your deeds are valid and accepted'},
  {e:'🛟',word:'Dangers',a:'النجاة من الفتن',bl:[['النجاة','an-najaat','being saved'],['من','min','from'],['الفتن','al-fitan','trials']],en:'being saved from trials'},
  {e:'🛡️',word:'Devil',a:'العصمة من الشيطان',bl:[['العصمة','al-\'isma','protection'],['من','min','from'],['الشيطان','ash-shaytaan','Shaytan']],en:'protection from Shaytan'},
  {e:'🤝',word:'Day',a:'نيل شفاعة النبي ﷺ',bl:[['نيل','nayl','earning'],['شفاعة','shafaa\'at','the intercession of'],['النبي ﷺ','an-nabee','the Prophet ﷺ']],en:'earning the intercession of the Prophet ﷺ on the Day of Judgement'}];

Lesson.start(Object.assign({}, ISLAMIC, {
  id:'i03', num:3, part:'Hadith · الحديث', emoji:'🤲', title:'Sincerity, intention and Hijra',
  intro:`Assalaamu alaykum! It's <b>Hudhud</b> again 🐦 Today: <b>sincerity</b>, <b>intention</b> and the <b>Hijra</b>, Question 3 of your sheet. Press <b>Start</b>!`,
  scenes:[
/* 0 */ {t:'Why do you do it?',run:async w=>{
  say(`Two boys clean the mosque. They do exactly the same job. But Allah gives them very different rewards. Why?`);await w(3400);
  const P=[{x:40,e:'🧒🧹',tag:'💖',t:'Boy 1',d:'He does it <b>only for Allah</b>.',col:'#18a058'},{x:500,e:'🧒🧹',tag:'🎭👏',t:'Boy 2',d:'He does it so people <b>praise him</b>.',col:'#e04848'}];
  const els=P.map(p=>mk('is-card',`left:${p.x}px;top:14px;width:420px;height:150px;text-align:center;border-color:${p.col}`,
    `<div style="font-size:50px">${p.e} <span class="tg">${p.tag}</span></div><div style="font-size:21px;font-weight:800;color:${p.col}">${p.t}</div><div style="font-size:18px;font-weight:700;color:#3a3f52">${p.d}</div>`));
  for(const [i,e] of els.entries()){pop(e);point(e);loop(e.querySelector('.tg'),[{transform:'scale(1)'},{transform:'scale(1.2)'}],600,{direction:'alternate'});
    say(i?`The second boy does it so people will see him and <b>praise</b> him.`:`The first boy does it <b>only for Allah</b>. Nobody needs to see him.`);await w(2800);}
  say(`The difference is inside the heart. Here are the three words for it.`);await w(2200);
  const Wd=[['الإخلاص','al-ikhlaas','sincerity','doing good deeds only for Allah','💖','#18a058'],['النية','an-niyya','intention','the reason in your heart','🎯','#2c66cf'],['الرياء','ar-riyaa\'','showing off','doing it to be seen: the opposite','🎭','#e04848']];
  for(const [i,[a,s,m,d,e,col]] of Wd.entries()){
    const c=mk('is-card',`left:${30+i*306}px;top:190px;width:286px;height:200px;text-align:center;border-color:${col}`,
      `<div style="font-size:44px">${e}</div><div class="ar-font" dir="rtl" style="font-size:38px;font-weight:700;color:${col};line-height:1.2">${a}</div>`+
      `<div style="font-size:15px;font-weight:800;color:#2c66cf">${s}</div><div style="font-size:19px;font-weight:800;color:#5a3c00">${m}</div><div style="font-size:15px;font-weight:700;color:#626a80">${d}</div>`);
    pop(c);point(c);beep(520+i*90,.08);
    say([`${aw(a,s)} means <b>sincerity</b>: doing good deeds <b>only for Allah</b>. That's the first boy.`,
      `${aw(a,s)} means <b>intention</b>: the reason in your heart, <b>why</b> you do something.`,
      `${aw(a,s)} means <b>showing off</b>: doing good so people see you. It's the <b>opposite</b> of sincerity. That's the second boy.`][i]);await w(3600);}
  unpoint();
  const h=mk('is-why','left:130px;top:410px;width:700px;text-align:center;font-size:20px',
    `The Prophet ﷺ said: ${ar(`إنما الأعمال بالنيات`,'Actions are judged by intentions.','innamal a\'maalu bin-niyyaat','ar-font')}`);pop(h);point(h);
  say(`The Prophet ﷺ said: ${ar('إنما الأعمال بالنيات','Actions are judged by intentions.')} That means <b>actions are judged by intentions</b>. The famous hadith of intentions starts like this.`);await w(4400);unpoint();}},

/* 1 */ {t:'The Hijra (Q3 a 1)',run:async w=>{
  say(`Question 3 a is a new kind of question. Each sentence has <b>three choices</b> in brackets. You draw a line under the right one.`);await w(3200);
  await clueCard(w,{src:WS+'(a) · 1',kind:UL,
    q:`${kw('ترك بلد','tark balad')} الشرك إلى بلد الإسلام ( ${op('النية','an-niyya')} – ${op('الهجرة','al-hijra',1)} – ${op('الإخلاص','al-ikhlaas')} )`,
    en:`${kw('Leaving the land')} of shirk for the land of Islam ( ${op('intention')} – ${op('Hijra',0,1)} – ${op('sincerity')} )`,
    keys:[`${aw('ترك بلد','tark balad')} means <b>leaving a land</b>: moving from one country to another. Moving away for Allah has a special name.`],
    clue:`<span class="ar-font" dir="rtl">ترك بلد</span> → 🏠➡️🐪➡️🕌 → Hijra`,answer:[['الهجرة','al-hijra','migration, the Hijra']],blockSize:40,
    why:`The Prophet ﷺ made the Hijra from Makkah to Madinah. Leaving a land = ${aw('الهجرة','al-hijra')}.`}).then(c=>underline(w,c,aw('الهجرة','al-hijra')));
  await w(800);}},

/* 2 */ {t:'Good company (Q3 a 2)',run:async w=>{
  const c=await clueCard(w,{src:WS+'(a) · 2',kind:UL,
    q:`من ${kw('الوسائل','al-wasaa\'il')} التي ${kw('تعين','tu\'een')} على ${kw('الإخلاص','al-ikhlaas')} ( ${op('مصاحبة الأخيار','musaahabat al-akhyaar',1)} – ${op('كثرة المال','kathrat al-maal')} – ${op('الرياء','ar-riyaa\'')} )`,
    en:`One of the ${kw('things')} that ${kw('help')} ${kw('sincerity')} ( ${op('keeping company with good people',0,1)} – ${op('lots of money')} – ${op('showing off')} )`,
    keys:[`${aw('الوسائل','al-wasaa\'il')} means <b>ways</b> or <b>things</b>.`,`${aw('تعين','tu\'een')} means <b>help</b>.`,`And ${aw('الإخلاص','al-ikhlaas')}, <b>sincerity</b>. So: what <b>helps</b> you be sincere?`],
    clue:`<span class="ar-font" dir="rtl">الوسائل … تعين</span> → 👫😇 → good company`,answer:[['مصاحبة','musaahabat','keeping company with'],['الأخيار','al-akhyaar','good people']],blockSize:36,
    why:`Good friends remind you to do things for Allah. Money doesn't help, and ${aw('الرياء','ar-riyaa\'')}, showing off, is the opposite!`});
  await underline(w,c,aw('مصاحبة الأخيار','musaahabat al-akhyaar'));}},

/* 3 */ {t:'Two conditions (Q3 a 3)',run:async w=>{
  say(`For a good deed to be accepted by Allah, it needs <b>two</b> things. Think of a door with <b>two locks</b>.`);await w(3000);
  const door=mk('','left:400px;top:30px;width:160px;height:230px;border-radius:14px 14px 4px 4px;background:#b8862b;border:5px solid #7a4a00;text-align:center;font-size:44px;line-height:72px','🔒<br>🔒<br>🚪');pop(door);
  const K=[{x:40,e:'💖',a:'خالصا لله',s:'khaalisan lillaah',m:'purely for Allah',col:'#18a058'},{x:620,e:'📖',a:'موافقا لسنة النبي ﷺ',s:'muwaafiqan li-sunnat an-nabee',m:'following the Sunnah of the Prophet ﷺ',col:'#2c66cf'}];
  const ks=[];
  for(const [i,k] of K.entries()){
    const c=mk('is-card',`left:${k.x}px;top:50px;width:300px;height:170px;text-align:center;border-color:${k.col}`,
      `<div style="font-size:40px">🔑${k.e}</div><div class="ar-font" dir="rtl" style="font-size:${i?26:34}px;font-weight:700;color:${k.col};line-height:1.3">${k.a}</div><div style="font-size:14px;font-weight:800;color:#2c66cf">${k.s}</div><div style="font-size:16px;font-weight:800;color:#5a3c00">${k.m}</div>`);
    pop(c);point(c);ks.push(c);
    say(i?`Key 2: ${aw('موافقا لسنة النبي ﷺ','muwaafiqan li-sunnat an-nabee')}, <b>following the Sunnah</b>: done the way the Prophet ﷺ taught.`:`Key 1: ${aw('خالصا لله','khaalisan lillaah')}, <b>purely for Allah</b>. That's sincerity.`);await w(3400);}
  unpoint();
  const one=mk('is-why','left:130px;top:290px;width:700px;text-align:center',`🔑 One key only → 🔒 the door stays shut ❌`);pop(one);
  say(`With only one key, the door stays shut.`);await w(2200);
  const two=mk('is-why','left:130px;top:350px;width:700px;text-align:center;border-color:#18a058;background:#e6f7ee',`🔑 + 🔑 Both keys → 🚪 open ✅ the deed is accepted`);pop(two);
  door.innerHTML='🔓<br>🔓<br>✨';beep(700,.1);yay();
  say(`With <b>both</b> keys, the door opens. Two conditions: for Allah <b>and</b> following the Sunnah.`);await w(3200);
  const t=mk('is-clue','left:130px;top:420px;width:700px;text-align:center;white-space:normal',`Remember: <b>two</b> conditions = <b>two</b> keys = the answer with <span class="ar-font" dir="rtl">و</span> (and)`);pop(t);
  say(`Remember: two conditions, two keys. In the exam, pick the answer that has <b>both</b>, joined by ${aw('و','wa')}, <b>and</b>.`);await w(3400);}},

/* 4 */ {t:'Pick both (Q3 a 3)',run:async w=>{
  const c=await clueCard(w,{src:WS+'(a) · 3',kind:UL,
    q:`من ${kw('شروط','shuroot')} صحة العمل أن يكون ( ${op('خالصا لله','khaalisan lillaah')} – ${op('موافقا لسنة النبي','muwaafiqan li-sunnat an-nabee')} – ${op('خالصا لله وموافقا لسنة النبي','khaalisan lillaah wa muwaafiqan li-sunnat an-nabee',1)} )`,
    en:`A ${kw('condition')} for a deed to be accepted is that it is ( ${op('purely for Allah')} – ${op('following the Sunnah')} – ${op('purely for Allah and following the Sunnah',0,1)} )`,
    keys:[`${aw('شروط','shuroot')} means <b>conditions</b>: more than one! So one key is not enough. Pick the choice with <b>both</b> keys.`],
    clue:`<span class="ar-font" dir="rtl">شروط</span> → 🔑💖 + 🔑📖 → both`,answer:[['خالصا','khaalisan','purely'],['لله','lillaah','for Allah'],['وموافقا','wa muwaafiqan','and following'],['لسنة','li-sunnat','the Sunnah of'],['النبي','an-nabee','the Prophet']],blockSize:28,
    why:`The first two choices are each only <b>one</b> key. The third has both, joined by ${aw('و','wa')}.`});
  await underline(w,c,`the <b>last</b> choice, the long one with both keys`);}},

/* 5 */ {t:'Gets it (Q3 a 4)',run:async w=>{
  say(`Later in the hadith of intentions, the Prophet ﷺ talks about someone who moves away for a <b>worldly</b> thing, like money, to get it.`);await w(3600);
  const v=mk('is-card','left:180px;top:20px;width:600px;text-align:center',
    `<div style="font-size:52px">🧳➡️💰</div><div class="ar-font" dir="rtl" style="font-size:52px;font-weight:700;color:#5a3c00">${aw('يصيبها','yuseebuhaa')}</div><div style="font-size:21px;font-weight:800;color:#2c66cf">= gets it 🎁</div>`);pop(v);point(v);
  say(`The hadith uses the word ${aw('يصيبها','yuseebuhaa')}. It means <b>gets it</b>: he gets the worldly thing he wanted.`);await w(3600);
  unpoint();clear();
  const c=await clueCard(w,{src:WS+'(a) · 4',kind:UL,
    q:`معنى ( ${kw('يصيبها','yuseebuhaa')} ) : ( ${op('يحصل عليها','yahsulu \'alayhaa',1)} – ${op('يحبها','yuhibbuhaa')} – ${op('يبتعد عنها','yabta\'idu \'anhaa')} )`,
    en:`The meaning of ( ${kw('yuseebuhaa')} ): ( ${op('gets it',0,1)} – ${op('loves it')} – ${op('keeps away from it')} )`,
    keys:[`The keyword is the word in brackets: ${aw('يصيبها','yuseebuhaa')}. It means <b>gets it</b>.`],
    clue:`<span class="ar-font" dir="rtl">يصيبها</span> → 🎁 → gets it`,answer:[['يحصل','yahsulu','he gets'],['عليها','\'alayhaa','it']],blockSize:40,
    why:`Not "loves it", not "keeps away from it". ${aw('يصيبها','yuseebuhaa')} = ${aw('يحصل عليها','yahsulu \'alayhaa')}, <b>gets it</b>.`});
  await underline(w,c,aw('يحصل عليها','yahsulu \'alayhaa'));}},

/* 6 */ {t:'Four fruits of sincerity (Q3 b)',run:async w=>{
  const q=mk('is-card','left:30px;top:8px;width:900px',`<div class="src">${WS}(b)</div><div class="q" style="font-size:28px">${ar(
    `اكتب ${kw('ثمرات','thamaraat')} ${kw('الإخلاص','al-ikhlaas')}`,`Write the ${kw('benefits')} of ${kw('sincerity')}`,'','blk')}</div>`);pop(q);
  say(`Question 3 b: ${ar('اكتب ثمرات الإخلاص','Write the benefits of sincerity.')}`);await w(2600);
  q.classList.add('lit');const K=q.querySelectorAll('.kw');point(K[0]);
  say(`${aw('ثمرات','thamaraat')} means <b>fruits</b> 🍎: the <b>benefits</b>, the good things you get.`);await w(3000);
  point(K[1]);say(`And ${aw('الإخلاص','al-ikhlaas')}: <b>sincerity</b>. There are four dotted lines, so write <b>four</b> answers.`);await w(3200);unpoint();
  const tip=mk('is-clue','left:200px;top:150px;width:560px;text-align:center;white-space:normal',`Remember the <b>4 Ds</b>: <b>D</b>eeds · <b>D</b>angers · <b>D</b>evil · <b>D</b>ay of Judgement`);pop(tip);
  say(`Memory trick: the <b>four Ds</b>. Deeds, Dangers, Devil, Day of Judgement.`);await w(3200);
  tip.remove();
  for(let i=0;i<4;i++){const F=FRUITS[i],y=150+i*92;
    const ic=mk('',`left:860px;top:${y}px;width:70px;text-align:center;font-size:46px`,F.e);pop(ic);
    const lab=mk('',`left:850px;top:${y+56}px;width:90px;text-align:center;font-size:13px;font-weight:800;color:#7a4a00`,F.word);pop(lab);
    const bl=ansBlocks(30,y,820,F.bl.map(b=>[...b]),{size:26,show:false});
    await revealBlocks(w,bl,{say:false,wait:200});point(ic);
    say(`${['One','Two','Three','Four'][i]}, <b>${F.word}</b>: ${aw(F.a)}: ${F.en}.`);await w(3600);}
  unpoint();}},

/* 7 */ {t:'Spot the difference',run:async w=>{
  say(`Watch out! Two questions on your sheet both ask for ${aw('ثمرات','thamaraat')}, fruits. The <b>second</b> keyword tells you which one.`);await w(3600);
  const C=[{x:30,src:'Q2 (b)',q:`دون أربعة من ${kw('ثمرات','thamaraat')} الإيمان ${kw('بالملائكة','bil-malaa\'ika')} .`,en:`Write down four of the ${kw('benefits')} of believing in ${kw('the angels')}.`,
      e:'👼',key:'الملائكة',ks:'al-malaa\'ika',m:'angels',ans:'Lovely Manners Get Thanks',col:'#2c66cf'},
    {x:490,src:'Q3 (b)',q:`اكتب ${kw('ثمرات','thamaraat')} ${kw('الإخلاص','al-ikhlaas')}`,en:`Write the ${kw('benefits')} of ${kw('sincerity')}`,
      e:'💖',key:'الإخلاص',ks:'al-ikhlaas',m:'sincerity',ans:'the 4 Ds: Deeds · Dangers · Devil · Day',col:'#18a058'}];
  for(const c of C){
    const k=mk('is-card lit',`left:${c.x}px;top:14px;width:440px;height:290px;border-color:${c.col}`,
      `<div class="src">Worksheet · ${c.src}</div><div class="q" style="font-size:24px">${ar(c.q,c.en,'','blk')}</div>`+
      `<div style="position:absolute;left:0;right:0;bottom:12px;text-align:center"><div style="font-size:44px">🍎 + ${c.e}</div>`+
      `<div class="ar-font" dir="rtl" style="font-size:28px;font-weight:700;color:${c.col}">ثمرات + ${c.key}</div>`+
      `<div style="font-size:17px;font-weight:800;color:#5a3c00;margin-top:2px">→ ${c.ans}</div></div>`);
    pop(k);point(k);say(`${c.src.replace('(b)','b')}: fruits plus ${aw(c.key,c.ks)}, <b>${c.m}</b> ${c.e}. Then you write <b>${c.ans}</b>.`);await w(3800);}
  unpoint();
  const t=mk('is-why','left:130px;top:330px;width:700px;text-align:center;font-size:20px',
    `👼 <span class="ar-font" dir="rtl" style="font-size:28px">ثمرات + الملائكة</span> → angels' list<br>💖 <span class="ar-font" dir="rtl" style="font-size:28px">ثمرات + الإخلاص</span> → the 4 Ds`);pop(t);
  say(`So always read the word <b>after</b> ${aw('ثمرات','thamaraat')}. Angels or sincerity?`);await w(3200);}},

/* 8 */ {t:'Build the answers',run:async w=>{
  say(`Now build the answers with tiles. Arabic goes from <b>right to left</b>, so the first tile goes on the right.`);await w(3000);
  let r=await buildAR(w,{src:WS+'(a) · 3',q:`Build the answer with <b>both keys</b>: 🔑💖 <b>purely for Allah</b> + 🔑📖 <b>and following the Sunnah of the Prophet</b>`,
    tiles:[['النبي','an-nabee'],['لله','lillaah'],['كثرة','kathrat'],['خالصا','khaalisan'],['لسنة','li-sunnat'],['وموافقا','wa muwaafiqan']],answer:['خالصا','لله','وموافقا','لسنة','النبي']});
  say(r.ok?`Excellent! ${aw('خالصا لله وموافقا لسنة النبي','khaalisan lillaah wa muwaafiqan li-sunnat an-nabee')}: both keys!`:`Nearly! It's ${aw('خالصا لله وموافقا لسنة النبي','khaalisan lillaah wa muwaafiqan li-sunnat an-nabee')}. ${aw('خالصا','khaalisan')} goes first, on the right.`);await w(3400);clear();
  r=await buildAR(w,{src:WS+'(b) · 2',q:`Build the second fruit: 🛟 <b>being saved from trials</b>`,
    tiles:[['الفتن','al-fitan'],['الشيطان','ash-shaytaan'],['النجاة','an-najaat'],['من','min']],answer:['النجاة','من','الفتن']});
  say(r.ok?`Brilliant! ${aw('النجاة من الفتن','an-najaat min al-fitan')}.`:`Look again: ${aw('النجاة من الفتن','an-najaat min al-fitan')}. Saved, from, trials.`);await w(3000);}},

/* 9 */ {t:'Trace it',run:async w=>{
  say(`Now trace some short answers with your finger. Go over the grey letters, from <b>right to left</b>.`);await w(3000);
  const W=[['الهجرة','al-hijra','the Hijra'],['الأخيار','al-akhyaar','good people'],['الفتن','al-fitan','trials']];
  for(const [a,s,m] of W){clear();say(`Trace ${aw(a,s)}, <b>${m}</b>. Press <b>Done</b> when you've finished.`);
