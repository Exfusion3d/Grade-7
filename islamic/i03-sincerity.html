<style>
/* the choices inside an "underline the right ending" question, with their sounds (🔤) */
.opt{border-radius:6px;padding:0 3px;background:linear-gradient(#e04848,#e04848) no-repeat right bottom/0% 5px;transition:background-size 1.1s ease-in-out}
body.snd-mode .ax:not(.en) .opt[data-tr]{padding-bottom:6px;display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;line-height:1.25}
body.snd-mode .ax:not(.en) .opt[data-tr]::after{content:attr(data-tr);direction:ltr;unicode-bidi:isolate;font-family:"Avenir Next","Nunito","Segoe UI",system-ui,sans-serif;
  font-size:max(12px,.45em);font-weight:800;color:#2c66cf;line-height:1.1}
.ul .ul-ans{background-size:100% 5px;color:#0f7a40}
.ul .ax.en .ul-ans{background-position:left bottom}
.ul .opt:not(.ul-ans){color:#a8a1b8}
/* the story: people, speech bubbles and the 📌 question tags */
.st-p{text-align:center;z-index:5}
.st-p .e{line-height:1.05;white-space:nowrap}
.st-p .nm{display:inline-block;margin-top:2px;background:#fff;border:2px solid #d9a441;border-radius:10px;padding:0 8px;font-size:15px;font-weight:800;color:#7a4a00}
.st-bub{background:#fff;border:3px solid #1f2433;border-radius:18px;padding:6px 12px;font-size:18px;font-weight:800;color:#1f2433;line-height:1.3;z-index:20;text-align:center}
.st-bub::after{content:'';position:absolute;top:100%;left:var(--tx,40px);margin-left:-10px;border:10px solid transparent;border-top-color:#1f2433}
.st-bub.up::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#1f2433}
.st-bub .ax:not(.en){font-size:1.25em}
.st-pin{text-align:center;border-color:#d9a441;box-shadow:0 6px 0 #e8c98a,0 10px 30px rgba(120,80,0,.25)}
.st-pin .pq{font-size:15px;font-weight:800;color:#a0742a;letter-spacing:.04em}
.st-pin .pk{font-size:28px;font-weight:700;margin:2px 0 4px;color:#1f2433}
.st-pin .pk .ax.en{font-size:22px}
.st-tag{background:#fff;border:3px solid;border-radius:14px;padding:4px 10px;text-align:center;font-weight:800;z-index:8}
.st-tag .ax:not(.en){font-size:30px}
.sm-card{position:absolute;background:#fff;border:3px solid #f0d9a8;border-radius:16px;box-shadow:0 4px 0 #f3e3c0;text-align:center;padding:6px 8px}
.sm-card .src{font-size:12px;font-weight:800;color:#a0742a;letter-spacing:.05em}
.sm-card .pic{font-size:32px;line-height:1.1}
.sm-card .cap{font-size:13px;font-weight:800;color:#626a80}
.sm-card .key{font-size:22px;font-weight:700;margin:2px 0}
.sm-card .key .ax.en{font-size:16px}
.sm-card .ans{font-weight:700;color:#0f7a40;line-height:1.3}
.sm-card .ans .ax.en{font-size:16px;color:#0f7a40}
</style>

<body>

<script>
/* Islamic Studies Lesson 3 · Hadith (الحديث وعلومه) · Worksheet Q3 (a) 1–4 and Q3 (b).
   Sincerity (الإخلاص), intention (النية), showing off (الرياء), the Hijra and the two conditions for a deed.
   Q3 (a) is "underline the right ending": the three choices sit inside the question and the right one is underlined. */
const WS='Worksheet · Q3 · ';
/* a choice inside the question; right = the one to underline */
const op=(t,tr,right)=>`<span class="opt${right?' ul-ans':''}"${tr?` data-tr="${escA(tr)}"`:''}>${t}</span>`;
const UL=['ضع خطا تحت','da\' khattan taht','underline the right choice'];
/* after the clue card: draw the underline under the right choice, right to left like a pen */
async function underline(w,c,text){c.classList.add('ul');beep(640,.08);point(c.querySelector('.ul-ans'));
  say(`On paper, draw a line <b>under</b> ${text}. Just one line, under the right choice.`);await w(2600);unpoint();}
const FRUITS=[
  {e:'✅',word:'Deeds',a:'صحة الأعمال',bl:[['صحة','sihhat','validity of'],['الأعمال','al-a\'maal','deeds']],en:'your deeds are valid and accepted'},
  {e:'🛟',word:'Dangers',a:'النجاة من الفتن',bl:[['النجاة','an-najaat','being saved'],['من','min','from'],['الفتن','al-fitan','trials']],en:'being saved from trials'},
  {e:'🛡️',word:'Devil',a:'العصمة من الشيطان',bl:[['العصمة','al-\'isma','protection'],['من','min','from'],['الشيطان','ash-shaytaan','Shaytan']],en:'protection from Shaytan'},
  {e:'🤝',word:'Day',a:'نيل شفاعة النبي ﷺ',bl:[['نيل','nayl','earning'],['شفاعة','shafaa\'at','the intercession of'],['النبي ﷺ','an-nabee','the Prophet ﷺ']],en:'earning the intercession of the Prophet ﷺ on the Day of Judgement'}];

/* ---------- the story "The Two Gardens": people, bubbles, scenery and the 📌 question tags ---------- */
function person(x,y,e,name,size=64){const p=mk('st-p',`left:${x}px;top:${y}px;width:130px`,`<div class="e" style="font-size:${size}px">${e}</div><div class="nm">${name}</div>`);pop(p);return p;}
const face=(p,e)=>{p.querySelector('.e').textContent=e;};
/* walk to (dx,dy) from where the person was placed, bobbing on the way */
function walk(p,dx,dy=0,ms=1500){const b=loop(p.querySelector('.e'),[{transform:'translateY(0)'},{transform:'translateY(-9px)'}],230,{direction:'alternate'});
  an(p,[{transform:`translate(${dx}px,${dy}px)`}],{duration:ms,easing:'ease-in-out'});setTimeout(()=>b.cancel(),ms);}
function bub(x,y,wd,html,tail=40,up){const b=mk('st-bub'+(up?' up':''),`left:${x}px;top:${y}px;width:${wd}px;--tx:${tail}px`,html);pop(b);return b;}
function glow(el,col='#ffd000'){return loop(el,[{filter:`drop-shadow(0 0 0 ${col})`},{filter:`drop-shadow(0 0 16px ${col})`}],700,{direction:'alternate'});}
function floatUp(x,y,list,n=6){for(let i=0;i<n;i++){const f=mk('',`left:${x+(i*37)%70-35}px;top:${y}px;font-size:28px;z-index:6;opacity:0`,list[i%list.length]);
  an(f,[{opacity:0,transform:'translateY(0)'},{opacity:1,offset:.2},{opacity:0,transform:'translateY(-150px)'}],{duration:1700,delay:i*260});}}
function shade(col,to,ms=1200){const d=mk('',`left:0;top:0;width:960px;height:520px;background:${col};opacity:0;z-index:4;pointer-events:none`);an(d,[{opacity:to}],{duration:ms});return d;}
/* a 📌 tag: the worksheet question, its keyword and the answer blocks, over a pale veil */
function pin(x,y,wd,lab,keyHTML,bl,size=32,pic=''){
  const veil=mk('',`left:0;top:0;width:960px;height:520px;background:rgba(255,248,232,.82);z-index:25`);an(veil,[{opacity:0},{opacity:1}],{duration:400});
  const c=mk('is-card lit st-pin',`left:${x}px;top:${y}px;width:${wd}px;z-index:30`,`<div class="pq">📌 ${lab}</div>${pic?`<div style="font-size:38px;line-height:1.1">${pic}</div>`:''}<div class="pk">${keyHTML}</div>`);
  const b=ansBlocks(0,0,0,bl.map(r=>[...r]),{size,show:false});b.style.cssText='position:relative;margin-top:6px;justify-content:center';c.appendChild(b);
  pop(c);beep(780,.1);return {c,b,off(){c.remove();veil.remove();}};}
const KW=(a,s,e)=>ar(kw(a,s),kw(e));

Lesson.start(Object.assign({}, ISLAMIC, {
  id:'i03', num:3, part:'Hadith · الحديث', emoji:'🤲', title:'Sincerity, intention and Hijra',
  intro:`Assalaamu alaykum! It's <b>Hudhud</b> again 🐦 Today: <b>sincerity</b>, <b>intention</b> and the <b>Hijra</b>, Question 3 of your sheet. Press <b>Start</b>!`,
  scenes:[
/* 0 */ {t:'Why do you do it?',run:async w=>{
  mk('',`left:0;top:0;width:960px;height:520px;background:linear-gradient(#cfeeff,#f4fbff 72%)`);
  mk('',`left:0;top:400px;width:960px;height:120px;background:linear-gradient(#9bd77a,#6fbf55)`);
  const t=mk('','left:0;top:16px;width:960px;text-align:center;font-size:44px;font-weight:800;color:#7a4a00','📖 The Two Gardens');pop(t);
  say(`Two boys do <b>exactly</b> the same good deed. But Allah gives them very different rewards. How can that be?`);await w(3400);
  const P=[{x:150,n:'Garden 1'},{x:590,n:'Garden 2'}],pots=[];
  for(const p of P){const g=mk('',`left:${p.x}px;top:330px;width:220px;height:90px;border-radius:50% 50% 12px 12px;background:#8a5a2b`);pop(g);
    const sp=mk('',`left:${p.x}px;top:250px;width:220px;text-align:center;font-size:70px`,'🌱');pop(sp,200);pots.push(sp);}
  say(`Picture two gardens. The same seeds, the same water, the same sunshine.`);await w(2800);
  pots[0].textContent='🌳';pop(pots[0]);an(pots[0],[{transform:'scale(1)'},{transform:'scale(1.7) translateY(-30px)'}],{duration:900});
  const fr=mk('',`left:150px;top:150px;width:220px;text-align:center;font-size:30px;opacity:0`,'🍎 🍊 🍐 🍋');an(fr,[{opacity:1}],{duration:500,delay:700});
  pots[1].textContent='🎈';pop(pots[1]);loop(pots[1],[{transform:'translateY(0)'},{transform:'translateY(-14px)'}],700,{direction:'alternate'});
  say(`One garden grows a real tree, full of fruit. The other grows only a shiny balloon, with nothing inside.`);await w(3600);
  const q=mk('is-why','left:180px;top:440px;width:600px;text-align:center;font-size:22px','🔒 The secret is hidden <b>inside the heart</b>.');pop(q);point(q);
  say(`The secret is something nobody can see: it's hidden <b>inside the heart</b>. Let's find out in a story. This is Question 3 of your sheet.`);await w(3800);unpoint();}},

/* 1 */ {t:'Story: Charity day',run:async w=>{
  mk('',`left:0;top:0;width:960px;height:520px;background:linear-gradient(#bfe6ff,#f2fbff 72%)`);
  mk('',`left:0;top:395px;width:960px;height:125px;background:linear-gradient(#9bd77a,#6fbf55)`);
  const sun=mk('','left:860px;top:14px;font-size:56px','☀️');loop(sun,[{transform:'rotate(0)'},{transform:'rotate(25deg)'}],2200,{direction:'alternate'});
  const ban=mk('','left:250px;top:12px;width:460px;text-align:center;padding:6px;border-radius:14px;background:#e06a1b;color:#fff;font-size:26px;font-weight:800;box-shadow:0 4px 0 #b44e0a','🎪 School Charity Day 🎪');pop(ban);
  mk('','left:380px;top:372px;width:200px;height:18px;background:#a8743a;border-radius:6px;box-shadow:0 4px 0 #7a4a20');
  mk('','left:395px;top:390px;width:12px;height:60px;background:#7a4a20');mk('','left:553px;top:390px;width:12px;height:60px;background:#7a4a20');
  const O=person(-140,300,'👦📦','Omar'),K=person(980,300,'🧒📦','Karim');
  say(`Story time! 📖 Meet two cousins, <b>Omar</b> and <b>Karim</b>. They're in the same class, and today is the school charity day.`);
  walk(O,370);walk(K,-560);await w(3600);
  say(`Both boys have the same job: carry the boxes of food to the charity table.`);
  walk(O,500,0,900);walk(K,-690,0,900);await w(1000);
  face(O,'👦');face(K,'🧒');const bx=mk('','left:380px;top:322px;width:200px;text-align:center;font-size:44px','📦📦');pop(bx);beep(500,.08);
  walk(O,340,0,800);walk(K,-520,0,800);await w(2400);
  face(K,'🧒📱');let b2=bub(560,150,300,`Quick, film me! 📸 Everyone will see how kind I am!`,230);floatUp(780,280,['👍','❤️','👏']);
  say(`Karim pulls out his phone. “Quick, film me! Everyone will see how kind I am!” He wants <b>likes</b> and <b>praise</b>.`);await w(4000);
  let b1=bub(130,150,300,`Nobody needs to see. I'm doing this for Allah. 💖`,110);const g=glow(O.querySelector('.e'));
  say(`Omar just keeps working. “Nobody needs to see. I'm doing this <b>for Allah</b>.”`);await w(3400);
  b1.remove();b2.remove();
  const ni=mk('st-tag',`left:330px;top:90px;width:300px;border-color:#2c66cf;color:#2c66cf;font-size:18px`,`<span style="font-size:30px">🎯</span> ${ar('النية','intention','an-niyya')}<div style="font-size:15px;color:#626a80">the reason in your heart</div>`);pop(ni);point(ni);
  say(`Same boxes, same table, same job. The difference is the reason in their hearts: ${aw('النية','an-niyya','intention')}, the <b>intention</b>.`);await w(4000);
  const ik=mk('st-tag',`left:80px;top:190px;width:250px;border-color:#18a058;color:#18a058;font-size:17px`,`<span style="font-size:30px">💖</span> ${ar('الإخلاص','sincerity','al-ikhlaas')}<div style="font-size:14px;color:#626a80">only for Allah</div>`);pop(ik);point(ik);
  say(`Omar has ${aw('الإخلاص','al-ikhlaas','sincerity')}, <b>sincerity</b>: doing good deeds <b>only for Allah</b>.`);await w(3400);
  const ri=mk('st-tag',`left:630px;top:190px;width:250px;border-color:#e04848;color:#e04848;font-size:17px`,`<span style="font-size:30px">🎭</span> ${ar('الرياء','showing off','ar-riyaa\'')}<div style="font-size:14px;color:#626a80">to be seen: the opposite</div>`);pop(ri);point(ri);
  say(`Karim has ${aw('الرياء','ar-riyaa\'','showing off')}, <b>showing off</b>: doing good so people see you. It's the <b>opposite</b> of sincerity.`);await w(3800);
  unpoint();ni.remove();ik.remove();ri.remove();
  b2=bub(540,170,320,`Omar, how do you do it? Don't you want people to clap for you? 👏`,250);
  say(`Karim is puzzled. “Omar, how do you do it? Don't you want people to clap for you?”`);await w(3200);
  b2.remove();const B=person(-140,300,'🧑','Bilal',56),Z=person(-140,300,'👦','Zayd',56);walk(B,140);walk(Z,235);
  b1=bub(150,160,330,`My good friends help me. They always remind me: do it for Allah!`,180);
  say(`Omar's friends <b>Bilal</b> and <b>Zayd</b> come over. “My good friends help me,” says Omar. “They always remind me: do it for Allah!”`);await w(4200);
  b1.remove();b2=bub(560,150,330,`I thought lots of money 💰 or showing off 🎭 would help!`,240);
  say(`“Oh!” says Karim. “I thought lots of <b>money</b> would help, or <b>showing off</b>!”`);await w(3000);
  const x1=mk('','left:640px;top:96px;font-size:50px;z-index:21','❌');pop(x1);const x2=mk('','left:770px;top:96px;font-size:50px;z-index:21','❌');pop(x2,250);boo();
  say(`No! Money doesn't make you sincere, and showing off is the <b>opposite</b>. It's <b>good friends</b> who help.`);await w(3400);
  b2.remove();x1.remove();x2.remove();
  const P=pin(150,60,660,'Question 3 (a) 2',KW(`الوسائل … تعين`,'al-wasaa\'il … tu\'een','things … help'),
    [['مصاحبة','musaahabat','keeping company with'],['الأخيار','al-akhyaar','good people']],40,'👦🧑👦');
  say(`📌 Here's <b>Question 3 a 2</b>! When you see ${aw('الوسائل','al-wasaa\'il','things')} and ${aw('تعين','tu\'een','help')}, things that <b>help</b> sincerity, think of Omar's good friends.`);await w(4400);
  await revealBlocks(w,P.b,{say:false,wait:300});
  say(`The answer: ${aw('مصاحبة الأخيار','musaahabat al-akhyaar','keeping company with good people')}: <b>keeping company with good people</b>. 👫`);await w(3400);
  unpoint();P.off();g.cancel();shade('#1d2d6b',.55,1500);
  say(`That evening, the cousins went to visit their grandfather, <b>Jiddo Yusuf</b>. And Karim had something to show him…`);await w(3200);}},

/* 2 */ {t:'Story: Jiddo\'s Hijra tale',run:async w=>{
  mk('',`left:0;top:0;width:960px;height:520px;background:linear-gradient(#141c48,#2f3f86 75%)`);
  mk('',`left:0;top:400px;width:960px;height:120px;background:linear-gradient(#b5463a,#8a2f27)`);
  const moon=mk('','left:60px;top:20px;font-size:54px','🌙');glow(moon,'#fff6b0');
  for(let i=0;i<12;i++){const s=mk('',`left:${150+i*67}px;top:${14+(i*53)%90}px;font-size:16px;color:#fff6b0`,'✦');loop(s,[{opacity:.3},{opacity:1}],600+i*90,{direction:'alternate'});}
  const lamp=mk('','left:460px;top:380px;font-size:40px','🪔');glow(lamp,'#ffb000');
  const J=person(415,270,'👴','Jiddo Yusuf',80),O=person(160,300,'👦','Omar'),K=person(680,300,'🧒📱','Karim');
  say(`That night, at Jiddo Yusuf's house. Karim can't wait to show his phone.`);await w(2800);
  let b=bub(560,170,300,`Jiddo! I got 50 likes today! 📱👍`,200);floatUp(745,280,['👍','❤️']);
  say(`“Jiddo! I got <b>fifty likes</b> today!”`);await w(2400);
  b.remove();b=bub(330,140,300,`Fifty likes! And what did you get from <b>Allah</b>? 🤔`,140);
  say(`Jiddo smiles. “Fifty likes! And what did you get from <b>Allah</b>?” Karim goes quiet.`);await w(3400);
  b.remove();face(K,'🧒❓');b=bub(330,140,300,`Let me tell you a true story about <b>intentions</b>.`,140);
  say(`“Let me tell you a true story,” says Jiddo, “about <b>intentions</b>.”`);await w(2800);b.remove();
  /* the map: Makkah on the right, Madinah on the left */
  const map=mk('',`left:0;top:0;width:960px;height:520px;background:linear-gradient(#ffe9b8,#f2c98a);z-index:9`);an(map,[{opacity:0},{opacity:1}],{duration:700});
  map.innerHTML=`<svg width="960" height="520" style="position:absolute;left:0;top:0"><path d="M790 330 C 640 420, 520 200, 330 300 S 200 330, 170 320" fill="none" stroke="#a0742a" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/></svg>`;
  for(const [x,y] of [[300,440],[620,450],[850,440],[80,450]])mk('',`left:${x}px;top:${y}px;font-size:34px`,'🌵',map);
  const mak=mk('st-tag',`left:700px;top:150px;width:220px;border-color:#e04848;color:#5a3c00;font-size:16px`,
    `<div style="font-size:50px">🕋</div><b>Makkah</b><div>${ar('بلد الشرك','the land of shirk','balad ash-shirk')}</div>`,map);pop(mak);point(mak);
  say(`Long ago in <b>Makkah</b>, most people worshipped idols instead of Allah. That is called <b>shirk</b>. The Muslims there were treated very badly.`);await w(4200);
  const mad=mk('st-tag',`left:40px;top:150px;width:220px;border-color:#18a058;color:#5a3c00;font-size:16px`,
    `<div style="font-size:50px">🌴🕌🌴</div><b>Madinah</b><div>${ar('بلد الإسلام','the land of Islam','balad al-islaam')}</div>`,map);pop(mad);point(mad);
  say(`So Allah allowed the Muslims to move to <b>Madinah</b>, a city whose people welcomed Islam.`);await w(3400);unpoint();
  const cam=mk('','left:760px;top:290px;font-size:56px;z-index:10','🐪');
  const bob=loop(cam,[{marginTop:'0px'},{marginTop:'-8px'}],300,{direction:'alternate'});
  an(cam,[{transform:'translate(0,0)'},{transform:'translate(-200px,60px)',offset:.3},{transform:'translate(-420px,-30px)',offset:.65},{transform:'translate(-600px,10px)'}],{duration:4400,easing:'linear'});
  say(`The Muslims, and then the Prophet ﷺ, left their homes in Makkah and travelled through the desert, all the way to Madinah.`);await w(4400);bob.cancel();
  const P=pin(200,40,560,'Question 3 (a) 1',KW('ترك بلد','tark balad','leaving a land'),[['الهجرة','al-hijra','the Hijra (migration)']],46,'🕋 🐪 ➡️ 🕌');
  say(`📌 <b>Question 3 a 1</b>! ${aw('ترك بلد','tark balad','leaving a land')}: <b>leaving</b> the land of shirk for the land of Islam.`);await w(3600);
  await revealBlocks(w,P.b,{say:false,wait:300});
  say(`That journey has a special name: ${aw('الهجرة','al-hijra','the Hijra')}, the <b>Hijra</b>. 🐪 Camel journey, Hijra!`);await w(3400);
  unpoint();P.off();an(map,[{opacity:0}],{duration:600});await w(700);map.remove();cam.remove();face(K,'🧒');
  b=bub(330,140,300,`Leaving home is hard. So what matters is <b>why</b> each person did it.`,140);
  say(`“Leaving your home is very hard,” says Jiddo. “So what matters is <b>why</b> each person did it.”`);await w(3200);b.remove();
  const h=mk('is-why','left:130px;top:20px;width:700px;text-align:center;font-size:20px;z-index:12',
    `The Prophet ﷺ said: ${ar('إنما الأعمال بالنيات','“Actions are judged by intentions.”','innamal a\'maalu bin-niyyaat','ar-font')}`);pop(h);point(h);
  say(`The Prophet ﷺ said: ${ar('إنما الأعمال بالنيات','Actions are judged by intentions.')} <b>Actions are judged by intentions.</b>`);await w(4000);
  const v=mk('st-tag','left:330px;top:135px;width:300px;border-color:#e06a1b;color:#5a3c00;font-size:16px;z-index:12',
