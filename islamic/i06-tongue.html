<script>
/* Islamic Studies Lesson 6 · Manners (التهذيب) · Worksheet Q6 (a), (b), (c) and Hadith 2.
   Built like the pilot (i02-angels.html): every question is a clue card (find the keyword, picture the answer,
   see the answer as coloured blocks), then build it, trace it and match the keywords. */
const WS='Worksheet · Q6 · ';
/* the three sins, each with one picture for its keyword */
const SINS=[
  {a:'الغيبة',s:'al-gheeba',en:'backbiting',e:'🙈',col:'#e06a1b',key:'يكرهونه',ks:'yakrahoonahu',ken:'they hate it',
   pic:'talking about someone behind their back, saying what they would hate'},
  {a:'السخرية',s:'as-sukhriyya',en:'mocking',e:'😏',col:'#6a45d8',key:'احتقار',ks:'ihtiqaar',ken:'looking down on',
   pic:'looking down on people and making fun of them'},
  {a:'النميمة',s:'an-nameema',en:'spreading tales',e:'📨',col:'#2c66cf',key:'نقل الكلام',ks:'naql al-kalaam',ken:'carrying talk',
   pic:'carrying talk from one person to another to cause trouble'}];
/* Q6 (a): the four causes. Memory sentence: Who Hurts Hearts Forgets */
const CAUSES=[
  {e:'👀',word:'Who',a:'عدم مراقبة الله',bl:[['عدم','\'adam','not'],['مراقبة','muraaqabat','being watched by'],['الله','Allaah','Allah']],
   en:'forgetting that Allah is watching',say:`<b>Who</b> is watching? Allah sees everything. Forgetting that is the first cause.`},
  {e:'🏠',word:'Hurts',a:'سوء التربية',bl:[['سوء','soo\'','bad'],['التربية','at-tarbiya','upbringing']],
   en:'a bad upbringing',say:`<b>Hurts</b>: a bad upbringing at home. Nobody taught them to guard their tongue.`},
  {e:'😤',word:'Hearts',a:'الحسد والكبر',bl:[['الحسد','al-hasad','envy'],['والكبر','wal-kibr','and arrogance']],
   en:'envy and arrogance',say:`<b>Hearts</b>: envy and arrogance are sicknesses of the heart. They push the tongue to say bad things.`},
  {e:'⚖️',word:'Forgets',a:'الغفلة عن الجزاء',bl:[['الغفلة','al-ghafla','forgetting'],['عن','\'an','about'],['الجزاء','al-jazaa\'','the reward and punishment']],
   en:'forgetting about reward and punishment',say:`<b>Forgets</b>: forgetting that every word is rewarded or punished on the Day of Judgement.`}];
const HADITH='تجد من شر الناس يوم القيامة عند الله ذا الوجهين ، الذي يأتي هؤلاء بوجه وهؤلاء بوجه';
const HADITH_EN='You will find among the worst of people on the Day of Resurrection, in the sight of Allah, the two-faced person, who comes to some people with one face and to others with another face.';

/* ---------- story helpers: a scenery strip (960×300), children, speech bubbles and 📌 answer pins ---------- */
const world=(top,bot,ground)=>mk('st-world',`left:0;top:0;width:960px;height:300px;border-radius:0 0 18px 18px;background:linear-gradient(${top},${bot})`,
  `<div style="position:absolute;left:0;right:0;bottom:0;height:78px;background:${ground}"></div>`);
const kid=(W,em,name,x,y,col)=>mk('st-kid',`left:${x}px;top:${y}px`,`<div class="e">${em}</div><div class="n" style="color:${col}">${name}</div><div class="mo"></div>`,W);
const mood=(k,e)=>{const m=k.querySelector('.mo');m.textContent=e;if(e)pop(m);};
/* walk to x with a little bounce on every step */
const walk=(k,x,ms,step=110)=>{const b=loop(k.querySelector('.e'),[{transform:'translateY(0)'},{transform:'translateY(-7px)'}],step,{direction:'alternate'});
  an(k,[{left:x+'px'}],{duration:ms,easing:'linear'}).then(()=>b.cancel());};
const bub=(W,x,y,wd,html,col,tx=40)=>mk('st-bub',`left:${x}px;top:${y}px;width:${wd}px;border-color:${col};--tx:${Math.max(14,Math.min(wd-30,tx))}px;--tc:${col}`,html,W);
/* a 📌 pin: the question it answers, its keyword, then the answer as coloured blocks */
function pin(x,y,wd,lab,key,blocks,{col='#d9a441',note}={}){
  const t=mk('is-card st-pin',`left:${x}px;top:${y}px;width:${wd}px;padding:6px 12px 8px;border-color:${col};z-index:25`,
    `<div class="src">📌 ${lab}</div><div class="st-key">${key}</div>`);
  const b=ansBlocks(0,0,wd-28,blocks.map(x=>[...x]),{size:26});b.style.position='relative';b.style.left='0';b.style.top='0';t.appendChild(b);
  if(note)t.insertAdjacentHTML('beforeend',`<div class="st-note">${note}</div>`);
  pop(t);beep(880,.08);return t;}

Lesson.start(Object.assign({}, ISLAMIC, {
  id:'i06', num:6, part:'Manners · التهذيب', emoji:'👅', title:'Sins of the tongue',
  intro:`Assalaamu alaykum! I'm <b>Hudhud the Hoopoe</b> 🐦 Today: the <b>sins of the tongue</b>, Question 6 of your sheet. Press <b>Start</b>!`,
  scenes:[
/* 0 */ {t:'A small tongue, a big danger',run:async w=>{
  const t=mk('','left:0;top:10px;width:960px;text-align:center',`<div style="font-size:70px">👅</div><div class="ar-font" dir="rtl" style="font-size:52px;font-weight:700;color:#8a4b00">${aw('آفات اللسان','aafaat al-lisaan')}</div><div style="font-size:20px;font-weight:800;color:#626a80">the sins of the tongue</div>`);pop(t);
  say(`${aw('السلام عليكم','assalaamu alaykum')}! Today's topic is ${aw('آفات اللسان','aafaat al-lisaan')}: the <b>sins of the tongue</b>. The tongue is small, but it can do big harm.`);await w(3800);
  const els=SINS.map((S,i)=>mk('is-card',`left:${640-i*306}px;top:232px;width:286px;height:200px;text-align:center;border-color:${S.col}`,
    `<div class="pic" style="font-size:58px">${S.e}</div><div class="ar-font" dir="rtl" style="font-size:38px;font-weight:700;color:${S.col};line-height:1.2">${S.a}</div>`+
    `<div style="font-size:15px;font-weight:800;color:#2c66cf">${S.s}</div><div style="font-size:18px;font-weight:800;color:#5a3c00">${S.en}</div>`));
  for(let i=0;i<3;i++){const S=SINS[i];pop(els[i]);point(els[i]);beep(520+i*90,.08);
    const p=els[i].querySelector('.pic');
    if(i===0)loop(p,[{transform:'rotate(-8deg)'},{transform:'rotate(8deg)'}],500,{direction:'alternate'});
    else if(i===1)loop(p,[{transform:'scale(1)'},{transform:'scale(1.15)'}],450,{direction:'alternate'});
    else loop(p,[{transform:'translateX(-14px)'},{transform:'translateX(14px)'}],700,{direction:'alternate'});
    say(`${aw(S.a,S.s)}: <b>${S.en}</b>. That means ${S.pic}.`);await w(3400);}
  unpoint();
  say(`Question 6 asks for the <b>causes</b> of these sins, their <b>names</b>, three <b>true or false</b> sentences, and <b>Hadith 2</b>. First, a story! ${aw('هيا بنا','hayyaa binaa','let\'s go')}!`);await w(3800);}},

/* 1 */ {t:'Story: the new girl',run:async w=>{
  const W=world('#bfe6ff','#effaff','#9bd77a');
  const sun=mk('','left:830px;top:14px;font-size:54px','☀️',W);loop(sun,[{transform:'rotate(0deg)'},{transform:'rotate(25deg)'}],1800,{direction:'alternate'});
  ['🌳','🌲','🌳','🌲'].forEach((t,i)=>mk('',`left:${470+i*120}px;top:${118+(i%2)*14}px;font-size:76px`,t,W));
  const cl=mk('','left:120px;top:40px;font-size:40px','☁️',W);loop(cl,[{transform:'translateX(0)'},{transform:'translateX(160px)'}],7000,{direction:'alternate'});
  const ch=mk('is-card','left:180px;top:340px;width:600px;text-align:center',`<div style="font-size:26px;font-weight:800;color:#7a4a00">📖 The rumour that ran around the class</div><div style="font-size:17px;font-weight:700;color:#626a80">Watch for the 📌 pins: each one is an exam answer!</div>`);pop(ch);
  const bus=mk('','left:-240px;top:120px;width:150px;height:110px',`<div style="font-size:110px;line-height:1;transform:scaleX(-1)">🚌</div>`,W);
  an(bus,[{left:'60px'}],{duration:1800,easing:'ease-out'});beep(300,.15);
  say(`Story time! 📖 Lina's class is going on a <b>school trip</b> to the park. Everybody is excited.`);await w(3400);
  an(bus,[{left:'-260px'}],{duration:1500,easing:'ease-in'});
  const lina=kid(W,'🧕🏽','Lina',40,142,'#18a058'),rania=kid(W,'👧🏾','Rania',140,142,'#c2367a'),maryam=kid(W,'👧🏽','Maryam',240,142,'#e06a1b');
  [lina,rania,maryam].forEach((k,i)=>pop(k,300+i*200));
  const huda=kid(W,'👧🏻','Huda',960,142,'#2c66cf');mk('','left:56px;top:28px;font-size:30px','🎒',huda);
  await w(1200);walk(huda,780,2400,90);
  say(`There's a new girl in the class: <b>Huda</b>. She's shy, she has a huge old backpack, and she walks with tiny, quick steps.`);await w(4000);
  ch.remove();
  an(rania,[{left:'170px'}],{duration:500});an(maryam,[{left:'230px'}],{duration:500});
  let b=bub(W,90,20,260,`"Look at the new girl's backpack. It's older than my granny!"`,'#c2367a',90);pop(b);beep(620,.06);mood(lina,'😕');
  say(`Rania whispers: "Look at the new girl's backpack. It's older than my granny!"`);await w(3200);b.remove();
  b=bub(W,190,20,260,`"And she's so slow at everything. So weird!"`,'#e06a1b',60);pop(b);beep(560,.06);
  say(`Maryam giggles: "And she's so slow at everything. So weird!"`);await w(3000);b.remove();
  const far=mk('','left:610px;top:40px;width:230px;text-align:center;font-size:17px;font-weight:800;color:#2c66cf;background:#fff;border-radius:12px;padding:4px 8px',`👂❌ Huda can't hear them`,W);pop(far);point(huda);
  say(`Huda is far away. She can't hear them. But if she did, she would <b>hate</b> it.`);await w(3400);unpoint();far.remove();
  const p1=pin(13,312,452,'Q6 (b) · 1',ar(`بما ${kw('يكرهونه','yakrahoonahu')} → 🙈`,`with what ${kw('they hate')} → 🙈`),[['الغيبة','al-gheeba','backbiting']],{col:'#e06a1b'});
  say(`That is ${aw('الغيبة','al-gheeba','backbiting')}: <b>backbiting</b>. Your sheet says: ${ar('ذكر الناس بما يكرهونه بالقول أو الفعل','Mentioning people with what they hate, by words or actions.')}`);await w(4600);
  point(p1.querySelector('.kw'));
  say(`The keyword is ${aw('يكرهونه','yakrahoonahu','they hate it')}: <b>what they hate</b>. Saying things people would hate, behind their back, is backbiting. Even if it's true!`);await w(4200);unpoint();
  /* Maryam copies Huda's walk */
  b=bub(W,250,20,220,`"Look, I'm Huda! 🐧"`,'#e06a1b',50);pop(b);
  const me=maryam.querySelector('.e'),bob=loop(me,[{transform:'translateY(0) rotate(-6deg)'},{transform:'translateY(-6px) rotate(6deg)'}],140,{direction:'alternate'});
  an(maryam,[{left:'380px'}],{duration:2200,easing:'linear'});mood(rania,'😂');beep(700,.05);
  say(`Then Maryam jumps up and <b>copies Huda's walk</b>: tiny, quick steps, like a penguin. Rania laughs. Maryam doesn't say a word about her.`);await w(4200);
  bob.cancel();b.remove();
  b=bub(W,10,20,280,`"She didn't <b>say</b> anything... so it isn't backbiting. Is it? 🤔"`,'#18a058',40);pop(b);mood(lina,'🤔');
  say(`Lina wonders: if Maryam didn't <b>say</b> anything, is it still backbiting?`);await w(3200);b.remove();
  const p2=pin(495,312,452,'Q6 (c) · 3',ar(`${kw('تقتصر','taqtasir')} الغيبة على ${kw('القول','al-qawl')} .`,`Backbiting is ${kw('only')} done with ${kw('words')}.`),CROSS,{col:'#e04848',note:`✔ ${ar('الغيبة بالقول أو الفعل','Backbiting is by words or actions','al-gheeba bil-qawl aw al-fi\'l')}`});
  say(`Yes, it is! Backbiting is ${ar('بالقول أو الفعل','by words or actions','bil-qawl aw al-fi\'l')}. So the sentence ${ar('تقتصر الغيبة على القول','Backbiting is only done with words')} is <b>false</b>. A cross!`);await w(4600);
  point(p2.querySelector('.kw'));
  say(`Watch out for ${aw('تقتصر','taqtasir','only')}: it means <b>only</b>. Copying someone's walk is an <b>action</b>, so backbiting is not only words.`);await w(4000);unpoint();
  mood(lina,'😟');shake(lina);
  say(`Lina gets a knot in her tummy. Something isn't right. And the day has only just begun...`);await w(3200);}},

/* 2 */ {t:'Story: faces, tales and two faces',run:async w=>{
  let W=world('#ffe2b8','#fff6e6','#a5d97e');
  const lake=()=>{mk('','left:560px;top:200px;width:420px;height:60px;border-radius:50%;background:#7cc3f0',``,W);mk('','left:30px;top:226px;width:150px;height:30px;border-radius:8px;background:repeating-linear-gradient(45deg,#e04848 0 14px,#fff 14px 28px)',``,W);};
  lake();mk('','left:60px;top:186px;font-size:34px','🧺',W);
  let huda=kid(W,'👧🏻','Huda',80,130,'#2c66cf');pop(huda);
  const yusuf=kid(W,'👦🏽','Yusuf',600,130,'#6a45d8');pop(yusuf,200);
  say(`Lunchtime by the lake. 🧺 Huda sits on a blanket, alone. Then <b>Yusuf</b> walks straight up to her.`);await w(3200);
  walk(yusuf,200,1400,120);await w(1500);mood(yusuf,'😝');
  let b=bub(W,230,10,300,`"Nice backpack, Grandma! Did you find it in a museum?" 😝`,'#6a45d8',30);pop(b);beep(650,.06);
  say(`He pulls a silly face, rolls his eyes and says: "Nice backpack, Grandma! Did you find it in a museum?"`);await w(3800);b.remove();
  const fans=['😂','🤭'].map((e,i)=>{const f=mk('',`left:${380+i*60}px;top:150px;font-size:44px`,e,W);pop(f,i*150);return f;});
  mood(huda,'😢');shake(huda);
  say(`Some children laugh. Yusuf is treating Huda as if she were small and worth nothing. Huda stares at the ground.`);await w(3600);
  const p1=pin(13,312,300,'Q6 (b) · 2',ar(`${kw('احتقار','ihtiqaar')} → 😝`,`${kw('looking down on')} → 😝`),[['السخرية','as-sukhriyya','mocking']],{col:'#6a45d8'});
  say(`That's ${aw('السخرية','as-sukhriyya','mocking')}: ${ar('احتقار الناس بالهمز واللمز','Looking down on people with mocking gestures and digs.')}`);await w(4000);
  point(p1.querySelector('.kw'));
  say(`The keyword is ${aw('احتقار','ihtiqaar','looking down on')}: <b>looking down on</b> people. The faces and the nasty little digs are ${aw('الهمز واللمز','al-hamz wal-lamz','mocking gestures and digs')}.`);await w(4400);unpoint();
  /* tales */
  W.remove();W=world('#ffe2b8','#fff6e6','#a5d97e');lake();
  huda=kid(W,'👧🏻','Huda',60,130,'#2c66cf');const rania=kid(W,'👧🏾','Rania',800,130,'#c2367a');pop(huda);pop(rania,150);
  const zaid=kid(W,'👦🏻','Zaid',430,130,'#0f7a6e');pop(zaid,300);
  const env=mk('','left:56px;top:20px;font-size:30px','📨',zaid);
  say(`Now meet <b>Zaid</b>. He loves carrying news, like a postman with a bag of letters. 📨`);await w(3000);
  walk(zaid,680,1200,90);await w(1300);
  b=bub(W,560,10,300,`"Huda said you're a show-off!"`,'#0f7a6e',200);pop(b);beep(560,.06);mood(rania,'😠');
  say(`He runs to Rania: "Huda said you're a show-off!" Huda never said that!`);await w(3200);b.remove();
  walk(zaid,170,1500,90);await w(1600);
  b=bub(W,100,10,300,`"Rania said you're boring!"`,'#0f7a6e',80);pop(b);beep(560,.06);mood(huda,'😠');
  say(`Then he runs back to Huda: "Rania said you're boring!" Now both girls are angry with each other.`);await w(3600);b.remove();
  const bolt=mk('','left:420px;top:60px;font-size:60px','⚡',W);pop(bolt);shake(bolt);
  const p2=pin(330,312,300,'Q6 (b) · 3',ar(`${kw('نقل الكلام','naql al-kalaam')} → 📨`,`${kw('carrying talk')} → 📨`),[['النميمة','an-nameema','spreading tales']],{col:'#2c66cf'});
  say(`That's ${aw('النميمة','an-nameema','spreading tales')}: ${ar('نقل الكلام للإفساد بين الناس','Carrying talk to make trouble between people.')}`);await w(4000);
  point(p2.querySelector('.kw'));
  say(`The keyword is ${aw('نقل الكلام','naql al-kalaam','carrying talk')}: <b>carrying talk</b>, like Zaid the postman, to <b>make trouble</b>.`);await w(3800);unpoint();
  /* two faces */
  W.remove();W=world('#ffe2b8','#fff6e6','#a5d97e');lake();
  huda=kid(W,'👧🏻','Huda',60,130,'#2c66cf');const maryam=kid(W,'👧🏽','Maryam',800,130,'#e06a1b');pop(huda);pop(maryam,150);
  const r=kid(W,'👧🏾','Rania',430,130,'#c2367a');pop(r,300);
  say(`And Rania? Watch her very carefully.`);await w(2200);
  walk(r,180,1200,90);await w(1300);mood(r,'😊');
  b=bub(W,140,10,300,`"I love your backpack! Sit with me on the bus!" 😊`,'#c2367a',50);pop(b);beep(660,.06);mood(huda,'🙂');
  say(`To Huda she's sweet: "I love your backpack! Sit with me on the bus!"`);await w(3200);b.remove();
  walk(r,680,1500,90);await w(1600);mood(r,'😏');
  b=bub(W,480,10,300,`"Her backpack is SO ugly. I was just being nice." 😏`,'#c2367a',220);pop(b);beep(520,.06);
  say(`Then she skips to Maryam: "Her backpack is SO ugly. I was just being nice." One face here, another face there.`);await w(3800);b.remove();
  for(let i=0;i<2;i++){walk(r,300,400,60);await w(450);mood(r,'😊');walk(r,560,400,60);await w(450);mood(r,'😏');}
  const mask=mk('','left:430px;top:30px;font-size:80px','🎭',W);pop(mask);shake(mask);
  const h=mk('is-card','left:30px;top:8px;width:900px;z-index:30',`<div class="src">Hadith 2 · ${aw('الحديث الثاني','al-hadeeth ath-thaani','Hadith 2')}</div><div class="q" style="font-size:22px">${ar(
    `عن أبي هريرة رضي الله عنه قال : قال رسول الله ﷺ : ( تجد من شر الناس يوم القيامة عند الله ${kw('ذا الوجهين','dhal-wajhayn')} ، الذي يأتي هؤلاء بوجه وهؤلاء بوجه ) .`,
    `Abu Hurayra said: the Messenger of Allah ﷺ said: "You will find among the worst of people on the Day of Resurrection, in the sight of Allah, the ${kw('two-faced')} person, who comes to some people with one face and to others with another face."`,'','blk')}</div>`);pop(h);
  say(`The Prophet ﷺ warned about exactly this, in <b>Hadith 2</b>: ${ar(HADITH,HADITH_EN)}`);await w(5000);
  h.classList.add('lit');point(h.querySelector('.kw'));
  say(`The keyword is ${aw('ذا الوجهين','dhal-wajhayn','the two-faced one')}: the person with <b>two faces</b>. ${aw('وجه','wajh','face')} means <b>face</b>.`);await w(3600);unpoint();h.remove();
  const p3=pin(647,312,300,'Hadith 2',ar(`${kw('ذا الوجهين','dhal-wajhayn')} → 🎭`,`${kw('two-faced')} → 🎭`),[['ذا','dha','the one with'],['الوجهين','al-wajhayn','two faces']],{col:'#c2367a'});
  say(`Rania was ${aw('ذا الوجهين','dhal-wajhayn','two-faced')}. The Prophet ﷺ said such a person is among the <b>worst of people</b> on the Day of Resurrection.`);await w(4200);}},

/* 3 */ {t:'Story: Lina speaks up',run:async w=>{
  let W=world('#cfe9ff','#f2faff','#9bd77a');
