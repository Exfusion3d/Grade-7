    rains.push(loop(d,[{transform:'translate(0,0)'},{transform:'translate(-14px,200px)'}],560+(i%5)*90,{delay:i*60,easing:'linear'}));}

  mk('','left:30px;top:350px;width:440px;height:130px;background:#8a5a2b;border-radius:16px 16px 6px 6px','');

  const maryam=mk('','left:62px;top:266px;font-size:62px;line-height:1;z-index:10','👧'),yusuf=mk('','left:160px;top:272px;font-size:56px;line-height:1;z-index:10','👦');

  loop(glow,[{opacity:.7,transform:'scale(.95)'},{opacity:1,transform:'scale(1.06)'}],900,{direction:'alternate'});

/* a speech bubble on the stage (one at a time) */
function bub(x,y,html,who){stage.querySelector('.st-bub')?.remove();const b=mk('st-bub',`left:${x}px;top:${y}px`,`<span class="n">${who}</span>${html}`);pop(b);return b;}
/* 📌 a story moment: the question, its keyword and the answer as coloured blocks (stacked in the right-hand column) */
async function pin(w,label,key,blocks,{x=612,wd=336,y=null,size=28,clear:cl=false}={}){
  const old=[...stage.querySelectorAll('.st-pin')];if(cl)old.forEach(o=>o.remove());
  gloss(blocks.map(b=>b[0]).join(' '),blocks.map(b=>b[2]).join(' '),blocks.map(b=>b[1]).join(' '));
  const bl=blocks.map(([a,s,m],i)=>{gloss(a,m,s);return `<div class="is-b ar-font" data-a="${a}" style="background:${BCOL[i%BCOL.length]}"><div class="a" dir="rtl" style="font-size:${size}px">${a}</div><div class="s">${s}</div><div class="m">${m}</div></div>`;}).join('');
  const p=mk('st-pin lit',`left:${x}px;top:0;width:${wd}px;visibility:hidden`,`<div class="lb">📌 ${label}</div><div class="kl">🔑 ${key}</div><div class="is-blocks">${bl}</div>`);
  await w(40);
  let top=y;if(top==null){const left=cl?[]:old;top=left.length?Math.max(...left.map(o=>o.offsetTop+o.offsetHeight))+10:12;
    if(top+p.offsetHeight>510){left.forEach(o=>o.remove());top=12;}}
  p.style.top=top+'px';p.style.visibility='';pop(p);beep(880,.07);point(p);return p;}
