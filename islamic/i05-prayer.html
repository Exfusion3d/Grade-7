function figure(x,y,s=1,pose='stand'){
  const f=mk('pr-fig',`left:${x}px;top:${y}px;width:${200*s}px;height:${200*s}px`,'');
  f.set=p=>{f.innerHTML=`<svg width="${200*s}" height="${200*s}" viewBox="0 0 200 200"><rect x="20" y="186" width="160" height="10" rx="4" fill="#18a058" opacity=".55"/>${POSE[p]}</svg>`;
    f.animate([{opacity:.2,transform:'scale(.96)'},{opacity:1,transform:'scale(1)'}],{duration:450});};
  f.set(pose);return f;}

const ACTS=[ /* in prayer order */
  {e:'🔄',word:'Move',pose:'ruku',said:['الله أكبر','Allaahu akbar'],bl:[['تكبيرات','takbeeraat','saying Allahu akbar'],['الانتقال','al-intiqaal','when moving']],
   en:`saying "Allahu akbar" each time you <b>move</b> to the next position`},
  {e:'👂',word:'Hear',pose:'up',said:['سمع الله لمن حمده','sami\'a Allaahu liman hamidah'],bl:[['التسميع','at-tasmee\'','saying "sami\'a Allaahu…"']],
   en:`saying "sami'a Allaahu liman hamidah" as you rise from bowing`},
  {e:'🙌',word:'Praise',pose:'up',said:['ربنا ولك الحمد','rabbanaa wa lakal-hamd'],bl:[['التحميد','at-tahmeed','saying "rabbanaa wa lakal-hamd"']],
   en:`saying "rabbanaa wa lakal-hamd" when you are standing up straight`},
  {e:'🧎',word:'Sit',pose:'sit',said:null,bl:[['الجلوس','al-juloos','sitting'],['للتشهد','lit-tashahhud','for the tashahhud'],['الأول','al-awwal','first']],
   en:`<b>sitting</b> for the first tashahhud, after two rak'ahs`},
  {e:'☝️',word:'Say',pose:'tash',said:['التحيات لله','at-tahiyyaatu lillaah'],bl:[['التشهد','at-tashahhud','the tashahhud'],['الأول','al-awwal','first']],
   en:`<b>saying</b> the first tashahhud, which begins "at-tahiyyaatu lillaah"`}];

const DEF={
  w:{t:'الواجب',ts:'al-waajib',te:'required',a:'ما يثاب فاعله ويأثم تاركه',s:'maa yuthaabu faa\'iluhu wa ya\'thamu taarikuh',
     bl:[['ما','maa','what'],['يثاب','yuthaabu','is rewarded'],['فاعله','faa\'iluhu','its doer'],['ويأثم','wa ya\'thamu','and is sinful'],['تاركه','taarikuh','its leaver']],
     en:'what its doer is rewarded for and its leaver is sinful for'},
  s:{t:'السنة',ts:'as-sunna',te:'recommended',a:'ما يثاب فاعلها ولا يأثم تاركها',s:'maa yuthaabu faa\'iluhaa wa laa ya\'thamu taarikuhaa',
     bl:[['ما','maa','what'],['يثاب','yuthaabu','is rewarded'],['فاعلها','faa\'iluhaa','its doer'],['ولا','wa laa','and not'],['يأثم','ya\'thamu','is sinful'],['تاركها','taarikuhaa','its leaver']],
     en:'what its doer is rewarded for, and its leaver is not sinful'},
  m:{t:'المكروه',ts:'al-makrooh',te:'disliked',a:'ما يثاب تاركه ولا يأثم فاعله',s:'maa yuthaabu taarikuhu wa laa ya\'thamu faa\'iluh',
     bl:[['ما','maa','what'],['يثاب','yuthaabu','is rewarded'],['تاركه','taarikuhu','its leaver'],['ولا','wa laa','and not'],['يأثم','ya\'thamu','is sinful'],['فاعله','faa\'iluh','its doer']],
     en:'what its leaver is rewarded for, and its doer is not sinful'}};
/* colour the doer green and the leaver pink in the definition blocks */
const tint=bl=>bl.map(([a,s,m])=>[a,s,m,/فاعل/.test(a)?'#18a058':/تارك/.test(a)?'#c2367a':/يثاب/.test(a)?'#d39a00':/يأثم/.test(a)?'#e04848':'#6a45d8']);

Lesson.start(Object.assign({}, ISLAMIC, {
  id:'i05', num:5, part:'Fiqh · الفقه', emoji:'🕌', title:'Prayer: required acts and rulings',
  intro:`Assalaamu alaykum! Hudhud here 🐦 Today: <b>prayer</b>, Question 5 of your sheet, and Hadith 3. Press <b>Start</b>!`,
  scenes:[
/* 0 */ {t:'Into the mosque',run:async w=>{
  const m=mk('','left:0;top:4px;width:960px;text-align:center;font-size:84px','🕌');pop(m);
  const t=mk('ar-font','left:0;top:110px;width:960px;text-align:center;font-size:52px;color:#8a4b00',aw('الصلاة','as-salaah'));pop(t);

  say(`${aw('السلام عليكم','assalaamu alaykum')}! Today is about ${aw('الصلاة','as-salaah')}, <b>prayer</b>. Watch my friend pray: standing, bowing, prostrating, sitting.`);

  unpoint();say(`${aw('هيا بنا','hayyaa binaa')}! Let's go!`);await w(1600);}},

/* 1 */ {t:'Eyes down (Hadith 3)',run:async w=>{
  say(`First, the <b>third hadith</b> you learn by heart. It is about where your eyes look in prayer.`);await w(2800);
  const h=mk('is-card','left:30px;top:8px;width:900px',`<div class="src">Hadith 3 · الحديث الثالث</div><div class="q" style="font-size:24px;line-height:1.6">${ar(
    `عن أنس بن مالك رضي الله عنه أن رسول الله ﷺ قال : ( ما بال أقوام ${kw('يرفعون أبصارهم إلى السماء','yarfa\'oona absaarahum ilas-samaa\'')} في صلاتهم ، فاشتد قوله في ذلك حتى قال : لينتهن عن ذلك أو لتخطفن أبصارهم ) .`,
    `Anas ibn Malik (may Allah be pleased with him) reported that the Messenger of Allah ﷺ said: "What is wrong with people who ${kw('raise their eyes to the sky')} in their prayer?" He spoke very strongly about it, until he said: "They must stop that, or their sight will be snatched away."`,'','blk')}</div>`);pop(h);
  say(`The Prophet ﷺ said: ${ar('ما بال أقوام يرفعون أبصارهم إلى السماء في صلاتهم','What is wrong with people who raise their eyes to the sky in their prayer?')}`);await w(4200);
  h.classList.add('lit');point(h.querySelector('.kw'));
  say(`The keywords: ${aw('يرفعون أبصارهم إلى السماء','yarfa\'oona absaarahum ilas-samaa\'')}: they <b>raise their eyes to the sky</b>.`);await w(3400);
  say(`He spoke very strongly: they must stop, or their <b>sight</b> could be taken away. So this is serious!`);await w(3400);unpoint();
  /* keep only the keyword line so the pictures have room */
  h.querySelector('.q').innerHTML=ar(`${kw('يرفعون أبصارهم إلى السماء','yarfa\'oona absaarahum ilas-samaa\'')} في صلاتهم`,`They ${kw('raise their eyes to the sky')} in their prayer`,'','blk');h.classList.add('lit');
  await w(60);const top=h.offsetHeight+22;
  const A=mk('is-card',`left:60px;top:${top}px;width:400px;height:${440-top}px;border-color:#e04848;text-align:center`,'');pop(A);
  const B=mk('is-card',`left:500px;top:${top}px;width:400px;height:${440-top}px;border-color:#18a058;text-align:center`,'');pop(B);
  const sc=Math.min(.9,(440-top-50)/200);const fy=top+Math.max(40,(440-top-200*sc)/2+10);
  const fa=figure(60+200-100*sc,fy,sc,'stand'),fb=figure(500+200-100*sc,fy,sc,'stand');
  const ua=mk('',`left:${60+200+30*sc}px;top:${fy-36}px;font-size:34px`,'☁️');const ea=mk('',`left:${60+200+10*sc}px;top:${fy-10}px;font-size:24px`,'⬆️');
  loop(ea,[{transform:'translateY(4px)'},{transform:'translateY(-6px)'}],500,{direction:'alternate'});
  const xa=mk('',`left:76px;top:${top+8}px;font-size:40px`,'❌');pop(xa);
  say(`Here, eyes go <b>up to the sky</b>. That's what the hadith warns against.`);await w(2800);
  const eb=mk('',`left:${500+200+20*sc}px;top:${fy+150*sc}px;font-size:24px`,'⬇️');loop(eb,[{transform:'translateY(-4px)'},{transform:'translateY(6px)'}],500,{direction:'alternate'});
  const spot=mk('',`left:${500+200-110*sc}px;top:${fy+174*sc}px;width:${36*sc}px;height:${14*sc}px;border-radius:50%;background:#ffd84d;box-shadow:0 0 12px #ffc400`,'');
  loop(spot,[{opacity:.5},{opacity:1}],600,{direction:'alternate'});
  const xb=mk('',`left:516px;top:${top+8}px;font-size:40px`,'✅');pop(xb);
  say(`Here, eyes look <b>down</b> at the place where your forehead goes in sujood. That's the right way: calm and focused.`);await w(3600);
  const tip=mk('is-why','left:130px;top:450px;width:700px;text-align:center;font-size:19px','💡 In prayer: eyes <b>down</b> 👇 on your sujood spot, never up to the sky ☁️');pop(tip);
  say(`Remember: in prayer, your eyes stay <b>down</b>, on your sujood spot. Never up at the sky.`);await w(3200);}},

/* 2 */ {t:'Watch the prayer (Q5 a)',run:async w=>{
  const q=mk('is-card','left:30px;top:8px;width:900px',`<div class="src">${WS}(a)</div><div class="q" style="font-size:26px">${ar(
    `اكتب خمسة من ${kw('واجبات','waajibaat')} ${kw('الصلاة','as-salaah')}`,`Write five of the ${kw('required acts')} of ${kw('prayer')}`,'','blk')}</div>`);pop(q);
  say(`Question 5 a says: ${ar('اكتب خمسة من واجبات الصلاة','Write five of the required acts of prayer.')}`);await w(2800);
  q.classList.add('lit');const K=q.querySelectorAll('.kw');point(K[0]);
  say(`Keywords: ${aw('واجبات','waajibaat')}, <b>required acts</b>, things you <b>must</b> do, and ${aw('الصلاة','as-salaah')}, <b>prayer</b>. Five dotted lines, so five answers.`);await w(3800);unpoint();
  const top=q.offsetHeight+20;
  const pane=mk('is-card',`left:30px;top:${top}px;width:300px;height:${505-top}px`,'');
  const fig=figure(80,top+(505-top)-215,1,'stand');
  say(`Let's watch a prayer and catch the five required acts as they happen.`);await w(2400);
  const list=mk('',`left:360px;top:${top+190}px;width:570px;display:flex;flex-direction:row-reverse;flex-wrap:wrap;gap:8px 10px`,'');
  for(let i=0;i<5;i++){const A=ACTS[i];
    stage.querySelectorAll('.pr-bub,.cur-ans').forEach(e=>e.remove());
    if(A.pose==='sit'){fig.set('ruku');await w(500);fig.set('up');await w(500);fig.set('sujood');await w(700);}
    fig.set(A.pose);await w(300);
    if(A.said){const b=mk('pr-bub ar-font',`left:50px;top:${top+8}px`,aw(A.said[0],A.said[1]));pop(b);}
    const bl=ansBlocks(360,top,570,A.bl,{size:34,show:false});bl.classList.add('cur-ans');await w(30);
    await revealBlocks(w,bl,{say:false,wait:300});point(bl);
    say(`${aw(A.bl.map(b=>b[0]).join(' '),A.bl.map(b=>b[1]).join(' '))}: ${A.en}.`);await w(3800);
    const chip=mk('is-chip','position:static',`<span style="font-size:24px">${A.e}</span><span class="ar-font" dir="rtl">${A.bl.map(b=>b[0]).join(' ')}</span>`,list);pop(chip);beep(600+i*70,.07);
    if(i===2){const tip=mk('is-why',`left:360px;top:${top+110}px;width:570px;font-size:16px;padding:6px 12px`,

      say(`Watch out! ${aw('التسميع','at-tasmee\'')} and ${aw('التحميد','at-tahmeed')} look alike. Tasmee' has ${aw('سمع','sami\'a')}, <b>hear</b>. Tahmeed has ${aw('حمد','hamd')}, <b>praise</b>.`);await w(4400);tip.remove();}}
  stage.querySelectorAll('.pr-bub,.cur-ans').forEach(e=>e.remove());unpoint();
  say(`That's all five! The figure did them in one prayer.`);await w(2200);}},

  await w(800);clear();

    ['فاعل','faa\'il','the doer 🏃','#18a058'],['تارك','taarik','the leaver 🙅','#c2367a'],['ولا','wa laa','and not 🚫','#2c66cf']];
