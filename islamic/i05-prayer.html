const WS='Worksheet · Q5 · ';
document.head.insertAdjacentHTML('beforeend',`<style>

function figure(x,y,s=1,pose='stand'){
  const f=mk('pr-fig',`left:${x}px;top:${y}px;width:${200*s}px;height:${200*s}px`,'');
  f.set=p=>{f.innerHTML=`<svg width="${200*s}" height="${200*s}" viewBox="0 0 200 200"><rect x="20" y="186" width="160" height="10" rx="4" fill="#18a058" opacity=".55"/>${POSE[p]}</svg>`;
    f.animate([{opacity:.2,transform:'scale(.96)'},{opacity:1,transform:'scale(1)'}],{duration:450});};
  f.set(pose);return f;}

const ACTS=[ /* in prayer order */
  {e:'🔄',word:'Move',pose:'ruku',said:['الله أكبر','Allaahu akbar'],bl:[['تكبيرات','takbeeraat','saying Allahu akbar'],['الانتقال','al-intiqaal','when moving']],
   en:`saying "Allahu akbar" each time you <b>move</b> to the next position`},
  {e:'👂',word:'Hear',pose:'up',said:['سمع الله لمن حمده','sami\'a Allaahu liman hamidah'],bl:[['التسميع','at-tasmee\'','saying "sami\'a Allaahu…"']],
   en:`saying "sami'a Allaahu liman hamidah" as you rise from bowing`},
  {e:'🙌',word:'Praise',pose:'up',said:['ربنا ولك الحمد','rabbanaa wa lakal-hamd'],bl:[['التحميد','at-tahmeed','saying "rabbanaa wa lakal-hamd"']],
   en:`saying "rabbanaa wa lakal-hamd" when you are standing up straight`},
  {e:'🧎',word:'Sit',pose:'sit',said:null,bl:[['الجلوس','al-juloos','sitting'],['للتشهد','lit-tashahhud','for the tashahhud'],['الأول','al-awwal','first']],
   en:`<b>sitting</b> for the first tashahhud, after two rak'ahs`},
  {e:'☝️',word:'Say',pose:'tash',said:['التحيات لله','at-tahiyyaatu lillaah'],bl:[['التشهد','at-tashahhud','the tashahhud'],['الأول','al-awwal','first']],
   en:`<b>saying</b> the first tashahhud, which begins "at-tahiyyaatu lillaah"`}];

const DEF={
  w:{t:'الواجب',ts:'al-waajib',te:'required',a:'ما يثاب فاعله ويأثم تاركه',s:'maa yuthaabu faa\'iluhu wa ya\'thamu taarikuh',
     bl:[['ما','maa','what'],['يثاب','yuthaabu','is rewarded'],['فاعله','faa\'iluhu','its doer'],['ويأثم','wa ya\'thamu','and is sinful'],['تاركه','taarikuh','its leaver']],

     bl:[['ما','maa','what'],['يثاب','yuthaabu','is rewarded'],['تاركه','taarikuhu','its leaver'],['ولا','wa laa','and not'],['يأثم','ya\'thamu','is sinful'],['فاعله','faa\'iluh','its doer']],
     en:'what its leaver is rewarded for, and its doer is not sinful'}};
/* colour the doer green and the leaver pink in the definition blocks */
const tint=bl=>bl.map(([a,s,m])=>[a,s,m,/فاعل/.test(a)?'#18a058':/تارك/.test(a)?'#c2367a':/يثاب/.test(a)?'#d39a00':/يأثم/.test(a)?'#e04848':'#6a45d8']);

/* ---------- the opening story: Bilal's first Dhuhr at the big mosque (fictional characters) ---------- */
document.head.insertAdjacentHTML('beforeend',`<style>
.st-bg{left:0;top:0;width:960px;height:520px}

.st-p .n{display:inline-block;margin-top:2px;font-size:14px;font-weight:800;color:#5a3c00;background:#fff8e6;border:2px solid #f2c200;border-radius:9px;padding:0 7px;white-space:nowrap}

.st-pin .key .ax.en{font-size:18px;display:block;text-align:left}
.st-pin .note{margin-top:8px;font-size:15px;padding:5px 10px}
.st-pin .note .ax:not(.en),.st-pin .note .aw:not(.en){font-size:1.35em}

</style>`);
/* a story character: an emoji with a name tag; .firstChild is the emoji (to tilt or flip it) */
function person(x,y,emo,name,size=76){const p=mk('st-p',`left:${x}px;top:${y}px`,`<div class="e" style="font-size:${size}px">${emo}</div><div class="n">${name}</div>`);pop(p);p._x=0;return p;}
/* walk characters to x offsets (dx) with a bobbing step; resolves when they arrive */
function walkTo(P,dx,ms){return Promise.all(P.map((p,i)=>{const b=loop(p.firstChild,[{transform:'translateY(0)'},{transform:'translateY(-7px)'}],260,{direction:'alternate',delay:i*130});
  const a=an(p,[{transform:`translateX(${p._x}px)`},{transform:`translateX(${dx[i]}px)`}],{duration:ms,easing:'linear'});p._x=dx[i];
  return Promise.resolve(a).then(()=>b.cancel());}));}
const bubs=()=>stage.querySelectorAll('.st-bub').forEach(e=>e.remove());
/* a speech bubble over a character (removes the last one); x/y: top left, else just above the character */
function bub(p,html,{x,y,max=stage.querySelector('.st-pin')?548:950}={}){bubs();const b=mk('st-bub',`left:0;top:0;visibility:hidden`,html);
  const px=p.offsetLeft+(p._x||0);
  const left=Math.max(8,Math.min(x??px,max-b.offsetWidth));b.style.left=left+'px';
  b.style.top=(y??Math.max(8,p.offsetTop-b.offsetHeight-14))+'px';
  /* point the tail at the character's head */
  const cx=px+p.offsetWidth/2;b.style.setProperty('--tx',Math.max(14,Math.min(b.offsetWidth-30,cx-left-8))+'px');b.style.visibility='';pop(b);beep(700,.04);return b;}
/* inside the mosque: wall, windows, the mihrab and the prayer carpet (stars: twinkling ceiling) */
let IDN=0;
function interior(stars){const id='crp'+(++IDN);
  const win=x=>`<path d="M${x} 230 V160 Q${x+30} 118 ${x+60} 160 V230 Z" fill="#a9dcff" stroke="#d9a441" stroke-width="4"/>`;
  mk('st-bg','',`<svg width="960" height="520" viewBox="0 0 960 520"><defs><pattern id="${id}" width="120" height="74" patternUnits="userSpaceOnUse">
    <rect width="120" height="74" fill="#b8452f"/><path d="M0 71 H120" stroke="#e8c27a" stroke-width="5"/><path d="M60 16 l15 20 l-15 20 l-15 -20z" fill="#cf5f45"/></pattern></defs>
    <rect width="960" height="520" fill="#f7ecd6"/><rect width="960" height="44" fill="#2f7d6d"/><path d="M0 44 H960" stroke="#d9a441" stroke-width="5"/>
    ${win(40)}${win(420)}${win(640)}${win(840)}
    <path d="M200 300 V140 Q270 54 340 140 V300 Z" fill="#2f7d6d" stroke="#d9a441" stroke-width="7"/><path d="M226 300 V152 Q270 92 314 152 V300 Z" fill="#256a5c"/>
    <rect y="300" width="960" height="220" fill="url(#${id})"/></svg>`);
  if(stars)for(let i=0;i<18;i++)mk('st-star',`left:${14+i*53}px;top:7px`,'✨');}
/* the three people praying in a row (stick figures, as in the rest of the lesson) */
function row(names){return names.map((n,i)=>{const x=20+i*160;const f=figure(x,318,.7,'stand');mk('st-name',`left:${x+20}px;top:462px;width:100px`,`<span class="n" style="background:#fff8e6;border:2px solid #f2c200;border-radius:9px;padding:0 7px">${n}</span>`);return f;});}
/* 📌 a story pin: the worksheet question's keyword and its answer blocks (shown with pinShow) */
function pin(x,y,wd,lab,key,blocks,{size=26,note}={}){
  const c=mk('is-card st-pin',`left:${x}px;top:${y}px;width:${wd}px`,`<div class="lab">📌 ${lab}</div><div class="key lit">${key}</div>`);
  const bl=ansBlocks(0,0,wd-34,blocks,{size,show:false});bl.style.position='relative';bl.style.width='100%';c.appendChild(bl);
  if(note)mk('is-why note','position:relative',note,c);
  pop(c);beep(880,.08);return c;}
const pinShow=(w,P)=>revealBlocks(w,P.querySelector('.is-blocks'),{say:false,wait:260});

Lesson.start(Object.assign({}, ISLAMIC, {
  id:'i05', num:5, part:'Fiqh · الفقه', emoji:'🕌', title:'Prayer: required acts and rulings',
  intro:`Assalaamu alaykum! Hudhud here 🐦 Today: <b>prayer</b>, Question 5 of your sheet, and Hadith 3. Press <b>Start</b>!`,
  scenes:[
/* 0 */ {t:'Into the mosque',run:async w=>{
  const m=mk('','left:0;top:4px;width:960px;text-align:center;font-size:84px','🕌');pop(m);
  const t=mk('ar-font','left:0;top:110px;width:960px;text-align:center;font-size:52px;color:#8a4b00',aw('الصلاة','as-salaah'));pop(t);
  const f=figure(700,250,1.15,'stand');
  say(`${aw('السلام عليكم','assalaamu alaykum')}! Today is about ${aw('الصلاة','as-salaah')}, <b>prayer</b>. Watch my friend pray: standing, bowing, prostrating, sitting.`);
  for(const p of ['stand','ruku','up','sujood','sit']){f.set(p);await w(700);}
  await w(1600);
  const P=[['👀','Hadith 3','Eyes down in prayer'],['🖐️','Q5 a','Five required acts'],['✅','Q5 b','Tick or cross'],['🧱','Q5 c','Three definitions']];
  const els=P.map(([e,a,b],i)=>mk('is-card',`left:${30+(i%2)*360}px;top:${250+Math.floor(i/2)*124}px;width:330px;height:104px`,
    `<div style="display:flex;gap:14px;align-items:center"><div style="font-size:50px">${e}</div><div><div style="font-size:23px;font-weight:800;color:#7a4a00">${a}</div><div style="font-size:17px;font-weight:700;color:#626a80">${b}</div></div></div>`));
  const lines=[`First, <b>Hadith 3</b>: where to look when you pray.`,`Then <b>Question 5 a</b>: five things you <b>must</b> do in prayer.`,`<b>Question 5 b</b>: three ticks and crosses.`,`And <b>Question 5 c</b>: three definitions, built from the same few blocks.`];
  for(let i=0;i<4;i++){pop(els[i]);point(els[i]);beep(520+i*80,.08);say(lines[i]);await w(2600);}
  unpoint();say(`${aw('هيا بنا','hayyaa binaa')}! Let's start with a <b>story</b>. Watch for the 📌 pins: each one is an exam answer!`);await w(3000);}},

/* 1 */ {t:'Story: Off to the big mosque',run:async w=>{
  mk('st-bg','background:linear-gradient(#7cc8f5,#d4f0ff 62%,#ead8a8 62%,#dcc28a)','');
  const sun=mk('','left:420px;top:6px;font-size:64px','☀️');loop(sun,[{transform:'rotate(0deg)'},{transform:'rotate(25deg) scale(1.1)'}],1600,{direction:'alternate'});
  mk('','left:20px;top:150px;font-size:96px','🏠');mk('','left:170px;top:178px;font-size:70px','🌴');mk('','left:560px;top:212px;font-size:56px','🌴');
  const mos=mk('','left:690px;top:96px;font-size:200px;line-height:1','🕌');
  const D=person(-40,262,'👨','Baba',100),B=person(-130,292,'👦','Bilal',72);
  const go=walkTo([D,B],[250,250],5200);
  say(`Story time! 📖 Meet <b>Bilal</b>. Today he is going to <b>Dhuhr</b> prayer at the big mosque with his Baba, for the very first time.`);await w(3600);
  point(sun);an(sun,[{filter:'drop-shadow(0 0 0 #ffd84d)'},{filter:'drop-shadow(0 0 24px #ffd84d)'}],{duration:900});
  say(`The sun is high in the sky. It's midday: the time for Dhuhr.`);await w(2600);unpoint();await go;
  bub(B,`What if I get it wrong, Baba? 😟`);
  say(`Bilal is a little nervous. "What if I get it wrong, Baba?"`);await w(2800);
  bub(D,`Just listen to the imam. His voice tells you every move. 🎙️`);
  say(`Baba smiles. "Just listen to the imam. His voice tells you every move."`);await w(3000);
  bub(D,`And on the way home, I'll show you my reward chart ⭐`);
  say(`"And on the way home, I'll show you my special <b>reward chart</b>."`);await w(2800);
  bubs();await walkTo([D,B],[330,330],2200);
  clear();interior();
  const F=row(['Baba','Bilal','Yusuf']);
  say(`Inside, shoes off, the carpet is soft. Bilal stands between Baba and his friend <b>Yusuf</b>, in a nice straight row.`);await w(3400);
  const im=mk('st-bub',`left:20px;top:16px;max-width:510px`,`🎙️ Imam: ${ar('الله أكبر','Allah is the greatest','Allaahu akbar')}`);pop(im);
  say(`The imam says ${ar('الله أكبر','Allah is the greatest')}, and the prayer begins.`);await w(2600);im.remove();
  bub(F[1],`🤫 ${ar('أعوذ بالله من الشيطان الرجيم','I seek refuge with Allah from Satan, the outcast','a\'oodhu billaahi minash-shaytaanir-rajeem')}`,{x:200,y:178});
  say(`Before the Faatiha, Bilal quietly says the isti'aadha: ${ar('أعوذ بالله من الشيطان الرجيم','I seek refuge with Allah from Satan, the outcast.')}`);await w(4000);
  const P=pin(560,16,385,'Q5 (b) · 1 · tick or cross',ar(`من ${kw('سنن','sunan')} الصلاة ${kw('القولية','al-qawliyya')} ${kw('الاستعاذة','al-isti\'aadha')}`,
    `${kw('Al-isti\'aadha')} is one of the ${kw('spoken')} ${kw('sunnahs')} of prayer`),TICK,{size:44,note:`🗣️ you <b>say</b> it = spoken &nbsp;·&nbsp; ⭐ a bonus = sunnah`});
  await w(60);point(P);
  say(`Baba taught him this one. It's a <b>spoken sunnah</b>: you <b>say</b> it with your tongue, and it earns a reward.`);await w(3600);
  await pinShow(w,P);point(P.querySelector('.is-blocks'));
  say(`So on your sheet, ${ar('من سنن الصلاة القولية الاستعاذة','al-isti\'aadha is one of the spoken sunnahs of prayer')} is <b>true</b>. Tick √!`);await w(3600);unpoint();}},

/* 2 */ {t:'Story: The imam\'s voice (Q5 a)',run:async w=>{
  interior();
  const F=row(['Baba','Bilal','Yusuf']);const pose=p=>F.forEach(f=>f.set(p));
  const KEY=ar(`اكتب خمسة من ${kw('واجبات','waajibaat')} ${kw('الصلاة','as-salaah')}`,`Write five of the ${kw('required acts')} of ${kw('prayer')}`);
  say(`Bilal listens to the imam's voice. He's about to discover the <b>five required acts</b> of prayer: things everyone <b>must</b> do.`);await w(3600);
  const list=mk('',`left:560px;top:250px;width:385px;display:flex;flex-direction:row-reverse;flex-wrap:wrap;gap:8px;justify-content:flex-start`,'');
  let P=null;
  const imam=said=>{bubs();const b=mk('st-bub',`left:20px;top:16px;max-width:510px`,`🎙️ Imam: ${said}`);pop(b);return b;};
  const act=async(i,line)=>{const A=ACTS[i];P?.remove();P=pin(560,12,385,`Q5 (a) · required act ${i+1} of 5`,KEY,A.bl,{size:26});await w(60);

  await act(1,`${aw('التسميع','at-tasmee\'')}, from ${aw('سمع','sami\'a')}: <b>hear</b>. Number two!`);

  say(`Bilal answers with everyone: ${ar('ربنا ولك الحمد','Our Lord, and all praise is Yours.')} That's <b>praise</b>.`);await w(3400);
  await act(2,`${aw('التحميد','at-tahmeed')}, from ${aw('حمد','hamd')}: <b>praise</b>. Number three!`);
  imam(ar('الله أكبر','Allah is the greatest','Allaahu akbar'));pose('sujood');await w(800);
  const cat=mk('',`left:540px;top:430px;font-size:46px;z-index:6`,'🐈');an(cat,[{transform:'translateX(0)'},{transform:'translateX(-600px)'}],{duration:4200,easing:'linear'});

  say(`After two rak'ahs, everyone <b>sits</b>. Is it over? No, Dhuhr has four rak'ahs. This sitting is required!`);await w(3400);
  await act(3,`${aw('الجلوس للتشهد الأول','al-juloos lit-tashahhud al-awwal')}: <b>sitting</b> for the first tashahhud. Number four!`);

  say(`Sitting there, Bilal says the first tashahhud: ${ar('التحيات لله','All greetings are for Allah')}, and the rest of it.`);await w(3200);
  await act(4,`${aw('التشهد الأول','at-tashahhud al-awwal')}: <b>saying</b> the first tashahhud. Number five!`);
  bubs();P.remove();pose('stand');
  const m=mk('is-clue','left:575px;top:40px;white-space:normal;width:355px;text-align:center',`🖐️ <b>M</b>ove, <b>H</b>ear, <b>P</b>raise, <b>S</b>it, <b>S</b>ay`);pop(m);point(list);
  say(`Five required acts in one prayer! Bilal counts them on his fingers: <b>Move, Hear, Praise, Sit, Say</b>.`);await w(3600);unpoint();}},
