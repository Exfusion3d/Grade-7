<script>
/* Islamic Studies Lesson 1 · Start here · Exam toolkit.
   How to read the exam: the six question areas, the nine instruction words (what each one asks you to do), the keyword
   trick (shown on questions from Q4, Q6 and Q7), and tips for writing Arabic answers (right to left, joined letters,
   ال, ة / ه, ى / ي and the hamza seats). It opens with a story, "The Case of the Secret Exam Paper" (scenes 1–5). */
const COL=['#18a058','#2c66cf','#e06a1b','#6a45d8','#c2367a','#0f7a6e'];
/* an instruction-word card: emoji, the Arabic word, its meaning and what to do */
const IW=(x,{a,s,m,e,todo,col,fs=36})=>mk('is-card',`left:${x}px;top:8px;width:268px;height:190px;text-align:center;padding:6px 10px;border-color:${col}`,
  `<div style="font-size:28px;line-height:1.1">${e}</div><div style="font-size:${fs}px;font-weight:700;color:#5a3c00;line-height:1.2;white-space:nowrap">${aw(a,s)}</div>`+
  `<div style="font-size:19px;font-weight:800;color:${col};line-height:1.2">${m}</div><div style="font-size:14px;font-weight:700;color:#626a80;line-height:1.2">${todo}</div>`);
/* the demo panel under the cards: a real line from the sheet and an animation of what to do */
let PANEL=null;
const demo=(src,q,en,tr)=>{if(PANEL)PANEL.remove();
  PANEL=mk('is-card','left:30px;top:216px;width:900px;height:294px;padding:10px 20px',`<div class="src">${src}</div><div class="q" style="font-size:28px">${ar(q,en,tr,'blk')}</div>`);pop(PANEL);return PANEL;};
/* numbered dotted answer lines, right to left like the sheet */
async function lines(w,p,n,top){const L=[];for(let i=0;i<n;i++){
    const l=mk('',`left:${150}px;top:${top+i*36}px;width:700px;height:32px;display:flex;flex-direction:row-reverse;align-items:flex-end;gap:10px`,
      `<b style="font-size:20px;color:#7a4a00">-${i+1}</b><div style="flex:1;border-bottom:4px dotted #b9a27a;height:24px"></div><span class="pen" style="font-size:24px;visibility:hidden">✏️</span>`,p);
    pop(l);beep(520+i*70,.06);L.push(l);
    const pen=l.querySelector('.pen');pen.style.visibility='visible';an(pen,[{transform:'translateX(0)'},{transform:'translateX(-560px)'}],{duration:500});await w(520);pen.style.visibility='hidden';}
  return L;}
const chip=(a,s)=>`${aw(a)}<small style="color:#2c66cf;margin-left:6px;font-size:13px">${s}</small>`;
const big=(t,col='#5a3c00',fs=34)=>`<span class="ar-font" dir="rtl" style="font-size:${fs}px;font-weight:700;color:${col}">${t}</span>`;

/* ---------- the story: "The Case of the Secret Exam Paper" ----------
   Detective Zain and Hudhud crack the sheet clue by clue: the six doors (headings), the nine orders (instruction words),
   the counting clue (dotted lines), the keyword fingerprints (غار → حراء, احتقار → السخرية, يعلم … الصلاة → مسؤول)
   and the writing clues. Characters are fictional; nobody holy is ever drawn. */
document.head.insertAdjacentHTML('beforeend',`<style>
.st-hdr{left:0;top:0;width:960px;height:40px;background:linear-gradient(90deg,#6a45d8,#2c66cf);color:#fff;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:30}
.st-bub{background:#fff;border:3px solid #1f2433;border-radius:18px;padding:7px 13px;font-size:18px;font-weight:800;color:#1f2433;line-height:1.3;z-index:25;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.st-bub.h{border-color:#b86a2c;background:#fff4dc;color:#7a4a00}
.st-bub.o{border-color:#c2367a;color:#8a1f55}
.st-bub .aw{font-size:1.25em}
.st-tag{background:#fffdf5;border:3px solid #e04848;border-radius:16px;padding:6px 12px 10px;box-shadow:0 5px 0 rgba(224,72,72,.22);z-index:22}
.st-tag .lb{font-size:15px;font-weight:900;color:#e04848;letter-spacing:.03em}
.st-tag .kr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 6px}
.st-tag .kl{font-size:14px;font-weight:800;color:#626a80;white-space:nowrap}
.st-tag .k{font-size:28px;font-weight:700;color:#1f2433}
.st-tag .k .ax.en{font-size:19px}
.st-door{background:linear-gradient(90deg,#8a5a2b,#a8733c);border:3px solid #5e3a17;border-radius:8px 8px 0 0;transform-origin:left center}
.st-door::after{content:'';position:absolute;right:12px;top:50%;width:12px;height:12px;border-radius:50%;background:#ffd84d;box-shadow:0 0 0 2px #7a4a00}
.st-map .ax{font-size:22px;white-space:nowrap}.st-map .ax.en{font-size:16px;white-space:normal}.st-map.big .ax{font-size:34px}.st-map.big .ax.en{font-size:18px}.st-map.big .r{margin-top:20px!important}.st-map .r{gap:6px!important}body.en-mode .st-map .r{flex-wrap:wrap}.st-map.big.mid .ax:not(.en){font-size:24px}.st-map .nar .ax:not(.en){font-size:19px;max-width:150px;white-space:normal}
</style>`);
const HUD=`<svg viewBox="0 0 80 80" style="width:100%;height:100%;overflow:visible">${ISLAMIC.mascot.replace(/\sid="mouth"/,'')}</svg>`;
const hudhud=(x,y,s=92,p)=>mk('',`left:${x}px;top:${y}px;width:${s}px;height:${s}px;z-index:12`,HUD,p);
const zain=(x,y,s=80,p)=>mk('',`left:${x}px;top:${y}px;font-size:${s}px;line-height:1;z-index:12`,`🧒🏽<span style="position:absolute;font-size:.5em;left:.72em;top:.5em">🔎</span>`,p);
const hdr=t=>{const h=mk('st-hdr','',t);an(h,[{transform:'translateY(-40px)'},{transform:'translateY(0)'}],{duration:500});return h;};
/* a speech bubble on the stage (z = Zain, h = Hudhud, o = someone else); a new one replaces that speaker's last bubble */
const BB={};
const bub=(x,y,wd,html,who='z',p)=>{BB[who]?.remove();const b=mk('st-bub '+who,`left:${x}px;top:${y}px;width:${wd}px`,html,p);BB[who]=b;pop(b);beep(who==='h'?820:660,.05);return b;};
/* a 📌 tag for a worksheet question: its keyword and the answer as coloured blocks */
function pin(x,y,wd,label,key,blocks,size=32){
  const t=mk('st-tag',`left:${x}px;top:${y}px;width:${wd}px`,`<div class="lb">📌 ${label}</div><div class="kr"><span class="kl">🔑 keyword</span><span class="k lit">${key}</span></div>`);
  if(blocks){const b=ansBlocks(0,0,wd-30,blocks,{size});b.style.position='relative';b.style.left=b.style.top='';t.appendChild(b);}
  pop(t);beep(880,.08);return t;}
/* Zain's night-time bedroom */
function room(){
  const bg=mk('','left:0;top:0;width:960px;height:520px;background:linear-gradient(#1d2550,#3b3f8f 70%,#5a4a8a)','');
  const win=mk('','left:640px;top:40px;width:220px;height:170px;border:8px solid #c9a46a;border-radius:12px;background:linear-gradient(#0e1435,#27306a)',
    `<span style="position:absolute;left:130px;top:18px;font-size:54px">🌙</span>`,bg);
  [[30,40],[90,20],[60,110],[150,120],[20,90]].forEach(([x,y],i)=>{const s=mk('',`left:${x}px;top:${y}px;font-size:16px`,'✨',win);loop(s,[{opacity:1},{opacity:.2}],900+i*230,{direction:'alternate'});});
  mk('','left:0;top:420px;width:960px;height:100px;background:#4a3b6b','',bg);
  mk('','left:200px;top:380px;width:520px;height:26px;border-radius:8px;background:#a8733c;box-shadow:0 6px 0 #6e4521','',bg);
  mk('','left:230px;top:406px;width:20px;height:114px;background:#7e5126','',bg);mk('','left:670px;top:406px;width:20px;height:114px;background:#7e5126','',bg);
  const lamp=mk('','left:610px;top:300px;font-size:64px','💡',bg);loop(lamp,[{filter:'drop-shadow(0 0 6px #ffd84d)'},{filter:'drop-shadow(0 0 22px #ffd84d)'}],1200,{direction:'alternate'});
  return bg;}

Lesson.start(Object.assign({}, ISLAMIC, {
  id:'i01', num:1, part:'Start here', emoji:'🧰', title:'Exam toolkit: instruction words and keywords',
  intro:`Assalaamu alaykum! I'm <b>Hudhud the Hoopoe</b> 🐦 Before we learn the answers, let's learn how to <b>read the exam</b>. Press <b>Start</b>!`,
  scenes:[
/* 0 */ {t:'Meet Hudhud',run:async w=>{
  const hi=mk('ar-font','left:0;top:6px;width:960px;text-align:center;font-size:64px;color:#8a4b00',aw('السلام عليكم','assalaamu \'alaykum'));pop(hi);
  say(`${aw('السلام عليكم','assalaamu alaykum')}! I'm <b>Hudhud the Hoopoe</b>. In the Qur'an, a hoopoe brought important news to Prophet Sulaiman. I'll bring you the news you need for your exam.`);
  await w(3600);
  const steps=[['🔎','Spot the keyword','Find the one or two words that tell you the answer.'],['🧠','Remember the answer','See it in colours, hear it and picture it.'],['✍️','Write it','Build it, trace it, then write it on paper.']];
  const els=steps.map(([e,t,d],i)=>mk('is-card',`left:${30+i*306}px;top:168px;width:286px;height:170px;text-align:center`,
    `<div style="font-size:52px">${e}</div><div style="font-size:23px;font-weight:800;color:#7a4a00">${i+1}. ${t}</div><div style="font-size:16px;font-weight:700;color:#626a80;margin-top:4px">${d}</div>`));
  for(let i=0;i<3;i++){pop(els[i]);point(els[i]);beep(520+i*90,.08);say([`You don't need to understand every Arabic word. First, <b>spot the keyword</b>.`,`Then <b>remember the answer</b>: I'll show it in colours, say it, and give you a picture for it.`,`Then <b>write it</b>: build it with tiles, trace it with your finger, and write it on paper.`][i]);await w(3200);}
  unpoint();
  const tb=mk('','left:110px;top:372px;width:740px;padding:12px 18px;border-radius:18px;background:#fff4dc;border:3px solid #d9a441;font-size:19px;font-weight:800;color:#7a4a00;text-align:center;line-height:1.5',
    `<span style="background:#fff;border:2px solid #e3e0f0;border-radius:10px;padding:2px 8px">🇬🇧</span> turns all the Arabic into English. &nbsp; <span style="background:#fff;border:2px solid #e3e0f0;border-radius:10px;padding:2px 8px">🔤</span> shows how the Arabic sounds.<br>👆 Tap any Arabic on the screen to hear it again.`);pop(tb);point(tb);
  say(`Two buttons help you at the top. The <b>English</b> button turns all the Arabic into English. The <b>Sounds</b> button shows how the Arabic sounds, in English letters. Tap any Arabic to hear it.`);
  await w(4200);unpoint();
  say(`This first lesson is your <b>exam toolkit</b>: how to find your way around the sheet, what each instruction means, and how to write your answers. But first, a <b>mystery story</b>!`);await w(3800);}},

/* 1 */ {t:'Story: The secret paper',run:async w=>{
  room();const z=zain(80,300,96);
  const T=mk('','left:0;top:14px;width:960px;text-align:center;font-size:30px;font-weight:900;color:#ffd84d;text-shadow:0 3px 0 #1d2550;z-index:20','🔎 The Case of the Secret Exam Paper');pop(T);
  say(`Here's a story. This is <b>Zain</b>, a young detective. It's the night before his Islamic Studies revision, and something strange is about to land on his desk.`);await w(3800);
  const P=mk('is-card','left:250px;top:150px;width:330px;height:216px;padding:8px 12px;z-index:8',
    `<div style="font-size:16px;font-weight:700;line-height:1.5">${ar('السؤال الثاني : في مجال : العقيدة','Question 2: in the area of Belief','','blk')}${ar('أكمل ما يأتي','Complete the following','','blk')}</div>`+
    `<div style="margin-top:10px;border-bottom:3px dotted #b9a27a;height:18px"></div><div style="border-bottom:3px dotted #b9a27a;height:26px"></div><div style="border-bottom:3px dotted #b9a27a;height:26px"></div>`);
  await an(P,[{transform:'translate(420px,-320px) rotate(40deg)'},{transform:'translate(0,0) rotate(-4deg)'}],{duration:1200,easing:'cubic-bezier(.3,1.3,.5,1)'});beep(300,.12);
  T.remove();
  bub(20,180,250,`😱 A secret code?! I can't read a word of it!`,'z');shake(z);
  say(`Zain can't read much Arabic, so the paper looks like a <b>secret code</b>. His heart sinks.`);await w(3200);
  const mg=mk('','left:300px;top:200px;font-size:70px;z-index:10','🔎');
  an(mg,[{transform:'translate(0,0)'},{transform:'translate(170px,20px)'},{transform:'translate(60px,90px)'},{transform:'translate(0,0)'}],{duration:2600});
  say(`But a detective never gives up. Zain grabs his magnifying glass and looks closer.`);await w(2800);mg.remove();
  const h=hudhud(820,250,100);
  await an(h,[{transform:'translate(200px,-260px) scale(.5)'},{transform:'translate(0,0) scale(1)'}],{duration:1300});loop(h,[{transform:'translateY(0)'},{transform:'translateY(-8px)'}],700,{direction:'alternate'});
  bub(640,120,300,`Every code has <b>clues</b>, Detective Zain. Let's crack them together!`,'h');
  say(`Then I flew in through the window! Every code has <b>clues</b>. Crack the clues, and this paper is not scary at all.`);await w(3600);
  bub(20,180,250,`Clues? Then let's start! 🔎`,'z');pop(z);await w(1600);
  /* clue 1: the six doors */
  clear();hdr('🔎 Clue 1 · The six doors');
  const H=mk('is-card','left:130px;top:50px;width:700px;text-align:center;padding:6px 14px',
    `<div class="q" style="font-size:28px">${ar(`السؤال الثاني : في مجال : ${kw('العقيدة','al-\'aqeeda')}`,`Question 2: in the area of: ${kw('Belief')}`,'','blk')}</div>`);H.querySelector('.ax').style.textAlign='center';pop(H);
  say(`Clue one. The paper has <b>six parts</b>, Questions 2 to 7. Each one starts with a heading like this one.`);await w(3200);
  H.classList.add('lit');point(H.querySelector('.kw'));
  say(`The <b>last word</b> of the heading is the name on the door. It tells you the <b>topic</b> behind it.`);await w(3000);unpoint();
  const D=[['Q2','👼','العقيدة','al-\'aqeeda','Belief: the angels'],['Q3','🤲','الحديث','al-hadeeth','Hadith: sincerity, Hijra'],['Q4','📜','السيرة','as-seera','Life of the Prophet ﷺ'],
    ['Q5','🕌','الفقه','al-fiqh','Fiqh: prayer'],['Q6','👅','التهذيب','at-tahdheeb','Manners: the tongue'],['Q7','🧩','الثقافة الإسلامية','ath-thaqaafa al-islaamiyya','Islamic culture']];
  const L=[`Door two: ${aw('العقيدة','al-\'aqeeda')}, <b>Belief</b>. Behind it: the angels.`,`Door three: ${aw('الحديث','al-hadeeth')}, <b>Hadith</b>: sincerity and the Hijra.`,
    `Door four: ${aw('السيرة','as-seera')}, <b>the life of the Prophet</b> ﷺ, and the first revelation.`,`Door five: ${aw('الفقه','al-fiqh')}, <b>Fiqh</b>, the rules of worship. Inside: a prayer mat!`,
    `Door six: ${aw('التهذيب','at-tahdheeb')}, <b>Manners</b>: the sins of the tongue.`,`Door seven: ${aw('الثقافة الإسلامية','ath-thaqaafa al-islaamiyya')}, <b>Islamic culture</b>: responsibility.`];
  const F=[];
  for(let i=0;i<6;i++){const [n,e,a,s,m]=D[i],x=20+(5-i)*156;
    const f=mk('',`left:${x}px;top:150px;width:144px;height:226px;background:#fff8e6;border:3px solid ${COL[i]};border-radius:12px;text-align:center;overflow:visible`,
      `<div style="height:26px;background:${COL[i]};color:#fff;font-size:16px;font-weight:900;line-height:26px">${n}</div><div style="font-size:44px;margin-top:6px">${e}</div>`+
      `<div style="font-size:${a.length>10?18:27}px;font-weight:700;color:#5a3c00;line-height:1.25;margin-top:4px">${aw(a,s,m.split(':')[0])}</div><div style="font-size:13px;font-weight:800;color:#626a80;margin-top:4px;padding:0 4px">${m}</div>`);
    const d=mk('st-door','left:0;top:26px;width:138px;height:194px','',f);pop(f,i*80);F.push(f);
    F[i].door=d;}
  await w(700);
  for(let i=0;i<6;i++){point(F[i]);an(F[i].door,[{transform:'perspective(500px) rotateY(0)',opacity:1},{transform:'perspective(500px) rotateY(-100deg)',opacity:.15}],{duration:800});beep(420+i*60,.07);
    say(L[i]);await w(2700);}
  unpoint();
  [3,5].forEach(i=>{F[i].style.boxShadow=`0 0 0 6px #ffd84d`;an(F[i],[{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:600,iterations:2});});
  pin(20,392,450,'Exam check · Question 5',ar(`في مجال : ${kw('الفقه','al-fiqh')}`,`in the area of: ${kw('Fiqh')}`),null).insertAdjacentHTML('beforeend',`<div style="font-size:17px;font-weight:800;color:#18a058">🕌 the rules of worship, like prayer</div>`);
  say(`Pin these two for the exam check. ${aw('الفقه','al-fiqh')} is the <b>prayer</b> door.`);await w(2800);
  pin(490,392,450,'Exam check · Question 7',ar(`في مجال : ${kw('الثقافة الإسلامية','ath-thaqaafa al-islaamiyya')}`,`in the area of: ${kw('Islamic culture')}`),null).insertAdjacentHTML('beforeend',`<div style="font-size:17px;font-weight:800;color:#0f7a6e">🧩 Islamic culture: responsibility</div>`);
  say(`And ${aw('الثقافة الإسلامية','ath-thaqaafa al-islaamiyya')}, <b>Islamic culture</b>, is the <b>responsibility</b> door. Clue one: cracked!`);await w(3400);}},

/* 2 */ {t:'Story: Nine secret orders',run:async w=>{
  hdr('🔎 Clue 2 · The nine orders');
  const z=zain(40,420,74),h=hudhud(850,412,92);loop(h,[{transform:'translateY(0)'},{transform:'translateY(-6px)'}],700,{direction:'alternate'});
  bub(130,430,330,`Every question starts with a strange word. Is it a password? 🤔`,'z');
  say(`Zain spots something. Every question starts with the same kind of word. A password, maybe?`);await w(3000);
  bub(480,430,350,`Better! They're <b>orders</b>. Each one tells you what to do.`,'h');
  say(`Not a password: an <b>order</b>! Each one tells you exactly what to do. There are nine. Let's open the detective's notebook.`);await w(3600);
  const O=[['اكتب','uktub','write','✍️',0],['دون','dawwin','write down: a list','📝',0],['أكمل','akmil','complete: fill the gap','🧩',1],
    ['ضع خطا تحت','da\' khattan taht','put a line under','➖',1],['ضع علامة ( √ ) أو ( × )','da\' \'alaama','put a mark: tick or cross','✔️',0],['عرف','\'arrif','define: what it means','📖',1],
    ['أجب','ajib','answer: a short answer','💬',0],['حدد','haddid','decide: write the label','🏷️',1],['وضح','wadd-dih','explain it','💡',0]];
  const S=[`Order one: ${aw('اكتب','uktub')}, <b>write</b>. Look for a number, like ${aw('خمسة','khamsa')}, five: then write five answers.`,
    `${aw('دون','dawwin')} means <b>write down</b>: write a <b>list</b>. Remember this one. It comes back in a minute!`,
    `${aw('أكمل','akmil')} means <b>complete</b>. There's a gap: fill it with the missing word, like the last piece of a jigsaw.`,
    `${aw('ضع خطا تحت','da\' khattan taht')} means <b>put a line under</b>. So Zain underlined... his sandwich!`,
    `${aw('ضع علامة','da\' \'alaama')} means <b>put a mark</b>: a tick if the sentence is true, a cross if it's false.`,
    `${aw('عرف','\'arrif')} means <b>define</b>: write what a word means, like a dictionary.`,
    `${aw('أجب','ajib')} means <b>answer</b>: write a short answer to the question.`,
    `${aw('حدد','haddid')} means <b>decide</b>: pick the right label, like ${aw('مسؤول','mas\'ool')}, responsible, and write it.`,
    `${aw('وضح','wadd-dih')} means <b>explain</b>: show what it means, in your own words.`];
  const C=[];
  for(let i=0;i<9;i++){const [a,s,m,e,ex]=O[i],x=640-(i%3)*310,y=50+Math.floor(i/3)*120;
    const c=mk('is-card',`left:${x}px;top:${y}px;width:300px;height:108px;padding:6px 10px;display:flex;align-items:center;gap:8px;border-color:${COL[i%6]}`,
      `<div class="em" style="font-size:40px;width:52px;text-align:center">${e}</div><div style="flex:1;text-align:right"><div style="font-size:${a.length>12?20:a.length>6?26:32}px;font-weight:700;color:#5a3c00;line-height:1.25">${aw(a,s,m.split(':')[0])}</div>`+
      `<div style="font-size:15px;font-weight:800;color:${COL[i%6]};line-height:1.2">${m}</div></div>`+(ex?`<div style="position:absolute;right:-8px;top:-12px;font-size:24px">📌</div>`:''));
    C.push(c);pop(c);point(c);an(c.querySelector('.em'),[{transform:'scale(1) rotate(0)'},{transform:'scale(1.5) rotate(-15deg)'},{transform:'scale(1) rotate(0)'}],{duration:800,delay:300});beep(500+i*50,.06);
    say(S[i]);
    if(i===3){await w(2600);bub(130,430,330,`Done! A neat line under my sandwich! 🥪`,'z');an(z,[{transform:'rotate(0)'},{transform:'rotate(-12deg)'},{transform:'rotate(0)'}],{duration:500});

/* 11 */ {t:'Writing Arabic',run:async w=>{
  const t=mk('','left:0;top:10px;width:960px;text-align:center;font-size:30px;font-weight:800;color:#7a4a00','⬅ Arabic goes from right to left');pop(t);
  say(`Now some tips for <b>writing</b> your answers. Arabic is written from <b>right to left</b>. You start on the right.`);await w(3000);
  /* the letters of الطاعة, one at a time from the right */
  const Lt=[['ا','alif'],['ل','laam'],['ط','taa'],['ا','alif'],['ع','\'ayn'],['ة','taa marboota']];
  const row=mk('','left:80px;top:80px;width:800px;height:130px;display:flex;flex-direction:row-reverse;justify-content:center;gap:22px','');
  for(let i=0;i<Lt.length;i++){const s=document.createElement('div');s.style.cssText='text-align:center;background:#fff;border:3px solid #f0d9a8;border-radius:14px;padding:0 12px;min-width:70px';
    s.innerHTML=`<div class="ar-font" style="font-size:56px;font-weight:700;color:#5a3c00;line-height:1.4">${Lt[i][0]}</div><div style="font-size:13px;font-weight:800;color:#2c66cf">${Lt[i][1]}</div>`;
    row.appendChild(s);pop(s);beep(500+i*60,.05);await w(380);}
  point(row);say(`Here are the letters of ${aw('الطاعة','at-taa\'a')}, <b>obedience</b>, one by one, starting on the right.`);await w(3000);
  await an(row,[{gap:'22px',opacity:1},{gap:'0px',opacity:.25}],{duration:900,fill:'forwards'});
  row.remove();
  const word=mk('','left:180px;top:70px;width:600px;text-align:center',`${big('الطاعة','#18a058',96)}<div style="font-size:18px;font-weight:800;color:#2c66cf">at-taa'a · obedience</div>`);pop(word);yay();point(word);
  say(`In a real word, the letters <b>join up</b>, like joined-up handwriting. They change shape a little when they join.`);await w(3200);
  say(`A few letters, like ${aw('ا','alif')}, never join to the letter after them. That's why you see small gaps in ${aw('الطاعة','at-taa\'a')}.`);await w(3600);
  /* ال at the start */
  const eq=[['ال','al','the'],['طاعة','taa\'a','obedience'],'الطاعة','at-taa\'a','the obedience'],eq2=[['ال','al','the'],['إيمان','eemaan','faith'],'الإيمان','al-eemaan','faith'];
  const rowE=(e,y)=>{const r=mk('',`left:60px;top:${y}px;width:840px;display:flex;flex-direction:row-reverse;align-items:center;justify-content:center;gap:18px`,
    `<div class="is-b" style="background:#e06a1b"><div class="a ar-font" dir="rtl" style="font-size:38px">${e[0][0]}</div><div class="s">${e[0][1]}</div><div class="m">${e[0][2]}</div></div>`+
    `<span style="font-size:36px;font-weight:800;color:#7a4a00">+</span>`+
    `<div class="is-b" style="background:#2c66cf"><div class="a ar-font" dir="rtl" style="font-size:38px">${e[1][0]}</div><div class="s">${e[1][1]}</div><div class="m">${e[1][2]}</div></div>`+
    `<span style="font-size:36px;font-weight:800;color:#7a4a00">=</span>`+
    `<div class="is-b" style="background:#18a058"><div class="a ar-font" dir="rtl" style="font-size:38px">${e[2]}</div><div class="s">${e[3]}</div><div class="m">${e[4]}</div></div>`);
    [...r.children].forEach(c=>{if(c.dataset)c.dataset.a=c.querySelector?.('.a')?.textContent||'';});pop(r);return r;};
  const r1=rowE(eq,250);point(r1);
  say(`Lots of answers start with ${aw('ال','al')}. It means <b>the</b>: ${aw('ال','al')} plus ${aw('طاعة','taa\'a')} makes ${aw('الطاعة','at-taa\'a')}.`);await w(3600);
  const r2=rowE(eq2,385);point(r2);
  say(`And ${aw('ال','al')} plus ${aw('إيمان','eemaan')} makes ${aw('الإيمان','al-eemaan')}, <b>faith</b>. Don't forget the ${aw('ال','al')} when the answer has it!`);await w(3800);unpoint();}},

/* 12 */ {t:'Letters that look alike',run:async w=>{
  say(`Some Arabic letters look almost the same. A few dots change everything! Let's look at the ones in your answers.`);await w(3000);
  const R=[
    {l:[['ة','taa marboota','two dots on top · sounds "a" or "t"'],['ه','haa','no dots · sounds "h"']],
     ex:[['الطاعة · السخرية','at-taa\'a · as-sukhriyya'],['فاعله','faa\'iluh']],
     say:`At the end of a word: ${aw('ة','taa marboota')} has <b>two dots on top</b>, like in ${aw('الطاعة','at-taa\'a')} and ${aw('السخرية','as-sukhriyya')}. ${aw('ه','haa')} has <b>no dots</b>, like in ${aw('فاعله','faa\'iluh')}.`},
    {l:[['ى','alif maqsoora','no dots · sounds "aa"'],['ي','yaa','two dots under · sounds "ee"']],
     ex:[['تعالى','ta\'aalaa'],['النبي','an-nabee']],
     say:`${aw('ى','alif maqsoora')} has <b>no dots</b> and sounds "aa", like in ${aw('تعالى','ta\'aalaa')}. ${aw('ي','yaa')} has <b>two dots under</b> and sounds "ee", like in ${aw('النبي','an-nabee')}.`},
    {l:[['أ إ ؤ ء','hamza','the little hamza ء sits on a seat, or alone']],
     ex:[['أكمل · الإيمان · مسؤول · الجزاء','akmil · al-eemaan · mas\'ool · al-jazaa\'']],
     say:`The little ${aw('ء','hamza')} is a short stop. It sits <b>on</b> an alif, <b>under</b> an alif, on a waw, or <b>alone</b>, as in these four answers. Check where it sits!`}];
  for(let i=0;i<3;i++){const o=R[i],y=8+i*170;
    const c=mk('is-card',`left:30px;top:${y}px;width:900px;height:154px;padding:8px 14px;border-color:${COL[i]}`,'');pop(c);
    const half=o.l.length===2?430:860;
    o.l.forEach(([a,s,m],j)=>{mk('',`left:${(o.l.length===2?(1-j)*440:0)+10}px;top:4px;width:${half}px;display:flex;flex-direction:row-reverse;align-items:center;gap:14px`,
      `<div class="ar-font" dir="rtl" style="font-size:58px;font-weight:700;color:${COL[i]};min-width:70px;text-align:center;line-height:1.3">${a}</div>`+
      `<div style="text-align:right"><div style="font-size:16px;font-weight:800;color:#2c66cf">${s}</div><div style="font-size:15px;font-weight:700;color:#626a80">${m}</div>`+
      `<div class="ar-font" dir="rtl" style="font-size:30px;font-weight:700;color:#5a3c00;line-height:1.3">${o.ex[j][0]}</div><div style="font-size:13px;font-weight:800;color:#2c66cf">${o.ex[j][1]}</div></div>`,c);});
    point(c);say(o.say);await w(5200);}
  unpoint();}},
