/* a definition taught chunk by chunk: each chunk is a group of coloured word blocks with a picture on its right */
async function chunkRows(w,chunks,{top,rowH=96,size=28}){
  for(let i=0;i<chunks.length;i++){const C=chunks[i],y=top+i*rowH;
    const ic=mk('',`left:858px;top:${y+4}px;width:72px;text-align:center;font-size:44px`,C.e);pop(ic);
    const bl=ansBlocks(30,y,810,C.bl.map(b=>[b[0],b[1],b[2],C.c]),{size,show:false});
    await revealBlocks(w,bl,{say:false,wait:250});point(ic);
    const lb=mk('',`left:30px;top:${y+14}px;width:${Math.max(120,bl.lastElementChild.offsetLeft-20)}px;font-size:19px;font-weight:800;color:${C.c}`,'= '+C.en);pop(lb);
    say(`${aw(C.bl.map(b=>b[0]).join(' '),C.bl.map(b=>b[1]).join(' '))}: <b>${C.en}</b>.`);await w(2600);}
  unpoint();}

Lesson.start(Object.assign({}, ISLAMIC, {
  id:'i04', num:4, part:'Life of the Prophet ﷺ · السيرة', emoji:'📜', title:'The first revelation in the cave of Hira',

  scenes:[
/* 0 */ {t:'The cave of Hira',run:async w=>{
  const sky=mk('','left:0;top:0;width:960px;height:520px;border-radius:18px;overflow:hidden',
    `<svg width="960" height="520" viewBox="0 0 960 520"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2350"/><stop offset="1" stop-color="#5a4a9a"/></linearGradient>
      <radialGradient id="gl"><stop offset="0" stop-color="#fff6c8"/><stop offset=".45" stop-color="#ffd84d" stop-opacity=".8"/><stop offset="1" stop-color="#ffd84d" stop-opacity="0"/></radialGradient></defs>

      <path d="M350 250 Q352 212 372 208 Q392 212 394 250 Z" fill="#1f160e"/>

  const cave=mk('is-chip','left:290px;top:262px',`${ar('غار حراء','the cave of Hira','ghaar hiraa\'')}`);pop(cave);point(cave);

  const jb=mk('is-chip','left:520px;top:120px',`✨ ${ar('جبريل','Jibreel','jibreel')}`);pop(jb);point(jb);

  const rd=mk('is-card','left:610px;top:190px;width:290px;text-align:center',`<div style="font-size:40px">📖</div><div style="font-size:24px;font-weight:800;color:#7a4a00">"Read!"</div>`+

  say(`Keep this picture in your head: ⛰️ cave, 🌙 Ramadan, 🎂 forty, ✨ Jibreel, 📖 Read. It answers half of Question 4!`);await w(3600);}},

/* 1 */ {t:'Khadijah and Waraqa',run:async w=>{
  const S=[{x:650,e:'🏠',a:'خديجة رضي الله عنها',s:'khadeeja radiyallaahu \'anhaa',en:'Khadijah',d:'His wife comforted him'},
    {x:340,e:'📜',a:'ورقة بن نوفل',s:'waraqa ibn nawfal',en:'Waraqa ibn Nawfal',d:'Her cousin, who knew the earlier holy books'},
    {x:30,e:'✨',a:'الناموس',s:'an-naamoos',en:'an-Naamoos',d:'= the angel of revelation, Jibreel'}];
  const T=[`After that, the Prophet ﷺ went home to his wife ${aw('خديجة','khadeeja')}, Khadijah. She comforted him.`,

    `Waraqa said it was ${aw('الناموس','an-naamoos')}, an-Naamoos, who had come to Prophet Musa. An-Naamoos means the <b>angel of revelation</b>: Jibreel!`];
  for(let i=0;i<3;i++){const s=S[i];
    const c=mk('is-card',`left:${s.x}px;top:14px;width:280px;height:228px;text-align:center`,
      `<div style="font-size:52px">${s.e}</div><div style="font-size:26px;font-weight:700;color:#5a3c00;line-height:1.35">${ar(s.a,s.en,s.s)}</div><div style="font-size:16px;font-weight:700;color:#626a80;margin-top:4px">${s.d}</div>`);
    pop(c);point(c);if(i)mk('',`left:${s.x+282}px;top:110px;font-size:34px;width:28px;text-align:center`,'⬅');
    say(T[i]);await w(3800);}
  unpoint();
  const f=mk('is-card','left:30px;top:268px;width:900px;text-align:center',
    `<div style="font-size:20px;font-weight:800;color:#7a4a00">Later, the revelation came in <b>different forms</b>:</div>`+
    `<div style="display:flex;justify-content:center;gap:60px;margin-top:8px"><div><div style="font-size:50px">👤</div><div style="font-size:16px;font-weight:800">Jibreel sometimes came<br>looking like a man</div></div>`+

    clue:`<span class="ar-font" dir="rtl">غار</span> → ⛰️🕳️ → Hira`,answer:[['حراء','hiraa\'','Hira']],blockSize:44,

  await clueCard(w,{src:WS+'(a) · 3',

  const top=q.offsetHeight+20;
  const h=mk('is-clue',`left:30px;top:${top}px;width:900px;box-sizing:border-box;text-align:center`,`<span class="ar-font" dir="rtl">لغة</span> in language → 🤫⚡ → <b>secret and quick</b>`);pop(h);point(h);
