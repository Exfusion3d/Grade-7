   No Qur'an verse is shown or spoken in Arabic; only the surah's name. The Prophet ﷺ and the angel are never drawn. */
const WS='Worksheet · Q4 · ';
const DEF_L=[ /* لغة: يطلق على الإعلام في خفاء وسرعة */
  {c:'#18a058',e:'🗣️',bl:[['يطلق','yutlaqu','it is used'],['على','\'alaa','for']],en:'it is used for'},

  {c:'#6a45d8',e:'🤫',bl:[['في','fee','in'],['خفاء','khafaa\'','secret']],en:'secretly'},
  {c:'#e06a1b',e:'⚡',bl:[['وسرعة','wa sur\'a','and quickly']],en:'and quickly'}];
const DEF_S=[ /* شرعا: إعلام الله تعالى أنبياءه ورسله بما يريد أن يبلغه إليهم */

  {c:'#6a45d8',e:'📨',bl:[['أن','an','to'],['يبلغه','yuballighahu','pass it on'],['إليهم','ilayhim','to them']],en:'to pass on to them'}];
/* a definition taught chunk by chunk: each chunk is a group of coloured word blocks with a picture on its right */
async function chunkRows(w,chunks,{top,rowH=96,size=28}){
  for(let i=0;i<chunks.length;i++){const C=chunks[i],y=top+i*rowH;
    const ic=mk('',`left:858px;top:${y+4}px;width:72px;text-align:center;font-size:44px`,C.e);pop(ic);
    const bl=ansBlocks(30,y,810,C.bl.map(b=>[b[0],b[1],b[2],C.c]),{size,show:false});
    await revealBlocks(w,bl,{say:false,wait:250});point(ic);
    const lb=mk('',`left:30px;top:${y+14}px;width:${Math.max(120,bl.lastElementChild.offsetLeft-20)}px;font-size:19px;font-weight:800;color:${C.c}`,'= '+C.en);pop(lb);
    say(`${aw(C.bl.map(b=>b[0]).join(' '),C.bl.map(b=>b[1]).join(' '))}: <b>${C.en}</b>.`);await w(2600);}
  unpoint();}

/* the story: a "📌 Q4 …" tag pops up when a story moment answers a worksheet question: the keyword, then the answer blocks */
function pin(x,y,wd,tag,[ka,ks,ke],ans,{size=30}={}){
  const p=mk('is-card lit',`left:${x}px;top:${y}px;width:${wd}px;box-sizing:border-box;z-index:15;padding:6px 12px 10px`,
    `<div class="src">📌 Q4 ${tag}</div><div style="display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;margin:2px 0 6px">`+
    `<span style="font-size:14px;color:#626a80">keyword:</span>${ar(kw(ka,ks),kw(ke))}</div>`);
  const b=ansBlocks(0,0,wd-24,ans,{size});b.style.position='relative';p.appendChild(b);
  pop(p);point(p);beep(880,.08);return p;}
function unpin(p){unpoint();an(p,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.8)'}],{duration:350}).then(()=>p.remove());}

Lesson.start(Object.assign({}, ISLAMIC, {
  id:'i04', num:4, part:'Life of the Prophet ﷺ · السيرة', emoji:'📜', title:'The first revelation in the cave of Hira',
  intro:`Assalaamu alaykum! It's <b>Hudhud</b> 🐦 again. Today: the <b>first revelation</b> in the cave of Hira, Question 4 of your sheet. Press <b>Start</b>!`,
  scenes:[
/* 0 */ {t:'Story: The cave on the mountain',run:async w=>{
  const bg=mk('','left:0;top:0;width:960px;height:520px;border-radius:18px;overflow:hidden',

      <rect width="960" height="520" fill="url(#sk0)"/>

      <path d="M-20 520 L120 330 L210 230 L290 120 Q310 100 330 118 L420 230 L520 360 L640 520 Z" fill="#6b4e33"/>
      <path d="M290 120 Q310 100 330 118 L372 170 Q320 150 262 162 Z" fill="#82603f"/>
      <path d="M120 330 L210 230 L250 250 L160 360 Z" fill="#5d432c"/>

      <rect y="492" width="960" height="28" fill="#3d2c1d"/>
      <g fill="#d8c39a"><rect x="650" y="452" width="46" height="40"/><rect x="702" y="440" width="40" height="52"/><rect x="752" y="458" width="38" height="34"/><rect x="852" y="446" width="44" height="46"/><rect x="902" y="460" width="50" height="32"/></g>
      <rect x="800" y="450" width="40" height="42" fill="#15151a"/><rect x="800" y="458" width="40" height="5" fill="#d9a441"/>
      <g id="win0" fill="#ffd84d"><rect x="664" y="464" width="8" height="10"/><rect x="716" y="452" width="8" height="10"/><rect x="766" y="468" width="8" height="10"/><rect x="866" y="458" width="8" height="10"/><rect x="920" y="470" width="8" height="10"/></g>
    </svg>`);
  loop(bg.querySelector('#stars0'),[{opacity:1},{opacity:.4}],1400,{direction:'alternate'});
  loop(bg.querySelector('#win0'),[{opacity:1},{opacity:.6}],900,{direction:'alternate'});
  const glow=bg.querySelector('#glow0');
  const ttl=mk('','left:0;top:20px;width:960px;text-align:center;font-size:40px;font-weight:800;color:#ffe9a8;text-shadow:0 3px 0 #1d2350','📜 A true story');pop(ttl);
  say(`${aw('السلام عليكم','assalaamu alaykum')}! Today's story is <b>true</b>. It happened in Makkah more than 1,400 years ago, and it changed the whole world.`);await w(3600);

  const mc=mk('is-chip','left:660px;top:384px',`🕋 ${ar('مكة','Makkah','makka')}`);pop(mc);point(mc);

  const am=mk('is-chip','left:620px;top:296px',`⭐ ${ar('الأمين','al-Ameen: the trustworthy one','al-ameen')}`);pop(am);point(am);
  say(`But one man was different: Muhammad ﷺ. Everyone knew he was honest. They called him ${aw('الأمين','al-ameen','al-Ameen')}, the <b>trustworthy one</b>.`);await w(3800);
  an(am,[{opacity:1},{opacity:0}],{duration:400});unpoint();
  /* footsteps climbing the path to the cave */
  const P=[[600,505],[520,452],[560,404],[468,344],[500,292],[402,244],[424,210],[330,192]];
  const ft=mk('','left:0;top:0;font-size:30px;z-index:5','👣');
  const fd=mk('','left:0;top:0;font-size:24px;z-index:5','🫓💧');
  say(`Before the revelation, he loved to be <b>alone</b>, away from the noise, to <b>worship</b> Allah. He took food and water and climbed up a mountain near Makkah.`);
  an(ft,P.map(([x,y])=>({transform:`translate(${x-15}px,${y-22}px)`})),{duration:5200,easing:'linear'});
  an(fd,P.map(([x,y])=>({transform:`translate(${x+14}px,${y-4}px)`})),{duration:5600,easing:'linear'});
  await w(4200);
  an(glow,[{opacity:0},{opacity:.55}],{duration:900});
  const cv=mk('is-chip','left:350px;top:146px',`🕳️ ${ar('غار حراء','the cave of Hira','ghaar hiraa\'')}`);pop(cv);point(cv);

  ft.remove();fd.remove();
  let p=pin(560,12,380,'(a) 2',['غار','ghaar','cave'],[['حراء','hiraa\'','Hira']],{size:40});
  say(`📌 That's Question 4 a 2! The keyword is ${aw('غار','ghaar')}, <b>cave</b>. Which cave did he worship in? ${aw('حراء','hiraa\'')}, <b>Hira</b>.`);await w(4000);

  const ag=mk('is-chip','left:40px;top:300px;font-size:30px','🎂 <b id="yr">1</b>&nbsp;years old');pop(ag);point(ag);
  const yr=ag.querySelector('#yr');let n=1;const iv=setInterval(()=>{if(!yr.isConnected||n>=40){clearInterval(iv);return;}yr.textContent=++n;},45);
  say(`Years went by. He grew older and older… until he was <b>forty</b> years old.`);await w(3200);
  await w.until(()=>n>=40);clearInterval(iv);yr.textContent='40';an(ag,[{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:600});
  p=pin(560,12,380,'(b) 1',['أربعين','arba\'een','forty'],TICK,{size:44});
  say(`📌 Question 4 b 1: ${aw('أربعين','arba\'een')} means <b>forty</b>. The revelation came when he was forty. So that sentence is <b>true</b>: tick √.`);await w(4200);
  unpin(p);
  const mn=mk('','left:40px;top:24px;font-size:64px','🌙');an(mn,[{opacity:0,transform:'translateY(30px) rotate(-30deg)'},{opacity:1,transform:'translateY(0) rotate(0)'}],{duration:900});
  const rm=mk('is-chip','left:120px;top:36px',`${ar('رمضان','Ramadan','ramadaan')}`);pop(rm);point(rm);
  say(`Then the new moon was seen: the month of ${aw('رمضان','ramadaan')}, <b>Ramadan</b>, had begun. He went up to the cave again, to worship.`);await w(3800);
  p=pin(560,12,380,'(b) 3',['رمضان','ramadaan','Ramadan'],TICK,{size:44});

  unpin(p);unpoint();
  an(glow,[{opacity:.55},{opacity:1}],{duration:900});loop(glow,[{transform:'scale(1)',transformOrigin:'318px 176px'},{transform:'scale(1.3)',transformOrigin:'318px 176px'}],800,{direction:'alternate'});

/* 1 */ {t:'Story: "Read!"',run:async w=>{
  const bg=mk('','left:0;top:0;width:960px;height:520px;border-radius:18px;overflow:hidden',

      <rect y="470" width="960" height="50" fill="#2c1f12"/>
    </svg>`);
  loop(bg.querySelector('#st1'),[{opacity:1},{opacity:.4}],1300,{direction:'alternate'});
  const glow=bg.querySelector('#glow1');
  const lb=mk('is-chip','left:20px;top:14px;font-size:16px',`🕳️ inside ${ar('غار حراء','the cave of Hira','ghaar hiraa\'')}`);pop(lb);

  an(glow,[{opacity:0},{opacity:1}],{duration:1400});loop(glow,[{transform:'scale(1)',transformOrigin:'315px 260px'},{transform:'scale(1.12)',transformOrigin:'315px 260px'}],900,{direction:'alternate'});

  say(`Suddenly, the angel ${aw('جبريل','jibreel')}, <b>Jibreel</b>, came to him. We never draw angels, so in our picture there is only a light.`);await w(3800);
  let p=pin(580,12,360,'(a) 3',['الملك','al-malak','the angel'],[['جبريل','jibreel','Jibreel'],['عليه السلام','\'alayhis-salaam','peace be upon him']],{size:36});
  say(`📌 Question 4 a 3: ${aw('الملك','al-malak')}, <b>the angel</b>. The angel who came down to the Prophet ﷺ was ${aw('جبريل عليه السلام','jibreel \'alayhis-salaam')}, Jibreel, peace be upon him.`);await w(4200);
  say(`Remember Lesson 2? Jibreel is the angel who brings Allah's words to the prophets.`);await w(2800);

  const C=mk('','left:610px;top:150px;display:flex;gap:16px;font-size:60px','');
  say(`The angel held him tightly, until it was very hard to bear, then let him go and said again: <b>Read!</b> This happened <b>three</b> times.`);
  ['1️⃣','2️⃣','3️⃣'].forEach((e,i)=>{const s=document.createElement('span');s.textContent=e;s.style.opacity=0;C.appendChild(s);pop(s,600+i*1500);});
  await w(4800);b1.remove();b2.remove();C.remove();unpoint();

  say(`Think about it: the very first word Allah sent down was <b>Read!</b> A great reason to love reading and learning.`);await w(3400);
  say(`Then the light was gone. The Prophet ﷺ left the cave and hurried home, his heart trembling…`);an(glow,[{opacity:1},{opacity:0}],{duration:1600});an(sp,[{opacity:1},{opacity:0}],{duration:1200});await w(3200);}},
