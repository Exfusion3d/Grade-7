<script>
/* Islamic Studies Lesson 7 · Islamic culture (الثقافة الإسلامية) · Worksheet Q7 (a) 1–3, (b), (c).
   Responsible or irresponsible (مسؤول / غير مسؤول), the four kinds of personal responsibility (المسؤولية + an ending
   in ـية) and responsibility towards religion (worship and dealings). Same pattern as the pilot, i02-angels.html.
   Scenes 1–5 are the opening story, "One week in Ramadan with the Saleh family": Faris stays up all night (a 1), Reem
   drinks too many energy drinks (a 2), Dad teaches the little ones to pray (a 3), Dad shows the four circles (b), and
   Faris prays at the mosque and sells honestly at the family shop (c); then a story map of all five questions. */
const WS='Worksheet · Q7 · ';
const MAS='#6a45d8';
const KINDS=[
  {e:'🕌',end:'الدينية',s:'ad-deeniyya',m:'religious',who:'religion',col:'#18a058',word:'Dad'},
  {e:'🧍',end:'الشخصية',s:'ash-shakhsiyya',m:'personal',who:'me',col:'#2c66cf',word:'Shows'},
  {e:'👨‍👩‍👧',end:'الأسرية',s:'al-usariyya',m:'family',who:'my family',col:'#e06a1b',word:'Us'},
  {e:'🏙️',end:'المجتمعية',s:'al-mujtama\'iyya',m:'to society',who:'society',col:'#c2367a',word:'Manners'}];
const bt=t=>`<span class="ar-font" style="font-size:26px">${t[0]}</span> <small>${t[1]}</small>`;
/* ---------- story helpers (the Saleh family's week in Ramadan) ---------- */
/* a character: big emoji with a name tag; .e is the emoji (change its text to change the face) */
const who=(x,y,e,name,size=80)=>mk('st-who',`left:${x}px;top:${y}px;width:${Math.round(size*1.5)}px`,`<div class="e" style="font-size:${size}px">${e}</div><div><span class="n">${name}</span></div>`);
const face=(c,e)=>{c.querySelector('.e').textContent=e;pop(c.querySelector('.e'));};
/* walk to x (and y), bobbing on the way */
async function walk(c,x,ms=1200,y){const b=loop(c.querySelector('.e'),[{transform:'translateY(0)'},{transform:'translateY(-9px)'}],230,{direction:'alternate'});
  const f={left:c.offsetLeft+'px',top:c.offsetTop+'px'},t={left:x+'px',top:(y??c.offsetTop)+'px'};
  await an(c,[f,t],{duration:ms,easing:'ease-in-out'});b.cancel();}
/* a speech bubble on the stage (tail on the left, or on the right with r) */
const bub=(x,y,html,{wd,r}={})=>{const b=mk('st-bub'+(r?' r':''),`left:${x}px;top:${y}px${wd?`;width:${wd}px`:';white-space:nowrap'}`,html);pop(b);beep(660,.04);return b;};
/* a window onto the sky that can turn from day to night and back */
function win(x,y,wd,h,night){
  const f=mk('st-win',`left:${x}px;top:${y}px;width:${wd}px;height:${h}px`,'');
  const sun=mk('',`left:${wd*.12}px;top:${h*.12}px;font-size:${h*.3}px;opacity:${night?0:1}`,'☀️',f);
  const n=mk('',`left:0;top:0;width:100%;height:100%;background:linear-gradient(#0f1440,#3a3f86);opacity:${night?1:0}`,
    `<div style="position:absolute;left:${wd*.6}px;top:${h*.1}px;font-size:${h*.3}px">🌙</div>`+[[.15,.2],[.35,.55],[.25,.75],[.8,.65],[.5,.3]].map(([a,b])=>`<div class="st-star" style="left:${wd*a}px;top:${h*b}px">✦</div>`).join(''),f);
  n.querySelectorAll('.st-star').forEach((s,i)=>loop(s,[{opacity:.25},{opacity:1}],500+i*170,{direction:'alternate'}));
  mk('',`left:${wd/2-4}px;top:0;width:8px;height:${h}px;background:#8a5a2b`,'',f);mk('',`left:0;top:${h/2-4}px;width:${wd}px;height:8px;background:#8a5a2b`,'',f);
  return{f,night:()=>{an(n,[{opacity:1}],{duration:1000});an(sun,[{opacity:0}],{duration:600});},day:()=>{an(n,[{opacity:0}],{duration:1000});an(sun,[{opacity:1}],{duration:1000});}};}
/* the moment a worksheet question happens in the story: a pinned card with the question (keywords lit) */
function pin(x,y,wd,src,q,en){const c=mk('is-card st-pin lit',`left:${x}px;top:${y}px;width:${wd}px`,`<div class="src">📌 ${src}</div><div class="pq">${ar(q,en,'','blk')}</div>`);
  pop(c);beep(880,.1);beep(1100,.1);point(c);return c;}
/* answer blocks inside a pinned card (a row, optionally with a picture on the left) */
function pinBlocks(c,ans,{size=30,pic}={}){const row=document.createElement('div');row.className='st-row';c.appendChild(row);
  if(pic){const p=document.createElement('div');p.className='st-pic';p.innerHTML=pic;row.appendChild(p);}
  const bl=ansBlocks(0,0,10,ans,{size,show:false});row.appendChild(bl);Object.assign(bl.style,{position:'relative',left:'0',top:'0',width:'auto',flex:'1'});return bl;}

Lesson.start(Object.assign({}, ISLAMIC, {
  id:'i07', num:7, part:'Islamic culture · الثقافة الإسلامية', emoji:'🧩', title:'Responsibility',
  intro:`Assalaamu alaykum! It's <b>Hudhud the Hoopoe</b> 🐦 Today: <b>responsibility</b>, Question 7 of your sheet. Press <b>Start</b>!`,
  scenes:[
/* 0 */ {t:'Responsible or not?',run:async w=>{
  say(`Question 7 is all about <b>responsibility</b>: doing your duties and looking after what you are in charge of. Two words open the door to the whole question.`);await w(3600);
  const R=mk('is-card','left:500px;top:20px;width:410px;height:230px;text-align:center;border-color:#18a058',
    `<div style="font-size:54px">🦸</div><div style="font-size:60px;font-weight:700;color:#18a058;line-height:1.2">${aw('مسؤول','mas\'ool')}</div><div style="font-size:20px;font-weight:800;color:#626a80">responsible</div>`);pop(R);point(R);
  say(`${aw('مسؤول','mas\'ool')} means <b>responsible</b>: someone who does the right thing and looks after their duties.`);await w(3200);
  const N=mk('is-card','left:50px;top:20px;width:410px;height:230px;text-align:center;border-color:#e04848',
    `<div style="font-size:54px">🙈</div><div style="font-size:60px;font-weight:700;color:#e04848;line-height:1.2">${aw('غير','ghayr')} ${aw('مسؤول','mas\'ool')}</div><div style="font-size:20px;font-weight:800;color:#626a80">irresponsible</div>`);pop(N);point(N);
  say(`${aw('غير مسؤول','ghayr mas\'ool')} means <b>irresponsible</b>. It's the same word with one extra word in front.`);await w(3200);
  const g=N.querySelector('.aw');g.style.cssText+=';background:#ffe680;border-radius:10px;box-shadow:0 0 0 3px #ffd84d';
  const ch=mk('is-chip','left:110px;top:270px',`<span class="ar-font" dir="rtl">غير</span><span>= not (like "un-" or "ir-")</span>`);pop(ch);point(ch);
  say(`${aw('غير','ghayr')} means <b>not</b>. So ${aw('غير مسؤول','ghayr mas\'ool')} is <b>not responsible</b>. Write ${aw('غير','ghayr')} first, on the right.`);await w(3600);
  const tip=mk('is-why','left:130px;top:350px;width:700px;text-align:center;font-size:19px',
    `✍️ Writing tip: hamza <bdi class="ar-font" style="font-size:30px">ء</bdi> + waaw <bdi class="ar-font" style="font-size:30px">و</bdi> = <bdi class="ar-font" style="font-size:30px">ؤ</bdi> (a hamza hat on the waaw)<br>`+
    `<span class="ar-font" dir="rtl" style="font-size:40px;color:#5a3c00">مسـ<span style="color:#e04848">ؤ</span>ول</span>`);pop(tip);point(tip);
  say(`Writing tip: in ${aw('مسؤول','mas\'ool')}, the little hamza ${aw('ء','hamza')} sits on top of a ${aw('و','waaw')}, like a hat. Then comes another ${aw('و','waaw')} and a ${aw('ل','laam')}.`);await w(4200);unpoint();}},

/* 1 */ {t:'Story: Faris the night owl (Q7 a 1)',run:async w=>{
  mk('','left:0;top:0;width:960px;height:520px;background:linear-gradient(#fff8ea,#f6e3c4)');
  mk('','left:0;top:400px;width:960px;height:120px;background:#d9b98c');
  const ttl=mk('st-title','left:110px;top:24px;width:740px','🌙 One week in Ramadan with the Saleh family');pop(ttl);
  const fam=[['👨','Dad',90],['🧕','Mum',90],['🧑','Faris, 16',84],['👧','Reem, 14',80],['👦','Yusuf, 7',64],['🧒','Huda, 5',58]];
  const F=fam.map(([e,n,s],i)=>who(40+i*150,400-s-46,e,n,s));F.forEach((f,i)=>pop(f,300+i*150));
  F.forEach((f,i)=>loop(f.querySelector('.e'),[{transform:'translateY(0)'},{transform:'translateY(-6px)'}],700+i*90,{direction:'alternate'}));
  say(`Story time! Meet the <b>Saleh family</b>. This Ramadan, in one week, they will act out every answer of Question 7.`);await w(3600);
  point(F[2]);say(`There's Dad and Mum, big brother <b>Faris</b>, sister <b>Reem</b>, and the little ones, <b>Yusuf</b> and <b>Huda</b>.`);await w(3600);
  unpoint();clear();
  /* Faris's room */
  mk('','left:0;top:0;width:960px;height:520px;background:#f1e2c6');
  mk('','left:0;top:400px;width:960px;height:120px;background:#c99e6b');
  const W=win(620,36,230,160,true);
  const bed=mk('','left:640px;top:268px;font-size:150px;line-height:1','🛏️');
  const dark=mk('','left:0;top:0;width:960px;height:520px;background:#0b1035;opacity:0;z-index:5;pointer-events:none');
  const tv=mk('','left:60px;top:250px;font-size:100px;line-height:1;z-index:8','📺');
  const clk=mk('st-clock','left:30px;top:30px','8:30 pm');pop(clk);
  const fa=who(-140,282,'🧑','Faris',80);
  const day=mk('st-day','left:330px;top:36px','Night 1');pop(day);
  say(`Night one. After the Taraweeh prayer, Faris sits down with his brand-new video game.`);
  await walk(fa,220,1500);W.night();an(dark,[{opacity:.42}],{duration:1200});
  loop(tv,[{filter:'drop-shadow(0 0 3px #7fd0ff)'},{filter:'drop-shadow(0 0 26px #7fd0ff)'}],600,{direction:'alternate'});
  const pad=mk('','left:330px;top:330px;font-size:42px;z-index:9','🎮');pop(pad);loop(pad,[{transform:'rotate(-12deg)'},{transform:'rotate(12deg)'}],260,{direction:'alternate'});
  await w(2400);
  clk.textContent='10:00 pm';shake(clk);let b=bub(230,196,'Just one more level!');
  say(`Ten o'clock. "Just one more level," says Faris.`);await w(2400);b.remove();
  say(`Midnight. One o'clock. Two. Three! His eyes are red and stinging, but he keeps on playing.`);
  for(const t of ['11:00 pm','12:00 am','1:00 am','2:00 am','3:00 am']){clk.textContent=t;beep(760,.05);shake(clk);await w(600);}
  face(fa,'🥱');await w(1800);
  const mum=who(980,268,'🧕','Mum',90);await walk(mum,470,1200);
  b=bub(440,180,'Faris! Suhoor, then Fajr!',{r:false});
  say(`At half past three, Mum calls him for suhoor, the meal before dawn. He gulps it down and prays Fajr half asleep.`);clk.textContent='3:30 am';await w(3600);b.remove();
  await walk(mum,990,900);mum.remove();pad.remove();
  await walk(fa,640,1000,262);face(fa,'😴');an(fa.querySelector('.e'),[{transform:'rotate(0)'},{transform:'rotate(-70deg)'}],{duration:400});
  const z=mk('st-z','left:740px;top:200px','Z z z');loop(z,[{transform:'translate(0,0)',opacity:.3},{transform:'translate(14px,-18px)',opacity:1}],900,{direction:'alternate'});
  say(`Then he drops into bed. Ahhh, sleep at last!`);await w(2000);
  W.day();an(dark,[{opacity:0}],{duration:1200});day.textContent='Day 1';
  say(`The sun comes up. Yusuf and Huda go to school, and Dad opens the family shop. And Faris? Still snoring at one o'clock in the afternoon!`);
  for(const t of ['7:00 am','9:00 am','11:00 am','1:00 pm']){clk.textContent=t;beep(600,.05);await w(700);}
  await w(2600);
  clk.textContent='3:00 pm';z.remove();face(fa,'😫');an(fa.querySelector('.e'),[{transform:'rotate(0)'}],{duration:300});b=bub(650,118,'Ugh! I missed school… and I\'m SO hungry!',{wd:250});
  say(`At three o'clock he wakes up grumpy. He has missed his lessons, he has a headache, and his fast feels twice as long.`);await w(3600);b.remove();
  day.textContent='Night 2, 3, 4…';shake(day);
  say(`And the next night? Exactly the same. Too much staying up, every single night.`);await w(2800);
  const c=pin(20,96,560,'Q7 · (a) · 1',`شاب ${kw('أسرف','asrafa')} ${kw('بالسهر','bis-sahar')} خلال شهر رمضان`,`A young man who ${kw('stayed up far too late')} in Ramadan`);
  say(`📌 That's Question 7 (a) 1! ${ar('شاب أسرف بالسهر خلال شهر رمضان','A young man who stayed up far too late in Ramadan.')} It's Faris!`);await w(3600);
  const K=c.querySelectorAll('.kw');point(K[0]);
  say(`The keywords: ${aw('أسرف','asrafa','he overdid it')}, he <b>overdid it</b>, and ${aw('بالسهر','bis-sahar','staying up late')}, <b>staying up late</b>. Too much is never a good sign.`);await w(3800);
  const bl=pinBlocks(c,[['غير','ghayr','not'],['مسؤول','mas\'ool','responsible']],{size:34,pic:'🧑🎮'});
  await revealBlocks(w,bl,{wait:1500});
  say(`So Faris was ${aw('غير مسؤول','ghayr mas\'ool')}, <b>irresponsible</b>. In the exam, see ${aw('أسرف بالسهر','asrafa bis-sahar','stayed up far too late')} and picture Faris snoring at lunchtime!`);await w(4000);unpoint();}},

/* 2 */ {t:'Story: Reem\'s cans and Dad\'s lesson (Q7 a 2, 3)',run:async w=>{
  mk('','left:0;top:0;width:960px;height:520px;background:#e9e2f7');
  mk('','left:0;top:400px;width:960px;height:120px;background:#b9a2d6');
  const W=win(40,40,200,140,true);
  const dark=mk('','left:0;top:0;width:960px;height:520px;background:#0b1035;opacity:.3;z-index:5;pointer-events:none');
  const re=who(56,218,'👧','Reem',84);
  const desk=mk('','left:70px;top:330px;width:400px;height:24px;background:#8a5a2b;border-radius:8px;z-index:9;box-shadow:0 6px 0 #5a3a1b');
  mk('','left:100px;top:354px;width:16px;height:60px;background:#6b4423;z-index:9');mk('','left:420px;top:354px;width:16px;height:60px;background:#6b4423;z-index:9');
  const books=mk('','left:404px;top:270px;font-size:52px;z-index:10','📚');
  const lamp=mk('','left:440px;top:214px;font-size:58px;z-index:10','💡');loop(lamp,[{filter:'drop-shadow(0 0 4px #ffd84d)'},{filter:'drop-shadow(0 0 22px #ffd84d)'}],800,{direction:'alternate'});
  const note=mk('st-day','left:300px;top:60px;background:#e04848','📅 Exams next week!');pop(note);
  const day=mk('st-day','left:560px;top:20px','Night 2');pop(day);
  say(`Meanwhile, Reem has exams next week. Her plan? Study all night, every night. And to stay awake… energy drinks!`);await w(3600);
  let b=bub(110,140,'Energy drinks will keep me awake!');await w(1600);b.remove();
  say(`One can after iftar. Two. Three. Four. Five cans!`);
  const cans=[];for(let i=0;i<5;i++){const cn=mk('',`left:${190+i*42}px;top:282px;font-size:44px;z-index:10`,'🥤');pop(cn);cans.push(cn);beep(500+i*90,.06);await w(500);}
  const cnt=mk('st-day','left:120px;top:440px;background:#e06a1b','🥤 × 5');pop(cnt);await w(1600);
  const heart=mk('','left:560px;top:120px;font-size:90px;z-index:10','❤️');pop(heart);
  loop(heart,[{transform:'scale(1)'},{transform:'scale(1.3)'}],170,{direction:'alternate'});
  face(re,'😵');loop(re.querySelector('.e'),[{transform:'translateX(-3px)'},{transform:'translateX(3px)'}],90,{direction:'alternate'});
  say(`Her heart starts racing, her hands start shaking, and at three in the morning she still can't fall asleep.`);await w(3800);
  heart.remove();day.textContent='Day 2';an(dark,[{opacity:0}],{duration:900});
  face(re,'🤢');const test=mk('','left:600px;top:150px;font-size:80px;z-index:10','📝❓');pop(test);
  say(`Next day, in her practice test, she feels sick and dizzy. She can't remember a single thing she studied!`);await w(3600);
  const mum=who(990,256,'🧕','Mum',90);test.remove();await walk(mum,600,1100);
  cans.forEach((c,i)=>an(c,[{transform:'translate(0,0)',opacity:1},{transform:`translate(${450-i*42}px,-60px) scale(.3)`,opacity:0}],{duration:700,delay:i*120}));
  const good=mk('','left:200px;top:270px;font-size:50px;z-index:10','💧🌴🛏️');pop(good);
  b=bub(470,160,'Water, dates and sleep: that\'s real energy!',{r:true});
  say(`Mum takes the cans away. "Water, dates and a good night's sleep," she says. "That's the real energy drink."`);await w(3800);b.remove();
  const c=pin(470,250,470,'Q7 · (a) · 2',`فتاة ${kw('تكثر','tukthir')} من ${kw('مشروبات الطاقة','mashroobaat at-taaqa')}`,`A girl who drinks ${kw('a lot of')} ${kw('energy drinks')}`);
  mum.remove();
  say(`📌 Question 7 (a) 2! ${ar('فتاة تكثر من مشروبات الطاقة','A girl who drinks a lot of energy drinks.')} That's Reem!`);await w(3400);
  const K=c.querySelectorAll('.kw');point(K[0]);
  say(`${aw('تكثر','tukthir','a lot')} means <b>a lot</b>, too much, and ${aw('مشروبات الطاقة','mashroobaat at-taaqa','energy drinks')} means <b>energy drinks</b>. Five cans: far too many!`);await w(3800);
