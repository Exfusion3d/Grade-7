<script>
/* Computer Lesson 4 · Web pages with HTML · Worksheet MCQ 7, MCQ 9, Blank 8, Blank 9, True/False 7, True/False 8.
   Hyperlinks with <A HREF>, internal and external linking (True/False 7 keeps the key's T with a gentle note,
   parent's decision), TARGET="_blank", absolute and relative URLs, link colours LINK / ALINK / VLINK. */
const HREFW=`<b data-say="H ref">HREF</b>`,BLANKW=`<b data-say="blank">_blank</b>`;
const SITE='https://www.chipscheese.com/';
const hiLine=(E,n)=>{const l=E.code.innerHTML.split('\n');l[n]=`<span style="background:#fff3a6;border-radius:4px">${l[n]}</span>`;E.code.innerHTML=l.join('\n');};
/* an arrow between two points in an svg string, drawn in */
const arrowSVG=(x1,y1,x2,y2,col,dash)=>`<path d="M${x1} ${y1} Q${(x1+x2)/2} ${Math.min(y1,y2)-40} ${x2} ${y2}" stroke="${col}" stroke-width="5" fill="none" stroke-linecap="round" ${dash?'stroke-dasharray="10 8"':''} marker-end="url(#ah-${col.slice(1)})"/>`;
const markers=cols=>`<defs>${cols.map(c=>`<marker id="ah-${c.slice(1)}" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="${c}"/></marker>`).join('')}</defs>`;

Lesson.start(Object.assign({},COMPUTER,{
  id:'c04', num:4, part:'Web pages with HTML', emoji:'🔗', title:'Links: internal, external and URLs',
  intro:`Hi, it's <b>Chip</b>! 🖱️ Today: <b>links</b>, the magic doors that jump from page to page. Press <b>Start</b>!`,
  scenes:[
/* 0 */ {t:'Jump to another page',run:async w=>{
  const E=editor(13,10,452,230,{title:'index.html - Notepad',size:17});pop(E.el);
  setCode(E,`<HTML>\n<BODY>\n<H1>Chip's Cheese Club</H1>\n<P>Welcome!</P>\n`);
  const B=browser(495,10,452,330,{url:SITE+'index.html',title:"Chip's Cheese Club"});pop(B.el,150);
  B.page.innerHTML=`<h1>Chip's Cheese Club</h1><p>Welcome!</p>`;
  say(`Remember the spider's web? 🕸️ Pages are joined by <b>hyperlinks</b>. Let's make one!`);await w(2400);
  await typeCode(w,E,`<A HREF="photos.html">My photos</A>`,{speed:34});hiLine(E,4);
  B.page.insertAdjacentHTML('beforeend','<p style="font-size:24px"><a class="lk">My photos</a></p>');const lk=B.page.querySelector('.lk');
  an(lk,[{transform:'scale(0)'},{transform:'scale(1)'}],{duration:400});lk.style.display='inline-block';
  say(`See the <b>blue, underlined</b> words? That's a link! Go on, <b>tap it</b>. 👆`);point(lk);
  let go=false;lk.onclick=()=>{go=true;};window.AUTOPLAY=()=>{go=true;};
  await w.until(()=>go);window.AUTOPLAY=null;unpoint();beep(800,.06);
  lk.style.color='#e04848';await w(300);
  await an(B.page,[{opacity:1,transform:'none'},{opacity:0,transform:'translateX(-60px)'}],{duration:300});
  B.go(SITE+'photos.html','My photos');B.page.innerHTML=`<h2>My photos 📸</h2><p style="font-size:44px;margin:4px 0">🧀 🐱 🏖️</p><p><a>⬅ Back home</a></p>`;
  an(B.page,[{opacity:0,transform:'translateX(60px)'},{opacity:1,transform:'none'}],{duration:300});yay();
  say(`Whoosh! 🚀 We jumped to a <b>new page</b>: photos dot H T M L. Look, the address changed too.`);
  B.addr.querySelector('.url').animate([{background:'#fff'},{background:'#ffe680'},{background:'#fff'}],{duration:1000,iterations:2});await w(3000);
  const an1=mk('',`left:13px;top:262px;width:452px;height:240px;border-radius:20px;background:#fff;border:3px solid #9fdfe6;box-shadow:0 5px 0 #9fdfe6;text-align:center;padding:12px;box-sizing:border-box`,
    `<div class="anc" style="font-size:80px;line-height:1.1">⚓</div><div style="font-size:24px;font-weight:900;color:#0e5f75">${C('<A>')} = <b>Anchor</b> tag</div><div style="font-size:18px;font-weight:700;color:#4a5570;margin-top:8px">It makes <b>hyperlinks</b>: words you click to jump somewhere else.</div>`);
  an1.querySelector('.cd').style.fontSize='24px';pop(an1);loop(an1.querySelector('.anc'),[{transform:'rotate(-12deg)'},{transform:'rotate(12deg)'}],700,{direction:'alternate'});
  say(`Links are made with the ${C('<A>')}. A stands for <b>anchor</b> ⚓. It's like a rope tying one page to another.`);await w(3400);
  const h=mk('',`left:495px;top:360px;width:452px;text-align:center;font-size:21px;font-weight:800;color:#1f2433`,'Click a link ➜ the browser opens another page 🚪');pop(h);await w(1600);}},

/* 1 */ {t:'Inside a link tag',run:async w=>{
  const big=mk('code',`left:13px;top:24px;width:934px;text-align:center;background:#1e2433;color:#e8ecf5;border-radius:18px;padding:16px 0;font-size:34px;font-weight:700;box-shadow:0 6px 0 #0e7490;box-sizing:border-box`,
    `<span class="p1">${hl('<A')}</span> <span class="p2"><span class="t-att">HREF</span>${hl('=')}<span class="t-str">"photos.html"</span></span>${hl('>')}<span class="p3">My photos</span><span class="p4">${hl('</A>')}</span>`);pop(big);
  const parts=[['.p1','opening tag ⚓','#7cc4ff',`It starts with the opening A tag: the <b>anchor</b>.`],
    ['.p2','where to go 📍','#e0a800',`Then the ${HREFW} attribute. Its value is the page to jump to: photos dot H T M L.`],
    ['.p3','what you click 👆','#18a058',`Between the tags, the <b>link text</b>: the words you see and click.`],

  let pi=0;for(const [cls,t,col,s] of parts){const el=big.querySelector(cls);el.style.cssText+=`;border-radius:8px;box-shadow:0 0 0 4px ${col}`;
    const l=mk('',`left:${13+el.offsetLeft+el.offsetWidth/2-90}px;top:${pi++===3?178:126}px;width:180px;text-align:center;font-size:20px;font-weight:900;color:${col}`,'⬆<br>'+t);pop(l);beep(600,.05);say(s);await w(2600);}
  const hr=mk('',`left:130px;top:240px;width:700px;height:96px;border-radius:20px;background:#fff8e6;border:3px solid #f2c200;text-align:center;padding:10px;box-sizing:border-box`,
    `<div style="font-size:30px;font-weight:900;color:#8a5a00">HREF = <span style="color:#e06a1b">H</span>ypertext <span style="color:#e06a1b">REF</span>erence</div><div style="font-size:18px;font-weight:700">the address of the page the link points to</div>`);pop(hr);
  say(`${HREFW} means <b>hypertext reference</b>: the address of the page the link points to. 📍`);await w(3000);
  const B=browser(250,350,460,160,{url:SITE+'index.html',title:"Chip's Cheese Club"});pop(B.el);
  B.page.innerHTML='<p style="font-size:26px;margin-top:14px"><a class="lk">My photos</a></p>';
  const lk=B.page.querySelector('.lk');const cur=mk('',`left:640px;top:470px;font-size:34px;z-index:5`,'👆');
  await an(cur,[{transform:'none'},{transform:'translate(-150px,-40px)'}],{duration:900});
  lk.style.color='#e04848';beep(800,.06);await w(400);
  B.go(SITE+'photos.html','My photos');B.page.innerHTML='<h2 style="margin-top:6px">My photos 📸</h2>';yay();
  say(`The browser reads the ${HREFW}, then opens that page. 🚀`);await w(2400);}},

/* 2 */ {t:'Internal and external links',run:async w=>{
  const site=mk('',`left:13px;top:10px;width:560px;height:310px;border-radius:24px;background:#e8f8ec;border:4px solid #18a058`,`<div style="margin:8px 16px;font-size:22px;font-weight:900;color:#127a43">🏠 My website: chipscheese.com</div>`);pop(site);
  const P=[['index.html','🏠',40,70],['photos.html','📸',220,150],['games.html','🎮',390,70]];
  const pg=P.map(([n,e,x,y],i)=>mk('',`left:${x}px;top:${y}px;width:130px;height:96px;border-radius:14px;background:#fff;border:3px solid #18a058;text-align:center;box-shadow:0 4px 0 #bfe7d2`,`<div style="font-size:40px">${e}</div><div style="font-size:15px;font-weight:800">${n}</div>`,site));
  pg.forEach((p,i)=>pop(p,200+i*150));
  const sv=mk('',`left:0;top:0;width:960px;height:340px;pointer-events:none;z-index:3`,`<svg width="960" height="340">${markers(['#18a058','#e06a1b'])}
    ${arrowSVG(13+170,10+130,13+225,10+195,'#18a058',1)}${arrowSVG(13+350,10+195,13+405,10+130,'#18a058',1)}${arrowSVG(13+170,10+100,13+385,10+100,'#18a058',1)}
    ${arrowSVG(13+525,10+110,690,120,'#e06a1b')}${arrowSVG(13+355,10+225,690,250,'#e06a1b')}</svg>`);
  const paths=[...sv.querySelectorAll('path[stroke]')].filter(p=>!p.closest('marker'));paths.forEach(p=>p.style.opacity=0);
  say(`There are <b>two types</b> of linking. Here's my website, with three pages of my own.`);await w(2600);
  paths.slice(0,3).forEach((p,i)=>p.animate([{opacity:0},{opacity:1}],{duration:500,delay:i*300,fill:'forwards'}));
  const il=mk('',`left:30px;top:270px;width:520px;text-align:center;font-size:22px;font-weight:900;color:#127a43`,'🟢 internal links: inside my own website');pop(il,600);
  say(`Links between pages of <b>my own website</b> are <b>internal links</b>. Internal means <b>inside</b>. They can even jump to another part of the <b>same page</b>, like "back to the top".`);await w(3800);
  const ext=mk('',`left:640px;top:10px;width:307px;height:310px;border-radius:24px;background:#fff1e6;border:4px solid #e06a1b`,`<div style="margin:8px 14px;font-size:20px;font-weight:900;color:#b4500f">🌍 Other websites</div>`);pop(ext);
  [['wikipedia.org','📚',60],['bbc.co.uk','📰',190]].forEach(([n,e,y],i)=>pop(mk('',`left:50px;top:${y}px;width:200px;height:96px;border-radius:14px;background:#fff;border:3px solid #e06a1b;text-align:center;box-shadow:0 4px 0 #f6cfae`,`<div style="font-size:40px">${e}</div><div style="font-size:15px;font-weight:800">www.${n}</div>`,ext),200+i*150));
  paths.slice(3).forEach((p,i)=>p.animate([{opacity:0},{opacity:1}],{duration:500,delay:400+i*300,fill:'forwards'}));
  const el=mk('',`left:560px;top:322px;width:400px;text-align:center;font-size:20px;font-weight:900;color:#b4500f`,'🟠 external links: out to other websites');pop(el,700);
  say(`Links that go <b>out</b> to a different website are <b>external links</b>. External means <b>outside</b>. 🌍`);await w(3200);
  const dot=mk('',`left:0;top:0;width:22px;height:22px;border-radius:50%;background:#ffd84d;box-shadow:0 0 12px #ffd84d;z-index:6`);
  for(const [x,y] of [[96,128],[296,208],[466,128],[740,118],[740,250]]){await an(dot,[{transform:`translate(${x}px,${y}px)`}],{duration:500});beep(700,.04);}
  dot.remove();
  wsCard('left:13px;top:362px;width:934px',{src:'Worksheet · MCQ 7',q:'Which of the following is a type of linking?&nbsp; (a) Internal linking &nbsp;(b) External linking &nbsp;(c) Both (a) and (b)',a:'✔ (c) Both (a) and (b)'});
  say(`Worksheet: which is a type of linking? Internal and external are <b>both</b> types. So the answer is <b>(c) Both (a) and (b)</b>.`);await w(3400);
  stage.innerHTML='';
  wsCard('left:110px;top:14px;width:740px',{src:'Worksheet · True/False 7',q:'Internal linking is used to link a page to another page.',a:'✔ T (True)'});
  say(`True or false? Internal linking is used to link a page to another page. In the exam, write <b>T, true</b>. ✔`);await w(3000);
  const ex=mk('',`left:110px;top:150px;width:740px;height:150px;border-radius:20px;background:#e8f8ec;border:3px solid #18a058`);pop(ex);
  const a=mk('',`left:60px;top:28px;width:160px;height:96px;border-radius:14px;background:#fff;border:3px solid #18a058;text-align:center`,`<div style="font-size:40px">🏠</div><div style="font-size:15px;font-weight:800">index.html</div>`,ex);
  const b=mk('',`left:520px;top:28px;width:160px;height:96px;border-radius:14px;background:#fff;border:3px solid #18a058;text-align:center`,`<div style="font-size:40px">📸</div><div style="font-size:15px;font-weight:800">photos.html</div>`,ex);
  const ar=mk('',`left:240px;top:40px;width:260px;text-align:center;font-size:18px;font-weight:900;color:#127a43`,'internal link<br><span style="font-size:40px">➡️</span><br>same website',ex);
  loop(ar,[{transform:'translateX(-10px)'},{transform:'translateX(10px)'}],600,{direction:'alternate'});
  say(`That's because internal links join the pages <b>of your own website</b>: one page to another page.`);await w(2800);
  const n=mk('ca-note',`left:110px;top:318px;width:740px;box-sizing:border-box`,'📘 Good to know: in the exam, write <b>T</b>. In many books, <b>internal</b> links jump to another page of the <b>same website</b>, or another part of the same page; <b>external</b> links go to a <b>different website</b>.');pop(n);
  say(`Good to know: in the exam, write T. In many books, internal links jump to another page of the same website, or another part of the same page, and external links go to a different website.`);await w(3600);}},

/* 3 */ {t:'TARGET: where the link opens',run:async w=>{
  const E=editor(13,10,934,84,{title:'games.html - Notepad',size:24,menu:null});setCode(E,'<A HREF="games.html">Games</A>');pop(E.el);
  const B=browser(13,112,600,270,{url:SITE+'index.html',title:'Home'});pop(B.el,150);
  const home=()=>{B.page.innerHTML=`<h2>Chip's Cheese Club</h2><p style="font-size:26px"><a class="lk">Games</a></p>`;return B.page.querySelector('.lk');};
  let lk=home();
  const tabs=B.bar;const t1=tabs.querySelector('.cw-tab');
  const side=mk('',`left:640px;top:112px;width:307px;height:270px;border-radius:20px;background:#fff;border:3px solid #9fdfe6;padding:14px;box-sizing:border-box;font-size:19px;font-weight:700;line-height:1.35`,
    `<div style="font-size:22px;font-weight:900;color:#0e5f75">🎯 TARGET</div>says <b>where</b> the link opens.<div class="st" style="margin-top:12px;font-size:18px;color:#4a5570">No TARGET: the new page <b>replaces</b> this one, in the <b>same tab</b>.</div>`);pop(side,300);
  say(`Links have another attribute: <b>TARGET</b>. It says <b>where</b> the new page opens. First, a link with <b>no</b> target…`);await w(3000);
  const click=async()=>{const c=mk('',`left:${13+30+lk.offsetLeft+lk.offsetWidth/2}px;top:${112+34+35+lk.offsetTop+20}px;font-size:34px;z-index:5`,'👆');pop(c);await w(500);lk.style.color='#e04848';beep(800,.06);await w(400);c.remove();};
  await click();
  await an(B.page,[{opacity:1},{opacity:0}],{duration:250});B.go(SITE+'games.html','Games');t1.textContent='Games';B.page.innerHTML='<h2>Games 🎮</h2><p>Chess, puzzles and cheese quizzes!</p>';an(B.page,[{opacity:0},{opacity:1}],{duration:250});
  say(`The Games page opened in the <b>same tab</b>, and our home page has gone. 😕`);await w(2600);
  await an(B.page,[{opacity:1},{opacity:0}],{duration:250});B.go(SITE+'index.html','Home');t1.textContent='Home';lk=home();an(B.page,[{opacity:0},{opacity:1}],{duration:250});
  say(`Now you add a TARGET! Tap the button to put ${C('TARGET="_blank"','target equals blank')} into the code.`);
  let added=false;const ab=btn('cb-del',`left:660px;top:400px;width:270px;font-size:19px;font-weight:800`,'➕ Add TARGET',()=>{added=true;});pop(ab);point(ab);
  window.AUTOPLAY=()=>{added=true;};await w.until(()=>added);window.AUTOPLAY=null;ab.remove();unpoint();
  E.src='<A HREF="games.html"';await typeCode(w,E,' TARGET="_blank"',{speed:40});await typeCode(w,E,'>Games</A>',{speed:5});
  side.querySelector('.st').innerHTML=`${C('TARGET="_blank"','target equals blank')}: the page opens in a <b>new tab</b>, and this one stays open. 🆕`;
  say(`${BLANKW} means: open the page in a <b>new, blank tab</b>. Now tap the <b>Games</b> link!`);point(lk);
  let go=false;lk.onclick=()=>{go=true;};window.AUTOPLAY=()=>{go=true;};await w.until(()=>go);window.AUTOPLAY=null;unpoint();
  lk.style.color='#e04848';beep(800,.06);await w(300);
  t1.style.opacity='.55';const t2=t1.cloneNode();t2.textContent='Games';t2.style.opacity='1';t2.style.marginLeft='4px';tabs.appendChild(t2);
  an(t2,[{transform:'translateY(30px) scale(.4)',opacity:0},{transform:'none',opacity:1}],{duration:500,easing:'cubic-bezier(.3,1.5,.5,1)'});
  B.go(SITE+'games.html');B.page.innerHTML='<h2>Games 🎮</h2><p>Chess, puzzles and cheese quizzes!</p>';yay();
  const hl2=t1.animate([{background:'#fff'},{background:'#bfe7d2'},{background:'#fff'}],{duration:900,iterations:3});point(t1);
  say(`A <b>new tab</b> popped up! 🆕 And look: our Home tab is still there, waiting for us.`);await w(3000);unpoint();
  wsCard('left:13px;top:398px;width:610px',{src:'Worksheet · Blank 8',q:'The ________ attribute is used to specify a target.',a:'✔ target'});
  say(`Worksheet: the <b>target</b> attribute is used to specify a target: where the link opens.`);await w(3000);}},

/* 4 */ {t:'Absolute and relative URLs',run:async w=>{
  say(`Every page has an address, called a <b>URL</b>. A <b>full</b> address looks like this.`);
  const U=[['https://','#6a45d8','how to fetch it','H T T P S'],['www.chipscheese.com','#2c66cf','which website','W W W dot chips cheese dot com'],['/photos/','#e06a1b','which folder','photos folder'],['cat.html','#18a058','which file','cat dot H T M L']];
  const line=mk('code',`left:13px;top:14px;width:934px;text-align:center;background:#1e2433;border-radius:16px;padding:12px 0;font-size:34px;font-weight:700;box-sizing:border-box;box-shadow:0 6px 0 #0e7490`,
    U.map(([t,c],i)=>`<span class="u${i}" style="color:${c==='#2c66cf'?'#7cc4ff':c==='#6a45d8'?'#c9b6f4':c==='#e06a1b'?'#ffb27a':'#9be38f'};opacity:0">${t}</span>`).join(''));pop(line);
  await w(800);
  for(let i=0;i<4;i++){const [t,c,lab,sp]=U[i];const s=line.querySelector('.u'+i);an(s,[{opacity:0,transform:'translateY(-20px)'},{opacity:1,transform:'none'}],{duration:400});s.style.display='inline-block';
    await w(60);const l=mk('',`left:${13+s.offsetLeft+s.offsetWidth/2-95}px;top:100px;width:190px;text-align:center;font-size:18px;font-weight:900;color:${c}`,'⬆<br>'+lab);pop(l);beep(600+i*70,.05);
    say(`<span data-say="${sp}">${t}</span>: ${lab}.`);await w(1900);}
  const ab=mk('',`left:13px;top:170px;width:455px;height:190px;border-radius:20px;background:#fff;border:3px solid #6a45d8;box-shadow:0 5px 0 #ddd3fb;padding:10px 16px;box-sizing:border-box`,
    `<div style="font-size:24px;font-weight:900;color:#6a45d8">🏠 Absolute URL</div><div style="font-size:17px;font-weight:700;margin:4px 0 8px">The <b>complete</b> address: website, folder and file.</div>
     <div class="env" style="background:#fff8e6;border:2px dashed #f2c200;border-radius:10px;padding:6px 10px;font-size:16px;font-weight:800;line-height:1.35">✉️ House 7, Cheese Street,<br>Salmiya, Kuwait</div>`);pop(ab);
  loop(ab.querySelector('.env'),[{transform:'rotate(-1.5deg)'},{transform:'rotate(1.5deg)'}],600,{direction:'alternate'});
  say(`This is an <b>absolute URL</b>: the <b>complete</b> path to the file. Like a full home address on a letter ✉️: anyone, anywhere, can find it.`);await w(3600);
  const rb=mk('',`left:492px;top:170px;width:455px;height:190px;border-radius:20px;background:#fff;border:3px solid #18a058;box-shadow:0 5px 0 #bfe7d2;padding:10px 16px;box-sizing:border-box`,
    `<div style="font-size:24px;font-weight:900;color:#18a058">👉 Relative URL</div><div style="font-size:17px;font-weight:700;margin:4px 0 8px">A <b>short</b> address, from where you are now.</div>
     <div style="display:flex;align-items:center;gap:12px"><span class="cd" style="font-size:22px">cat.html</span><span style="font-size:16px;font-weight:800">"It's next door!" 🏡🏡</span></div>`);pop(rb);
  say(`A <b>relative URL</b> is just the short part, like cat dot H T M L. It's like saying "next door": it only works from inside the same website.`);await w(3600);
  const tr=mk('ca-trick',`left:13px;top:378px;width:934px;box-sizing:border-box;text-align:center;font-size:20px`,'💡 <b>Absolute</b> = <b>A</b>ll of it: the complete address. <b>Relative</b> = just the nearby part.');pop(tr);
  say(`Memory trick: <b>Absolute</b> starts with A, for <b>All of it</b>: the complete address!`);await w(2800);
