<title>Three kinds of style sheet</title>
<link rel="stylesheet" href="../lessons/engine.css">
<style>
.cw-page,.cw-page *{transition:color .6s,background-color .6s,font-size .6s}
.cw-page.bgimg{transition:background-position .9s cubic-bezier(.3,1.3,.5,1)}
.mini,.mini *{transition:color .5s,background-color .5s}
.kind{position:absolute;top:14px;width:300px;height:250px;border-radius:22px;background:#fff;border:3px solid;text-align:center;padding:10px 14px;box-sizing:border-box}
.kind .e{font-size:58px;line-height:1.1}
.kind .n{font-size:28px;font-weight:900}
.kind .d{font-size:17px;font-weight:800;color:#1f2433;margin-top:4px}
.kind .a{font-size:16px;font-weight:700;color:#4a5570;margin-top:8px;line-height:1.3}
.pick{position:absolute;display:flex;align-items:center;justify-content:center;height:46px;border-radius:14px;background:#fff;border:3px solid #22b8c9;box-shadow:0 4px 0 #0e7490;
  font-size:18px;font-weight:800;color:#1f2433;cursor:pointer;user-select:none;-webkit-user-select:none;white-space:nowrap}
.pick:active{transform:translateY(3px);box-shadow:0 1px 0 #0e7490}
.pick.on{background:#22b8c9;color:#fff}
.go-on{position:absolute;border-radius:16px;padding:10px 22px;font-size:19px;font-weight:800;color:#fff;background:#0e7490;box-shadow:0 5px 0 #0b5566;cursor:pointer;text-align:center}
.hlbox{position:absolute;border-radius:8px;background:#ffd84d33;border:3px solid #ffd84d;pointer-events:none}
</style>

<body>
<script src="../lessons/engine.js"></script>
<script src="computer.js"></script>
<script>
/* Computer Lesson 6 · Styling with CSS · Worksheet Q9, Q10, MCQ 3, MCQ 4, MCQ 5, Blank 2, True/False 5.
   Built like the pilot (c01): inline, internal and external style sheets each shown working live, Q9 and Q10 with teachA,
   then three useful properties (font-family, text-indent, background-position) that the student changes with buttons. */
function at(el){let l=0,t=0,e=el;while(e&&e!==stage){l+=e.offsetLeft;t+=e.offsetTop;e=e.offsetParent;}return{x:l,y:t,w:el.offsetWidth,h:el.offsetHeight};}
function sparkle(el){const p=at(el);const s=mk('',`left:${p.x+p.w/2-20}px;top:${p.y-10}px;font-size:34px;z-index:30;pointer-events:none`,'✨');
  an(s,[{transform:'scale(0) rotate(0)',opacity:1},{transform:'scale(1.3) rotate(90deg)',opacity:1,offset:.5},{transform:'scale(.6) rotate(180deg)',opacity:0}],{duration:900}).then(()=>s.remove());}
/* glow a word of code inside an editor */
function glowIn(E,word){const s=[...E.code.querySelectorAll('span')].find(x=>x.textContent.trim()===word);
  if(s)s.animate([{background:'transparent',boxShadow:'0 0 0 0 #ffd84d'},{background:'#ffd84d55',boxShadow:'0 0 0 4px #ffd84d'},{background:'transparent',boxShadow:'0 0 0 0 #ffd84d'}],{duration:1300,iterations:2});return s;}
/* a yellow box around lines a..b (0-based) of an editor */
function lineBox(E,a,b){const n=E.src.split('\n').length,lh=E.code.offsetHeight/n;
  return mk('hlbox',`left:6px;top:${10+a*lh-3}px;width:${E.body.clientWidth-12}px;height:${(b-a+1)*lh+6}px`,'',E.body);}
/* a small web page */
function mini(x,y,title,parent){const m=mk('mini',`left:${x}px;top:${y}px;width:290px;height:150px;border-radius:12px;background:#fff;border:2px solid #9aa7bd;box-shadow:0 5px 14px rgba(31,36,51,.15);overflow:hidden`,'',parent);
  m.innerHTML=`<div class="bar" style="height:24px;background:#e3e8f0;font-size:13px;font-weight:800;color:#3a4256;padding:3px 10px;box-sizing:border-box">● ● ● ${title}</div>
   <div style="font-family:Times New Roman,serif;font-size:19px;line-height:1.35;padding:6px 12px"><p class="t" style="margin:0 0 4px">${title} page</p><p class="t" style="margin:0">Hello from Chip!</p></div>`;
  return m;}
/* a picture for the background-position scene: a smiling sun (inline SVG, no files) */
const SUN=`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g stroke='#f2a900' stroke-width='7' stroke-linecap='round'>${[0,45,90,135,180,225,270,315].map(a=>`<line x1='60' y1='8' x2='60' y2='22' transform='rotate(${a} 60 60)'/>`).join('')}</g><circle cx='60' cy='60' r='32' fill='#ffd84d' stroke='#f2a900' stroke-width='4'/><circle cx='49' cy='55' r='4' fill='#1f2433'/><circle cx='71' cy='55' r='4' fill='#1f2433'/><path d='M46 68 Q60 80 74 68' stroke='#1f2433' stroke-width='4' fill='none' stroke-linecap='round'/></svg>`)}")`;
/* a row of buttons; resolves after one tap and then a "move on" tap. vals: [label, value, css]. */
async function picker(w,{x,y,cols,bw,vals,onPick,line,after,done='Carry on ➜',doneAt}){
  let picked=false,moveOn=false,nx=null;
  const P=vals.map((v,i)=>{const r=Math.floor(i/cols),c=i%cols;
    const b=btn('pick',`left:${x+c*(bw+12)}px;top:${y+r*58}px;width:${bw}px;${v[2]||''}`,v[0],()=>{onPick(v[1],i);P.forEach(q=>q.classList.toggle('on',q===b));beep(620+i*50,.06);
      if(!picked){picked=true;nx=btn('go-on',doneAt,done,()=>{moveOn=true;});pop(nx);}});pop(b,i*70);return b;});
  say(line);point(P[0]);
  window.AUTOPLAY=()=>{if(!picked)P[Math.min(1,P.length-1)].onclick();else if(nx)nx.onclick();};
  await w.until(()=>picked);unpoint();if(after)say(after);
  await w.until(()=>moveOn);window.AUTOPLAY=null;P.forEach(b=>b.remove());nx.remove();}

Lesson.start(Object.assign({},COMPUTER,{
  id:'c06', num:6, part:'Styling with CSS', emoji:'📑', title:'Three kinds of style sheet',
  intro:`Hi, it's <b>Chip</b> again 🖱️ Where do we put our CSS? There are <b>three</b> places! Press <b>Start</b>!`,
  scenes:[
/* 0 */ {t:'Three places to put CSS',run:async w=>{
  say(`CSS can live in <b>three</b> different places. Each one is a <b>type of style sheet</b>.`);await w(2600);
  const K=[['🏷️','Inline','on <b>one</b> element','like a sticker on one thing','#e06a1b'],['📋','Internal','in the <b>HEAD</b> of one page','like rules on one classroom door','#2c66cf'],
    ['📕','External','in its own <b>.css</b> file','like the school rule book for every class','#18a058']];
  const lines=[`<b>Inline</b>: the style goes right on <b>one element</b>, like a sticker on one thing. 🏷️`,
    `<b>Internal</b>: the styles go in the <b>HEAD</b> of one page, like rules on one classroom door.`,
    `<b>External</b>: the styles go in their own <b>.css file</b>, like a rule book the whole school shares.`];
  const cards=K.map(([e,n,d,a,col],i)=>mk('kind',`left:${13+i*317}px;border-color:${col};box-shadow:0 5px 0 ${col}55;opacity:0`,`<div class="e">${e}</div><div class="n" style="color:${col}">${n}</div><div class="d">${d}</div><div class="a">${a}</div>`));
  for(let i=0;i<3;i++){pop(cards[i]);loop(cards[i].querySelector('.e'),[{transform:'translateY(0)'},{transform:'translateY(-6px)'}],600,{direction:'alternate'});point(cards[i]);beep(560+i*90,.1);say(lines[i]);await w(3000);}
  unpoint();
  const ins=mk('kind',`left:330px;top:-260px;border-color:#9aa7bd;z-index:10`,`<div class="e">📦</div><div class="n" style="color:#6a7488">Inside?</div><div class="d">a fourth type?</div>`);
  await an(ins,[{transform:'translateY(0)'},{transform:'translateY(330px)'}],{duration:700,easing:'cubic-bezier(.3,1.4,.5,1)'});beep(300,.15);
  say(`Wait… what about <b>"Inside"</b>? Is that a type of style sheet?`);await w(2200);
  const x=mk('',`left:400px;top:100px;font-size:150px;line-height:1;z-index:11;opacity:0`,'❌');an(x,[{opacity:0,transform:'scale(2)'},{opacity:1,transform:'scale(1)'}],{duration:400});boo();
  say(`<b>No!</b> "Inside" is <b>not</b> a type of style sheet. It's a trick option. 🙅`);await w(2400);
  an(ins,[{transform:'translateY(330px)'},{transform:'translateY(330px) rotate(25deg)',opacity:.6,offset:.3},{transform:'translateY(800px) rotate(60deg)',opacity:0}],{duration:1000,easing:'ease-in'});
  an(x,[{opacity:1},{opacity:0,transform:'translateY(300px)'}],{duration:900,easing:'ease-in'});await w(1000);
  wsCard('left:110px;top:296px;width:740px',{src:'Worksheet · MCQ 3',q:'Which of the following is not a type of style sheet?<br>(a) External &nbsp; (b) Internal &nbsp; (c) Inside',a:'✔ (c) Inside'});
  say(`Worksheet: which is <b>not</b> a type of style sheet? <b>Inside!</b> The real three are inline, internal and external.`);await w(3400);}},

/* 1 */ {t:'Inline: style on one element',run:async w=>{
  say(`Let's start with <b>inline</b>. We add a ${C('STYLE','style')} attribute <b>inside one tag</b>. Watch.`);
  const E=editor(13,14,470,250,{title:'index.html - Notepad',size:18});pop(E.el);
  const B=browser(500,14,446,250,{url:'file:///C:/Users/Student/index.html',title:'My page'});pop(B.el);
  B.page.innerHTML='<p class="a">Hello!</p><p class="b">Goodbye!</p><p class="c">See you!</p>';
  const [pa,pb,pc]=['a','b','c'].map(k=>B.page.querySelector('.'+k));[pa,pb,pc].forEach(p=>p.style.fontSize='26px');
  await typeCode(w,E,`<BODY>\n<P STYLE="color:red">Hello!</P>\n<P>Goodbye!</P>\n<P>See you!</P>\n</BODY>`,{speed:20});
  pa.style.color='#e04848';sparkle(pa);beep(880,.08);await w(1200);
  const s=glowIn(E,'STYLE');if(s)point(s);
  say(`See the ${C('STYLE','style')} attribute? It's <b>in the line</b> of that one tag. That's why it's called <b>inline</b>.`);await w(3000);unpoint();
  const spot=mk('',`left:${at(pa).x-12}px;top:${at(pa).y-6}px;width:180px;height:${at(pa).h+12}px;border-radius:14px;border:4px solid #e06a1b;box-shadow:0 0 0 2000px rgba(31,36,51,.0);z-index:5`);
  pop(spot);loop(spot,[{transform:'scale(1)'},{transform:'scale(1.06)'}],500,{direction:'alternate'});
  say(`And it styles only that <b>single element</b>. "Goodbye" and "See you" stay black.`);await w(2800);
  const n=mk('ca-note',`left:13px;top:286px;width:933px;box-sizing:border-box`,
    `🏷️ <b>Inline</b> = a <span class="cd">STYLE="…"</span> attribute inside <b>one</b> tag → styles a <b>single HTML element</b>.<br>Want "See you" green? It needs its own STYLE attribute.`);pop(n);
  await w(1800);
  setCode(E,`<BODY>\n<P STYLE="color:red">Hello!</P>\n<P>Goodbye!</P>\n<P STYLE="color:green">See you!</P>\n</BODY>`);pc.style.color='#18a058';sparkle(pc);beep(880,.08);
  say(`To make "See you" green, we must add <b>another</b> style attribute to <b>that</b> tag. One element at a time!`);await w(3200);
  stage.innerHTML='';
  await teachA(w,{src:'Worksheet · Q10',q:'Define inline style sheet.',
    keys:[['Define',`<b>Define</b> means: say exactly what it is.`],['inline',`The keyword is <b>inline</b>: the sticker on <b>one</b> element.`]],
    lines:['The inline style sheet is used to apply the style to a <b>single HTML element</b>','using the <b>style attribute</b>.'],
    trick:'<b>In</b>line = <b>in</b> the <b>line</b> of one tag 🏷️: a <b>single</b> element, using the <b>style attribute</b>.'});}},

/* 2 */ {t:'Internal: in the HEAD section',run:async w=>{
  say(`Next, <b>internal</b>. The CSS rules go in a ${C('<STYLE>')} block, in the <b>HEAD section</b> of the page.`);
  const E=editor(13,10,470,400,{title:'pets.html - Notepad',size:17});pop(E.el);
  const B=browser(500,10,446,250,{url:'file:///C:/Users/Student/pets.html',title:'My pets'});pop(B.el);
  B.page.innerHTML='<p>Cats 🐱</p><p>Dogs 🐶</p><p>Fish 🐟</p>';const ps=[...B.page.querySelectorAll('p')];ps.forEach(p=>p.style.fontSize='26px');
  const SRC=`<HTML>\n<HEAD>\n<STYLE>\n  p { color: blue; }\n</STYLE>\n</HEAD>\n<BODY>\n<P>Cats</P>\n<P>Dogs</P>\n<P>Fish</P>\n</BODY>\n</HTML>`;
  await typeCode(w,E,SRC,{speed:12});
  ps.forEach((p,i)=>setTimeout(()=>{p.style.color='#2c66cf';sparkle(p);beep(700+i*80,.06);},i*250));await w(1600);
  const hb=lineBox(E,1,5);pop(hb);point(E.el);
  say(`Look where it is: between ${C('<HEAD>')} and ${C('</HEAD>')}. The <b>internal</b> style sheet is in the <b>head section</b>.`);await w(3200);unpoint();
  say(`One rule, and <b>every</b> paragraph on <b>this page</b> turns blue. But only on this page: other pages don't see it.`);
  ps.forEach((p,i)=>p.animate([{transform:'none'},{transform:'translateX(12px)'},{transform:'none'}],{duration:500,delay:i*200}));await w(3000);
  wsCard('left:500px;top:276px;width:446px',{src:'Worksheet · True/False 5',q:'The internal style sheet style is defined in the head section of a web page.',a:'✔ T (True)'});
  say(`True or false? The internal style sheet is defined in the <b>head section</b> of a web page. <b>True!</b>`);await w(3200);
  const tr=mk('ca-trick',`left:13px;top:424px;width:933px;box-sizing:border-box`,'💡 <b>Int</b>ernal lives <b>in</b> the <b>HEAD</b>: like the rules in your head, for one page only. 🧠');pop(tr);
  say(`Memory trick: <b>internal</b> lives in the <b>head</b>, like rules in your head. 🧠`);await w(2600);}},

/* 3 */ {t:'External: one file for many pages',run:async w=>{
  say(`Last, <b>external</b>. The rules go in a <b>separate file</b> ending in <b>.css</b>.`);
  const E=editor(318,8,324,108,{title:'📕 style.css',dark:true,size:22,menu:null});pop(E.el);setCode(E,'p { color: green; }','css');
  await w(2200);
  const M=['🏠 Home','🎮 Games','📷 Photos'].map((n,i)=>{const m=mini(13+i*322,200,n);pop(m,i*120);return m;});
  const svg=mk('',`left:0;top:0;width:960px;height:520px`,`<svg width="960" height="520">${M.map((m,i)=>`<line x1="480" y1="116" x2="${13+i*322+145}" y2="200" stroke="#18a058" stroke-width="4" stroke-dasharray="7 6"/>`).join('')}</svg>`);
  svg.querySelectorAll('line').forEach((l,i)=>l.animate([{opacity:0},{opacity:1}],{duration:400,delay:300+i*150,fill:'both'}));
  const lk=mk('',`left:13px;top:372px;width:933px;text-align:center`,`<div style="font-size:17px;font-weight:800;color:#4a5570;margin-bottom:6px">Each page links to it with one line in its HEAD:</div>${C('<LINK REL="stylesheet" HREF="style.css">','link tag, with H ref style dot C S S')}`);
  lk.querySelector('.cd').style.fontSize='22px';pop(lk,300);
  say(`Each page <b>links</b> to that file with a ${C('<LINK>')} tag. Now three pages share the same rules.`);await w(3000);
  const go=(col)=>M.forEach((m,i)=>{const d=mk('',`left:470px;top:110px;width:20px;height:20px;border-radius:50%;background:#ffd84d;box-shadow:0 0 12px #ffd84d;z-index:5`);
    an(d,[{transform:'none'},{transform:`translate(${13+i*322+145-480}px,90px)`}],{duration:550}).then(()=>{d.remove();m.querySelectorAll('.t').forEach(t=>t.style.color=col);sparkle(m);});});
  go('#18a058');beep(880,.08);await w(1800);
  say(`Change the file to <b>purple</b>… and all the linked pages change together! ⚡`);await w(1000);
  setCode(E,'p { color: purple; }','css');glowIn(E,'purple');go('#6a45d8');beep(880,.08);await w(2400);
  say(`That's the power of <b>external</b> style sheets: one file can style a whole website.`);await w(2600);
  stage.innerHTML='';
  await teachA(w,{src:'Worksheet · Q9',q:'List down the different types of CSS?',read:'List down the different types of CSS.',
    keys:[['List',`<b>List</b> means: write them one under the other, numbered.`],['types of CSS',`<b>Types of CSS</b>: the three kinds of style sheet.`]],
    lines:['1. <b>Inline</b> style sheet','2. <b>Internal</b> style sheet','3. <b>External</b> style sheet'],
    trick:'<b>In, In, Ex</b> 🏷️📋📕: <b>In</b>line = one element · <b>In</b>ternal = one page (in the HEAD) · <b>Ex</b>ternal = many pages (a .css file). "Inside" is <b>not</b> a type!'});}},

/* 4 */ {t:'Sort the style sheets',run:async w=>{
  const r=await sortGame(w,{bins:['🏷️ Inline','📋 Internal','📕 External'],colors:['#e06a1b','#2c66cf','#18a058'],top:176,
    items:[['&lt;B STYLE="color:red"&gt;',0],['one element only',0],['&lt;STYLE&gt; in the HEAD',1],['one page only',1],['style.css',2],['&lt;LINK HREF="style.css"&gt;',2],['many pages',2]],
    intro:`Sort them! Is each one about an <b>inline</b>, an <b>internal</b> or an <b>external</b> style sheet? Tap one, then tap its box.`});
  say(r.ok===r.total?`Perfect! 🎉 A style attribute is <b>inline</b>, a style block in the head is <b>internal</b>, and a linked .css file is <b>external</b>.`
    :`Nearly! A style attribute in one tag is <b>inline</b>. A style block in the head is <b>internal</b>. A linked .css file is <b>external</b>.`);await w(3400);}},

/* 5 */ {t:'font-family: the font of the text',run:async w=>{
  say(`Now some useful <b>properties</b>. First, ${C('font-family','font family')}. It sets the <b>font</b> of the text.`);
  const E=editor(13,10,460,110,{title:'style.css',dark:true,size:19,menu:null});pop(E.el);
  const fam=v=>setCode(E,`p { font-family: ${v}; }`,'css');fam('Times New Roman');
  const B=browser(13,134,460,250,{url:'file:///C:/Users/Student/index.html',title:'My page'});pop(B.el);
  B.page.innerHTML='<p style="font-size:32px;line-height:1.3">Chip loves cheese and computers! 🧀</p>';const p=B.page.querySelector('p');
  await w(2400);
  const F=[['Arial','Arial'],['Courier New','Courier New'],['Georgia','Georgia'],['Comic Sans MS','Comic Sans MS'],['Verdana','Verdana'],['Times New Roman','Times New Roman']];
  await picker(w,{x:494,y:20,cols:2,bw:220,vals:F.map(([n,v])=>[n,v,`font-family:'${v}',sans-serif`]),
    onPick:v=>{fam(v);glowIn(E,v.split(' ')[0]);p.style.fontFamily=`'${v}',serif`;sparkle(p);},
    line:`Your turn! Tap a font name. The value changes, and the text changes its font.`,after:`See? Same words, new font. Try another, then tap <b>Carry on</b>.`,doneAt:'left:604px;top:210px;width:220px'});
  const n=mk('ca-note',`left:494px;top:20px;width:452px;box-sizing:border-box`,
    `⚠️ Not <b>font name</b>: there is no such property.<br>⚠️ Not <b>font-style</b>: that makes text <i>italic</i> (slanted), it does not change the font.`);pop(n);
  say(`Careful! There is no property called font name. And ${C('font-style','font style')} only makes text <i>italic</i>, slanted. It doesn't change the font.`);
  p.style.fontStyle='italic';await w(2600);p.style.fontStyle='normal';await w(800);
  wsCard('left:494px;top:180px;width:452px',{src:'Worksheet · MCQ 4',q:'________ is used to set the font of a text.<br>(a) Font family &nbsp; (b) Font name &nbsp; (c) Font style',a:'✔ (a) Font family'});
  say(`Worksheet: <b>font family</b> is used to set the font of a text. A family of fonts! 👨‍👩‍👧`);await w(3200);}},

/* 6 */ {t:'text-indent: the first line',run:async w=>{
  say(`Next, ${C('text-indent','text indent')}. It moves the <b>first line</b> of a paragraph in from the left, like in a story book. 📖`);
  const B=browser(13,10,560,300,{url:'file:///C:/Users/Student/story.html',title:'My story'});pop(B.el);
  B.page.innerHTML='<p style="font-size:24px;line-height:1.45;margin:4px 0">Once upon a time, a little mouse called Chip found a computer. He clicked, he typed, and he learned to make his very own web pages.</p>';
  const p=B.page.querySelector('p');
  const E=editor(590,10,356,110,{title:'style.css',dark:true,size:20,menu:null});pop(E.el);
  const ind=v=>setCode(E,`p {\n  text-indent: ${v};\n}`,'css');ind('0px');
  await w(2600);
  const ar=mk('',`left:22px;top:${at(p).y+6}px;font-size:24px;z-index:5;opacity:0`,'➡️');
  const slide=async v=>{const from=getComputedStyle(p).textIndent;ind(v);glowIn(E,v);await an(p,[{textIndent:from},{textIndent:v}],{duration:800,easing:'cubic-bezier(.3,1.3,.5,1)'});p.style.textIndent=v;};
  say(`Watch the value change to <b>60 pixels</b>… only the first line slides in! The other lines stay where they are.`);
  an(ar,[{opacity:0},{opacity:1}],{duration:300});loop(ar,[{transform:'translateX(-4px)'},{transform:'translateX(6px)'}],500,{direction:'alternate'});
  await nap(w,900);await slide('60px');beep(760,.08);sparkle(p);await w(2600);
  await picker(w,{x:590,y:138,cols:2,bw:172,vals:[['30px','30px'],['60px','60px'],['90px','90px'],['120px','120px']],
