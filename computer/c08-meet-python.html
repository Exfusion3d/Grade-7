/* a short "quick check" pick inside a teaching scene (not saved as an exam answer) */
async function quick(w,{q,o,a,why,top=40}){
  const box=mk('ex-q',`top:${top}px`,`<span class="src">🤔 Quick check</span>${q}`);pop(box);
  say(`${q} ${o.map((t,i)=>`<b>${'ABC'[i]}:</b> ${t}`).join(', ')}?`);
  await w(60);const y0=top+box.offsetHeight+16,n=o.length,cw=(880-(n-1)*14)/n;let picked=-1;
  const opts=o.map((t,i)=>{const e=mk('ex-opt',`left:${40+i*(cw+14)}px;top:${y0}px;width:${cw}px;min-height:62px`,`<span class="k">${'ABC'[i]}</span><span>${t}</span>`);pop(e,i*90);
    e.onclick=()=>{if(picked<0){picked=i;stopVoice();}};return e;});
  await w(1500);if(picked<0)say('Tap your answer!');
  await w.until(()=>picked>=0);
  const ok=picked===a;opts.forEach(e=>e.classList.add('locked'));opts[a].classList.add('ok');
  if(ok){yay();confetti(40);}else{opts[picked].classList.add('bad');shake(opts[picked]);boo();}
  const hgt=Math.max(...opts.map(e=>e.offsetHeight));
  const wb=mk('ex-why',`top:${y0+hgt+16}px`,(ok?'✅ <b>Correct!</b> ':`❌ <b>Not quite.</b> The answer is <b>${'ABC'[a]}</b>. `)+why);pop(wb);
  say((ok?'Correct! ':`Not quite. The answer is ${'ABC'[a]}. `)+why);await w(2800);return ok;}

/* open a window's menu (idx = which menu word) and show a dropdown; returns the dropdown */
function dropdown(W,idx,items,hi){const m=W.el.querySelector('.cw-menu');const sp=m.children[idx];sp.style.background='#cfe6ff';sp.style.borderRadius='4px';
  const d=mk('',`left:${sp.offsetLeft}px;top:${m.offsetTop+m.offsetHeight}px;min-width:190px;background:#fff;border:1px solid #9aa7bd;box-shadow:0 6px 16px rgba(0,0,0,.2);font-size:14px;font-weight:600;color:#1f2433;z-index:30;padding:3px 0`,
    items.map((t,i)=>`<div class="mi" style="display:flex;justify-content:space-between;gap:18px;padding:4px 12px">${t}</div>`).join(''),W.el);
  d.close=()=>{sp.style.background='';d.remove();};
  const it=d.children[hi];if(it){setTimeout(()=>{it.style.background='#cfe6ff';},350);}beep(650,.05);return d;}
/* print program output in the IDLE shell (as Run Module does) */
function shellPrint(S,lines,restart){S.cur.innerHTML='';
  S.log.insertAdjacentHTML('beforeend','\n'+(restart?`<span style="color:#7a849a">= RESTART: ${escC(restart)}</span>\n`:'')+lines.map(l=>`<span class="t-out">${escC(l)}</span>\n`).join('')+'<span class="idle-p">&gt;&gt;&gt; </span>');
  S.cur=document.createElement('span');S.log.appendChild(S.cur);S.cur.innerHTML='<span class="caret"></span>';
  while(S.log.offsetHeight>S.body.clientHeight-20&&S.log.firstChild)S.log.firstChild.remove();beep(500,.05);}

/* 1 */ {t:'Two features of Python',run:async w=>{

/* 2 */ {t:'Object Oriented: write once, reuse',run:async w=>{
