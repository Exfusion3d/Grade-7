<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="gate.js" data-account></script>
<script type="module" src="src/account.js" data-account></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Science Quest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#6a45d8">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">

<title>Science Quest: Grade 7 Exam Quiz</title>
<style>
:root{
  --ink:#1f2433; --muted:#626a80; --line:#e3e6ef; --bg:#f4f2ff;
  --g:#17935b; --gl:#e4f6ec; --o:#e06a1b; --ol:#fdeedf; --b:#2c66cf; --bl:#e5eefc;
  --p:#6a45d8; --pl:#efe9ff; --ok:#18a058; --okl:#e3f7ec; --bad:#e04848; --badl:#fde8e8; --y:#ffd84d;
}
*{box-sizing:border-box}
body{margin:0; font-family:"Avenir Next","Nunito","Segoe UI",system-ui,sans-serif; color:var(--ink); background:var(--bg); min-height:100vh;
  background-image:radial-gradient(circle at 10% 10%,#e3dcff 0,transparent 35%),radial-gradient(circle at 90% 80%,#d9ecff 0,transparent 40%)}
button{font:inherit; color:inherit; cursor:pointer}
.wrap{max-width:780px; margin:0 auto; padding:18px 16px 60px}
.hidden{display:none!important}

/* ---------- menu ---------- */
.hero{background:linear-gradient(135deg,#2a2f6b,#6a45d8 60%,#2c66cf); color:#fff; border-radius:26px; padding:26px 26px 22px; position:relative; overflow:hidden}
.hero h1{margin:0; font-size:clamp(30px,6vw,46px); font-weight:800; letter-spacing:-.01em}
.hero p{margin:6px 0 0; opacity:.92; font-size:17px}
.hero .atom{position:absolute; right:-10px; top:-10px; font-size:120px; opacity:.18; transform:rotate(15deg)}
.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:18px}
.mode{border:none; text-align:left; border-radius:20px; padding:18px; color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.15); transition:transform .12s, box-shadow .12s; position:relative}
.mode:hover{transform:translateY(-3px); box-shadow:0 9px 0 rgba(0,0,0,.15)}
.mode:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.15)}
.mode .lv{font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.9}
.mode h3{margin:4px 0 4px; font-size:21px}
.mode .meta{font-size:14px; opacity:.95}
.mode .best{margin-top:10px; font-size:13px; font-weight:700; background:rgba(255,255,255,.22); display:inline-block; padding:3px 10px; border-radius:20px}
.mode .emo{position:absolute; right:14px; top:12px; font-size:34px}
.m4{background:linear-gradient(140deg,#17935b,#45c288)} .m5{background:linear-gradient(140deg,#e06a1b,#f5a54a)}
.m9{background:linear-gradient(140deg,#2c66cf,#5aa0f0)} .mb{background:linear-gradient(140deg,#b0207a,#6a45d8)}
.menu-foot{display:flex; justify-content:space-between; align-items:center; margin-top:16px; color:var(--muted); font-size:14px; flex-wrap:wrap; gap:10px}
.resume{margin-top:16px;background:#fff;border-radius:20px;padding:12px 16px 6px;box-shadow:0 6px 18px rgba(80,50,180,.08)}
.resume h3{margin:0 0 6px;font-size:17px;color:#4a2ea6}
.rrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:2px solid var(--line)}
.rrow .rt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.rrow .rt span{font-size:13.5px;color:var(--muted);font-weight:700}
.rrow .go{width:auto;margin:0;padding:10px 16px;font-size:16px;flex:none}
.rx{border:2px solid var(--line);background:#fff;border-radius:12px;width:40px;height:40px;font-weight:800;color:var(--muted);flex:none}
.pill{border:2px solid var(--line); background:#fff; border-radius:30px; padding:7px 14px; font-weight:700; font-size:14px}

/* ---------- HUD ---------- */
.hud{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.hud .home{background:#fff; border:2px solid var(--line); border-radius:14px; padding:6px 10px; font-weight:800}
.bar{flex:1; height:16px; background:#fff; border-radius:20px; overflow:hidden; border:2px solid var(--line)}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,#6a45d8,#2c66cf); border-radius:20px; transition:width .4s}
.stat{background:#fff; border:2px solid var(--line); border-radius:14px; padding:5px 10px; font-weight:800; font-size:15px; white-space:nowrap}
.streak.hot{background:#fff3d6; border-color:#f2b200; animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* ---------- card ---------- */
.card{background:#fff; border-radius:24px; padding:20px 20px 18px; box-shadow:0 10px 30px rgba(60,40,140,.10); position:relative}
.qtop{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.tag{font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:20px}
.t4{background:var(--gl); color:var(--g)} .t5{background:var(--ol); color:var(--o)} .t9{background:var(--bl); color:var(--b)}
.tt{background:var(--pl); color:var(--p)}
.qnum{margin-left:auto; color:var(--muted); font-weight:700; font-size:14px}
.prompt{font-size:21px; font-weight:700; line-height:1.35; margin:4px 0 6px}
.hint{color:var(--muted); font-size:14.5px; margin-bottom:12px}
.img{text-align:center; margin:6px 0 12px}
.img svg{max-width:100%; height:auto}

/* options */
.opts{display:grid; gap:10px}
.opts.grid2{grid-template-columns:1fr 1fr}
@media(max-width:560px){.opts.grid2.text{grid-template-columns:1fr}}
.opt{display:flex; align-items:center; gap:12px; text-align:left; background:#fff; border:2.5px solid var(--line); border-radius:16px; padding:12px 14px; font-size:17px; font-weight:600; transition:transform .1s, border-color .15s, background .15s; box-shadow:0 3px 0 var(--line)}
.opt:hover:not(:disabled){border-color:#b9a8f0; transform:translateY(-1px)}
.opt .k{flex:none; width:32px; height:32px; border-radius:10px; background:var(--pl); color:var(--p); display:flex; align-items:center; justify-content:center; font-weight:800}
.opt.sel{border-color:var(--p); background:var(--pl)}
.opt.ok{border-color:var(--ok); background:var(--okl); box-shadow:0 3px 0 #9fdcbb}
.opt.ok .k{background:var(--ok); color:#fff}
.opt.bad{border-color:var(--bad); background:var(--badl); box-shadow:0 3px 0 #f2b0b0; animation:shake .35s}
.opt.bad .k{background:var(--bad); color:#fff}
.opt.miss{border-style:dashed; border-color:var(--ok)}
.opt:disabled{cursor:default}
.opt.pic{flex-direction:column; justify-content:center; padding:10px}
.tf .opt{justify-content:center; font-size:22px; padding:18px}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* match */
.match{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px}
.mcol{display:flex; flex-direction:column; gap:9px}
.mi{border:2.5px solid var(--line); background:#fff; border-radius:14px; padding:10px 12px; font-size:15.5px; font-weight:600; text-align:left; min-height:48px; display:flex; align-items:center; gap:8px; box-shadow:0 3px 0 var(--line)}
.mi.sel{border-color:var(--p); background:var(--pl)}
.mi .dot{flex:none; width:14px; height:14px; border-radius:50%; background:var(--line)}
.mi.ok{border-color:var(--ok); background:var(--okl)} .mi.bad{border-color:var(--bad); background:var(--badl)}
.mi .fix{display:block; font-size:12.5px; color:var(--ok); font-weight:700}

/* sort */
.tray{display:flex; flex-wrap:wrap; gap:8px; min-height:54px; padding:10px; border:2.5px dashed var(--line); border-radius:16px; margin-bottom:12px; justify-content:center}
.chip{border:2.5px solid #cfc4f5; background:#fff; border-radius:30px; padding:8px 14px; font-weight:700; font-size:15.5px; box-shadow:0 3px 0 #ddd5fa; touch-action:none; user-select:none; -webkit-user-select:none}
.chip.sel{background:var(--p); color:#fff; border-color:var(--p)}
.chip.ok{border-color:var(--ok); background:var(--okl)} .chip.bad{border-color:var(--bad); background:var(--badl)}
.chip small{display:block; font-size:11px; color:var(--ok)}
.bins{display:grid; gap:12px}
.bin{border:3px solid; border-radius:18px; padding:10px; min-height:110px; transition:transform .15s, background .15s}
.bin h4{margin:0 0 8px; font-size:16px; text-align:center}
.bin .in{display:flex; flex-wrap:wrap; gap:7px; justify-content:center}
.bin.over{transform:scale(1.03)}
.bin.c0{border-color:#f5a54a; background:#fff8ef} .bin.c0 h4{color:var(--o)}
.bin.c1{border-color:#5aa0f0; background:#f2f7ff} .bin.c1 h4{color:var(--b)}
.bin.c2{border-color:#45c288; background:#effaf4} .bin.c2 h4{color:var(--g)}
.ghost{position:fixed; pointer-events:none; z-index:50; transform:translate(-50%,-50%) rotate(-4deg); box-shadow:0 10px 20px rgba(0,0,0,.2)}

/* fill */
.sent{font-size:18.5px; line-height:2.3}
.blank{display:inline-block; min-width:110px; border:none; border-bottom:3px solid #b9a8f0; background:var(--pl); border-radius:10px 10px 0 0; padding:0 10px; font-weight:800; color:var(--p); text-align:center; line-height:1.7}
.blank.active{background:#ffe9a8; border-color:#f2b200}
.blank.ok{background:var(--okl); color:var(--ok); border-color:var(--ok)}
.blank.bad{background:var(--badl); color:var(--bad); border-color:var(--bad); text-decoration:line-through}
.fixw{color:var(--ok); font-weight:800; font-size:15px; margin-left:4px}
.bank{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; justify-content:center}

/* pH */
.phbox{text-align:center}
.phbig{width:120px; height:120px; border-radius:50%; margin:6px auto 8px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:44px; box-shadow:inset 0 -8px 0 rgba(0,0,0,.15); transition:background .2s}
.phbig small{font-size:13px; letter-spacing:.08em}
input[type=range].ph{-webkit-appearance:none; appearance:none; width:100%; height:26px; border-radius:20px; background:linear-gradient(90deg,#e5262a,#f47c20,#fcd20f,#c9dc22,#3fae49,#14a3a0,#2a86c8,#3f43a0,#6d1f7c); outline:none}
input[type=range].ph::-webkit-slider-thumb{-webkit-appearance:none; width:38px; height:38px; border-radius:50%; background:#fff; border:5px solid var(--ink); cursor:grab}
input[type=range].ph::-moz-range-thumb{width:30px; height:30px; border-radius:50%; background:#fff; border:5px solid var(--ink)}
.phticks{display:flex; justify-content:space-between; font-weight:800; color:var(--muted); font-size:13px; padding:4px 8px}

/* bars */
.bars{display:flex; justify-content:center; gap:40px; align-items:flex-end; height:230px; border-left:3px solid var(--ink); border-bottom:3px solid var(--ink); padding:0 20px; margin:10px auto 6px; max-width:380px; position:relative;
  background-image:linear-gradient(#eef0f5 2px,transparent 2px); background-size:100% 36px; background-position:0 -2px}
.bcol{display:flex; flex-direction:column; align-items:center; width:90px}
.bfill{width:70px; border:3px solid; border-radius:6px 6px 0 0; background:#fff; transition:height .25s}
.bctrl{display:flex; justify-content:center; gap:40px; max-width:380px; margin:0 auto}
.bctrl div{display:flex; flex-direction:column; align-items:center; gap:4px; width:110px; font-weight:800}
.bctrl .btns{flex-direction:row}
.rb{width:42px; height:42px; border-radius:12px; border:2.5px solid var(--line); background:#fff; font-size:22px; font-weight:800; box-shadow:0 3px 0 var(--line)}

/* key */
.animal{display:flex; gap:14px; align-items:center; background:var(--gl); border-radius:18px; padding:12px 16px; margin-bottom:12px}
.animal .em{font-size:52px}
.animal ul{margin:4px 0 0; padding-left:18px; font-weight:600}
.step{border:2.5px solid var(--line); border-radius:16px; padding:12px 14px; margin:8px 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap; animation:pop .3s}
.step b{flex:1; font-size:17px; min-width:200px}
.yn{border:2.5px solid var(--line); background:#fff; border-radius:12px; padding:8px 18px; font-weight:800; box-shadow:0 3px 0 var(--line)}
.yn.ok{background:var(--okl); border-color:var(--ok)} .yn.bad{background:var(--badl); border-color:var(--bad)}
.leaf{font-size:20px; font-weight:800; text-align:center; padding:12px; border-radius:16px; animation:pop .35s}
@keyframes pop{from{transform:scale(.85); opacity:0}}

/* build */
.lab{display:grid; grid-template-columns:1fr; gap:12px}
.ctrls{display:flex; flex-wrap:wrap; gap:14px; justify-content:center}
.ctrl{background:#f7f6fd; border-radius:16px; padding:10px 14px; text-align:center; font-weight:800}
.ctrl .row{display:flex; align-items:center; gap:10px; margin-top:6px; justify-content:center}
.ctrl .v{font-size:24px; min-width:24px}
.swbtn{border:none; border-radius:30px; padding:10px 18px; font-weight:800; color:#fff; margin-top:6px}
.amm{display:inline-block; background:#1f2433; color:#7cf0a5; font-family:"SF Mono",Menlo,monospace; font-size:22px; padding:6px 14px; border-radius:10px; letter-spacing:.05em}

/* footer / feedback */
.actions{display:flex; justify-content:flex-end; margin-top:16px; gap:10px}
.go{border:none; border-radius:16px; padding:13px 26px; font-size:18px; font-weight:800; color:#fff; background:var(--p); box-shadow:0 5px 0 #4a2ea6; transition:transform .1s}
.go:active{transform:translateY(3px); box-shadow:0 2px 0 #4a2ea6}
.go:disabled{background:#c9c3df; box-shadow:0 5px 0 #aea7c9; cursor:not-allowed}
.go.green{background:var(--ok); box-shadow:0 5px 0 #0f7a41}
.fb{margin-top:14px; border-radius:18px; padding:14px 16px; animation:pop .3s}
.fb.ok{background:var(--okl); border:2.5px solid #9fdcbb}
.fb.bad{background:#fff4e5; border:2.5px solid #f6c37a}
.fb h3{margin:0 0 4px; font-size:20px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:#c26a00}
.fb p{margin:0; font-size:16px; line-height:1.45}
.plus{position:absolute; right:22px; top:16px; font-weight:800; color:var(--ok); font-size:22px; animation:float 1.1s forwards}
@keyframes float{to{transform:translateY(-40px); opacity:0}}

/* end */
.end{text-align:center}
.stars{font-size:64px; letter-spacing:8px; margin:6px 0}
.stars span{display:inline-block; animation:pop .5s backwards; filter:grayscale(1); opacity:.35}
.stars span.on{filter:none; opacity:1}
.bigscore{font-size:46px; font-weight:800; color:var(--p)}
.endgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0}
.endgrid div{background:#f7f6fd; border-radius:16px; padding:10px; font-weight:700; color:var(--muted); font-size:14px}
.endgrid b{display:block; font-size:26px; color:var(--ink)}
.endbtns{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.revise{background:#f7f6fd; border-radius:16px; padding:12px 14px; margin:0 0 16px; text-align:left}
.revise h4{margin:0 0 8px; font-size:16px}
.revise a{display:flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--line); border-radius:12px; padding:9px 12px; margin-top:6px; color:var(--ink); text-decoration:none; font-weight:700; font-size:15px}
.revise .n{flex:none; background:#efe9ff; color:#4a2ea6; border-radius:8px; padding:2px 8px; font-size:13px; font-weight:800}
.revise .c{margin-left:auto; flex:none; color:var(--muted); font-size:13px}
.ghostbtn{border:2.5px solid var(--line); background:#fff; border-radius:16px; padding:12px 20px; font-size:17px; font-weight:800; box-shadow:0 4px 0 var(--line)}
canvas#fx{position:fixed; inset:0; pointer-events:none; z-index:100}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">

  <!-- MENU -->
  <section id="menu">
    <div class="hero">
      <div class="atom">⚛️</div>
      <h1>Science Quest</h1>
      <p>Grade 7 Cambridge exam review. Pick a level, answer questions, build streaks and collect stars!</p>
    </div>
    <div class="resume" id="resume"></div>
    <div class="modes" id="modes"></div>
    <div class="menu-foot">
      <a class="pill" href="science.html" style="text-decoration:none;color:inherit">🏠 Science lessons</a><span>💡 Every answer comes with a quick explanation.</span>
      <button class="pill" id="soundBtn">🔊 Sound: on</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden">
    <div class="hud">
      <button class="home" id="homeBtn" title="Back to menu">✕</button>
      <div class="bar"><i id="prog"></i></div>
      <div class="stat streak" id="streak">🔥 0</div>
      <div class="stat" id="score">⭐ 0</div>
    </div>
    <div class="card" id="card"></div>
  </section>

  <!-- END -->
  <section id="end" class="hidden">
    <div class="card end" id="endCard"></div>
  </section>
</div>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ================= sound ================= */
let soundOn=store.get('sq_sound',true), actx=null;
function tone(f,t0,dur,type='sine',vol=.18){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime+t0;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.start(t);o.stop(t+dur);}catch(e){}}
const sfx={ok(){tone(660,0,.12,'triangle');tone(990,.1,.22,'triangle');},bad(){tone(200,0,.25,'sawtooth',.08);tone(150,.12,.3,'sawtooth',.08);},
  tap(){tone(520,0,.05,'sine',.08);},win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,'triangle'));}};

/* ================= confetti ================= */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[];
function resize(){cv.width=innerWidth;cv.height=innerHeight;}addEventListener('resize',resize);resize();
function confetti(n=80,x=innerWidth/2,y=innerHeight/3){const cols=['#6a45d8','#2c66cf','#17935b','#e06a1b','#ffd84d','#e04848'];
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*12,vy:Math.random()*-11-3,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.3,life:120});
  if(parts.length===n)requestAnimationFrame(loop);}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life--;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,Math.min(1,p.life/40));cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+40);if(parts.length)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height);}

/* ================= SVG art ================= */
const INK='#1f2433';
function hazard(kind,size=130){
  const c=60;let art='';
  if(kind==='corrosive') art=`<rect x="28" y="30" width="8" height="22" fill="${INK}" transform="rotate(-55 32 41)"/><rect x="84" y="30" width="8" height="22" fill="${INK}" transform="rotate(55 88 41)"/>
    <circle cx="40" cy="55" r="2.4" fill="${INK}"/><circle cx="42" cy="62" r="2.4" fill="${INK}"/><circle cx="78" cy="55" r="2.4" fill="${INK}"/><circle cx="80" cy="62" r="2.4" fill="${INK}"/>
    <rect x="30" y="71" width="22" height="6" fill="${INK}"/><path d="M68,78 q4,-10 10,-8 q6,-6 10,0 v8 z" fill="${INK}"/>`;
  if(kind==='flammable') art=`<path d="M60,28 C82,48 82,64 72,74 C74,62 66,56 64,52 C62,64 56,68 58,74 C40,66 42,48 60,28 Z" fill="${INK}"/><rect x="40" y="79" width="40" height="5" fill="${INK}"/>`;
  if(kind==='environment') art=`<line x1="46" y1="76" x2="46" y2="38" stroke="${INK}" stroke-width="4"/><line x1="46" y1="52" x2="34" y2="42" stroke="${INK}" stroke-width="3"/><line x1="46" y1="46" x2="58" y2="36" stroke="${INK}" stroke-width="3"/>
    <line x1="34" y1="78" x2="90" y2="78" stroke="${INK}" stroke-width="3"/><ellipse cx="72" cy="66" rx="11" ry="5" fill="${INK}"/><path d="M82,66 l8,-6 v12 z" fill="${INK}"/>`;

function comp(t,x,y,glow=0){
  const m=`<rect x="${x-15}" y="${y-4}" width="30" height="8" fill="#fff"/>`;const w=(a,b)=>`<line x1="${a}" y1="${y}" x2="${b}" y2="${y}" stroke="${INK}" stroke-width="2.5"/>`;
  switch(t){
    case 'cell':return m+w(x-15,x-4)+`<line x1="${x-4}" y1="${y-13}" x2="${x-4}" y2="${y+13}" stroke="${INK}" stroke-width="2.5"/><line x1="${x+4}" y1="${y-7}" x2="${x+4}" y2="${y+7}" stroke="${INK}" stroke-width="6"/>`+w(x+4,x+15);
    case 'sw':return m+w(x-15,x-10)+`<circle cx="${x-10}" cy="${y}" r="2.8" fill="${INK}"/><circle cx="${x+10}" cy="${y}" r="2.8" fill="${INK}"/>`+w(x-10,x+10)+w(x+10,x+15);
    case 'swo':return m+w(x-15,x-10)+`<circle cx="${x-10}" cy="${y}" r="2.8" fill="${INK}"/><line x1="${x-10}" y1="${y}" x2="${x+8}" y2="${y-12}" stroke="${INK}" stroke-width="2.5"/><circle cx="${x+10}" cy="${y}" r="2.8" fill="${INK}"/>`+w(x+10,x+15);
    case 'lamp':return m+(glow>0?`<circle cx="${x}" cy="${y}" r="${11+16*glow}" fill="#ffd000" opacity="${.18+.45*glow}"/>`:'')+w(x-15,x-10)+w(x+10,x+15)+
      `<circle cx="${x}" cy="${y}" r="10" fill="${glow>0?'#fff6b0':'#fff'}" stroke="${INK}" stroke-width="2.5"/><line x1="${x-7}" y1="${y-7}" x2="${x+7}" y2="${y+7}" stroke="${INK}" stroke-width="2.2"/><line x1="${x+7}" y1="${y-7}" x2="${x-7}" y2="${y+7}" stroke="${INK}" stroke-width="2.2"/>`;
    case 'bz':return m+w(x-15,x-10)+w(x+10,x+15)+`<path d="M${x-10},${y} A10,10 0 0 0 ${x+10},${y} Z" fill="#fff" stroke="${INK}" stroke-width="2.5"/>`;
    case 'amm':return m+w(x-15,x-10)+w(x+10,x+15)+`<circle cx="${x}" cy="${y}" r="10" fill="#fff" stroke="${INK}" stroke-width="2.5"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="800" font-family="sans-serif">A</text>`;
  }return '';}
function circuit(top,bottom,W=220,H=120){
  const x0=20,x1=W-20,y0=24,y1=H-26;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="none" stroke="${INK}" stroke-width="2.5"/>`;
  const place=(items,y)=>items.forEach((it,i)=>{const x=x0+(x1-x0)*(i+1)/(items.length+1);s+=comp(it.t||it,x,y,it.g||0);});
  place(top,y0);place(bottom,y1);return s+'</svg>';}

function meter(v){
  const cxm=150,cym=160,R=118;const ang=x=>Math.PI*(1-(x/10))*0.8+Math.PI*0.1;
  const P=(r,a)=>[cxm+r*Math.cos(a),cym-r*Math.sin(a)];
  let s=`<svg width="300" height="180" viewBox="0 0 300 180"><rect x="4" y="4" width="292" height="172" rx="18" fill="#f7f8fb" stroke="${INK}" stroke-width="2.5"/>`;
  const [ax,ay]=P(R,ang(0)),[bx,by]=P(R,ang(10));s+=`<path d="M${ax},${ay} A${R},${R} 0 0 0 ${bx},${by}" fill="none" stroke="${INK}" stroke-width="2"/>`;
  for(let x=0;x<=10.001;x+=.5){const a=ang(x),big=Math.abs(x%2)<.01,L=big?14:7;const[p1,q1]=P(R,a),[p2,q2]=P(R-L,a);
    s+=`<line x1="${p1}" y1="${q1}" x2="${p2}" y2="${q2}" stroke="${INK}" stroke-width="${big?2:1}"/>`;
    if(big){const[tx,ty]=P(R-28,a);s+=`<text x="${tx}" y="${ty+5}" text-anchor="middle" font-size="14" font-weight="800" font-family="sans-serif">${x}</text>`;}}
  const[nx,ny]=P(R+6,ang(v));s+=`<line x1="${cxm}" y1="${cym-8}" x2="${nx}" y2="${ny-8}" stroke="#e02020" stroke-width="3.5"/><circle cx="${cxm}" cy="${cym-8}" r="7" fill="${INK}"/>`;
  s+=`<text x="${cxm}" y="${cym-36}" text-anchor="middle" font-size="22" font-weight="800" fill="#2c66cf" font-family="sans-serif">A</text></svg>`;return s;}

/* ---------- continuing a level ----------
   An unfinished level is saved after every answer (through src/account.js, so it follows the student between
   devices) and listed on the menu as "Continue where you left off". */
/* only this quiz's levels: other subjects' quizzes (e.g. Maths Quest) save theirs in the same place */
function savedRuns(){try{const me=JSON.parse(localStorage.getItem('g7_me'));const all=JSON.parse(localStorage.getItem('g7_resume_'+me.username)).quizzes||{};
  const mine=new Set([...MODES.map(m=>m.id),'retry']);return Object.fromEntries(Object.entries(all).filter(([m])=>mine.has(m)));}catch(e){return{};}}
function saveRun(i){track('quizState',S.mode,{ids:S.qs.map(q=>q.id),i,score:S.score,streak:S.streak,best:S.best,right:S.right,wrong:S.wrong.map(q=>q.id)});}
function resumeRun(mode,st){const byId=Object.fromEntries(BANK.map(q=>[q.id,q]));const qs=st.ids.map(id=>byId[id]).filter(Boolean);if(!qs.length)return;
  S={mode,qs,i:Math.min(st.i,qs.length),score:st.score,streak:st.streak,best:st.best,right:st.right,wrong:st.wrong.map(id=>byId[id]).filter(Boolean)};
  if(S.i>=qs.length){endGame();return;}show('game');renderQ();}
const modeName=id=>{const m=MODES.find(x=>x.id===id);return m?`${m.emo} ${m.lv}: ${m.name}`:'🔁 Practise my mistakes';};
function renderResume(){const box=$('#resume'),runs=Object.entries(savedRuns()).sort((a,b)=>(b[1].at||0)-(a[1].at||0));box.innerHTML='';
  if(!runs.length){box.style.display='none';return;}box.style.display='';
  box.appendChild(el('h3','','▶ Continue where you left off'));
  runs.forEach(([mode,st])=>{const n=(st.ids||[]).length;const row=el('div','rrow',`<div class="rt"><b>${modeName(mode)}</b><span>${st.i>=n?'All answered: see your results':`Question ${st.i+1} of ${n}`} · ${st.score} pts</span></div>`);
    const go=el('button','go','Continue ▶');go.onclick=()=>resumeRun(mode,st);
    const x=el('button','rx','✕');x.title='Forget this level';x.setAttribute('aria-label','Forget this unfinished level');x.onclick=()=>{track('quizState',mode,null);renderMenu();};
    row.appendChild(go);row.appendChild(x);box.appendChild(row);});}
addEventListener('g7-resume',()=>{if(!$('#menu').classList.contains('hidden'))renderMenu();});
function renderMenu(){
  renderResume();
  const box=$('#modes');box.innerHTML='';
  MODES.forEach(m=>{const n=m.id==='boss'?25:m.pick().length;const best=store.get('sq_best_'+m.id,null);
    const b=el('button','mode '+m.cls,`<div class="emo">${m.emo}</div><div class="lv">${m.lv}</div><h3>${m.name}</h3><div class="meta">${n} questions${m.id==='boss'?' from all units':''}</div>`+
      (best?`<div class="best">Best: ${'⭐'.repeat(best.stars)}${'☆'.repeat(3-best.stars)} · ${best.pct}%</div>`:''));
    b.onclick=()=>start(m.id,m.id==='boss'?m.pick():shuffle(m.pick()));box.appendChild(b);});
  $('#soundBtn').textContent=soundOn?'🔊 Sound: on':'🔇 Sound: off';
}
$('#soundBtn').onclick=()=>{soundOn=!soundOn;store.set('sq_sound',soundOn);renderMenu();};
$('#homeBtn').onclick=()=>{if(confirm('Leave this level? Your progress will be lost.'))show('menu');};
function show(id){['menu','game','end'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));if(id==='menu')renderMenu();scrollTo(0,0);}

/* ================= game state ================= */
let S;
/* Progress saving: handed to src/account.js, which may load after this script. */
function track(method,...args){(window.__track=window.__track||[]).push([method,args]);}
function start(mode,qs){S={mode,qs,i:0,score:0,streak:0,best:0,right:0,wrong:[]};saveRun(0);show('game');renderQ();}
function hud(){$('#prog').style.width=(S.i/S.qs.length*100)+'%';const st=$('#streak');st.textContent='🔥 '+S.streak;st.classList.toggle('hot',S.streak>=3);$('#score').textContent='⭐ '+S.score;}

function renderQ(){
  hud();const q=S.qs[S.i];const card=$('#card');card.innerHTML='';
  card.appendChild(el('div','qtop',`<span class="tag t${q.u}">${UNIT[q.u]}</span><span class="tag tt">${TYPE[q.type]}</span><span class="qnum">${S.i+1} / ${S.qs.length}</span>`));
  card.appendChild(el('div','prompt',q.q));
  if(q.hint)card.appendChild(el('div','hint',q.hint));
  if(q.img)card.appendChild(el('div','img',q.img));
  const body=el('div','body');card.appendChild(body);
  const actions=el('div','actions');const checkBtn=el('button','go','Check ✔');actions.appendChild(checkBtn);card.appendChild(actions);
  let api=null;
  api=R[q.type](q,body,()=>{if(api)checkBtn.disabled=!api.ready();},(ok)=>finish(ok));
  checkBtn.disabled=!api.ready();
  if(api.instant)actions.classList.add('hidden');
  checkBtn.onclick=()=>{if(!api.ready())return;finish(api.check());};
  function finish(ok){
    actions.classList.remove('hidden');checkBtn.disabled=false;
    if(api.lock)api.lock();
    if(ok){S.streak++;S.best=Math.max(S.best,S.streak);S.right++;const pts=100+Math.min(50,(S.streak-1)*10);S.score+=pts;sfx.ok();
      card.appendChild(el('div','plus','+'+pts));if(S.streak%5===0)confetti(70);else confetti(25,innerWidth/2,innerHeight/2);}
    else{S.streak=0;S.wrong.push(q);sfx.bad();}
    track('answer',{questionId:q.id,lessonId:q.l,source:'quiz',correct:ok});saveRun(S.i+1);
    hud();
    const fb=el('div','fb '+(ok?'ok':'bad'),`<h3>${ok?'✅ '+pickr(PRAISE):'💡 '+pickr(OOPS)}</h3><p>${q.why}</p>`);
    card.insertBefore(fb,actions);
    checkBtn.textContent=S.i===S.qs.length-1?'See my results 🏁':'Next ➜';checkBtn.classList.add('green');
    checkBtn.onclick=()=>{S.i++;if(S.i>=S.qs.length)endGame();else{renderQ();scrollTo({top:0,behavior:'smooth'});}};
    fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

/* ================= question renderers ================= */
const R={};
R.mcq=(q,body,upd,done)=>{
  const box=el('div','opts'+(q.grid?' grid2':'')+(q.pic?'':' text')+(q.type==='tf'?' tf grid2':''));body.appendChild(box);
  const btns=q.o.map((t,i)=>{const b=el('button','opt'+(q.pic?' pic':''),(q.type==='tf'||q.pic)?(q.pic?`<span class="k">${'ABCD'[i]}</span>`:'')+t:`<span class="k">${'ABCD'[i]}</span><span>${t}</span>`);box.appendChild(b);return b;});
  btns.forEach((b,i)=>b.onclick=()=>{btns.forEach(x=>x.disabled=true);btns[q.a].classList.add('ok');if(i!==q.a)b.classList.add('bad');done(i===q.a);});
  return{instant:true,ready:()=>false};
};
R.tf=R.mcq;
R.pick=(q,body,upd)=>{
  const box=el('div','opts grid2 text');body.appendChild(box);const sel=new Set();
  const btns=q.o.map((t,i)=>{const b=el('button','opt',`<span class="k">☐</span><span>${t}</span>`);
    b.onclick=()=>{sfx.tap();sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel',sel.has(i));b.querySelector('.k').textContent=sel.has(i)?'☑':'☐';upd();};box.appendChild(b);return b;});
  return{ready:()=>sel.size>0,check(){const want=new Set(q.a);let ok=sel.size===want.size&&[...sel].every(i=>want.has(i));
    btns.forEach((b,i)=>{b.disabled=true;if(want.has(i)&&sel.has(i))b.classList.add('ok');else if(sel.has(i))b.classList.add('bad');else if(want.has(i))b.classList.add('miss');});return ok;}};
};
const PAIRC=['#6a45d8','#e06a1b','#17935b','#2c66cf','#d4329a','#c9a000','#0aa5a5'];
R.match=(q,body,upd)=>{
  const wrap=el('div','match');body.appendChild(wrap);const L=el('div','mcol'),Rc=el('div','mcol');wrap.append(L,Rc);
  const lefts=q.pairs.map((p,i)=>({i,t:p[0]}));const rights=shuffle(q.pairs.map((p,i)=>({i,t:p[1]})));
  const link={};let selL=null;
  const lb=lefts.map(o=>{const b=el('button','mi',`<span class="dot"></span><span>${o.t}</span>`);L.appendChild(b);return b;});
  const rb=rights.map(o=>{const b=el('button','mi',`<span class="dot"></span><span>${o.t}</span>`);Rc.appendChild(b);return b;});
  function paint(){lb.forEach((b,li)=>{const linked=link[li]!=null;b.classList.toggle('sel',selL===li);b.querySelector('.dot').style.background=linked?PAIRC[li%PAIRC.length]:'';b.style.borderColor=linked?PAIRC[li%PAIRC.length]:'';});
    rb.forEach((b,ri)=>{const li=Object.keys(link).find(k=>link[k]===ri);b.querySelector('.dot').style.background=li!=null?PAIRC[li%PAIRC.length]:'';b.style.borderColor=li!=null?PAIRC[li%PAIRC.length]:'';});upd();}
  lb.forEach((b,li)=>b.onclick=()=>{sfx.tap();if(link[li]!=null&&selL!==li){delete link[li];}selL=selL===li?null:li;paint();});
  rb.forEach((b,ri)=>b.onclick=()=>{if(selL==null){const li=Object.keys(link).find(k=>link[k]===ri);if(li!=null){delete link[li];sfx.tap();paint();}return;}
    sfx.tap();Object.keys(link).forEach(k=>{if(link[k]===ri)delete link[k];});link[selL]=ri;
    selL=lb.findIndex((_,k)=>link[k]==null);if(selL<0)selL=null;paint();});
  selL=0;paint();
  return{ready:()=>Object.keys(link).length===lefts.length,
    lock(){lb.concat(rb).forEach(b=>b.disabled=true);},
    check(){let ok=true;lb.forEach((b,li)=>{const good=rights[link[li]].i===lefts[li].i;b.style.borderColor='';b.classList.remove('sel');b.classList.add(good?'ok':'bad');
      if(!good){ok=false;b.querySelector('span:last-child').insertAdjacentHTML('beforeend',`<span class="fix">✔ ${q.pairs[li][1]}</span>`);}});return ok;}};
};
R.sort=(q,body,upd)=>{
  const tray=el('div','tray');body.appendChild(tray);
  const bins=el('div','bins');bins.style.gridTemplateColumns=`repeat(${q.bins.length},1fr)`;body.appendChild(bins);
  const binEls=q.bins.map((n,i)=>{const b=el('div','bin c'+i,`<h4>${n}</h4><div class="in"></div>`);b.dataset.bin=i;bins.appendChild(b);return b;});
  let sel=null,locked=false;
  const chips=shuffle(q.items).map(([t,bin])=>{const c=el('div','chip',t);c.dataset.want=bin;c.dataset.at='';tray.appendChild(c);return c;});
  function place(c,bi){if(bi==null){tray.appendChild(c);c.dataset.at='';}else{binEls[bi].querySelector('.in').appendChild(c);c.dataset.at=bi;}sfx.tap();setSel(null);upd();}
  function setSel(c){chips.forEach(x=>x.classList.toggle('sel',x===c));sel=c;}
  binEls.forEach((b,bi)=>b.onclick=e=>{if(locked||!sel||e.target.closest('.chip'))return;place(sel,bi);});
  tray.onclick=e=>{if(locked||!sel||e.target.closest('.chip'))return;place(sel,null);};
  chips.forEach(c=>{let sx=null,sy,drag=false,ghost=null,over=null;
    const move=e=>{if(sx==null)return;if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){drag=true;ghost=c.cloneNode(true);ghost.classList.add('ghost');document.body.appendChild(ghost);c.style.opacity=.35;}
      if(drag){e.preventDefault();ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';const t=document.elementFromPoint(e.clientX,e.clientY);const b=t&&t.closest('.bin');if(over&&over!==b)over.classList.remove('over');over=b;if(b)b.classList.add('over');}};
    const up=e=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      if(sx==null)return;sx=null;
      if(drag){drag=false;if(ghost)ghost.remove();ghost=null;c.style.opacity='';if(locked)return;
        const t=e.type==='pointercancel'?null:document.elementFromPoint(e.clientX,e.clientY);const b=(t&&t.closest('.bin'))||over;
        if(over)over.classList.remove('over');over=null;
        if(b)place(c,+b.dataset.bin);else if(t&&t.closest('.tray'))place(c,null);}
      else if(!locked&&e.type==='pointerup'){sfx.tap();setSel(sel===c?null:c);}};
    c.onpointerdown=e=>{if(locked)return;sx=e.clientX;sy=e.clientY;drag=false;addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);};
  });
  return{ready:()=>chips.every(c=>c.dataset.at!==''),lock(){locked=true;},
    check(){let ok=true;chips.forEach(c=>{const good=c.dataset.at==c.dataset.want;c.classList.remove('sel');c.classList.add(good?'ok':'bad');if(!good){ok=false;c.insertAdjacentHTML('beforeend',`<small>→ ${q.bins[c.dataset.want]}</small>`);}});return ok;}};
};
R.fill=(q,body,upd)=>{
  const sent=el('div','sent');body.appendChild(sent);const vals=q.ans.map(()=>null);let active=0;
  sent.innerHTML=q.text.replace(/\{(\d)\}/g,(m,n)=>`<button class="blank" data-n="${n}">&nbsp;</button>`);
  const blanks=[...sent.querySelectorAll('.blank')];
  const bank=el('div','bank');body.appendChild(bank);
  const words=shuffle(q.bank).map(w=>{const c=el('button','chip',w);bank.appendChild(c);c.onclick=()=>{if(active==null)return;sfx.tap();vals[active]=w;
    const nx=vals.findIndex(v=>v==null);active=nx<0?null:nx;paint();};return c;});
  function paint(){blanks.forEach((b,i)=>{b.innerHTML=vals[i]||'&nbsp;';b.classList.toggle('active',active===i);});words.forEach(c=>c.style.opacity=vals.includes(c.textContent)?.45:1);upd();}
  blanks.forEach((b,i)=>b.onclick=()=>{sfx.tap();if(vals[i]!=null&&active===i){vals[i]=null;}active=i;paint();});
  paint();
  return{ready:()=>vals.every(v=>v!=null),lock(){blanks.concat(words).forEach(b=>b.disabled=true);},
    check(){let ok=true;blanks.forEach((b,i)=>{b.classList.remove('active');const good=vals[i]===q.ans[i];b.classList.add(good?'ok':'bad');if(!good){ok=false;b.insertAdjacentHTML('afterend',`<span class="fixw">${q.ans[i]}</span>`);}});return ok;}};
};
R.ph=(q,body,upd)=>{
  const box=el('div','phbox',`<div style="font-size:22px;font-weight:800">${q.sub}</div><div class="phbig"></div><input type="range" class="ph" min="1" max="14" step="1" value="7"><div class="phticks">${Array.from({length:14},(_,i)=>`<span>${i+1}</span>`).join('')}</div>`);
  body.appendChild(box);const r=box.querySelector('input'),big=box.querySelector('.phbig');let moved=false;
  const kind=v=>v<7?'ACID':v===7?'NEUTRAL':'ALKALI';
  function paint(){const v=+r.value;big.style.background=PHC[v-1];big.innerHTML=`${v}<small>${kind(v)}</small>`;}
  r.oninput=()=>{if(!moved){moved=true;upd();}tone(300+r.value*45,0,.05,'sine',.06);paint();};paint();
  return{ready:()=>moved,lock(){r.disabled=true;},check(){return +r.value===q.ans;}};
};
R.bars=(q,body,upd)=>{
  const vals=q.labels.map(()=>0);const H=36;
  const chart=el('div','bars');body.appendChild(chart);const ctrl=el('div','bctrl');body.appendChild(ctrl);
  const cols=['#e06a1b','#2c66cf'];
  const fills=q.labels.map((l,i)=>{const c=el('div','bcol');const f=el('div','bfill');f.style.borderColor=cols[i];c.appendChild(f);chart.appendChild(c);return f;});
  const nums=q.labels.map((l,i)=>{const d=el('div','',`<span>${l}</span><div class="btns"><button class="rb">−</button><button class="rb">+</button></div><span class="v" style="font-size:22px">0</span>`);ctrl.appendChild(d);
    const [m,p]=d.querySelectorAll('.rb');m.onclick=()=>{vals[i]=Math.max(0,vals[i]-1);go();};p.onclick=()=>{vals[i]=Math.min(q.max,vals[i]+1);go();};return d.querySelector('.v');});
  let touched=false;function go(){touched=true;sfx.tap();paint();upd();}
  function paint(){fills.forEach((f,i)=>{f.style.height=(vals[i]*H)+'px';nums[i].textContent=vals[i];});}
  chart.style.height=(q.max*H+4)+'px';for(let k=0;k<=q.max;k++){const t=el('span','',k);t.style.cssText=`position:absolute;left:-24px;bottom:${k*H-9}px;font-weight:800;color:#626a80;font-size:14px`;chart.appendChild(t);}paint();
  return{ready:()=>touched,lock(){ctrl.querySelectorAll('button').forEach(b=>b.disabled=true);},check(){return vals.every((v,i)=>v===q.ans[i]);}};
};
R.key=(q,body,upd,done)=>{
  body.appendChild(el('div','animal',`<div class="em">${q.animal.em}</div><div><b>Mystery animal clues:</b><ul>${q.animal.facts.map(f=>`<li>${f}</li>`).join('')}</ul></div>`));
  const steps=el('div');body.appendChild(steps);
  function step(k){const s=KEY[k];const row=el('div','step',`<b>${k+1}. ${s.q}</b>`);const y=el('button','yn','Yes'),n=el('button','yn','No');row.append(y,n);steps.appendChild(row);
    const answer=yes=>{y.disabled=n.disabled=true;const want=q.traits[s.trait];const good=yes===want;(yes?y:n).classList.add(good?'ok':'bad');
      if(!good){(want?y:n).classList.add('ok');steps.appendChild(el('div','leaf',`Oops, wrong turn! 🧭`));done(false);return;}
      sfx.tap();if(yes){steps.appendChild(el('div','leaf',`It's a… ${s.yes}!`));done(true);}else if(k+1<KEY.length)step(k+1);else{steps.appendChild(el('div','leaf',s.no));done(true);}};
    y.onclick=()=>answer(true);n.onclick=()=>answer(false);}
  step(0);return{instant:true,ready:()=>false};
};
R.build=(q,body,upd)=>{
  const st={...q.init};let touched=false;
  const lab=el('div','lab');body.appendChild(lab);const pic=el('div','img');const amm=el('div','',`<div style="text-align:center">Ammeter reading: <span class="amm"></span></div>`);
  const ctrls=el('div','ctrls');lab.append(pic,amm,ctrls);
  function I(){return st.closed?0.5*st.cells/st.lamps:0;}
  function draw(){const b=st.closed?Math.min(1,0.45*st.cells/st.lamps):0;
    const top=[...Array(st.cells)].map(()=>'cell').concat([st.closed?'sw':'swo','amm']);const bot=[...Array(st.lamps)].map(()=>({t:'lamp',g:b}));
    pic.innerHTML=circuit(top,bot,340,150);amm.querySelector('.amm').textContent=I().toFixed(2)+' A';
    ctrls.querySelector('.cv').textContent=st.cells;ctrls.querySelector('.lv').textContent=st.lamps;
    const s=ctrls.querySelector('.swbtn');s.textContent=st.closed?'Switch: CLOSED (on)':'Switch: OPEN (off)';s.style.background=st.closed?'#18a058':'#e04848';}
  ctrls.innerHTML=`<div class="ctrl">🔋 Cells<div class="row"><button class="rb" data-a="c-">−</button><span class="v cv"></span><button class="rb" data-a="c+">+</button></div></div>
    <div class="ctrl">💡 Lamps<div class="row"><button class="rb" data-a="l-">−</button><span class="v lv"></span><button class="rb" data-a="l+">+</button></div></div>
    <div class="ctrl">🔘 Switch<div><button class="swbtn" data-a="sw"></button></div></div>`;
  ctrls.onclick=e=>{const a=e.target.dataset.a;if(!a||e.target.disabled)return;
    if(a==='c-')st.cells=Math.max(1,st.cells-1);if(a==='c+')st.cells=Math.min(3,st.cells+1);if(a==='l-')st.lamps=Math.max(1,st.lamps-1);if(a==='l+')st.lamps=Math.min(3,st.lamps+1);if(a==='sw')st.closed=!st.closed;
    touched=true;sfx.tap();draw();upd();};
  draw();
  return{ready:()=>touched,lock(){ctrls.querySelectorAll('button').forEach(b=>b.disabled=true);},check(){return q.goal(st);}};
};

/* ================= end ================= */
/* links to the lessons behind this level's mistakes, most mistakes first */
function revise(){const cnt={};S.wrong.forEach(q=>{if(LESSONS[q.l])cnt[q.l]=(cnt[q.l]||0)+1;});
  const ids=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b));if(!ids.length)return'';
  return `<div class="revise"><h4>📖 Lessons to revise</h4>`+ids.map(id=>`<a href="lessons/${LESSONS[id][0]}.html"><span class="n">Lesson ${+id.slice(1)}</span>${LESSONS[id][1]}<span class="c">${cnt[id]} mistake${cnt[id]>1?'s':''}</span></a>`).join('')+'</div>';}
function endGame(){
  hud();const n=S.qs.length,pct=Math.round(S.right/n*100);const stars=pct>=90?3:pct>=70?2:pct>=40?1:0;
  track('quizRun',{mode:S.mode,right:S.right,total:n,score:S.score,stars});track('quizState',S.mode,null);
  const key='sq_best_'+S.mode;const prev=store.get(key,null);if(S.mode!=='retry'&&(!prev||pct>prev.pct))store.set(key,{pct,stars});
  const msg=stars===3?'Legendary! You\'re exam-ready! 🏆':stars===2?'Great job! A little more practice and you\'ll ace it!':stars===1?'Good start! Practise your mistakes to level up.':'Keep going, every try makes your brain stronger! 💪';
  const c=$('#endCard');c.innerHTML=`<div style="font-size:15px;font-weight:800;color:var(--muted);letter-spacing:.1em;text-transform:uppercase">Level complete</div>
    <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?'on':''}" style="animation-delay:${i*.2}s">⭐</span>`).join('')}</div>
    <div class="bigscore">${S.score} pts</div><p style="font-size:18px;font-weight:700">${msg}</p>
    <div class="endgrid"><div><b>${S.right}/${n}</b>correct</div><div><b>${pct}%</b>accuracy</div><div><b>🔥 ${S.best}</b>best streak</div></div>
    ${revise()}<div class="endbtns"></div>`;
  const bt=c.querySelector('.endbtns');
  if(S.wrong.length){const r=el('button','go',`🔁 Practise my ${S.wrong.length} mistake${S.wrong.length>1?'s':''}`);r.onclick=()=>start('retry',shuffle(S.wrong));bt.appendChild(r);}
  const again=el('button','ghostbtn','▶ Play again');const mode=S.mode;again.onclick=()=>{const m=MODES.find(x=>x.id===mode);start(mode,m?(mode==='boss'?m.pick():shuffle(m.pick())):shuffle(S.qs));};bt.appendChild(again);
  const home=el('button','ghostbtn','🏠 Menu');home.onclick=()=>show('menu');bt.appendChild(home);
  show('end');sfx.win();if(stars>=2){confetti(150);setTimeout(()=>confetti(120,innerWidth*.25,innerHeight*.4),400);setTimeout(()=>confetti(120,innerWidth*.75,innerHeight*.4),800);}
}
renderMenu();
