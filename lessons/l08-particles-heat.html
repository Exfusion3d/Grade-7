<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6a45d8">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-180.png">
<title>Particles and heat</title>
<link rel="stylesheet" href="engine.css">
<style>
.pt{position:absolute;border-radius:50%;box-shadow:inset -3px -3px 0 rgba(0,0,0,.14)}
.box8{position:absolute;border:3px solid #c9c2e6;border-radius:14px;background:#fbfaff;overflow:hidden;overflow:clip}
.lbl{position:absolute;background:#1f2433;color:#fff;border-radius:10px;padding:3px 10px;font-size:14px;font-weight:800;white-space:nowrap}
.note{position:absolute;background:#fff;border:3px solid #ece8f8;border-radius:18px;padding:10px 16px;font-size:17px;font-weight:700;line-height:1.4}
.ocard{position:absolute;width:295px;height:52px;border-radius:14px;background:#fff;border:3px solid #cfc4f5;box-shadow:0 3px 0 #ddd5fa;
  display:flex;align-items:center;padding:0 12px;font-size:15px;font-weight:800;line-height:1.2;cursor:pointer;z-index:5;
  transition:left .6s cubic-bezier(.3,1.2,.4,1),top .6s cubic-bezier(.3,1.2,.4,1),background .3s,border-color .3s}
.ocard.done{background:#e3f7ec;border-color:#18a058;cursor:default}
.oslot{position:absolute;width:295px;height:52px;border-radius:14px;border:3px dashed #c9c2e6;display:flex;align-items:center;padding-left:10px;font-weight:800;color:#a99be0;font-size:18px}
.flame8{position:absolute;width:30px;height:56px;border-radius:50% 50% 45% 45%/70% 70% 30% 30%;
  background:radial-gradient(ellipse at 50% 80%,#fff 0,#7fc8ff 25%,#2c66cf 55%,rgba(44,102,207,0) 72%)}
</style>
</head>
<body>
<script src="engine.js"></script>
<script>
/* Lesson 8 · Particles and heat (Unit 5) */
const P=(x,y,d,c,parent)=>mk('pt',`left:${x}px;top:${y}px;width:${d}px;height:${d}px;background:${c}`,null,parent);
const R=(a,b)=>a+Math.random()*(b-a);
/* make a particle jiggle on the spot; amplitude a px, period ms */
function jig(el,a,ms){if(el._j)el._j.cancel();const k=[{transform:'translate(0,0)'},{transform:`translate(${a}px,${-a*.7}px)`},{transform:`translate(${-a*.8}px,${a*.5}px)`},{transform:`translate(${a*.5}px,${a*.8}px)`},{transform:'translate(0,0)'}];
  el._j=el.animate(k,{duration:ms,iterations:Infinity,delay:-Math.random()*ms});}

Lesson.start({
  id:'l08', num:8, unit:5, emoji:'🔥', title:'Particles and heat',
  intro:`Hi! I'm <b>Professor Atom</b> ⚛️ Today we zoom inside materials to see what <b>heat</b> really does. Press <b>Start</b>!`,
  scenes:[

/* 1 */ {t:'Everything is made of particles', run:async w=>{
  say(`Everything around you is made of tiny <b>particles</b>, far too small to see. Let's zoom in with a super microscope! 🔬`);
  const S=[['🧊 Solid','Particles in <b>neat rows</b>, touching. They only <b>vibrate</b> on the spot.','#f7ad5f'],
    ['💧 Liquid','Particles touching but <b>jumbled</b>. They <b>slide</b> past each other.','#5d9cf5'],
    ['💨 Gas','Particles <b>far apart</b>, zooming fast in all directions.','#9aa3b5']];
  const boxes=S.map((s,i)=>{const p=panel(13+i*315,8,303,372,s[0],s[1]);pop(p,i*150);return mk('box8','left:30px;top:48px;width:238px;height:220px',null,p);});
  await w(2800);
  // solid: neat rows
  for(let r=0;r<5;r++)for(let c=0;c<6;c++){const d=P(22+c*33,30+r*33,30,'#f7ad5f',boxes[0]);jig(d,1.6,260);}
  say(`In a <b>solid</b>, the particles sit in <b>neat rows</b>. They can't move around… they just <b>vibrate</b> on the spot.`);
  await w(3400);
  // liquid: jumbled, sliding
  const lq=mk('','left:0;top:70px;width:238px;height:150px;background:rgba(93,156,245,.12)',null,boxes[1]);
  for(let i=0;i<24;i++){const d=P(R(4,200),R(78,182),30,'#5d9cf5',boxes[1]);
    d.animate([{transform:'translate(0,0)'},{transform:`translate(${R(-26,26)}px,${R(-14,14)}px)`},{transform:`translate(${R(-26,26)}px,${R(-14,14)}px)`},{transform:'translate(0,0)'}],{duration:R(2200,3200),iterations:Infinity});}
  say(`In a <b>liquid</b>, the particles still touch, but they're <b>jumbled</b> up and <b>slide</b> past each other. That's why liquids flow!`);
  await w(3600);
  // gas: zooming
  for(let i=0;i<9;i++){const d=P(R(10,190),R(10,170),26,'#9aa3b5',boxes[2]);const k=[{transform:'translate(0,0)'}];
    for(let j=0;j<4;j++)k.push({transform:`translate(${R(-100,100)}px,${R(-80,80)}px)`});k.push({transform:'translate(0,0)'});
    d.animate(k,{duration:R(2600,3600),iterations:Infinity,easing:'linear',delay:-R(0,2000)});}
  say(`In a <b>gas</b>, the particles are <b>far apart</b> and zoom around fast, bumping into the walls. 💨`);
  await w(3400);
  const n=mk('note','left:13px;top:394px;width:933px;height:118px;display:flex;align-items:center;gap:18px;background:#fff8e6;border-color:#f2c200;font-size:20px',
    `<span style="font-size:58px;line-height:1" class="fl">🔥</span><span>The big secret of this lesson: <b>heat energy makes particles move MORE</b>. More heat = more vibrating, sliding and zooming!</span>`);pop(n);
  loop(n.querySelector('.fl'),[{transform:'scale(1) rotate(-6deg)'},{transform:'scale(1.15) rotate(6deg)'}],420,{direction:'alternate'});
  say(`Here's the big secret: <b>heat energy makes particles move more</b>. Keep that in mind for the whole lesson! 🔥`);
  await w(3000);
}},

/* 2 */ {t:'Heat it up!', run:async w=>{
  const head=mk('tag','left:60px;top:14px;background:#efe9ff;color:#4a2ea6;font-size:17px','🔍 A metal bar, zoomed in to see its particles');pop(head);
  const SP=[30,33,36,39],AMP=[1.4,2.8,4.2,5.6],PER=[300,210,150,110],COL=['#f7ad5f','#f59a4a','#ef7a3a','#e85a2e'],TEMP=[20,150,300,450];
  const X0=60,Y0=96,D=26,NC=12,NR=4;
  const ghost=mk('','left:'+(X0-8)+'px;top:'+(Y0-8)+'px;width:'+(11*SP[0]+D+16)+'px;height:'+(3*SP[0]+D+16)+'px;border:3px dashed #9a96b0;border-radius:12px;z-index:2');
  const bar=mk('','left:'+(X0-8)+'px;top:'+(Y0-8)+'px;width:'+(11*SP[0]+D+16)+'px;height:'+(3*SP[0]+D+16)+'px;border:3px solid #d66a0a;background:#fff3e6;border-radius:12px;transition:width 1s,height 1s');
  const parts=[];for(let r=0;r<NR;r++)for(let c=0;c<NC;c++){const d=P(X0+c*SP[0],Y0+r*SP[0],D,COL[0]);d.style.transition='left 1s,top 1s,background .8s';d.style.zIndex=3;d.r=r;d.c=c;parts.push(d);jig(d,AMP[0],PER[0]);pop(d,(r*NC+c)*8);}
  const ruler=mk('','left:'+X0+'px;top:300px;height:4px;background:#1f2433;width:'+(11*SP[0]+D)+'px;transition:width 1s');
  mk('','left:-2px;top:-8px;width:4px;height:20px;background:#1f2433',null,ruler);const rend=mk('','right:-2px;top:-8px;width:4px;height:20px;background:#1f2433',null,ruler);
  const rl=mk('','left:'+X0+'px;top:310px;font-size:16px;font-weight:800;color:#626a80','↔ length of the bar');
  const fl=mk('','left:'+X0+'px;top:250px;width:470px;height:40px;display:flex;gap:18px;justify-content:center;font-size:32px;line-height:1',null);
  // thermometer + button
  const th=mk('','left:600px;top:60px;width:34px;height:250px;border:4px solid #5a6478;border-radius:18px;background:#fff;overflow:hidden');
  const tf=mk('','left:6px;bottom:6px;width:14px;height:20px;border-radius:7px;background:#e04848;transition:height 1s',null,th);
  const tt=mk('','left:648px;top:270px;font-size:24px;font-weight:800;color:#e04848','20 °C');
  let taps=0,armed=false,lvl=0;
  const b=btn('bigbtn','left:700px;top:70px;width:240px;height:84px;background:linear-gradient(135deg,#e06a1b,#e04848);display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.45','🔥 Add heat',()=>{if(!armed)return;armed=false;taps++;beep(300+taps*120,.15,'sawtooth',.06);});
  const dots=mk('','left:700px;top:166px;width:240px;text-align:center;font-size:18px;font-weight:800;color:#626a80','Heat level: ○ ○ ○');
  window.AUTOPLAY=()=>{if(armed)b.click();};
  say(`Here's a <b>metal bar</b>. Its particles sit in neat rows, gently <b>vibrating</b>. The dashed line shows its size when cold.`);
  await w(3600);
  const LINES=[`The particles <b>vibrate more</b>! Look, they push each other a little further apart.`,
    `Even more heat… the particles vibrate <b>harder</b> and take up <b>more space</b>. 📏`,
    `Maximum heat! 🔥 The particles are jiggling wildly, and the whole bar has <b>grown longer</b>.`];
  for(let k=1;k<=3;k++){
    armed=true;b.style.opacity=1;loop(b,[{transform:'scale(1)'},{transform:'scale(1.06)'}],500,{direction:'alternate'});
    say(k===1?`Your turn! 👆 Tap <b>Add heat</b> to heat the bar with a flame.`:`Tap <b>Add heat</b> again! 👆`);
    await w.until(()=>taps>=k);b.style.opacity=.45;b.getAnimations().forEach(a=>a.cancel());
    lvl=k;const s=SP[k];
    parts.forEach(d=>{d.style.left=(X0+d.c*s)+'px';d.style.top=(Y0+d.r*s)+'px';d.style.background=COL[k];jig(d,AMP[k],PER[k]);});
    bar.style.width=(11*s+D+16)+'px';bar.style.height=(3*s+D+16)+'px';ruler.style.width=(11*s+D)+'px';
    tf.style.height=(20+k*70)+'px';tt.textContent=TEMP[k]+' °C';dots.textContent='Heat level: '+'● '.repeat(k)+'○ '.repeat(3-k);
    fl.innerHTML='';for(let i=0;i<k*2;i++){const f=mk('','position:relative','🔥',fl);f.style.position='relative';loop(f,[{transform:'scale(1)'},{transform:'scale(1.25)'}],300+i*40,{direction:'alternate'});}
    say(LINES[k-1]);await w(3200);}
  rl.innerHTML='↔ the bar got <b style="color:#e04848">LONGER</b>: it <b>expanded</b>!';pop(rl);
  const n=mk('note','left:13px;top:350px;width:560px;height:84px;font-size:16.5px',`🔥 Heated → particles <b>vibrate more</b> → they push apart and take up <b>more space</b> → the metal <b>expands</b>.`);pop(n);
  say(`So when a metal is heated, its particles <b>vibrate more</b> and take up more space. The metal <b>expands</b>!`);
  await w(3600);
  const x=mk('note','left:590px;top:350px;width:356px;height:84px;font-size:14.5px;color:#9a3030;background:#fdf0f0;border-color:#f2b0b0',`❌ A) shrink &nbsp;❌ C) turn into gas<br>❌ D) lose all their weight`);pop(x);
  an(n,[{opacity:1},{opacity:0}],{duration:300,fill:'forwards'});
  wsCard('left:13px;top:350px;width:560px',{src:'Worksheet · Unit 5 · MCQ 18',q:'What happens to most solid metals when they are heated?',a:'✔ B) They expand as particles vibrate more'});
  say(`✅ That's <b>MCQ 18</b>: heated metals <b>expand as particles vibrate more</b>. Answer <b>B</b>! They don't shrink, turn to gas or lose weight.`);
  await w(3000);
}},

/* 3 */ {t:'Watch out: particles do NOT grow!', run:async w=>{
  say(`⚠️ Watch out! Lots of people think the particles themselves get <b>bigger</b> when heated. Let's check…`);
  const L=panel(13,8,460,300,'❌ Myth: the particles get bigger','');pop(L);
  const small=P(110,110,46,'#f7ad5f',L);jig(small,1.5,300);
  mk('','left:176px;top:112px;font-size:40px;font-weight:800;color:#626a80','→',L);
  const big=P(250,72,120,'#e85a2e',L);
  mk('','left:84px;top:170px;font-size:15px;font-weight:800;color:#626a80','cold particle',L);
  await w(2600);
  const X=mk('','left:220px;top:40px;font-size:150px;line-height:1;color:#e04848;font-weight:800;z-index:3','✖',L);pop(X);boo();
  mk('','left:20px;top:230px;width:420px;text-align:center;font-size:19px;font-weight:800;color:#e04848','WRONG! Particles never swell up.',L);
  say(`<b>Wrong!</b> ❌ A particle does <b>not</b> get bigger when it's heated. So what really happens?`);
  await w(3000);
  const Rp=panel(487,8,460,300,'✅ Truth: the GAPS get bigger','');pop(Rp);
  mk('','left:20px;top:58px;font-size:15px;font-weight:800;color:#2c66cf','❄️ cold',Rp);mk('','left:20px;top:160px;font-size:15px;font-weight:800;color:#e04848','🔥 hot',Rp);
  for(let i=0;i<6;i++){const d=P(90+i*44,48,40,'#f7ad5f',Rp);jig(d,1.5,300);}
  for(let i=0;i<6;i++){const d=P(90+i*58,150,40,'#e85a2e',Rp);jig(d,5,120);
    if(i<5){const g=mk('','left:'+(130+i*58)+'px;top:156px;width:18px;height:28px;border-radius:6px;background:rgba(255,216,77,.7);z-index:-1',null,Rp);loop(g,[{opacity:.3},{opacity:1}],500,{direction:'alternate'});}}
  mk('','left:20px;top:222px;width:420px;text-align:center;font-size:17px;font-weight:800;color:#18a058','Same-sized particles, just vibrating more<br>and spreading out. 🟨 = bigger gaps',Rp);
  say(`✅ Each particle stays the <b>same size</b>. They just <b>vibrate more</b> and spread out, so the <b>gaps</b> between them get bigger.`);
  await w(3800);
  // ball and ring
  const B=panel(13,318,933,194,'🔵 The ball-and-ring test','');pop(B);
  const ring=mk('','left:450px;top:52px;width:26px;height:80px;border:7px solid #5a6478;border-radius:50%;z-index:4',null,B);
  mk('','left:458px;top:130px;width:10px;height:50px;background:#5a6478',null,B);
  const ball=mk('','left:110px;top:64px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9bec8 45%,#6b7280);z-index:3',null,B);
  const st=mk('','left:640px;top:70px;width:270px;font-size:20px;font-weight:800;text-align:center',``,B);
  say(`Here's a famous test. When the metal ball is <b>cold</b>, it fits through the ring.`);
  await an(ball,[{transform:'translateX(0)'},{transform:'translateX(420px)'}],{duration:1600,easing:'ease-in-out'});
  st.innerHTML='❄️ Cold: it fits! ✅';pop(st);await w(2600);
  await an(ball,[{transform:'translateX(420px)'},{transform:'translateX(0)'}],{duration:900});
  const f=mk('','left:118px;top:120px;font-size:40px;line-height:1','🔥',B);pop(f);loop(f,[{transform:'scale(1)'},{transform:'scale(1.25)'}],300,{direction:'alternate'});
  ball.style.transition='background 1s';ball.style.background='radial-gradient(circle at 35% 30%,#fff,#f59a4a 45%,#b8401c)';
  say(`Now we <b>heat</b> the ball. 🔥 Its particles vibrate more and spread out, so the ball <b>expands</b>…`);
  await an(ball,[{transform:'scale(1)'},{transform:'scale(1.3)'}],{duration:1200});
  f.remove();
  await an(ball,[{transform:'scale(1.3)'},{transform:'translateX(360px) scale(1.3)'}],{duration:1200,easing:'ease-in'});shake(ball);beep(160,.2,'square',.08);
  st.innerHTML='🔥 Hot: STUCK! ❌';pop(st);
  say(`…and now it's <b>stuck</b>! The hot ball is too big to fit. Cool it down and it <b>contracts</b> (shrinks) and fits again. ❄️`);
  await w(2400);
  ball.style.background='radial-gradient(circle at 35% 30%,#fff,#b9bec8 45%,#6b7280)';
  await an(ball,[{transform:'translateX(360px) scale(1.3)'},{transform:'translateX(360px) scale(1)'}],{duration:1000});
  await an(ball,[{transform:'translateX(360px)'},{transform:'translateX(420px)'}],{duration:600});
  st.innerHTML='❄️ Cooled: contracts and fits ✅';pop(st);
  say(`Heating made the ball <b>expand</b>, cooling made it <b>contract</b>. The particles never changed size: only the <b>gaps</b> did! ✅`);
  await w(3000);
}},

/* 4 */ {t:'Expansion in real life', run:async w=>{
  say(`Engineers have to plan for <b>expansion</b> every single day. Let's see three examples! 👷`);
  await w(2200);
  // railway
  const A=panel(13,8,303,384,'🚆 Railway tracks','Small <b>gaps</b> are left between rails. On hot days the rails <b>expand</b> into the gaps instead of bending.');pop(A);
  const sun=mk('','left:226px;top:44px;font-size:42px;line-height:1','☀️',A),snow=mk('','left:226px;top:44px;font-size:38px;line-height:1','❄️',A);
  [22,62,102,172,212,252].forEach(x=>mk('','left:'+x+'px;top:150px;width:18px;height:90px;background:#9a6a3a;border-radius:3px',null,A));
  const r1=mk('','left:6px;top:170px;width:130px;height:14px;background:#7d8796;border-radius:3px;transform-origin:left',null,A);
  const r2=mk('','left:150px;top:170px;width:140px;height:14px;background:#7d8796;border-radius:3px;transform-origin:right',null,A);
  const r3=mk('','left:6px;top:206px;width:130px;height:14px;background:#7d8796;border-radius:3px;transform-origin:left',null,A);
  const r4=mk('','left:150px;top:206px;width:140px;height:14px;background:#7d8796;border-radius:3px;transform-origin:right',null,A);
  const gl=mk('lbl','left:112px;top:110px','gap ↓',A);
  [r1,r3].forEach(r=>loop(r,[{transform:'scaleX(1)'},{transform:'scaleX(1.05)'}],2200,{direction:'alternate'}));
  [r2,r4].forEach(r=>loop(r,[{transform:'scaleX(1)'},{transform:'scaleX(1.045)'}],2200,{direction:'alternate'}));
  loop(sun,[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}],2200,{direction:'alternate'});
  loop(snow,[{opacity:1},{opacity:0}],2200,{direction:'alternate'});
  const tr=mk('','left:0;top:110px;font-size:36px;line-height:1','🚆',A);tr.animate([{transform:'translateX(-60px)'},{transform:'translateX(320px)'}],{duration:4200,iterations:Infinity,easing:'linear'});
  say(`🚆 <b>Railway tracks</b> have small <b>gaps</b> between the rails. In summer the rails expand and fill the gaps, instead of buckling.`);
  await w(4000);
  // bridge
  const Bp=panel(328,8,303,384,'🌉 Bridges','Bridges have <b>expansion joints</b>: gaps that let the road grow in summer and shrink in winter.');pop(Bp);
  mk('','left:20px;top:200px;width:30px;height:60px;background:#b9bec8',null,Bp);mk('','left:250px;top:200px;width:30px;height:60px;background:#b9bec8',null,Bp);
  const d1=mk('','left:10px;top:180px;width:136px;height:20px;background:#5d6573;border-radius:3px;transform-origin:left',null,Bp);
  const d2=mk('','left:156px;top:180px;width:136px;height:20px;background:#5d6573;border-radius:3px;transform-origin:right',null,Bp);
  [d1,d2].forEach(d=>loop(d,[{transform:'scaleX(1)'},{transform:'scaleX(1.03)'}],2200,{direction:'alternate'}));
  const jt=mk('lbl','left:140px;top:226px','↑ expansion joint',Bp);
  for(let i=0;i<3;i++){const wv=mk('','left:'+(30+i*90)+'px;top:270px;font-size:40px;line-height:1;color:#5d9cf5;font-weight:800','〰️',Bp);loop(wv,[{transform:'translateX(-6px)'},{transform:'translateX(6px)'}],900,{direction:'alternate'});}
  const car=mk('','left:0;top:148px;font-size:32px;line-height:1','🚗',Bp);car.animate([{transform:'translateX(320px) scaleX(1)'},{transform:'translateX(-50px) scaleX(1)'}],{duration:3600,iterations:Infinity,easing:'linear'});
  say(`🌉 <b>Bridges</b> have <b>expansion joints</b>: gaps that let the road get longer on hot days without cracking.`);
  await w(3800);
  // jar lid
  const C=panel(643,8,303,384,'🫙 A stuck jar lid','Stuck lid? Run it under <b>hot water</b>. The metal lid <b>expands</b> more than the glass, so it loosens.');pop(C);
  mk('','left:98px;top:150px;width:110px;height:110px;border:4px solid #8fb4d8;border-top:none;border-radius:0 0 22px 22px;background:linear-gradient(#fff 0,#ffd6a0 30%,#f2a64a)',null,C);
  const lid=mk('','left:92px;top:126px;width:122px;height:28px;border-radius:8px;background:repeating-linear-gradient(90deg,#9aa3b5 0 6px,#c3cad5 6px 12px);border:2px solid #6b7380',null,C);
  const tap=mk('','left:120px;top:36px;font-size:44px;line-height:1;transform:scaleX(-1)','🚰',C);
  say(`🫙 A jar lid is stuck! Run <b>hot water</b> over the <b>metal lid</b>…`);
  const drops=[];for(let i=0;i<4;i++){const d=mk('','left:'+(134+i*9)+'px;top:80px;width:8px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#e06a1b',null,C);
    drops.push(d.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(42px)',opacity:.4}],{duration:500,iterations:Infinity,delay:i*120}));}
  const steam=mk('','left:200px;top:96px;font-size:22px',`♨️`,C);loop(steam,[{opacity:0,transform:'translateY(0)'},{opacity:1,transform:'translateY(-14px)'}],900,{direction:'alternate'});
  await w(1600);
  await an(lid,[{transform:'scaleX(1)'},{transform:'scaleX(1.1)'}],{duration:900});
