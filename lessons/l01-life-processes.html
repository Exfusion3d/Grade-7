.lt{position:absolute;border-radius:18px;color:#fff;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.lt .L{font-size:58px;font-weight:900;line-height:1;margin-top:10px}
.lt .ic{font-size:30px;line-height:1;margin-top:4px}
.lt .wd{font-size:14px;font-weight:800;margin-top:6px;opacity:0}
.mt{position:absolute;display:flex;align-items:center;background:#fff;border:3px solid #e3e0f0;border-radius:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #e3e0f0;transition:background .2s,border-color .2s}
.mt.l{justify-content:center;font-size:19px}

.zp{cursor:pointer}

.row4{position:absolute;display:flex;align-items:center;gap:12px;background:#fff;border:3px solid #ece8f8;border-radius:16px;padding:0 12px;transition:background .3s,border-color .3s}
.row4 .e{font-size:44px;line-height:1}

.row4 .v{position:absolute;right:10px;font-size:26px}

<script>
/* Lesson 1 · Is it alive? The 7 life processes (Unit 4) */
const STAMP=(x,y,txt,par,extra)=>{const s=mk('stamp',`left:${x}px;top:${y}px;z-index:20;${extra||''}`,txt,par);
  an(s,[{transform:'scale(3) rotate(-20deg)',opacity:0},{transform:'rotate(-5deg)',opacity:1}],{duration:500,easing:'cubic-bezier(.5,1.6,.5,1)'});yay();return s;};
const fillGap=(el,word)=>{el.innerHTML=word;el.classList.add('filled');an(el,[{transform:'scale(1.6)'},{transform:'scale(1)'}],{duration:450});beep(820,.08);};
const GAP='<span class="gap">?</span>';
const PROC=[['M','Movement','🏃','#e06a1b'],['R','Respiration','⚡','#e04848'],['S','Sensitivity','👃','#6a45d8'],['G','Growth','🌱','#18a058'],['R','Reproduction','🐣','#d63f8c'],['E','Excretion','💨','#2c66cf'],['N','Nutrition','🍎','#c58a00']];
function bubble(par,x,y,txt,col){return mk('',`left:${x}px;top:${y}px;width:38px;height:38px;border-radius:50%;background:${col}22;border:2px solid ${col};color:${col};font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center`,txt,par);}

const SCENES=[
/* 1 */ {t:'Is it alive?',run:async w=>{
  const h=mk('','left:0;top:4px;width:960px;text-align:center;font-size:30px;font-weight:800;color:#4a2ea6','🤔 Is it alive?');pop(h);
  const B=[['🚗','A car','It moves!'],['🔥','A fire','It grows!'],['🐈','A cat','It moves, eats, grows…']];
  const P=B.map((b,i)=>{const p=mk('panel',`left:${40+i*300}px;top:50px;width:280px;height:160px`,'');pop(p,i*250);
    const e=mk('big-emoji','left:104px;top:16px;font-size:66px',b[0],p);
    mk('','left:0;top:106px;width:280px;text-align:center;font-size:18px;font-weight:800',`${b[1]}: <span style="color:#6a45d8">${b[2]}</span>`,p);return{p,e};});
  loop(P[0].e,[{transform:'translateX(-80px)'},{transform:'translateX(46px)'}],1400,{direction:'alternate'});
  loop(P[1].e,[{transform:'scale(.6)'},{transform:'scale(1.25)'}],1200,{direction:'alternate'});
  loop(P[2].e,[{transform:'translateY(0) rotate(-4deg)'},{transform:'translateY(-10px) rotate(4deg)'}],500,{direction:'alternate'});
  say(`Hi! I'm <b>Professor Atom</b> 👋 Today's big question is: how can we tell if something is <b>alive</b>?`);await w(2800);
  say(`A car <b>moves</b>. A fire <b>grows</b>. So… are they alive? 🤔 Let's find out!`);await w(3000);
  say(`Every living thing does <b>seven life processes</b>. Scientists remember them with a name: <b>MRS GREN</b>!`);
  const T=PROC.map((p,i)=>{const t=mk('lt',`left:${44+i*126}px;top:232px;width:116px;height:150px;background:${p[3]}`,`<div class="L">${p[0]}</div><div class="ic">${p[2]}</div><div class="wd">${p[1]}</div>`);
    an(t,[{transform:`translate(${(i-3)*90+(i%2?120:-120)}px,${i%2?320:-300}px) rotate(${i%2?200:-200}deg) scale(.3)`,opacity:0},{transform:'none',opacity:1}],{duration:900,delay:i*160,easing:'cubic-bezier(.3,1.3,.5,1)'});
    beep(400+i*70,.08,'triangle',.1,i*.16);return t;});
  await w(3200);
  say(`<b>M</b>ovement, <b>R</b>espiration, <b>S</b>ensitivity, <b>G</b>rowth, <b>R</b>eproduction, <b>E</b>xcretion and <b>N</b>utrition.`);
  for(let i=0;i<7;i++){const wd=T[i].querySelector('.wd');an(wd,[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:350});
    T[i].animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:400});beep(600+i*60,.06);await w(550);}
  await w(2200);
  [0,1].forEach(i=>{const x=mk('',`left:226px;top:8px;font-size:38px`,'❌',P[i].p);pop(x);P[i].e.style.filter='grayscale(1)';});
  const ok=mk('','left:226px;top:8px;font-size:38px','✅',P[2].p);pop(ok,300);yay();
  const info=mk('info','left:130px;top:400px;width:700px;padding:16px 20px;font-size:20px;line-height:1.5',
    'A car and a fire only do one or two of these.<br>🐈 The cat does <b style="color:#ffd84d">ALL SEVEN</b>, so it is alive!');pop(info);
  say(`A car and a fire only do one or two of these. The cat does <b>all seven</b>, so the cat is alive! ✅`);await w(3000);}},

/* 2 */ {t:'M · R · S',run:async w=>{
  say(`Let's meet the first three: <b>M</b>, <b>R</b> and <b>S</b>. Watch each one closely! 👀`);await w(2000);
  const X=[13,328,643];
  // Movement
  const p1=panel(X[0],8,303,376,'🏃 Movement',`Most living organisms can change the shape and position of their bodies. This is called ${GAP}.`);pop(p1);
  mk('','left:12px;top:132px;width:276px;height:4px;background:#e8dcc0;border-radius:2px',null,p1);
  const ch=mk('big-emoji','left:0;top:66px;font-size:62px','🐆',p1);
  ch.animate([{transform:'translateX(300px)'},{transform:'translateX(-80px)'}],{duration:2200,iterations:Infinity,easing:'linear'});
  const sun=mk('big-emoji','left:214px;top:160px;font-size:40px','☀️',p1);loop(sun,[{transform:'rotate(0)'},{transform:'rotate(40deg)'}],1500,{direction:'alternate'});
  const fl=mk('big-emoji','left:110px;top:170px;font-size:54px;transform-origin:50% 100%','🌻',p1);
  loop(fl,[{transform:'rotate(-14deg)'},{transform:'rotate(14deg)'}],2400,{direction:'alternate'});
  mk('','left:20px;top:240px;font-size:13px;font-weight:800;color:#18a058','plants move too, slowly!',p1);
  say(`<b>Movement</b> 🏃 A cheetah sprints. Even a sunflower slowly turns to face the Sun!`);await w(3200);
  fillGap(p1.querySelector('.gap'),'movement');
  say(`Changing the shape and position of your body is called <b>movement</b>.`);await w(2800);
  // Respiration
  const p2=panel(X[1],8,303,376,'⚡ Respiration',`All living organisms break down some of the food they eat, to provide them with energy. This is called ${GAP}.`);pop(p2);
  const cell=mk('','left:66px;top:50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#eaffef,#bfeccd);border:4px solid #18a058',null,p2);
  mk('','left:126px;top:110px;width:48px;height:48px;border-radius:50%;background:#7fd19c',null,p2);
  mk('','left:96px;top:226px;font-size:13px;font-weight:800;color:#18a058','a living cell',p2);
  for(let i=0;i<4;i++){const g=mk('',`left:6px;top:${100+(i%2)*40}px;font-size:22px`,'🍞',p2);
    g.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate(120px,0) scale(.5)',opacity:1,offset:.7},{transform:'translate(130px,0) scale(0)',opacity:0}],{duration:2000,iterations:Infinity,delay:i*500});}
  const fire=mk('big-emoji','left:132px;top:104px;font-size:38px','🔥',p2);loop(fire,[{transform:'scale(.8)'},{transform:'scale(1.25)'}],300,{direction:'alternate'});
  for(let i=0;i<4;i++){const z=mk('',`left:160px;top:120px;font-size:24px`,'⚡',p2);
    z.animate([{transform:'translate(0,0) scale(.3)',opacity:0},{opacity:1,offset:.3},{transform:`translate(110px,${(i-1.5)*40}px) scale(1.2)`,opacity:0}],{duration:1600,iterations:Infinity,delay:i*400});}
  say(`<b>Respiration</b> happens inside every cell. Food is broken down to <b>release energy</b> ⚡ for everything else.`);await w(3400);
  fillGap(p2.querySelector('.gap'),'respiration');
  say(`Breaking down food to release energy is called <b>respiration</b>.`);await w(2600);
  // Sensitivity
  const p3=panel(X[2],8,303,376,'👃 Sensitivity',`Polar bears can ${GAP} things in their environment. With their nose they can sense the smell of meat.`);pop(p3);
  mk('','left:0;top:190px;width:303px;height:60px;background:linear-gradient(#eef6ff,#d9ebff)',null,p3);
  const bear=mk('big-emoji','left:14px;top:118px;font-size:76px','🐻‍❄️',p3);
  const meat=mk('big-emoji','left:226px;top:150px;font-size:44px','🍖',p3);loop(meat,[{transform:'rotate(-8deg)'},{transform:'rotate(8deg)'}],700,{direction:'alternate'});
  for(let i=0;i<3;i++){const s=mk('',`left:200px;top:${130+i*16}px;width:60px;height:20px`,`<svg width="60" height="20"><path d="M2 10 Q12 0 22 10 T42 10 T58 10" fill="none" stroke="#9a7a55" stroke-width="3" stroke-linecap="round"/></svg>`,p3);
    s.animate([{transform:'translateX(0)',opacity:0},{opacity:.9,offset:.2},{transform:'translateX(-110px)',opacity:0}],{duration:1800,iterations:Infinity,delay:i*600});}
  const sn=mk('','left:90px;top:84px;font-size:18px;font-weight:800;color:#6a45d8','sniff… sniff!',p3);
  loop(sn,[{opacity:.2,transform:'scale(.9)'},{opacity:1,transform:'scale(1.1)'}],600,{direction:'alternate'});
  loop(bear,[{transform:'rotate(0)'},{transform:'rotate(-6deg) translateY(-4px)'}],600,{direction:'alternate'});
  say(`<b>Sensitivity</b> means detecting changes around you. This polar bear smells meat from far away! 🐻‍❄️`);await w(3400);
  fillGap(p3.querySelector('.gap'),'sense');
  say(`Polar bears can <b>sense</b> things in their environment. With their nose they sense the smell of meat.`);await w(3200);
  const warn=mk('','left:13px;top:396px;width:933px;height:116px;background:#fff8e6;border:3px solid #f2c200;border-radius:20px;padding:12px 18px;font-size:18px;font-weight:700;line-height:1.45',
    `⚠️ <b style="color:#c26a00">Careful!</b> Respiration is <b>NOT</b> the same as breathing.<br>🫁 <b>Breathing</b> moves air in and out of the lungs.<br>⚡ <b>Respiration</b> releases <b>energy</b> from food, inside <b>every cell</b>.`);pop(warn);
  STAMP(716,430,'resp. ≠ breathing',null,'font-size:20px');
  say(`⚠️ Careful! Respiration is <b>not</b> breathing. Breathing moves air in and out. <b>Respiration releases energy</b> from food in every cell.`);await w(3000);}},

/* 3 */ {t:'G · R · E · N',run:async w=>{
  say(`Now the last four letters: <b>G</b>, <b>R</b>, <b>E</b> and <b>N</b>. Four exam answers are hiding here! 🎯`);await w(2200);
  // When a panel's exam answer arrives, its picture fades and the worksheet card takes that space (title and sentence stay).
  const C3=(P,n,q,a)=>{[...P.children].forEach(c=>{if(c.tagName!=='H4'&&!c.classList.contains('cap'))an(c,[{opacity:1},{opacity:0}],{duration:300});});
    return wsCard('left:9px;top:40px;width:436px',{src:'Worksheet · Unit 4 · MCQ '+n,q,a},P);};
  // Growth
  const pG=panel(13,8,460,248,'🌱 Growth',`Young plants and animals get bigger. This is called ${GAP}: a <b>permanent</b> increase in size and mass.`);pop(pG);
  mk('','left:14px;top:162px;width:210px;height:4px;background:#b98b5a;border-radius:2px',null,pG);
  const G=[['🌱',26,20],['🪴',40,84],['🌳',62,140]];
  G.forEach(([e,s,x],i)=>{const g=mk('big-emoji',`left:${x}px;top:${164-s*1.15}px;font-size:${s}px`,e,pG);pop(g,i*600);loop(g,[{transform:'scale(1)'},{transform:'scale(1.06)'}],900,{direction:'alternate',delay:i*200});});
  const ar=mk('','left:18px;top:44px;font-size:13px;font-weight:800;color:#18a058','size ↑ &nbsp; mass ↑',pG);pop(ar,1400);
  say(`<b>Growth</b> 🌱 A seed grows into a giant tree. It gets bigger <b>and</b> heavier, and it stays that way.`);await w(3200);
  fillGap(pG.querySelector('.gap'),'growth');C3(pG,14,'What does "growth" mean in biology?','✔ B) A permanent increase in size and mass');
  say(`In biology, growth is <b>a permanent increase in size and mass</b>. That's answer <b>B</b> for MCQ 14.`);await w(3400);
  // Reproduction
  const pR=panel(487,8,460,248,'🐣 Reproduction',`Living organisms ${GAP} to make more of the same kind of organism.`);pop(pR);
  const hen=mk('big-emoji','left:18px;top:62px;font-size:70px','🐔',pR);loop(hen,[{transform:'rotate(-6deg)'},{transform:'rotate(6deg)'}],500,{direction:'alternate'});
  const egg=mk('big-emoji','left:122px;top:100px;font-size:46px','🥚',pR);
  const wob=loop(egg,[{transform:'rotate(-14deg)'},{transform:'rotate(14deg)'}],180,{direction:'alternate'});
  say(`<b>Reproduction</b> 🐣 Living things make <b>young ones</b>, more of the same kind. Watch the egg…`);await w(2400);
  wob.cancel();egg.textContent='🐣';pop(egg);beep(1000,.1);
  const ck=mk('big-emoji','left:176px;top:110px;font-size:34px','🐥',pR);pop(ck,300);loop(ck,[{transform:'translateY(0)'},{transform:'translateY(-8px)'}],350,{direction:'alternate'});
  await w(900);fillGap(pR.querySelector('.gap'),'reproduce');C3(pR,1,'Living things produce young ones by __________.','✔ B) Reproduction');
  say(`Living things produce young ones by <b>reproduction</b>. Answer <b>B</b> for MCQ 1.`);await w(3000);
  // Excretion
  const pE=panel(13,264,460,248,'💨 Excretion',`All living organisms ${GAP} waste substances. Animals excrete ${GAP} when they breathe out.`);pop(pE);
  const face=mk('big-emoji','left:16px;top:66px;font-size:70px','😮‍💨',pE);loop(face,[{transform:'scale(1)'},{transform:'scale(1.06)'}],800,{direction:'alternate'});
  for(let i=0;i<4;i++){const b=bubble(pE,86,96,'CO₂','#2c66cf');b.animate([{transform:'translate(0,0) scale(.4)',opacity:0},{opacity:1,offset:.2},{transform:`translate(130px,${(i%2?-1:1)*30}px) scale(1)`,opacity:0}],{duration:2400,iterations:Infinity,delay:i*600});}
  say(`<b>Excretion</b> 💨 means getting rid of <b>waste</b> your body has made. Every breath out carries away <b>carbon dioxide</b>.`);await w(3400);
  const gE=pE.querySelectorAll('.gap');fillGap(gE[0],'excrete');await w(500);fillGap(gE[1],'carbon dioxide');
  C3(pE,9,'What is the term for getting rid of waste products that the body has made?','✔ B) Excretion');
  say(`Getting rid of waste the body has made is <b>excretion</b>. Answer <b>B</b> for MCQ 9. Careful: digestion is a different thing!`);await w(3400);
  // Nutrition
  const pN=panel(487,264,460,248,'🍎 Nutrition',`Another word for taking in nutrition is ${GAP}. Food gives energy and materials for growth.`);pop(pN);
  const gr=[];for(let i=0;i<3;i++){const g=mk('big-emoji',`left:${14+i*30}px;top:122px;font-size:30px;transform-origin:50% 100%`,'🌿',pN);gr.push(g);
    g.animate([{transform:'scaleY(1)'},{transform:'scaleY(.2)',offset:.6},{transform:'scaleY(1)'}],{duration:2400,iterations:Infinity,delay:i*300});}
  const z=mk('big-emoji','left:110px;top:66px;font-size:76px;transform-origin:20% 80%','🦓',pN);loop(z,[{transform:'rotate(0)'},{transform:'rotate(-10deg) translateY(4px)'}],400,{direction:'alternate'});
  const mu=mk('','left:20px;top:48px;font-size:15px;font-weight:800;color:#c58a00','munch munch!',pN);loop(mu,[{opacity:.2},{opacity:1}],400,{direction:'alternate'});
  say(`<b>Nutrition</b> 🍎 means taking in food for <b>energy and growth</b>. This zebra is grazing on grass!`);await w(3200);
  fillGap(pN.querySelector('.gap'),'feeding');C3(pN,8,'Which process involves taking in food for energy and growth?','✔ B) Nutrition');
  say(`Another word for nutrition is <b>feeding</b>. Taking in food for energy and growth is <b>nutrition</b>: answer <b>B</b> for MCQ 8.`);await w(3400);}},

/* 4 */ {t:'Plants make their own food',run:async w=>{
  const L=panel(13,8,600,504,'🌿 Photosynthesis: how plants make food','Plants use <b>sunlight</b>, <b>water</b> and <b>carbon dioxide</b> to make their own food (sugar). Oxygen is given out.');pop(L);
  // stem + roots + leaf
  mk('','left:0;top:0;width:600px;height:420px',`<svg width="600" height="420">
    <rect x="0" y="352" width="600" height="68" fill="#e9d6b8"/>
    <path d="M300 352 C300 300 300 280 300 240" stroke="#3f9a52" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M300 352 q-30 30 -70 40 M300 352 q10 40 0 60 M300 352 q40 25 80 30" stroke="#a0703c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M300 250 C200 240 170 150 210 90 C290 100 330 180 300 250 Z" fill="#4caf63" stroke="#2f7d43" stroke-width="4"/>
    <path d="M300 250 C270 190 240 140 214 96" stroke="#2f7d43" stroke-width="3" fill="none"/></svg>`,L);
  const sun=mk('big-emoji','left:26px;top:44px;font-size:74px','☀️',L);loop(sun,[{transform:'rotate(0) scale(1)'},{transform:'rotate(30deg) scale(1.1)'}],1400,{direction:'alternate'});
  mk('','left:20px;top:126px;font-size:15px;font-weight:800;color:#c58a00','sunlight',L);
  say(`Plants can't go shopping for food! 🌿 So how do they eat? They <b>make their own food</b>. This is called <b>photosynthesis</b>.`);await w(3200);
  for(let i=0;i<5;i++){const r=mk('',`left:96px;top:${86+i*14}px;width:130px;height:5px;border-radius:3px;background:linear-gradient(90deg,#ffd84d,#ffb300);transform-origin:0 50%;transform:rotate(${8+i*4}deg)`,null,L);
    r.animate([{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 0 100%)'}],{duration:1400,iterations:Infinity,delay:i*200});}
  say(`First, the leaf traps <b>sunlight</b> ☀️ That gives the energy to make food.`);await w(2600);
  const wl=mk('','left:322px;top:372px;font-size:15px;font-weight:800;color:#2c66cf','💧 water (from the roots)',L);const drops=[];
  for(let i=0;i<4;i++){const d=drops[drops.length]=mk('big-emoji','left:291px;top:340px;font-size:20px','💧',L);
    d.animate([{transform:'translateY(0)',opacity:0},{opacity:1,offset:.15},{transform:'translateY(-150px)',opacity:1,offset:.85},{transform:'translateY(-160px)',opacity:0}],{duration:2400,iterations:Infinity,delay:i*600});}
  say(`Next, <b>water</b> 💧 travels up from the roots, through the stem, to the leaf.`);await w(2600);
  mk('','left:420px;top:92px;font-size:15px;font-weight:800;color:#626a80;width:160px;text-align:center','carbon dioxide (from the air)',L);
  for(let i=0;i<4;i++){const b=bubble(L,520,140+(i%2)*40,'CO₂','#626a80');
    b.animate([{transform:'translate(0,0)',opacity:0},{opacity:1,offset:.2},{transform:'translate(-230px,20px) scale(.5)',opacity:0}],{duration:2400,iterations:Infinity,delay:i*600});}
  say(`And <b>carbon dioxide</b> from the air goes in through tiny holes in the leaf.`);await w(2600);
  const food=mk('','left:150px;top:250px;width:120px;height:44px;border-radius:14px;background:#fff1c9;border:3px solid #e0a800;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:4px','🍬 food!',L);pop(food);
  loop(food,[{transform:'scale(1)'},{transform:'scale(1.1)'}],500,{direction:'alternate'});
