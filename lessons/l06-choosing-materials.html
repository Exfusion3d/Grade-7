<script>
/* Lesson 6 · Choosing materials: the property toolkit (Unit 5) */
async function wipe(w){const k=[...stage.children];k.forEach(e=>an(e,[{opacity:1},{opacity:0}],{duration:350}));await w(400);k.forEach(e=>e.remove());}
/* a steel nail drawn with CSS: outer box moves, inner box is rotated */
function nail(par,x,y,len,rot){const o=mk('',`left:${x}px;top:${y}px;width:1px;height:1px;z-index:4`,null,par);
  mk('',`left:0;top:-11px;width:${len}px;height:22px;transform:rotate(${rot}deg);transform-origin:${len}px 11px;margin-left:${-len}px`,
   `<div style="position:absolute;left:0;top:0;width:7px;height:22px;border-radius:2px;background:#5d6573"></div>`+
   `<div style="position:absolute;left:6px;top:7px;width:${len-24}px;height:8px;background:linear-gradient(#eef1f5,#8a94a3)"></div>`+
   `<div style="position:absolute;left:${len-18}px;top:7px;width:18px;height:8px;background:linear-gradient(#eef1f5,#8a94a3);clip-path:polygon(0 0,100% 50%,0 100%)"></div>`,o);
  return o;}
const label=(par,css,html)=>mk('',`font-weight:800;font-size:15px;${css}`,html,par);

Lesson.start({
  id:'l06', num:6, unit:5, emoji:'🧰', title:'Choosing materials: the property toolkit',
  intro:`Hi! I'm <b>Professor Atom</b> ⚛️ Today you become a <b>materials engineer</b>! Press <b>Start</b>!`,
  scenes:[

/* 1 */ {t:'The property toolkit',run:async w=>{
  const eng=mk('big-emoji','left:40px;top:340px;font-size:96px','👷');pop(eng);
  const box=mk('big-emoji','left:390px;top:330px;font-size:130px','🧰');pop(box,200);
  say(`Engineers never pick a material at random! 👷 First they open their <b>property toolkit</b> and test it.`);
  await w(2400);
  box.animate([{transform:'rotate(0)'},{transform:'rotate(-8deg)'},{transform:'rotate(8deg)'},{transform:'rotate(0)'}],{duration:400,iterations:2});
  const T=[['💎','Hardness','Can it be scratched?','#2c66cf'],['💪','Strength','How much force before it breaks?','#e06a1b'],['⚖️','Density','How heavy for its size?','#6a45d8'],['💥','Brittle?','Does it shatter when hit?','#e04848'],
    ['🪟','Transparent?','Does light pass through?','#17935b'],['🔥','Thermal insulator?','Does heat get through?','#d66a0a'],['⚡','Electrical insulator?','Does electricity get through?','#2c66cf']];
  say(`Each property is a <b>tool</b> for testing a material. Out they come! 🧰`);
  for(let i=0;i<T.length;i++){const x=i<4?13+i*237:131+(i-4)*237,y=i<4?10:124;
    const c=mk('card',`left:${x}px;top:${y}px;width:222px;height:104px;border-color:${T[i][3]};display:flex;gap:8px;align-items:center;padding:8px 10px`,
      `<span class="ic" style="font-size:34px;line-height:1">${T[i][0]}</span><div><h4 style="color:${T[i][3]};font-size:16px">${T[i][1]}</h4><p style="font-size:13.5px">${T[i][2]}</p></div>`);
    an(c,[{transform:`translate(${455-(x+111)}px,${395-(y+52)}px) scale(.15)`,opacity:0},{transform:'none',opacity:1}],{duration:700,easing:'cubic-bezier(.3,1.3,.5,1)'});
    loop(c.querySelector('.ic'),[{transform:'rotate(-10deg)'},{transform:'rotate(10deg)'}],700+i*90,{direction:'alternate'});
    beep(450+i*70,.08);await w(420);}
  await w(1600);
  const bub=mk('','left:150px;top:252px;width:230px;height:66px;background:#fff;border:3px solid #6a45d8;border-radius:18px;font-size:16px;font-weight:800;color:#4a2ea6;display:flex;align-items:center;justify-content:center;text-align:center','Which material for…');pop(bub);
  const jobs=['🍳 a pan handle?','✈️ an aeroplane?','🪟 a window?','⛏️ a drill tip?'];let j=0;
  const tick=()=>{if(!bub.isConnected)return;bub.innerHTML=`Which material for<br>${jobs[j++%4]}`;bub.animate([{transform:'scale(.85)'},{transform:'scale(1)'}],{duration:300});setTimeout(tick,1500);};tick();
  mk('','left:600px;top:244px;font-size:16px;font-weight:800;color:#8a78cc;letter-spacing:.08em','OUR MATERIALS');
  const M=['🪵 Wood','🔩 Steel','🪟 Glass','🧴 Plastic','💎 Diamond','🥫 Aluminium','⬛ Lead','🧵 Cotton'];
  say(`Every job needs the <b>right properties</b>. A pan handle, an aeroplane and a window all need very different materials!`);
  M.forEach((m,i)=>{const c=mk('',`left:${600+(i%2)*176}px;top:${272+Math.floor(i/2)*58}px;width:166px;height:44px;border-radius:22px;background:#fff;border:3px solid #cfc4f5;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #ddd5fa`,m);pop(c,i*120);
    loop(c,[{transform:'translateY(0)'},{transform:'translateY(-4px)'}],900+i*70,{direction:'alternate',delay:600});});
  await w(4200);
  say(`Let's try out each tool, one by one. At the end, <b>you</b> will be the engineer! 🎯`);}},

/* 2 */ {t:'Scratch and smash',run:async w=>{
  say(`Tool number one: <b>hardness</b> 💎. We test it with a <b>scratch test</b>, using a steel nail.`);
  const P1=panel(13,8,460,300,'🪵 Scratch test: soft wood','The nail leaves a deep scratch. Wood is quite <b>soft</b>.');pop(P1);
  mk('','left:50px;top:70px;width:360px;height:130px;border-radius:12px;background:repeating-linear-gradient(90deg,#dca46a 0 18px,#c98d52 18px 30px,#e2b07a 30px 46px);box-shadow:0 7px 0 #a8743f',null,P1);
  const sv=mk('','left:50px;top:70px;width:360px;height:130px',`<svg width="360" height="130"><path d="M30 70 L80 64 L130 72 L190 62 L250 70 L320 64" fill="none" stroke="#6b3d14" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>`,P1);
  const n1=nail(P1,80,134,110,50);
  await w(1800);
  an(sv.querySelector('path'),[{strokeDashoffset:100},{strokeDashoffset:0}],{duration:1600,easing:'linear'});
  for(let i=0;i<6;i++)beep(180+Math.random()*60,.06,'sawtooth',.03,i*.25);
  await an(n1,[{transform:'translate(0,0)'},{transform:'translate(290px,-4px)'}],{duration:1600,easing:'linear'});
  const s1=label(P1,'left:60px;top:214px;color:#a14c00;font-size:18px','SCRATCH! ✘ soft');pop(s1);
  say(`On soft <b>wood</b>, the nail digs in and leaves a deep scratch. Now let's try a <b>diamond</b>…`);
  await w(2200);
  const P2=panel(487,8,460,300,'💎 Scratch test: diamond','The nail just slides off. No mark! Diamond is the <b>hardest</b> natural material.');pop(P2);
  const dia=mk('big-emoji','left:150px;top:62px;font-size:130px','💎',P2);loop(dia,[{filter:'drop-shadow(0 0 0 #9fd8ff)'},{filter:'drop-shadow(0 0 14px #9fd8ff)'}],900,{direction:'alternate'});
  const n2=nail(P2,140,134,110,50);
  await w(600);
  const sp=label(P2,'left:150px;top:118px;font-size:24px','✨');
  loop(sp,[{opacity:0,transform:'scale(.5)'},{opacity:1,transform:'scale(1.3)'}],200,{direction:'alternate'});
  an(sp,[{transform:'translateX(0)'},{transform:'translateX(170px)'}],{duration:1400,easing:'linear'});
  for(let i=0;i<6;i++)beep(1600+Math.random()*400,.03,'square',.03,i*.22);
  await an(n2,[{transform:'translate(0,0)'},{transform:'translate(170px,0)'}],{duration:1400,easing:'linear'});
  sp.remove();
  const s2=label(P2,'left:60px;top:214px;color:#17935b;font-size:18px','No mark! ✔ very hard 😎');pop(s2);
  say(`On <b>diamond</b>, the nail just slides off. Not a mark! Diamond is the <b>hardest</b> natural material.`);
  await w(3200);
  const L=mk('','left:13px;top:318px;width:933px;height:112px;background:#fff;border:3px solid #ece8f8;border-radius:20px');pop(L);
  mk('','left:16px;top:8px;font-size:17px;font-weight:800','<b style="color:#2c66cf">Hardness</b> = how well a material resists being <b>scratched</b> or <b>dented</b>.',L);
  const bar=mk('','left:20px;top:48px;width:888px;height:50px;border-radius:25px;background:linear-gradient(90deg,#fff3c4,#cfe3ff)',null,L);
  mk('','left:8px;top:14px;font-size:13px;font-weight:800;color:#8a6d00','◀ SOFTER',bar);mk('','left:808px;top:14px;font-size:13px;font-weight:800;color:#1c4a9c','HARDER ▶',bar);
  const H=['🧈 Butter','🪵 Wood','🟠 Copper','🪟 Glass','💎 Diamond'];
  say(`Here's a <b>hardness ladder</b>. A harder material can scratch a softer one, but not the other way round.`);
  for(let i=0;i<H.length;i++){const c=mk('tag',`left:${92+i*142}px;top:9px;background:#fff;border:2px solid #d9d2f5;font-size:16px`,H[i],bar);pop(c);beep(400+i*90,.07);await w(350);}
  await w(2600);
  an(P1,[{opacity:1},{opacity:0}],{duration:300});
  wsCard('left:13px;top:8px;width:460px',{src:'Worksheet · Unit 5 · MCQ 10',q:'What property measures how well a material resists being scratched or dented?',a:'✔ A) Hardness'});
  say(`✅ Exam question 10: the property that measures how well a material resists being <b>scratched or dented</b> is <b>A) Hardness</b>.`);
  await w(4200);
  await wipe(w);
  /* ---- smash test ---- */
  say(`Now the <b>smash test</b> 🔨. What happens when we hit glass and steel with a hammer?`);
  const P3=panel(13,8,460,300,'🪟 Hit glass with a hammer…','Glass <b>shatters</b> into sharp pieces. It is <b>brittle</b>.');pop(P3);
  const shards=[];
  for(let r=0;r<3;r++)for(let c=0;c<4;c++){const s=mk('',`left:${90+c*70}px;top:${60+r*48}px;width:70px;height:48px;background:rgba(160,210,255,.55);border:1px solid #fff;box-shadow:inset 0 0 8px rgba(255,255,255,.9)`,null,P3);shards.push(s);}
  const P4=panel(487,8,460,300,'🔩 Hit steel with a hammer…','Steel <b>bends</b> and dents, but it does <b>not</b> shatter.');pop(P4);
  mk('','left:70px;top:150px;width:40px;height:60px;background:#7d8796;border-radius:4px',null,P4);mk('','left:350px;top:150px;width:40px;height:60px;background:#7d8796;border-radius:4px',null,P4);
  const bl=mk('','left:80px;top:126px;width:150px;height:24px;background:linear-gradient(#e2e6ec,#8a94a3);border-radius:4px 0 0 4px;transform-origin:100% 50%',null,P4);
  const br=mk('','left:230px;top:126px;width:150px;height:24px;background:linear-gradient(#e2e6ec,#8a94a3);border-radius:0 4px 4px 0;transform-origin:0 50%',null,P4);
  const hm1=mk('big-emoji','left:250px;top:20px;font-size:62px;transform-origin:80% 80%','🔨',P3);
  const hm2=mk('big-emoji','left:200px;top:22px;font-size:62px;transform-origin:80% 80%','🔨',P4);
  await w(1800);
  an(hm1,[{transform:'rotate(-40deg)'},{transform:'rotate(15deg) translateY(30px)'}],{duration:350,easing:'ease-in'});await w(350);
  beep(1800,.05,'square',.08);beep(1300,.12,'sawtooth',.06,.03);
  shards.forEach((s,i)=>{const dx=(i%4-1.5)*60+(Math.random()-.5)*40,dy=(2-Math.floor(i/4))*22+18+Math.random()*20,rt=(Math.random()-.5)*300;
    an(s,[{transform:'none'},{transform:`translate(${dx}px,${dy*.4-40}px) rotate(${rt/2}deg)`,offset:.4},{transform:`translate(${dx*1.3}px,${dy}px) rotate(${rt}deg)`,opacity:.8}],{duration:900,easing:'ease-in'});});
  const k1=label(P3,'left:30px;top:44px;color:#e04848;font-size:22px','SMASH! 💥');pop(k1);
  say(`💥 The glass <b>shatters</b> into sharp pieces. Glass is <b>brittle</b>: it breaks easily when it is struck.`);
  await w(3000);
  an(hm2,[{transform:'rotate(-40deg)'},{transform:'rotate(15deg) translateY(36px)'}],{duration:350,easing:'ease-in'});await w(350);
  beep(300,.15,'triangle',.12);
  an(bl,[{transform:'none'},{transform:'translateY(16px) rotate(9deg)'}],{duration:300});an(br,[{transform:'none'},{transform:'translateY(16px) rotate(-9deg)'}],{duration:300});
  const k2=label(P4,'left:30px;top:44px;color:#2c66cf;font-size:22px','BONK! 🔩');pop(k2);
  say(`The steel just <b>bends</b> and dents. It does <b>not</b> shatter, so steel is <b>not brittle</b>.`);
  await w(3000);
  const WD=mk('','left:13px;top:318px;width:933px;height:120px;background:#fff;border:3px solid #ece8f8;border-radius:20px');pop(WD);
  const D=[['💥 Brittle','breaks or shatters easily when struck',1],['🌿 Flexible','bends easily without breaking',0],['🔨 Malleable','can be hammered into a new shape',0],['〰️ Ductile','can be pulled into thin wires',0]];
  say(`Don't mix up these four words! Only one means <b>shatters easily</b>…`);
  D.forEach((d,i)=>{const e=mk('',`left:${12+(i%2)*458}px;top:${10+Math.floor(i/2)*52}px;width:446px;height:44px;border-radius:12px;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;background:#f6f4fd`,`<b style="min-width:112px">${d[0]}</b> = ${d[1]}`,WD);pop(e,i*150);
    if(d[2])setTimeout(()=>{e.style.background='#e3f7ec';e.style.boxShadow='0 0 0 3px #18a058';},900);});
  await w(2600);
  an(P4,[{opacity:1},{opacity:0}],{duration:300});
  wsCard('left:487px;top:8px;width:460px',{src:'Worksheet · Unit 5 · MCQ 5',q:'Which term describes a material that breaks or shatters easily when struck?',a:'✔ B) Brittle'});
  say(`✅ Exam question 5: a material that breaks or shatters easily when struck is <b>B) Brittle</b>. Watch out: glass is <b>hard</b> to scratch, but still brittle!`);}},

/* 3 */ {t:'Strength: the pull test',run:async w=>{
  say(`Tool number two: <b>strength</b> 💪. Let's clamp two materials into a pulling machine and pull harder and harder!`);
  const P=panel(13,8,933,250,'💪 The pull test','');pop(P);
  const lanes=[{y:70,n:'🧵 Cotton thread',breakAt:20},{y:160,n:'⛓️ Steel cable',breakAt:Infinity}];
  lanes.forEach(L=>{label(P,`left:30px;top:${L.y-30}px;font-size:16px`,L.n);
    mk('',`left:20px;top:${L.y-10}px;width:44px;height:56px;background:#5d6573;border-radius:8px`,null,P);
    L.left=mk('',`left:64px;top:${L.y+(L.breakAt<99?16:11)}px;width:280px;height:${L.breakAt<99?4:14}px;transform-origin:0 50%;background:${L.breakAt<99?'#e8dcc0':'repeating-linear-gradient(60deg,#c3cad5 0 6px,#8a94a3 6px 10px)'}`,null,P);
    L.right=mk('',`left:344px;top:${L.y+(L.breakAt<99?16:11)}px;width:280px;height:${L.breakAt<99?4:14}px;transform-origin:100% 50%;background:${L.breakAt<99?'#e8dcc0':'repeating-linear-gradient(60deg,#c3cad5 0 6px,#8a94a3 6px 10px)'}`,null,P);
    L.hook=mk('',`left:624px;top:${L.y-10}px;width:44px;height:56px;background:#e06a1b;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff`,'➡',P);
    L.meter=mk('',`left:700px;top:${L.y-6}px;width:200px;height:48px;background:#1f2433;color:#7dffa1;border-radius:10px;font-family:Menlo,monospace;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center`,'0 N',P);});
  await w(2400);
  say(`Pulling… The <b>force</b> is measured in <b>newtons (N)</b>. Watch the meters climb!`);
  let snapped=false;
  for(let k=0;k<=40;k++){const F=k?Math.round(Math.pow(1.31,k)):0;
    lanes.forEach(L=>{if(L.breakAt<99&&snapped)return;const f=Math.min(F,L.breakAt);L.meter.textContent=f.toLocaleString('en-GB')+' N';
      L.hook.style.transform=L.right.style.transform=`translateX(${Math.min(8,k/5)}px)`;});
    if(!snapped&&F>=20){snapped=true;const L=lanes[0];beep(1200,.08,'square',.08);
      an(L.left,[{transform:'none'},{transform:'rotate(22deg) scaleX(.4)'}],{duration:500,easing:'cubic-bezier(.5,1.6,.5,1)'});
      an(L.right,[{transform:'translateX(3px)'},{transform:'translateX(8px) rotate(-22deg) scaleX(.4)'}],{duration:500,easing:'cubic-bezier(.5,1.6,.5,1)'});
      L.meter.style.color='#ff7b7b';const sn=label(P,'left:300px;top:40px;color:#e04848;font-size:22px','SNAP! at 20 N');pop(sn);
      say(`<b>SNAP!</b> 🧵 The cotton thread breaks at only about <b>20 newtons</b>. It is <b>weak</b>.`);await w(2600);}
    else{beep(300+k*20,.03,'sine',.03);await w(110);}}
  const ok=label(P,'left:300px;top:130px;color:#17935b;font-size:22px','Still holding! 💪');pop(ok);
  say(`The steel cable is still holding at <b>50,000 newtons</b>! Steel is very <b>strong</b>.`);
  await w(3000);
  const B1=panel(13,268,460,176,'🏗️ Strong cable → safe crane','');pop(B1);
  mk('','left:40px;top:44px;width:12px;height:124px;background:#f2c200',null,B1);mk('','left:40px;top:44px;width:300px;height:12px;background:#f2c200',null,B1);
  const hang=mk('','left:300px;top:56px;width:60px;height:110px',`<div style="position:absolute;left:28px;top:0;width:4px;height:60px;background:#5d6573"></div><div style="position:absolute;left:4px;top:56px;font-size:46px;line-height:1">🚗</div>`,B1);
  loop(hang,[{transform:'translateY(4px)'},{transform:'translateY(-6px)'}],1300,{direction:'alternate'});
  label(B1,'left:120px;top:96px;font-size:14px;color:#3a3f52','steel cable lifts<br>a 1,500 kg car');
  const B2=panel(487,268,460,176,'👇 Pushing counts too','');pop(B2);
  const chalk=mk('','left:110px;top:110px;width:26px;height:56px;background:#f4f1ea;border:2px solid #cfc8b8;border-radius:4px',null,B2);
  mk('','left:320px;top:110px;width:26px;height:56px;background:linear-gradient(90deg,#8a94a3,#e2e6ec,#8a94a3);border-radius:4px',null,B2);
  const wa=mk('','left:83px;top:40px;width:80px;height:40px;background:#3b4252;color:#fff;border-radius:6px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center','PUSH',B2);
  const wb=mk('','left:293px;top:40px;width:80px;height:40px;background:#3b4252;color:#fff;border-radius:6px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center','PUSH',B2);
  label(B2,'left:180px;top:60px;font-size:13px;color:#3a3f52;text-align:center','chalk<br>vs<br>steel rod');
  say(`Strength isn't just about pulling. <b>Pushing</b> counts too! Let's squash a stick of chalk and a steel rod.`);
  await w(2200);
  an(wa,[{transform:'none'},{transform:'translateY(54px)'}],{duration:600,easing:'ease-in'});await an(wb,[{transform:'none'},{transform:'translateY(30px)'}],{duration:600,easing:'ease-in'});
  beep(250,.2,'sawtooth',.05);chalk.style.transformOrigin='50% 100%';an(chalk,[{transform:'none'},{transform:'scaleY(.12)',opacity:.6}],{duration:300});
  [0,1,2,3].forEach(i=>{const c=mk('',`left:${112+i*7}px;top:150px;width:9px;height:9px;background:#f4f1ea;border:1px solid #cfc8b8`,null,B2);an(c,[{transform:'none'},{transform:`translate(${(i-1.5)*26}px,8px) rotate(${i*60}deg)`}],{duration:500});});
  const cr=label(B2,'left:40px;top:146px;color:#e04848','crumbles!');pop(cr);const hd=label(B2,'left:356px;top:146px;color:#17935b','holds ✔');pop(hd);
  say(`The chalk <b>crumbles</b>, but the steel rod holds. Strong materials can take a big <b>pull</b> or <b>push</b> without breaking.`);
  await w(3400);
  an(B1,[{opacity:1},{opacity:0}],{duration:300});
  wsCard('left:13px;top:268px;width:460px',{src:'Worksheet · Unit 5 · MCQ 11',q:'What does "strength" mean in material science?',a:'✔ B) How much pulling or pushing force it can take before breaking'});
  say(`✅ Exam question 11: strength means <b>B) how much pulling or pushing force a material can take before breaking</b>.`);}},

/* 4 */ {t:'Density: packed in',run:async w=>{
  say(`Tool number three: <b>density</b> ⚖️. Here are two cubes of exactly the <b>same size</b>: one is wood, one is lead.`);
  const P1=panel(13,8,460,300,'⚖️ Same size, different mass','Both cubes have the <b>same volume</b>, but the lead has far more <b>mass</b>.');pop(P1);
  mk('','left:205px;top:172px;width:50px;height:46px;background:#6b7380;clip-path:polygon(50% 0,100% 100%,0 100%)',null,P1);
  mk('','left:170px;top:216px;width:120px;height:10px;background:#5d6573;border-radius:5px',null,P1);
  const beam=mk('','left:70px;top:164px;width:320px;height:10px;background:#3b4252;border-radius:5px',null,P1);
