<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Avenir Next","Nunito","Segoe UI",system-ui,sans-serif;color:#1f2433;background:#f1eefe;
  background-image:radial-gradient(circle at 8% 10%,#e2d9ff 0,transparent 35%),radial-gradient(circle at 92% 85%,#d6e9ff 0,transparent 40%);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#holder{margin:0 auto;position:relative;overflow:hidden;overflow:clip}
#app{width:980px;position:absolute;left:0;top:0;transform-origin:0 0;padding:10px}
header{display:flex;align-items:center;gap:12px;height:46px}
.brand{font-weight:800;font-size:20px;color:#4a2ea6;white-space:nowrap}
#dots{display:flex;gap:6px;flex:1;justify-content:center}
#dots button{width:14px;height:14px;border-radius:50%;border:none;background:#d6d0f0;padding:0;transition:all .3s}
#dots button.done{background:#a891ee}
#dots button.cur{background:#6a45d8;width:30px;border-radius:8px}
.icon{border:2px solid #e3e0f0;background:#fff;border-radius:12px;padding:5px 10px;font-weight:800}
#narr{display:flex;align-items:center;gap:12px;height:96px;margin:4px 0 8px}
#mascot{flex:none;width:84px;height:84px}
#mascot .orb{transform-origin:40px 40px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bubble{flex:1;background:#fff;border-radius:20px;padding:10px 18px;min-height:84px;position:relative;box-shadow:0 6px 18px rgba(80,50,180,.10);display:flex;flex-direction:column;justify-content:center}
#bubble:before{content:"";position:absolute;left:-12px;top:34px;border:8px solid transparent;border-right:12px solid #fff}

#stage{position:relative;contain:paint;width:960px;height:520px;background:#fff;border-radius:24px;overflow:hidden;overflow:clip;box-shadow:0 10px 30px rgba(80,50,180,.12);

.voice{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:6px 8px;box-shadow:0 4px 0 #dcd6f2}

#next{background:#6a45d8;color:#fff;box-shadow:0 4px 0 #4a2ea6}
#next.ready{animation:nudge 1.2s infinite}
@keyframes nudge{50%{transform:scale(1.08);box-shadow:0 4px 0 #4a2ea6,0 0 0 8px rgba(106,69,216,.18)}}

/* tiles */
.tile{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:800;background:#e9e6f4;color:#9a96b0;
  transition:background .5s,color .5s,box-shadow .4s,opacity .4s;user-select:none}
.tile i{position:absolute;left:3px;top:1px;font-size:.42em;font-style:normal;opacity:.65}
.tile.on.metal{background:#f7ad5f;color:#5c2c00}
.tile.on.nonmetal{background:#5d9cf5;color:#fff}

.tile.hl{box-shadow:0 0 0 3px #1f2433,0 0 16px 4px #ffd84d;z-index:6}
.tile.click{cursor:pointer}
.tile.click:hover{transform:scale(1.25);z-index:7}

.info{position:absolute;background:#1f2433;color:#fff;border-radius:16px;padding:10px 16px;font-size:18px;font-weight:700;text-align:center}
.info .k{padding:2px 10px;border-radius:20px;font-size:14px}
.legend{position:absolute;display:flex;gap:8px;flex-wrap:wrap}
.chipk{padding:4px 12px;border-radius:20px;font-weight:800;font-size:14px}
.stamp{position:absolute;border:4px solid #18a058;color:#18a058;font-weight:800;font-size:22px;padding:6px 16px;border-radius:14px;background:#fff;white-space:nowrap}
.card{background:#fff;border:3px solid;border-radius:18px;padding:10px 12px;box-shadow:0 6px 0 rgba(0,0,0,.05)}
.card h4{margin:0;font-size:18px}
.card .area{position:relative;height:132px;overflow:hidden;overflow:clip}
.card p{margin:4px 0 0;font-size:14px;line-height:1.3;color:#444}
.panel{background:#fff;border:3px solid #ece8f8;border-radius:20px;overflow:hidden;overflow:clip}
.panel h4{position:absolute;left:16px;top:10px;margin:0;font-size:18px}
.panel .cap{position:absolute;left:16px;right:16px;bottom:10px;font-size:14.5px;line-height:1.3;color:#3a3f52}
.cmp{background:#fff;border:3px solid #ece8f8;border-radius:20px;padding:10px 14px}
.cmp .row{display:grid;grid-template-columns:150px 1fr 1fr;gap:8px;margin:3px 0;font-size:15.5px;font-weight:700}
.cmp .row div{padding:5px 12px;border-radius:10px}
.cmp .row .m{background:#fff1e0;color:#a14c00}.cmp .row .n{background:#e6f0ff;color:#1c4a9c}
.cmp .row.h div{background:none;font-size:13px;letter-spacing:.08em;padding-top:0;padding-bottom:0}
.clue{background:#fffbe9;border:3px dashed #e8c547;border-radius:18px;text-align:center;padding:12px;font-size:18px}
.clue .e{font-size:40px}
.bigbtn{position:absolute;border:none;border-radius:20px;font-size:26px;font-weight:800;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.paper{background:#fffdf5;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.12);padding:14px 18px;font-size:19px;
  background-image:repeating-linear-gradient(transparent 0 31px,#d6e4f5 31px 32px);background-position:0 46px}
.paper .r{height:32px;line-height:32px;font-family:"Chalkboard SE","Comic Sans MS",cursive;transition:opacity .3s}
.bin{border:4px solid;border-radius:20px}
.bin h4{margin:10px 0 0;text-align:center;font-size:20px}
.chip2{position:absolute;width:128px;height:42px;border-radius:21px;background:#fff;border:3px solid #d9d2f5;font-weight:800;display:flex;align-items:center;justify-content:center;
  transition:left .8s cubic-bezier(.3,1.2,.4,1),top .8s cubic-bezier(.3,1.2,.4,1),background .3s,border-color .3s;z-index:5}
.chip2.bad{background:#fde3e3;border-color:#e04848}
.chip2.good{background:#e3f7ec;border-color:#18a058}
.word{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;border:3px solid #e3e0f0;border-radius:18px;
  font-size:19px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #e3e0f0;transition:transform .15s}
.word:hover{transform:translateY(-2px)}
.word svg{position:absolute;left:-12px;top:-12px;pointer-events:none;overflow:visible}
.word.good{background:#e3f7ec;border-color:#18a058}.word.bad{background:#fde3e3;border-color:#e04848}
.badge{background:#fff;border:3px solid #ece8f8;border-radius:20px;text-align:center;padding:14px 14px;font-size:17px;font-weight:700;line-height:1.4;display:flex;flex-direction:column;justify-content:center;align-items:center}
.badge .e{font-size:50px;display:block;margin-bottom:8px}
.mcard{position:absolute;border-radius:14px;background:#f7ad5f;color:#5c2c00;display:flex;align-items:center;gap:10px;padding:0 12px;font-weight:800;box-shadow:0 4px 0 #d98a3a}
.mcard b{font-size:30px;min-width:46px}
.mcard span{font-size:17px}
.mcard em{position:absolute;right:8px;top:4px;font-style:normal;font-size:12px;background:#fff;border-radius:10px;padding:1px 7px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:100}
.home{text-decoration:none}
#rotate{display:none;position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#2a2f6b,#6a45d8 60%,#2c66cf);color:#fff;text-align:center;flex-direction:column;align-items:center;justify-content:center;padding:30px;font-weight:800}
#rotate .ph{font-size:80px;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotate h2{font-size:28px;margin:18px 0 8px}#rotate p{font-size:17px;opacity:.9;margin:0 0 22px;font-weight:600}
#rotate button{border:none;border-radius:16px;padding:12px 22px;font-size:16px;font-weight:800;background:rgba(255,255,255,.2);color:#fff}
@media (orientation:portrait) and (max-width:820px){body:not(.anyway) #rotate{display:flex}}
</style>

<body>
<canvas id="fx"></canvas>
<div id="rotate"><div class="ph">📱</div><h2>Turn your phone sideways!</h2><p>Professor Atom's adventure fits best in landscape.</p><button onclick="document.body.classList.add('anyway')">Keep it upright anyway</button></div>
<div id="holder"><div id="app">
  <header>
    <div class="brand">⚛️ Periodic Table Adventure</div>
    <div id="dots"></div>
    <a class="icon home" href="index.html" title="All activities">🏠</a>
    <button class="icon" id="snd">🔊</button>
  </header>
  <div id="narr">
    <svg id="mascot" viewBox="0 0 80 80">
      <g class="orb" fill="none" stroke="#6a45d8" stroke-width="3">
        <ellipse cx="40" cy="40" rx="37" ry="13"/><ellipse cx="40" cy="40" rx="37" ry="13" transform="rotate(60 40 40)"/><ellipse cx="40" cy="40" rx="37" ry="13" transform="rotate(-60 40 40)"/>
      </g>
      <circle cx="40" cy="40" r="18" fill="#ffd84d" stroke="#e0a800" stroke-width="2"/>
      <circle cx="34" cy="37" r="2.8" fill="#1f2433"/><circle cx="46" cy="37" r="2.8" fill="#1f2433"/>
      <path id="mouth" d="M33 45 Q40 52 47 45" stroke="#1f2433" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <circle cx="29" cy="44" r="3" fill="#ff9f9f" opacity=".7"/><circle cx="51" cy="44" r="3" fill="#ff9f9f" opacity=".7"/>
    </svg>
    <div id="bubble" title="Tap to hear this again"><span class="again">🔈 tap to hear again</span><div id="stitle"></div><div id="text"></div></div>
  </div>

    <div class="voice"><button id="vbtn">🗣️ Tutor voice: on</button><select id="vsel" title="Choose a voice"></select><select id="vrate" title="Speaking speed"><option value="0.85">🐢 Slow</option><option value="1" selected>Normal</option><option value="1.15">🐇 Fast</option></select></div>
    <div class="sp" id="count"></div>

</div></div>

<script>
/* ====================== basics ====================== */
const $=s=>document.querySelector(s);
const stage=$('#stage');
let token=0,cur=0,soundOn=true,actx=null;
try{soundOn=localStorage.getItem('pta_sound')!=='0';}catch(e){}
function beep(f=600,d=.08,type='triangle',v=.12,t0=0){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+t0;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.02);}catch(e){}}
const yay=()=>{[523,659,784,1047].forEach((f,i)=>beep(f,.25,'triangle',.12,i*.1));};
const boo=()=>{beep(220,.25,'sawtooth',.06);beep(160,.3,'sawtooth',.06,.12);};
/* ---------- tutor voice (Web Speech API) ---------- */
const HAS_TTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
let voiceOn=true,voice=null,rate=1,speakUntil=0,speakId=0,lastSay='';
try{voiceOn=localStorage.getItem('pta_voice')!=='0';rate=+(localStorage.getItem('pta_rate')||1);}catch(e){}
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/;
function voices(){return HAS_TTS?speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)&&!NOVELTY.test(v.name)):[];}
function pickVoice(){const vs=voices();if(!vs.length)return;let saved='';try{saved=localStorage.getItem('pta_vname')||'';}catch(e){}
  let v=vs.find(x=>x.name===saved);
  if(!v){const pref=[/Enhanced|Premium|Natural|Neural/i,/Google UK English Female/,/Serena|Stephanie|Kate|Martha/,/Daniel|Arthur|Oliver/,/Google UK English Male/,/Microsoft (Sonia|Libby|Hazel|Ryan)/,/Samantha|Karen|Moira|Tessa/,/Google US English/,/Microsoft (Aria|Jenny|Zira)/];
    const gb=vs.filter(x=>/en[-_]GB/i.test(x.lang));for(const r of pref){v=gb.find(x=>r.test(x.name))||vs.find(x=>r.test(x.name));if(v)break;}}
  voice=v||vs.find(x=>/en[-_]GB/i.test(x.lang))||vs[0];
  const sel=document.getElementById('vsel');if(sel){sel.innerHTML=vs.map(x=>`<option ${x===voice?'selected':''}>${x.name}</option>`).join('');}}
if(HAS_TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function cleanSpeech(html){let t=html.replace(/<br\s*\/?>/gi,'. ').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,' and ');
  t=t.replace(/\((?:[A-Z][a-z]?)\)/g,'').replace(/÷/g,' divided by ').replace(/≈/g,' about ').replace(/[→➡]/g,', ').replace(/=/g,' equals ').replace(/%/g,' percent').replace(/°C/g,' degrees Celsius')
     .replace(/\bB\)/g,'B,').replace(/\bvs\b/g,'versus').replace(/\be\.g\./g,'for example');
  const EMO=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\u{FE0F}\u{200D}\u{20E3}]+/gu;
  t=t.replace(/Try Fe, Au and O!/,'Try iron, gold and oxygen!');
  t=t.replace(/(\d)\s*A\b/g,'$1 amps').replace(/\bamps \(A\)/g,'amps');
  t=t.replace(new RegExp('([a-z0-9])\\s*'+EMO.source+'\\s+(?=[A-Z])','gu'),'$1. ').replace(EMO,' ');
  t=t.replace(/\b[A-Z]{3,}\b/g,w=>w.toLowerCase());
  return t.replace(/…/g,'... ').replace(/\s+/g,' ').replace(/\s+([.,!?])/g,'$1').trim();}
function talk(on){$('#mascot').classList.toggle('talking',on);}
function speak(html){if(!HAS_TTS)return;speechSynthesis.cancel();speakUntil=0;talk(false);if(!voiceOn)return;
  const t=cleanSpeech(html);if(!t)return;const my=++speakId;
  const u=new SpeechSynthesisUtterance(t);if(voice){u.voice=voice;u.lang=voice.lang;}else u.lang='en-GB';u.rate=rate;u.pitch=1.05;
  speakUntil=Date.now()+(t.split(' ').length/(2.4*rate))*1000+2500; /* safety cap if 'end' never fires */
  u.onstart=()=>{if(my===speakId)talk(true);};u.onend=u.onerror=()=>{if(my===speakId){speakUntil=0;talk(false);}};
  if(!speechSynthesis.speaking&&!speechSynthesis.pending)speechSynthesis.speak(u); /* direct call keeps iPad/iPhone happy */
  else setTimeout(()=>{if(my===speakId)speechSynthesis.speak(u);},60);}
function stopVoice(){speakId++;speakUntil=0;talk(false);if(HAS_TTS)speechSynthesis.cancel();}
/* wait at least ms AND until the tutor has finished speaking */
function sleep(ms,my){return new Promise((res,rej)=>{const t0=Date.now();(function tick(){if(my!==token)return rej('cancel');
  if(Date.now()-t0>=ms&&!(voiceOn&&speakUntil&&Date.now()<speakUntil))return res();setTimeout(tick,100);})();});}
function mk(cls,css,html,parent){const e=document.createElement('div');if(cls)e.className=cls;e.style.cssText='position:absolute;'+(css||'');if(html!=null)e.innerHTML=html;(parent||stage).appendChild(e);return e;}
function an(e,kf,o){const op=Object.assign({duration:600,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'},o||{});const a=e.animate(kf,op);
  return Promise.race([a.finished.catch(()=>{}),new Promise(r=>setTimeout(r,op.duration+(op.delay||0)+80))]);}
function loop(e,kf,dur,o){return e.animate(kf,Object.assign({duration:dur,iterations:Infinity,easing:'ease-in-out'},o||{}));}
function pop(e,delay){return an(e,[{transform:'scale(0)',opacity:0},{transform:'scale(1.1)',opacity:1,offset:.7},{transform:'scale(1)',opacity:1}],{duration:500,delay:delay||0});}
function shake(e){e.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(-5px)'},{transform:'translateX(0)'}],{duration:400});}
function say(html){lastSay=html;speak(html);const t=$('#text');t.innerHTML=html;t.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:350});
  $('#mascot').animate([{transform:'translateY(0)'},{transform:'translateY(-9px) rotate(-6deg)'},{transform:'translateY(0)'}],{duration:450});beep(880,.04,'sine',.05);}

/* ====================== confetti ====================== */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;}addEventListener('resize',rs);rs();
function confetti(n=120){const cols=['#6a45d8','#2c66cf','#17935b','#e06a1b','#ffd84d','#e04848'];const start=!parts.length;
  for(let i=0;i<n;i++)parts.push({x:innerWidth*(.2+Math.random()*.6),y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:Math.random()*7+4,c:cols[i%6],a:Math.random()*6,va:(Math.random()-.5)*.3,l:140});
  if(start)requestAnimationFrame(fx);}
function fx(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=.33;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);
  cx.globalAlpha=Math.max(0,Math.min(1,p.l/40));cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();});parts=parts.filter(p=>p.l>0&&p.y<cv.height+50);
  if(parts.length)requestAnimationFrame(fx);else cx.clearRect(0,0,cv.width,cv.height);}

/* ====================== periodic table data ====================== */
const SYM='H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' ');
const NAME='Hydrogen Helium Lithium Beryllium Boron Carbon Nitrogen Oxygen Fluorine Neon Sodium Magnesium Aluminium Silicon Phosphorus Sulfur Chlorine Argon Potassium Calcium Scandium Titanium Vanadium Chromium Manganese Iron Cobalt Nickel Copper Zinc Gallium Germanium Arsenic Selenium Bromine Krypton Rubidium Strontium Yttrium Zirconium Niobium Molybdenum Technetium Ruthenium Rhodium Palladium Silver Cadmium Indium Tin Antimony Tellurium Iodine Xenon Caesium Barium Lanthanum Cerium Praseodymium Neodymium Promethium Samarium Europium Gadolinium Terbium Dysprosium Holmium Erbium Thulium Ytterbium Lutetium Hafnium Tantalum Tungsten Rhenium Osmium Iridium Platinum Gold Mercury Thallium Lead Bismuth Polonium Astatine Radon Francium Radium Actinium Thorium Protactinium Uranium Neptunium Plutonium Americium Curium Berkelium Californium Einsteinium Fermium Mendelevium Nobelium Lawrencium Rutherfordium Dubnium Seaborgium Bohrium Hassium Meitnerium Darmstadtium Roentgenium Copernicium Nihonium Flerovium Moscovium Livermorium Tennessine Oganesson'.split(' ');
const NONMET=new Set('H He C N O F Ne P S Cl Ar Se Br Kr I Xe Rn Og'.split(' '));
const SEMI=new Set('B Si Ge As Sb Te At'.split(' '));
const GAS=new Set('H He N O F Ne Cl Ar Kr Xe Rn'.split(' '));
const kind=s=>NONMET.has(s)?'nonmetal':SEMI.has(s)?'semi':'metal';
const KLABEL={metal:['Metal','#f7ad5f','#5c2c00'],nonmetal:['Non-metal','#5d9cf5','#fff'],semi:['In-between (metalloid)','#c9b6f4','#3b2477']};
function POS(z){
  if(z===1)return[1,1];if(z===2)return[18,1];
  if(z<=4)return[z-2,2];if(z<=10)return[z+8,2];
  if(z<=12)return[z-10,3];if(z<=18)return[z,3];
  if(z<=36)return[z-18,4];if(z<=54)return[z-36,5];

function makeTable({x,y,s,nums=false,on=false}){

/* 6 */ {t:'The magnet test',run:async w=>{

      say(`${C[i][1]}… nothing happens. <b>Not magnetic</b>. ❌`);const b=mk('',`left:${24+i*116+28}px;top:472px;font-size:30px`,'❌');pop(b);await w(900);}}

  say(`Only <b>iron, steel, nickel and cobalt</b> are magnetic. Gold, silver, copper and aluminium are <b>NOT</b>. That's answer <b>B</b> on your sheet!`);}},

/* 9 */ {t:'Ten metals (and an alloy!)',run:async w=>{

  flyFrom(T.tiles.Fe,fe,761,272);flyFrom(T.tiles.C,c,860,272);await w(1100);

  const st=mk('mcard',`left:761px;top:272px;width:170px;height:78px;background:linear-gradient(135deg,#c3cad5,#8a94a3);color:#1f2433;box-shadow:0 4px 0 #6b7380`,`<b style="font-size:22px;min-width:0">⚙️</b><span>Steel</span><em style="background:#ffd84d">ALLOY</em>`);pop(st);yay();
  say(`✨ <b>Steel is an ALLOY</b>! It's fine for your answer, but if you want a "pure" metal, use <b>lead</b> or <b>tin</b> instead.`);await w(3800);
  const A=mk('','left:13px;top:364px;width:430px;height:148px;background:#fff;border:3px solid #ece8f8;border-radius:20px;padding:12px 16px;font-size:16.5px;line-height:1.4',
    `<b style="font-size:19px;color:#6a45d8">What is an alloy?</b><br>A <b>mixture of a metal with one or more other elements</b>. Alloys are often stronger or harder.<br>⚙️ Steel = iron + carbon<br>🎺 Brass = copper + zinc`);pop(A);

    `<b style="font-size:19px;color:#b08400">💍 24 carat vs 18 carat gold</b><div style="font-size:14px;font-weight:800;margin-top:8px">24 carat</div><div class="g24" style="display:flex;gap:2px;height:22px"></div><div style="font-size:14px;font-weight:800;margin-top:6px">18 carat</div><div class="g18" style="display:flex;gap:2px;height:22px"></div><div class="gt" style="font-size:15px;font-weight:800;margin-top:6px;opacity:0">18 ÷ 24 = <span style="color:#b08400">75% gold</span> · 24 carat = nearly pure gold</div>`);pop(G);
  const sq=(box,n)=>{for(let i=0;i<24;i++){const d=document.createElement('div');d.style.cssText='width:17px;border-radius:3px;background:#e2e4ea;transition:background .25s';box.appendChild(d);}return [...box.children];};

  for(let i=0;i<24;i++){a24[i].style.background='#e7b416';if(i<18)a18[i].style.background='#e7b416';beep(400+i*25,.03,'sine',.04);await w(90);}

  say(`<b>24 carat</b> is nearly pure gold. <b>18 carat</b> is 18 parts out of 24, which is <b>75% gold</b>. The rest is other metals, so it's an alloy!`);}},

/* 10 */ {t:'Sofia\'s mix-up',run:async w=>{

  const rows=paper.querySelectorAll('.r');const chips={};let nm=0,nn=0;
  for(let i=0;i<items.length;i++){const[nme,s]=items[i];const bin=s==='M'?binM:binN;const k=s==='M'?nm++:nn++;
    const ch=mk('chip2',`left:${40}px;top:${20+14+34+i*32-6}px`,nme);chips[nme]=ch;rows[i].style.opacity=.3;
    ch.offsetWidth;const[x,y]=slot(bin,k);ch.style.left=x+'px';ch.style.top=y+'px';beep(500+i*50,.06);
    setTimeout(()=>{const n=bin.querySelector('.n');n.textContent=s==='M'?nm:nn;n.animate([{transform:'scale(1.8)'},{transform:'scale(1)'}],{duration:300});},500);await w(650);}
  await w(600);
  say(`Sofia thinks there are <b>5 metals</b> and <b>3 non-metals</b>. But <b>two</b> of her answers are WRONG! Can you spot them? 🤔`);await w(4200);
  for(const n of ['Carbon','Sulfur']){chips[n].classList.add('bad');shake(chips[n]);}boo();
  say(`Got it? <b>Carbon</b> and <b>sulfur</b> are <b>NON-METALS</b>! They're dull and brittle, and they live on the right of the table.`);await w(3600);
  [['Carbon',binN,3],['Sulfur',binN,4],['Copper',binM,1],['Iron',binM,2]].forEach(([n,b,k])=>{const[x,y]=slot(b,k);chips[n].style.left=x+'px';chips[n].style.top=y+'px';});
  ['Carbon','Sulfur'].forEach(n=>setTimeout(()=>{chips[n].classList.remove('bad');chips[n].classList.add('good');},800));
  setTimeout(()=>{binM.querySelector('.n').textContent=3;binN.querySelector('.n').textContent=5;[binM,binN].forEach(b=>b.querySelector('.n').animate([{transform:'scale(1.8)'},{transform:'scale(1)'}],{duration:300}));yay();},800);
  await w(1600);
  say(`Now it's right: <b>3 metals</b> (silver, copper, iron) and <b>5 non-metals</b> (oxygen, helium, carbon, nitrogen, sulfur). ✅`);await w(3400);
  const S=mk('','left:20px;top:362px;width:260px;height:150px;background:#fff;border:3px solid #ece8f8;border-radius:18px;padding:10px 14px;font-size:15.5px;line-height:1.55;font-weight:700',
    `Sofia's metals: <b style="color:#e04848">5</b><br>Correct metals: <b style="color:#18a058">3</b><br>Sofia's non-metals: <b style="color:#e04848">3</b><br>Correct non-metals: <b style="color:#18a058">5</b>`);pop(S);
  const ch=mk('','left:300px;top:362px;width:400px;height:150px;background:#fff;border:3px solid #ece8f8;border-radius:18px');pop(ch);
  const ax=mk('','left:50px;top:12px;width:3px;height:112px;background:#1f2433',null,ch);mk('','left:50px;top:122px;width:330px;height:3px;background:#1f2433',null,ch);
  for(let k=0;k<=5;k++)mk('',`left:30px;top:${116-k*21}px;font-size:12px;font-weight:800;color:#626a80`,k,ch);
  const b1=mk('','left:110px;top:122px;width:70px;height:0;border:3px solid #e06a1b;border-bottom:none;background:#fff;transition:all 1s cubic-bezier(.3,1.3,.5,1)',null,ch);
  const b2=mk('','left:240px;top:122px;width:70px;height:0;border:3px solid #2c66cf;border-bottom:none;background:#fff;transition:all 1s cubic-bezier(.3,1.3,.5,1) .3s',null,ch);
  mk('','left:100px;top:126px;font-size:13px;font-weight:800','Metals',ch);mk('','left:226px;top:126px;font-size:13px;font-weight:800','Non-metals',ch);
  b1.offsetWidth;b1.style.top=(122-63)+'px';b1.style.height='63px';b2.style.top=(122-105)+'px';b2.style.height='105px';
  const tip=mk('','left:718px;top:362px;width:222px;height:150px;background:#fff8e6;border:3px solid #f2c200;border-radius:18px;padding:10px 14px;font-size:15px;font-weight:700;line-height:1.5',
    `📏 Bar chart tips<br>✏️ Use a pencil &amp; ruler<br>🏷️ Label both bars<br>🚫 Don't shade the bars`);pop(tip,600);
  say(`Then draw the <b>bar chart</b> with the correct numbers: <b>3</b> and <b>5</b>. Use a pencil and ruler, label both bars, and <b>don't shade</b> them! 📊`);}},

/* 11 */ {t:'Circle the metal properties',run:async w=>{
  const W=[['malleable',1],['has a dull surface',0],['does not conduct electricity',0],['ductile',1],['feels cold to the touch',1],['makes a ringing sound when tapped',1],['conducts heat',1],['brittle',0],['has a shiny surface',1]];
  const h=mk('','left:0;top:14px;width:960px;text-align:center;font-size:26px;font-weight:800;color:#d66a0a','⭕ Circle every property of METALS');pop(h);
  say(`Your turn! 🎮 <b>Tap</b> every word that describes a property of <b>metals</b> to circle it. Then press <b>Check</b>.`);
  const sel=new Set();let checked=false;
  const els=W.map((wd,i)=>{const x=24+(i%3)*310,y=70+Math.floor(i/3)*104;const e=mk('word',`left:${x}px;top:${y}px;width:290px;height:76px`,wd[0]);pop(e,i*70);
    e.onclick=()=>{if(checked)return;beep(650,.05);if(sel.has(i)){sel.delete(i);const s=e.querySelector('svg');if(s)s.remove();}else{sel.add(i);circle(e,'#6a45d8');}};return e;});
  function circle(e,col,dash){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',314);s.setAttribute('height',100);
    s.innerHTML=`<ellipse cx="157" cy="50" rx="150" ry="44" fill="none" stroke="${col}" stroke-width="4" ${dash?'stroke-dasharray="10 8"':'pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"'}/>`;e.appendChild(s);
    if(!dash)s.querySelector('ellipse').animate([{strokeDashoffset:100},{strokeDashoffset:0}],{duration:450,fill:'forwards'});}
  const btn=mk('bigbtn','left:370px;top:398px;width:220px;height:70px;background:#6a45d8;display:flex;align-items:center;justify-content:center;font-size:24px','Check ✔');pop(btn,700);
  btn.onclick=()=>{if(checked)return;checked=true;let right=0,wrong=0,miss=0;
    W.forEach((wd,i)=>{const e=els[i];if(wd[1]&&sel.has(i)){e.classList.add('good');right++;}else if(!wd[1]&&sel.has(i)){e.classList.add('bad');wrong++;shake(e);}else if(wd[1]){circle(e,'#18a058',true);miss++;}});
    btn.style.opacity=.3;
    if(!wrong&&!miss){yay();confetti(120);say(`🏆 PERFECT! Malleable, ductile, feels cold, rings when tapped, conducts heat and shiny are all <b>metal</b> properties!`);}
    else{boo();say(`You got <b>${right}</b> of 6. ${wrong?`The red ones are <b>non-metal</b> properties (dull, brittle, doesn't conduct). `:''}${miss?`The dashed green ones were missed. `:''}Press <b>Replay</b> to try again!`);}};}},

/* 12 */ {t:'You did it!',run:async w=>{
  say(`🎉 You finished the <b>Periodic Table Adventure</b>! Here's everything you learned…`);
  const B=[['🗺️','Metals: <b>left &amp; middle</b>. Non-metals: <b>top right</b>.'],['✨','Metals: shiny, conduct heat &amp; electricity, malleable, ductile, sonorous.'],['🪨','Non-metals: dull, brittle, insulators, many are gases.'],['💧','<b>Mercury</b>: the only liquid metal.'],
    ['✏️','<b>Graphite</b> (carbon): a non-metal that conducts.'],['🧲','Magnetic: <b>iron, steel, nickel, cobalt</b>.'],['🎈','Helium: light &amp; unreactive.<br>Sulfur: acid &amp; fertiliser.'],['⚙️','Alloy = metal + other elements.<br>18 carat = 75% gold.']];
  for(let i=0;i<8;i++){const b=mk('badge',`left:${13+(i%4)*237}px;top:${14+Math.floor(i/4)*214}px;width:222px;height:200px`,`<span class="e">${B[i][0]}</span><div>${B[i][1]}</div>`);pop(b);beep(500+i*70,.08);await w(450);}
  confetti(200);yay();await w(1200);
  const f=mk('','left:130px;top:448px;width:700px;height:58px;border-radius:18px;background:linear-gradient(135deg,#6a45d8,#2c66cf);color:#fff;font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer','🎮 Now try the Materials level in your Science Quest quiz! ➜');f.onclick=()=>{location.href='quiz.html';};pop(f);
  say(`You're a <b>Periodic Table pro</b>! 🧠 Now test yourself with the <b>Materials</b> level in the Science Quest quiz.`);}},
];

/* ====================== navigation ====================== */
function dots(){const d=$('#dots');d.innerHTML='';SC.forEach((s,i)=>{const b=document.createElement('button');b.title=s.t;b.className=i===cur?'cur':i<cur?'done':'';b.onclick=()=>go(i);d.appendChild(b);});
  $('#count').textContent=`Scene ${cur+1} of ${SC.length}`;$('#back').style.visibility=cur?'visible':'hidden';$('#next').textContent=cur===SC.length-1?'Start over ⟲':'Next ▶';}
async function run(){const my=++token;stopVoice();stage.getAnimations&&stage.getAnimations({subtree:true}).forEach(a=>a.cancel());stage.innerHTML='';
  $('#next').classList.remove('ready');$('#stitle').textContent=`Scene ${cur+1} · ${SC[cur].t}`;dots();
  try{await SC[cur].run(ms=>sleep(ms,my));if(my===token){$('#next').classList.add('ready');if(cur===SC.length-1)try{localStorage.setItem('g7_done_l05','1');}catch(e){}}}catch(e){if(e!=='cancel')console.error(e);}}
function go(i){cur=(i+SC.length)%SC.length;run();}
$('#next').onclick=()=>go(cur+1);$('#back').onclick=()=>go(cur-1);$('#replay').onclick=()=>run();
$('#snd').onclick=()=>{soundOn=!soundOn;$('#snd').textContent=soundOn?'🔊':'🔇';try{localStorage.setItem('pta_sound',soundOn?'1':'0');}catch(e){}};
$('#snd').textContent=soundOn?'🔊':'🔇';
function vUI(){const b=$('#vbtn');b.textContent=voiceOn?'🗣️ Tutor voice: on':'🤐 Tutor voice: off';b.classList.toggle('off',!voiceOn);
  $('#vsel').style.display=$('#vrate').style.display=voiceOn&&HAS_TTS?'':'none';$('#vrate').value=String(rate);
  if(!HAS_TTS){b.textContent='🗣️ Voice not supported';b.disabled=true;}}
$('#vbtn').onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem('pta_voice',voiceOn?'1':'0');}catch(e){}vUI();if(voiceOn)speak(lastSay);else stopVoice();};
$('#vsel').onchange=e=>{voice=voices().find(v=>v.name===e.target.value)||voice;try{localStorage.setItem('pta_vname',voice.name);}catch(_){}speak(lastSay);};
$('#vrate').onchange=e=>{rate=+e.target.value;try{localStorage.setItem('pta_rate',rate);}catch(_){}speak(lastSay);};
$('#bubble').onclick=()=>{if(lastSay){if(!voiceOn){voiceOn=true;vUI();}speak(lastSay);}};
vUI();if(HAS_TTS)pickVoice();
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft'&&cur)go(cur-1);});
function fit(){const s=Math.min(innerWidth/980,innerHeight/760);const a=$('#app'),h=$('#holder');a.style.transform=`scale(${s})`;h.style.width=980*s+'px';h.style.height=760*s+'px';}
addEventListener('resize',fit);fit();
addEventListener('scroll',()=>{if(scrollX||scrollY)scrollTo(0,0);});$('#holder').addEventListener('scroll',e=>{e.target.scrollLeft=0;e.target.scrollTop=0;});
const start=new URLSearchParams(location.search).get('scene');
if(start)go(Math.max(0,Math.min(SC.length-1,+start-1)));
else{dots();$('#stitle').textContent='Welcome';say(`Hi! I'm <b>Professor Atom</b> ⚛️ Ready to explore the Periodic Table? Press <b>Start</b>!`);
  const b=mk('bigbtn','left:290px;top:190px;width:380px;height:110px;background:linear-gradient(135deg,#6a45d8,#2c66cf);display:flex;align-items:center;justify-content:center;font-size:30px;white-space:nowrap','▶ Start the adventure!');
  loop(b,[{transform:'scale(1)'},{transform:'scale(1.06)'}],700,{direction:'alternate'});mk('','left:0;top:340px;width:960px;text-align:center;font-size:17px;color:#626a80;font-weight:700','13 short animated scenes · tap ▶ Next to move on · 🔊 sound on');
  b.onclick=()=>{beep(660,.1);go(0);};}
</script>
