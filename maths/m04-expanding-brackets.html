<script>
/* Maths Lesson 4 · Chapter 2 · Exercise 2.4 (Q3, Q5, Q9)
   Every worksheet question type is taught with teachQ (maths.js): question first and read aloud, key words lit up,
   a try with a real number, the student taps "Show me", then the working one line at a time, the answer and why.
   Q3 e), Q5 g) and Q5 j) are built in "Build it!"; the rest are in the Exam check. */
const WS='Worksheet · Ex 2.4 · ';
const STEM3='Expand the brackets.';
const STEM5='Multiply out the brackets.';
const STEM9='The diagram shows a rectangle. The width of the rectangle is 8cm. The length of the rectangle is 3y + 4 cm. Write an expression, in its simplest form, for the:';
const w0=ms=>new Promise(r=>setTimeout(r,ms));
const clear=keep=>[...stage.children].forEach(e=>{if(!keep||!keep.includes(e))e.remove();});

/* A big expression with arrows from the number outside the bracket to each term inside.
   html marks the outside number with class "o" and each term (with its sign) with class "t". */
let AID=0;
function expander(x,y,html,fs=46){
  const box=mk('mx ex',`left:${x}px;top:${y}px;font-size:${fs}px;line-height:1.1;white-space:nowrap;z-index:6`,html);pop(box);
  const id='ah'+(++AID),NS='http://www.w3.org/2000/svg';
  const hold=mk('',`left:${x}px;top:${y-70}px;width:420px;height:72px;pointer-events:none;z-index:5`,
    `<svg width="420" height="72" style="overflow:visible"><defs><marker id="${id}" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e06a1b"/></marker></defs></svg>`);
  const svg=hold.querySelector('svg'),o=box.querySelector('.o'),T=[...box.querySelectorAll('.t')];
  const cx=e=>e.offsetLeft+e.offsetWidth/2;
  const glow=(e,c)=>e.animate([{background:'transparent'},{background:c},{background:'transparent'}],{duration:1100});
  return{box,hop:async(i,lab,col='#18a058')=>{const t=T[i],x1=cx(o),x2=cx(t),h=24+i*15;
      const p=document.createElementNS(NS,'path');
      p.setAttribute('d',`M${x1},68 Q${(x1+x2)/2},${68-2*h} ${x2},66`);
      p.setAttribute('fill','none');p.setAttribute('stroke','#e06a1b');p.setAttribute('stroke-width','4');p.setAttribute('stroke-linecap','round');
      svg.appendChild(p);const L=p.getTotalLength();p.style.strokeDasharray=L;
      glow(o,'#ffe680');beep(520,.06);
      await an(p,[{strokeDashoffset:L},{strokeDashoffset:0}],{duration:800});
      p.setAttribute('marker-end',`url(#${id})`);glow(t,'#ffe680');beep(760,.08);
      if(lab){const l=mk('mx lab',`left:${x+cx(t)-70}px;top:${y+fs*1.1+8}px;width:140px;color:${col}`,lab);pop(l);point(l);return l;}
      point(t);}};}

/* An area rectangle: height labelled `out`, its length split into parts [[label, width px, colour]].
   fill(i, text) colours one part and writes its area inside. */
function areaRect(x,y,h,out,parts){
  const side=mk('mx',`left:${x-64}px;top:${y+h/2-22}px;width:54px;text-align:right;font-size:32px;color:#e06a1b`,out);pop(side);
  let cx=x;const P=parts.map(([lab,wd,col],i)=>{const r=mk('ar',`left:${cx}px;top:${y}px;width:${wd+(i?0:3)}px;height:${h}px;border-color:${col};color:${col}`,'');
    const l=mk('mx lab',`left:${cx}px;top:${y-40}px;width:${wd}px;font-size:30px;color:${col}`,lab);pop(r,i*150);pop(l,i*150);cx+=wd;return{r,l,col};});
  return{side,P,fill:async(i,txt)=>{const p=P[i];
    p.l.animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:700});
    side.animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:700});beep(520,.06);await w0(600);
    p.r.style.background=p.col+'26';p.r.innerHTML=txt;
    await an(p.r,[{boxShadow:'0 0 0 0 '+p.col},{boxShadow:'0 0 0 10px transparent'}],{duration:700});beep(780,.08);point(p.r);}};}

Lesson.start(Object.assign({}, MATHS, {
  id:'m04', num:4, part:'Chapter 2', emoji:'📦', title:'Expanding brackets',
  intro:`Hi! I'm <b>Pi the Robot</b> 🤖 Let's open up some brackets. Press <b>Start</b>!`,
  scenes:[
/* 0 */ {t:'Brackets are packages',run:async w=>{
  say(`Hi! I'm <b>Pi the Robot</b>. Today you'll learn to <b>expand brackets</b>. That means writing an expression without its brackets.`);
  await w(3000);
  const ex=mk('mx','left:690px;top:70px;font-size:50px;white-space:nowrap','3(10 + 2)');pop(ex);point(ex);
  say(`Look at <b>3(10 + 2)</b>. A number right in front of a bracket means <b>times</b>. So this is 3 lots of the bracket.`);
  await w(3200);
  const box=i=>{const b=mk('pk',`left:${40+i*206}px;top:40px`,'');pop(b,i*200);
    const a=mk('pk-c',`left:12px;top:30px;border-color:#2c66cf;color:#2c66cf`,'10',b),c=mk('pk-c',`left:108px;top:30px;border-color:#18a058;color:#18a058`,'2',b);return{b,a,c};};
  let B=[0,1,2].map(box);
  say(`Think of it as <b>3 packages</b>. Each package holds a 10 and a 2.`);
  await w(2800);
  const L1=mk('mx-step try','left:60px;top:200px','Bracket first: &nbsp;3 × 12 = 36');pop(L1);point(L1);
  say(`One way: work out the bracket first. 10 + 2 is 12, and 3 lots of 12 is <b>36</b>.`);
  await w(3000);
  for(const k of B)k.a.animate([{background:'#fff'},{background:'#cfe0ff'},{background:'#fff'}],{duration:900});beep(500,.08);point(B[2].a);
  say(`Another way: open the packages. There are three 10s. That makes <b>30</b>.`);
  await w(2600);
  for(const k of B)k.c.animate([{background:'#fff'},{background:'#c9f0da'},{background:'#fff'}],{duration:900});beep(650,.08);point(B[2].c);
  say(`And there are three 2s. That makes <b>6</b>.`);
  await w(2200);
  const L2=mk('mx-step try','left:60px;top:262px','Open it up: &nbsp;3 × 10 + 3 × 2 = 30 + 6 = 36');pop(L2);point(L2);
  say(`30 + 6 is <b>36</b> too. The same answer! Multiply <b>each thing</b> inside by 3, then add.`);
  await w(3200);yay();
  /* now with a letter */
  ex.innerHTML='3(y + 6)';pop(ex);
  B.forEach(k=>{k.a.innerHTML='y';k.c.innerHTML='6';k.a.style.fontFamily='Georgia,serif';k.a.style.fontStyle='italic';pop(k.a);pop(k.c);});point(ex);
  say(`Now with a letter: <b>3(y + 6)</b>. Each package holds a <b>y</b> and a <b>6</b>.`);
  await w(3000);
  for(const k of B)k.a.animate([{background:'#fff'},{background:'#cfe0ff'},{background:'#fff'}],{duration:900});beep(500,.08);
  const L3=mk('mx-step','left:60px;top:336px','three y\'s = 3y &nbsp;&nbsp; three 6s = 18');pop(L3);point(L3);
  say(`Three y's make <b>3y</b>. Three 6s make <b>18</b>.`);
  await w(2600);
  const L4=mk('mx-step','left:60px;top:402px;border-color:#18a058;color:#0f7a40','3(y + 6) = <b>3y + 18</b>');pop(L4);point(L4);yay();
  say(`So 3(y + 6) is <b>3y + 18</b>. We can't add those, because 3y and 18 are not like terms.`);
  await w(3200);
  const rule=mk('tag','left:520px;top:412px;background:#ffe6cf;color:#7a2e00;font-size:19px;white-space:nowrap','Multiply <b>every</b> term inside!');pop(rule);point(rule);
  say(`Today's big rule: multiply <b>every term</b> inside the bracket by the number outside.`);
  await w(3000);}},

/* 1 */ {t:'Multiply every term',run:async w=>{
  say(`Let's do the worksheet questions, <b>one at a time</b>. Watch the rectangle.`);
  await w(2400);
  let R,E;
  await teachQ(w,{src:WS+'Q3 a)',q:STEM3+'<br>a) 3(y + 6)',read:'Expand the brackets: 3, bracket y + 6.',
    keys:[['Expand',`<b>Expand</b> means multiply out, so the answer has <b>no brackets</b>.`],['3(y + 6)',`The 3 is outside the bracket. It must multiply <b>both</b> the y and the 6.`]],
    before:[{show:'Try y = 10: &nbsp;3(10 + 6) = 3 × 16 = 48',say:`Try a number first. If y is 10, the bracket is 16, and 3 × 16 is <b>48</b>. Remember 48.`,try:true,wait:2800}],
    steps:[{act:async()=>{R=areaRect(660,190,96,'3',[['y',150,'#2c66cf'],['6',100,'#18a058']]);await w0(900);},
        show:'3(y + 6) <i>a 3 by (y + 6) rectangle</i>',say:`Here's a rectangle. It is 3 tall, and y + 6 long. Its area is 3(y + 6).`,wait:2600},
      {act:()=>R.fill(0,'3y'),show:'3 × y = 3y',say:`The blue part is 3 by y. Its area is 3 × y, which is <b>3y</b>.`},
      {act:()=>R.fill(1,'18'),show:'3 × 6 = 18',say:`The green part is 3 by 6. Its area is <b>18</b>.`},
      {show:'= 3y + 18 <i>add the parts</i>',say:`Add the two parts together: <b>3y + 18</b>.`}],
    answer:'3y + 18',why:'The 3 multiplies both terms. Check with y = 10: 3y + 18 = 30 + 18 = 48, the same as before. ✔'});
  await w(1200);clear();
  await teachQ(w,{src:WS+'Q3 g)',q:STEM3+'<br>g) 6(2 + f)',read:'Expand the brackets: 6, bracket 2 + f.',
    keys:[['6(2 + f)',`This time the <b>number</b> comes first inside the bracket. That's fine: we still multiply each term by 6.`]],
    before:[{show:'Try f = 10: &nbsp;6(2 + 10) = 6 × 12 = 72',say:`Try f = 10. The bracket is 12, and 6 × 12 is <b>72</b>.`,try:true,wait:2600}],
    steps:[{act:async()=>{E=expander(640,290,'<span class="o">6</span>(<span class="t">2</span> + <span class="t">f</span>)');await w0(700);},
        show:'6(2 + f) <i>one arrow to each term</i>',say:`Draw an arrow from the 6 to each term inside.`},
      {act:()=>E.hop(0,'12'),show:'6 × 2 = 12',say:`First arrow: 6 × 2 is <b>12</b>.`},
      {act:()=>E.hop(1,'+ 6f'),show:'6 × f = 6f',say:`Second arrow: 6 × f is <b>6f</b>.`},
      {show:'= 12 + 6f <i>keep the order</i>',say:`So the answer is <b>12 + 6f</b>. Keep the terms in the same order as the bracket.`}],
    answer:'12 + 6f',why:'Check with f = 10: 12 + 6f = 12 + 60 = 72. ✔ Writing 6f + 12 is also right.'});
  await w(1500);}},

/* 2 */ {t:'A minus inside',run:async w=>{
  say(`Now a <b>minus</b> inside the bracket. The sign in front of a term <b>travels with it</b>, just like when we simplified.`);
  await w(3200);
  let E;
  await teachQ(w,{src:WS+'Q3 d)',q:STEM3+'<br>d) 3(b − 1)',read:'Expand the brackets: 3, bracket b − 1.',
    keys:[['− 1',`The 1 has a <b>minus</b> in front. That minus stays with it.`]],
    before:[{show:'Try b = 10: &nbsp;3(10 − 1) = 3 × 9 = 27',say:`Try b = 10. The bracket is 9, and 3 × 9 is <b>27</b>.`,try:true,wait:2600}],
    steps:[{act:async()=>{E=expander(650,290,'<span class="o">3</span>(<span class="t">b</span> <span class="t">− 1</span>)');await w0(700);},
        show:'3(b − 1)',say:`Two terms inside: <b>b</b>, and <b>minus 1</b>.`},
      {act:()=>E.hop(0,'3b'),show:'3 × b = 3b',say:`3 × b is <b>3b</b>.`},
      {act:()=>E.hop(1,'− 3','#e04848'),show:'3 × 1 = 3 <i>the minus stays</i>',say:`3 × 1 is 3, and the minus stays in front: <b>minus 3</b>.`,wait:2400},
      {show:'= 3b − 3',say:`So the answer is <b>3b − 3</b>.`}],
    answer:'3b − 3',why:'Check with b = 10: 3b − 3 = 30 − 3 = 27. ✔ The minus inside stays a minus.'});
  await w(1200);clear();
  await teachQ(w,{src:WS+'Q3 j)',q:STEM3+'<br>j) 6(2 − x)',read:'Expand the brackets: 6, bracket 2 − x.',
    keys:[['− x',`Here the <b>letter</b> has the minus. So we take away the x term.`]],
    before:[{show:'Try x = 1: &nbsp;6(2 − 1) = 6 × 1 = 6',say:`Try x = 1. The bracket is 1, and 6 × 1 is <b>6</b>.`,try:true,wait:2600}],
    steps:[{act:async()=>{E=expander(650,290,'<span class="o">6</span>(<span class="t">2</span> <span class="t">− x</span>)');await w0(700);},
        show:'6(2 − x)',say:`Two terms inside: <b>2</b>, and <b>minus x</b>.`},
      {act:()=>E.hop(0,'12'),show:'6 × 2 = 12',say:`6 × 2 is <b>12</b>.`},
      {act:()=>E.hop(1,'− 6x','#e04848'),show:'6 × x = 6x <i>the minus stays</i>',say:`6 × x is 6x, and the minus stays: <b>minus 6x</b>.`,wait:2400},
      {show:'= 12 − 6x',say:`So the answer is <b>12 − 6x</b>.`}],
    answer:'12 − 6x',why:'Check with x = 1: 12 − 6x = 12 − 6 = 6. ✔ The minus belongs to the x, so it stays in front of 6x.'});
  await w(1500);}},

/* 3 */ {t:'Two letters',run:async w=>{
  say(`What if there are <b>two letters</b> inside? Same rule: one arrow to each term.`);
  await w(2600);
  let E;
  await teachQ(w,{src:WS+'Q3 h)',q:STEM3+'<br>h) 2(l + g)',read:'Expand the brackets: 2, bracket l + g.',
    keys:[['l + g',`Two different letters, <b>l</b> and <b>g</b>. They are unlike terms, so they stay apart.`]],
    before:[{show:'Try l = 3, g = 4: &nbsp;2(3 + 4) = 2 × 7 = 14',say:`Try l = 3 and g = 4. The bracket is 7, and 2 × 7 is <b>14</b>.`,try:true,wait:2600}],
    steps:[{act:async()=>{E=expander(660,290,'<span class="o">2</span>(<span class="t">l</span> + <span class="t">g</span>)');await w0(700);},
        show:'2(l + g)',say:`Two terms inside: <b>l</b> and <b>g</b>.`},
      {act:()=>E.hop(0,'2l'),show:'2 × l = 2l',say:`2 × l is <b>2l</b>.`},
      {act:()=>E.hop(1,'+ 2g'),show:'2 × g = 2g',say:`2 × g is <b>2g</b>.`},
      {show:'= 2l + 2g',say:`So the answer is <b>2l + 2g</b>.`}],
    answer:'2l + 2g',why:'Check with l = 3, g = 4: 2l + 2g = 6 + 8 = 14. ✔'});
  await w(1200);clear();
  await teachQ(w,{src:WS+'Q5 k)',q:STEM5+'<br>k) 7(6c − 7h)',read:'Multiply out the brackets: 7, bracket 6c − 7h.',
    keys:[['Multiply out',`<b>Multiply out</b> means the same as expand.`],['6c − 7h',`Each term has a number <b>and</b> a letter. Multiply the numbers; the letter stays.`]],
    before:[{show:'Try c = 2, h = 1: &nbsp;7(12 − 7) = 7 × 5 = 35',say:`Try c = 2 and h = 1. 6c is 12 and 7h is 7. The bracket is 5, and 7 × 5 is <b>35</b>.`,try:true,wait:3000}],
    steps:[{act:async()=>{E=expander(630,290,'<span class="o">7</span>(<span class="t">6c</span> <span class="t">− 7h</span>)');await w0(700);},
        show:'7(6c − 7h)',say:`Two terms: <b>6c</b>, and <b>minus 7h</b>.`},
      {act:()=>E.hop(0,'42c'),show:'7 × 6c = 42c <i>7 × 6 = 42</i>',say:`7 × 6c: multiply the numbers, 7 × 6 is 42. So <b>42c</b>.`,wait:2400},
      {act:()=>E.hop(1,'− 49h','#e04848'),show:'7 × 7h = 49h <i>the minus stays</i>',say:`7 × 7h is 49h, and the minus stays: <b>minus 49h</b>.`,wait:2400},
      {show:'= 42c − 49h',say:`So the answer is <b>42c − 49h</b>.`}],
    answer:'42c − 49h',why:'Check with c = 2, h = 1: 42c − 49h = 84 − 49 = 35. ✔'});
  await w(1500);}},

/* 4 */ {t:'A number and a letter',run:async w=>{
  say(`Now the terms inside have a <b>number in front</b>, like 2x. Multiply the numbers, and keep the letter.`);
  await w(3000);
  let E;
  await teachQ(w,{src:WS+'Q5 a)',q:STEM5+'<br>a) 3(2x + 1)',read:'Multiply out the brackets: 3, bracket 2x + 1.',
    keys:[['2x',`<b>2x</b> means 2 × x. So 3 × 2x is 3 × 2 × x.`]],
    before:[{show:'Try x = 10: &nbsp;3(20 + 1) = 3 × 21 = 63',say:`Try x = 10. 2x is 20, so the bracket is 21. 3 × 21 is <b>63</b>.`,try:true,wait:2800}],
    steps:[{act:async()=>{E=expander(650,290,'<span class="o">3</span>(<span class="t">2x</span> + <span class="t">1</span>)');await w0(700);},
        show:'3(2x + 1)',say:`Two terms inside: <b>2x</b> and <b>1</b>.`},
      {act:()=>E.hop(0,'6x'),show:'3 × 2x = 6x <i>3 × 2 = 6</i>',say:`3 × 2x: 3 × 2 is 6, and the x stays. So <b>6x</b>.`,wait:2400},
      {act:()=>E.hop(1,'+ 3'),show:'3 × 1 = 3',say:`3 × 1 is <b>3</b>. Don't forget this one!`},
      {show:'= 6x + 3',say:`So the answer is <b>6x + 3</b>.`}],
    answer:'6x + 3',why:'Check with x = 10: 6x + 3 = 60 + 3 = 63. ✔ Not 6x + 1: the 1 must be multiplied too.'});
  await w(1200);clear();
  await teachQ(w,{src:WS+'Q5 e)',q:STEM5+'<br>e) 2(3b − 4)',read:'Multiply out the brackets: 2, bracket 3b − 4.',
    keys:[['− 4',`Watch the <b>minus</b> in front of the 4. It stays with the 4.`]],
    before:[{show:'Try b = 2: &nbsp;2(6 − 4) = 2 × 2 = 4',say:`Try b = 2. 3b is 6, so the bracket is 6 − 4, which is 2. And 2 × 2 is <b>4</b>.`,try:true,wait:3000}],
    steps:[{act:async()=>{E=expander(650,290,'<span class="o">2</span>(<span class="t">3b</span> <span class="t">− 4</span>)');await w0(700);},
        show:'2(3b − 4)',say:`Two terms: <b>3b</b>, and <b>minus 4</b>.`},
      {act:()=>E.hop(0,'6b'),show:'2 × 3b = 6b <i>2 × 3 = 6</i>',say:`2 × 3b: 2 × 3 is 6, so <b>6b</b>.`},
      {act:()=>E.hop(1,'− 8','#e04848'),show:'2 × 4 = 8 <i>the minus stays</i>',say:`2 × 4 is 8, and the minus stays: <b>minus 8</b>.`,wait:2400},
      {show:'= 6b − 8',say:`So the answer is <b>6b − 8</b>.`}],
    answer:'6b − 8',why:'Check with b = 2: 6b − 8 = 12 − 8 = 4. ✔ The minus inside the bracket stays a minus.'});
  await w(1500);}},

/* 5 */ {t:'Three terms',run:async w=>{
  say(`Some brackets hold <b>three terms</b>. Then you need <b>three arrows</b>. Don't miss any!`);
  await w(2600);
  let E;
  await teachQ(w,{src:WS+'Q5 d)',q:STEM5+'<br>d) 6(4z + 7v + 9)',read:'Multiply out the brackets: 6, bracket 4z + 7v + 9.',
    keys:[['4z + 7v + 9',`Three terms: <b>4z</b>, <b>7v</b> and <b>9</b>. All three get multiplied by 6.`]],
    before:[{show:'Try z = 1, v = 1: &nbsp;6(4 + 7 + 9) = 6 × 20 = 120',say:`Try z = 1 and v = 1. The bracket is 4 + 7 + 9, which is 20. 6 × 20 is <b>120</b>.`,try:true,wait:3000}],
    steps:[{act:async()=>{E=expander(560,290,'<span class="o">6</span>(<span class="t">4z</span> + <span class="t">7v</span> + <span class="t">9</span>)',38);await w0(700);},
       say:`Three terms, so three arrows.`},
      {act:()=>E.hop(0,'24z'),show:'6 × 4z = 24z',say:`6 × 4z is <b>24z</b>.`},
      {act:()=>E.hop(1,'+ 42v'),show:'6 × 7v = 42v',say:`6 × 7v is <b>42v</b>.`},
      {act:()=>E.hop(2,'+ 54'),show:'6 × 9 = 54',say:`6 × 9 is <b>54</b>.`},
      {show:'= 24z + 42v + 54',say:`So the answer is <b>24z + 42v + 54</b>.`}],
    answer:'24z + 42v + 54',why:'Check with z = 1, v = 1: 24 + 42 + 54 = 120. ✔'});
  await w(1200);clear();
  await teachQ(w,{src:WS+'Q5 l)',q:STEM5+'<br>l) 9(5 + 3h − 4i)',read:'Multiply out the brackets: 9, bracket 5 + 3h − 4i.',
    keys:[['5 + 3h − 4i',`Three terms again. The last one, <b>4i</b>, has a minus in front.`]],
    before:[{show:'Try h = 1, i = 1: &nbsp;9(5 + 3 − 4) = 9 × 4 = 36',say:`Try h = 1 and i = 1. The bracket is 5 + 3 − 4, which is 4. 9 × 4 is <b>36</b>.`,try:true,wait:3000}],

  const R=[[WS+'Q3 e)',STEM3+'<br>e) 6(d − 9)','Expand the brackets: 6, bracket d − 9.',['6d','d','−','+','54','9','15'],[['6d','−','54']],'6d − 54',`6 × d is 6d. 6 × 9 is 54, and the minus stays.`],
    [WS+'Q5 g)',STEM5+'<br>g) 6(5d − 1)','Multiply out the brackets: 6, bracket 5d − 1.',['30d','11d','5d','−','+','6','1'],[['30d','−','6']],'30d − 6',`6 × 5d is 30d. 6 × 1 is 6, and the minus stays.`],
    [WS+'Q5 j)',STEM5+'<br>j) 5(3b + 4g)','Multiply out the brackets: 5, bracket 3b + 4g.',['15b','8b','4g','20g','+','−','35bg'],[['15b','+','20g'],['20g','+','15b']],'15b + 20g',`5 × 3b is 15b, and 5 × 4g is 20g. b and g can't join.`]];
