/* A place-value table. ints = whole-number columns (1-3), decs = decimal columns (1-4).
   put(row,'3.21') slides the digits in, lined up by the decimal point; pad(row,n) adds green zeros
   to make n decimal places; glow(col) lights up one column; tick(row) marks a row. Column 0 is the leftmost. */
function pvTable(x,y,{ints=1,decs=3,rows=2,cw=52}={}){
  const IL=['Hundreds','Tens','Ones'].slice(3-ints),DL=[frac(1,10),frac(1,100),frac(1,1000),frac(1,10000)].slice(0,decs);
  const cols=[...IL.map(l=>({l,w:cw})),{l:'',w:20,pt:1},...DL.map(l=>({l,w:cw}))];
  let cx=8;cols.forEach(c=>{c.x=cx;cx+=c.w;});
  const W=cx+8,H=50+rows*58+6;
  const t=mk('',`left:${x}px;top:${y}px;width:${W}px;height:${H}px;background:#fff;border:3px solid #f7d3b5;border-radius:16px;box-shadow:0 4px 0 #f7d3b5`);
  cols.forEach((c,i)=>{if(!c.pt)mk('',`left:${c.x}px;top:6px;width:${c.w}px;height:40px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:${i<ints?12:15}px;font-weight:800;color:#c4520e`,c.l,t);});
  for(let r=0;r<rows;r++)mk('',`left:6px;top:${48+r*58}px;width:${W-12}px;height:2px;background:#f2e3d6`,'',t);
  const cells=[...Array(rows)].map(()=>({}));let g=null;
  const cell=(r,i,txt,col)=>mk('mx',`left:${cols[i].x}px;top:${52+r*58}px;width:${cols[i].w}px;height:52px;display:flex;align-items:center;justify-content:center;font-size:34px;color:${col}`,txt,t);
  return{el:t,W,H,
    put:async(r,s,col='#2c66cf')=>{const [a,b='']=s.split('.');const es=[];
      [...a].forEach((d,k)=>es.push([ints-1-(a.length-1-k),d]));
      if(s.includes('.'))es.push([ints,'.']);
      [...b].forEach((d,k)=>es.push([ints+1+k,d]));
      for(const [i,d] of es){const e=cell(r,i,d,col);cells[r][i]=e;an(e,[{opacity:0,transform:'translateY(-40px)'},{opacity:1,transform:'none'}],{duration:450});beep(480+i*40,.05);await w0(160);}},
    pad:(r,n)=>{for(let i=ints+1;i<=ints+n;i++)if(!cells[r][i]){const e=cell(r,i,'0','#18a058');cells[r][i]=e;pop(e);}beep(820,.08);},
    glow:(i,col='#ffd84d')=>{if(g)g.remove();g=mk('',`left:${cols[i].x}px;top:4px;width:${cols[i].w}px;height:${H-12}px;border-radius:10px;background:${col};opacity:.5`,'');t.insertBefore(g,t.firstChild);pop(g);beep(300,.08);return g;},
    tick:(r,txt='✅')=>{const e=mk('',`left:${W+2}px;top:${60+r*58}px;font-size:28px`,txt,t);pop(e);return e;}};}

/* two tiles and a sign between them (the crocodile scene) */
function numTile(x,y,txt,col='#2c66cf'){const e=mk('mx',`left:${x}px;top:${y}px;width:200px;height:120px;border-radius:24px;background:#fff;border:4px solid ${col};color:${col};font-size:64px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 ${col}55`,txt);pop(e);return e;}

/* a number line from a to b (in steps of `step`), labelled every `every` ticks */
function numLine(x,y,wd,a,b,step,every,fs=13){const n=Math.round((b-a)/step),dx=wd/n;
  mk('',`left:${x}px;top:${y}px;width:${wd}px;height:4px;border-radius:2px;background:#1f2433`);
  for(let i=0;i<=n;i++){const big=i%every===0;mk('',`left:${x+i*dx-1}px;top:${y-(big?9:5)}px;width:2px;height:${big?22:14}px;background:#1f2433`);
    if(big)mk('',`left:${x+i*dx-24}px;top:${y+16}px;width:48px;text-align:center;font-size:${fs}px;font-weight:800;color:#5a5f70`,+(a+i*step).toFixed(3));}
  return v=>x+(v-a)/step*dx;}
function dot(x,y,col){const d=mk('',`left:${x-10}px;top:${y-8}px;width:20px;height:20px;border-radius:50%;background:${col};border:3px solid #fff;box-shadow:0 0 0 3px ${col}`);pop(d);beep(700,.08);return d;}

/* 1 */ {t:'The place-value table',run:async w=>{
  say(`To compare decimals we use a <b>place-value table</b>. Each column is worth <b>ten times less</b> than the column on its left.`);
  await w(3200);
  const T=pvTable(332,14,{ints:2,decs:3});pop(T.el);await w(600);
  point(T.el.children[1]);T.glow(1);
  say(`This is the <b>ones</b> column. After the decimal point come the <b>tenths</b>, the <b>hundredths</b> and the <b>thousandths</b>.`);
  await w(2600);T.glow(3);await w(800);T.glow(4);await w(800);T.glow(5);await w(1200);
  say(`Let's compare <b>5.3</b> and <b>5.17</b>. The decimal points go in the <b>same column</b>, one above the other.`);
  await T.put(0,'5.3');await w(600);await T.put(1,'5.17','#e06a1b');await w(2400);
  const S=[];let y=210;const line=(h,cls='mx-step')=>{const e=mk(cls,`left:200px;top:${y}px;max-width:620px`,h);pop(e);point(e);y+=58;S.push(e);return e;};
  T.glow(1);line('Ones: <b>5</b> and <b>5</b> <i>the same, so move right</i>');
  say(`Start on the <b>left</b>. Ones: 5 and 5. They're the same, so we move one column to the right.`);
  await w(3000);
  T.glow(3);line('Tenths: <b>3</b> and <b>1</b> <i>different: this column decides!</i>');
  say(`Tenths: 3 and 1. They're different, so this column <b>decides</b>. 3 tenths is more than 1 tenth.`);
  await w(3000);
  T.tick(0,'⭐');line('So <b>5.3</b> is bigger than 5.17');
  say(`So <b>5.3</b> is bigger, even though 5.17 has more digits. We stop at the <b>first column that is different</b>.`);
  await w(3200);
  T.pad(0,2);line('Trick: 5.3 = 5.3<b style="color:#18a058">0</b> <i>30 hundredths beat 17</i>');
  say(`A handy trick: fill the gap with a <b>zero</b>. 5.3 is the same as 5.30. Now 30 hundredths beats 17 hundredths.`);
  await w(3400);
  say(`So: line up the points, add zeros to make them the <b>same length</b>, and compare from the <b>left</b>.`);
  await w(3000);}},

/* 2 */ {t:'Which is the smallest?',run:async w=>{

  await teachQ(w,{...LAY,src:WS+'Q1 a)',q:STEM1+'<br>a) 13.5, 9.99',read:'Write down which is the smallest decimal number: 13.5 or 9.99.',

        show:'Line up the decimal points',say:`Put both numbers in the table, with the decimal points lined up. Notice 9.99 has <b>no tens</b>.`,wait:2600},
      {act:async()=>{T.glow(0);},show:'Tens: <b>1</b> and <b>0</b> <i>this column decides</i>',say:`Start on the left. Tens: 13.5 has <b>one ten</b>, 9.99 has <b>none</b>. So 9.99 is smaller.`,wait:2800},

    steps:[{act:async()=>{T=pvTable(596,20,{ints:1,decs:2});pop(T.el);await w(400);await T.put(0,'3.4');await T.put(1,'3.21','#e06a1b');},
        show:'Ones: <b>3</b> and <b>3</b> <i>the same</i>',say:`Line them up. Ones: 3 and 3. The same, so move right.`,wait:2400},
      {act:async()=>{T.glow(2);},show:'Tenths: <b>4</b> and <b>2</b> <i>this decides</i>',say:`Tenths: 4 and 2. Different! 2 tenths is less than 4 tenths, so 3.21 is smaller.`,wait:2800},
      {act:async()=>{T.pad(0,2);T.glow(3,'#bfeacd');T.tick(1);},show:'Check: 3.4<b style="color:#18a058">0</b> and 3.21',say:`Check with the zero trick: 3.4 is 3.40. And 21 is less than 40. ✔`,wait:2600}],

  await w(1500);}},

/* 5 */ {t:'Zoom in on the number line',run:async w=>{
  say(`A <b>number line</b> shows it too: the further <b>right</b>, the bigger the number. We can zoom in between decimals!`);

/* 6 */ {t:'Equal or not equal?',run:async w=>{
  say(`Last sign: <b>equals</b>, or <b>not equal</b>. Some decimals look different but are really the <b>same</b> number!`);
  await w(3000);
  const X=180,Y=120;
  mk('',`left:${X}px;top:${Y}px;width:600px;height:70px;border-radius:10px;background:#fff;border:3px solid #9aa3b5`);
  const sh=mk('',`left:${X+3}px;top:${Y+3}px;width:120px;height:64px;background:#5d9cf5;transform-origin:0 50%`);an(sh,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:900});
  for(let i=1;i<10;i++)mk('',`left:${X+3+i*60}px;top:${Y+3}px;width:2px;height:64px;background:#1f2433`);
  const l1=mk('mx-step',`left:${X}px;top:${Y+90}px`,'2 tenths = <b>0.2</b>');pop(l1);point(l1);
  say(`Here's one whole bar cut into <b>10</b> equal parts. 2 parts are blue: 2 tenths, or <b>0.2</b>.`);
  await w(3200);
  const thin=[];for(let i=0;i<10;i++)for(let j=1;j<10;j++)thin.push(mk('',`left:${X+3+i*60+j*6}px;top:${Y+3}px;width:1px;height:64px;background:#1f2433;opacity:0`));
  thin.forEach((e,k)=>an(e,[{opacity:0},{opacity:.45}],{duration:400,delay:k*6}));await w(1400);
  const l2=mk('mx-step',`left:${X}px;top:${Y+160}px`,'20 hundredths = <b>0.20</b>');pop(l2);point(l2);
  say(`Now cut every part into 10 again. That makes 100 tiny parts. The blue covers <b>20</b> of them: 20 hundredths, or <b>0.20</b>.`);
  await w(3400);
  const l3=mk('mx',`left:${X}px;top:${Y+240}px;width:600px;text-align:center;font-size:52px;color:#18a058`,'0.2 = 0.20');pop(l3);point(l3);yay();
  say(`The blue part didn't change! So <b>0.2 equals 0.20</b>. A zero at the <b>end</b>, after the decimal point, changes nothing.`);
  await w(3400);clear();
  let T;
  await teachQ(w,{...LAY,src:WS+'Q5 a)',q:STEM5+'<br>a) 4.2 ☐ 4.20',read:'Write the correct sign, equals or not equal, between 4.2 and 4.20.',
    keys:[['≠',`This sign means <b>not equal</b>. The line through it says no!`]],
    before:[{show:'Remember: 0.2 = 0.20',say:`Remember the bar: 2 tenths is the same as 20 hundredths.`,try:true,wait:2400}],
    steps:[{act:async()=>{T=pvTable(596,20,{ints:1,decs:2});pop(T.el);await w(400);await T.put(0,'4.2');await T.put(1,'4.20','#e06a1b');},
        show:'Ones <b>4</b> and <b>4</b>, tenths <b>2</b> and <b>2</b>',say:`Line them up. Ones: 4 and 4. Tenths: 2 and 2. The same!`,wait:2600},
      {act:async()=>{T.pad(0,2);T.glow(3,'#bfeacd');},show:'4.2 = 4.2<b style="color:#18a058">0</b>',say:`4.20 just has a zero on the end. Add the same zero to 4.2 and they match exactly.`,wait:2600}],
    answer:'4.2 = 4.20',why:'A zero at the end, after the decimal point, does not change the value. ✔'});
  await w(1200);clear();
  await teachQ(w,{...LAY,src:WS+'Q5 c)',q:STEM5+'<br>c) 0.340 ☐ 0.304',read:'Write the correct sign, equals or not equal, between 0.340 and 0.304.',
    keys:[['≠',`<b>Not equal</b> means the two numbers have different values.`]],
    before:[{show:'0.340 = 0.34 <i>end zero: no change</i>',say:`First, the zero at the <b>end</b> of 0.340 changes nothing. 0.340 is the same as 0.34.`,try:true,wait:2600}],
    steps:[{act:async()=>{T=pvTable(596,20,{ints:1,decs:3});pop(T.el);await w(400);await T.put(0,'0.340');await T.put(1,'0.304','#e06a1b');},
        show:'Tenths: <b>3</b> and <b>3</b> <i>the same</i>',say:`Line them up. Ones: 0 and 0. Tenths: 3 and 3. The same so far.`,wait:2600},
      {act:async()=>{T.glow(3);},show:'Hundredths: <b>4</b> and <b>0</b> <i>different!</i>',say:`Hundredths: 4 and 0. Different! The zero in 0.304 is in the <b>middle</b>, and it pushes the 4 along.`,wait:2800},
      {show:'0.340 ≠ 0.304',say:`So they are <b>not equal</b>. 0.340 is the bigger one.`}],
    answer:'0.340 ≠ 0.304',why:'A zero at the end changes nothing, but a zero in the middle moves the digits and changes the value. ✔'});
  await w(1500);}},

/* 7 */ {t:'Tap the bigger number',run:async w=>{
  const R=[['0.45','0.5',1,'0.50 &gt; 0.45','0.5 is 0.50, and 50 hundredths is more than 45 hundredths.'],
    ['7.8','7.08',0,'7.80 &gt; 7.08','Tenths: 8 is more than 0. So 7.8 is bigger.'],
    ['1.29','1.3',1,'1.30 &gt; 1.29','Tenths: 3 is more than 2. The 9 comes too late to matter!'],
    ['6.1','6.099',0,'6.100 &gt; 6.099','Tenths: 1 is more than 0. So 6.1 is bigger.'],
    ['0.07','0.7',1,'0.70 &gt; 0.07','7 tenths is much more than 7 hundredths.']];
  say(`Your turn! Two numbers will appear. <b>Tap the bigger one</b>. Remember: line up the points and compare from the left.`);
  await w(3200);
  let right=0;
  for(let i=0;i<R.length;i++){stage.innerHTML='';const [l,r,a,show,why]=R[i];
    mk('ex-head','',`👆 Tap the bigger number · ${i+1} of ${R.length}`);
    let picked=-1;const B=[l,r].map((t,k)=>{const b=btn('mx-tile',`left:${110+k*440}px;top:110px;width:300px;height:150px;font-size:66px;border-radius:26px`,t,()=>{if(picked<0)picked=k;});pop(b,k*150);return b;});
    say(`Which is bigger: <b>${l}</b> or <b>${r}</b>?`);
    window.AUTOPLAY=()=>{if(picked<0)picked=i<3?a:1-a;};
    await w.until(()=>picked>=0);window.AUTOPLAY=null;
    const ok=picked===a;if(ok){right++;yay();confetti(30);}else{boo();shake(B[picked]);}
    B[a].style.borderColor='#18a058';B[a].style.background='#e6f7ee';if(!ok){B[picked].style.borderColor='#e04848';B[picked].style.background='#fdecec';}
    const s=mk('mx-step',`left:110px;top:300px`,show);pop(s);point(s);
    const e=mk('mx-why','left:110px;top:370px;width:740px','💡 '+why);pop(e);
    say((ok?'Yes! ':'Not quite. ')+why);await w(3000);}
  stage.innerHTML='';
  const s=mk('','left:180px;top:150px;width:600px;text-align:center',`<div style="font-size:70px">🏅</div><div style="font-size:30px;font-weight:800;color:#7a2e00;margin-top:6px">You got ${right} of ${R.length}!</div>`);pop(s);
  if(right===R.length){yay();confetti(100);}
  say(right===R.length?`All ${R.length} right! You're a decimal detective.`:`Good effort! Press Replay to try again.`);
  await w(2500);}},

/* 8 */ {t:'Sort: equal or not?',run:async w=>{
  const r=await sortGame(w,{bins:['= 0.6 (equal)','≠ 0.6 (not equal)'],colors:['#45c288','#f5a54a'],top:200,
    items:[['0.60',0],['0.600',0],['0.6000',0],['0.06',1],['6.0',1],['0.606',1],['0.006',1],['0.16',1]],
    intro:`Which cards are <b>equal to 0.6</b>? Tap a card, then tap its box. Press <b>Check</b> when you're done.`});
  say(r.ok===r.total?`Perfect! Every card is in the right box.`:`You got ${r.ok} of ${r.total}. The red cards are in the wrong box. Let's see why.`);
  await w(2600);
  say(`<b>0.60</b>, <b>0.600</b> and <b>0.6000</b> just have zeros on the <b>end</b>. They all equal 0.6.`);await w(3000);
  say(`<b>0.06</b> and <b>0.006</b> have zeros in <b>front</b> of the 6, which moves it. <b>6.0</b> is six whole ones. Not equal!`);await w(3200);
  say(`And <b>0.606</b> and <b>0.16</b> have extra digits that are not zeros, so they're different numbers too.`);
  await w(3000);}},
