<script>
/* Maths Lesson 15 · Chapter 10 · Percentages, fractions and decimals: Exercise 10.1 (Q2, Q4, Q5, Q9) and Exercise 10.2 (Q2, Q5, Q9).
   Taught with teachQ (maths.js): question first, read aloud, key words, an easy number first, "Show me",
   then the working one line at a time, the answer and why. The rest are in the two Exam checks. */
const WS1='Worksheet · Ex 10.1 · ',WS2='Worksheet · Ex 10.2 · ';
const STEM2='Write these percentages as fractions. Write your answers in the simplest form.';
const STEM4='Write these percentages as a decimal and as a fraction.';
const STEM5='Write these fractions as percentages.';
const STEM102='Write these percentages as decimals and as fractions. Write each in its simplest form.';
const STEM9='Write each of these mixed numbers as a percentage.';
const w0=ms=>new Promise(r=>setTimeout(r,ms));
const clear=keep=>[...stage.children].forEach(e=>{if(!keep||!keep.includes(e))e.remove();});
/* the first free line under the question card */
const below=()=>{const c=stage.querySelector('.ws-card');return c?c.offsetTop+c.offsetHeight+12:150;};

/* a 10 × 10 hundred square; shade(n) colours n small squares (n may be 7.5), where(fn) colours the squares fn(col,row) picks */
function hsq(x,y,c=24,g=2){const W=10*c+9*g;
  const box=mk('',`left:${x}px;top:${y}px;width:${W}px;height:${W}px`);pop(box);
  const C=[...Array(100)].map((_,i)=>mk('hc',`left:${(i%10)*(c+g)}px;top:${Math.floor(i/10)*(c+g)}px;width:${c}px;height:${c}px`,'',box));
  let F=[];
  const fill=async(list,col)=>{list.forEach(([i,f],k)=>{const s=mk('',`left:0;top:0;width:${f*100}%;height:100%;background:${col}`,'',C[i]);F.push(s);
      an(s,[{opacity:0,transform:'scale(.2)'},{opacity:1,transform:'none'}],{duration:300,delay:k*16});});
    beep(620,.06);await w0(list.length*16+400);};
  return{box,W,
    shade:(n,col='#f5a54a')=>{const L=[];for(let i=0;i<Math.ceil(n);i++)L.push([i,Math.min(1,n-i)]);return fill(L,col);},
    where:(fn,col='#f5a54a')=>fill([...Array(100).keys()].filter(i=>fn(i%10,Math.floor(i/10))).map(i=>[i,1]),col),
    mid:()=>{const l=mk('',`left:${5*(c+g)-g/2-2}px;top:-4px;width:4px;height:${W+8}px;background:#7a2e00;border-radius:2px`,'',box);pop(l);},
    clear:()=>{F.forEach(e=>e.remove());F=[];}};}

/* a conversion ladder: boxes joined by arrows, e.g. 60%  →out of 100→  60/100  →÷10→  6/10 */
function ladder(x,y){let cx=x;return{
  box:async(html,col)=>{const b=mk('cbox',`left:${cx}px;top:${y}px`+(col?`;color:${col};border-color:${col}`:''),html);pop(b);await w0(40);cx+=b.offsetWidth;point(b);beep(640,.07);await w0(350);return b;},
  arrow:async(t,b='')=>{const a=mk('carr',`left:${cx}px;top:${y}px`,`<span>${t}</span><b>➜</b><span>${b}</span>`);cx+=76;
    await an(a,[{opacity:0,transform:'translateX(-20px)'},{opacity:1,transform:'none'}],{duration:500});beep(500,.05);return a;}};}

/* a place-value table (tens to thousandths); shift() divides by 100: every digit moves two places right, then zeros fill the gaps */
function pvt(x,y){const CW=78,PW=24,cx=p=>p>=0?(1-p)*CW:2*CW+PW+(-p-1)*CW;
  const box=mk('',`left:${x}px;top:${y}px;width:${5*CW+PW}px;height:96px`);pop(box);
  [[1,'tens'],[0,'ones'],[-1,'tenths'],[-2,'hundredths'],[-3,'thousandths']].forEach(([p,n])=>{mk('pvh',`left:${cx(p)}px;width:${CW}px`,n,box);mk('pvc',`left:${cx(p)+3}px;width:${CW-6}px`,'',box);});
  mk('pvd',`left:${2*CW}px;width:${PW}px;color:#e04848`,'.',box);
  let D=[];const add=(ch,p,col='#7a2e00')=>{const el=mk('pvd',`left:${cx(p)}px;width:${CW}px;color:${col}`,ch,box);D.push({el,p});return el;};
  return{box,
    set:s=>{D.forEach(d=>d.el.remove());D=[];const [ip,dp='']=s.split('.');
      [...ip].forEach((ch,j)=>pop(add(ch,ip.length-1-j)));[...dp].forEach((ch,j)=>pop(add(ch,-(j+1))));},
    shift:async()=>{beep(520,.08);
      await Promise.all(D.map(d=>an(d.el,[{transform:'none'},{transform:`translateX(${cx(d.p-2)-cx(d.p)}px)`}],{duration:1000})));
      D.forEach(d=>{d.p-=2;d.el.style.left=cx(d.p)+'px';d.el.getAnimations().forEach(a=>a.cancel());});
      const hi=Math.max(...D.map(d=>d.p));
      for(let p=0;p>hi;p--){pop(add('0',p,'#18a058'));beep(760,.06);await w0(300);}}};}

/* a bar for an amount; split(n) cuts it into n equal parts, shade(k) colours the next k parts (k may be 0.5) */
function bar(x,y,wd,label,h=50){
  const b=mk('',`left:${x}px;top:${y}px;width:${wd}px;height:${h}px;border-radius:12px;background:#fff;border:3px solid #7a2e00;overflow:hidden`);pop(b);
  const lab=mk('mx','left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px',label,b);
  let E=[],parts=1,sh=0;const iw=wd-6;
  return{b,pw:()=>iw/parts,
    split:async(n,each,fs=18)=>{E.forEach(e=>e.remove());E=[];sh=0;lab.style.display='none';parts=n;const pw=iw/n;
      for(let i=1;i<n;i++){const l=mk('',`left:${i*pw-1}px;top:0;width:2px;height:100%;background:#7a2e00;z-index:2`,'',b);E.push(l);
        an(l,[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:400,delay:i*45});}
      for(let i=0;i<n;i++)E.push(mk('mx',`left:${i*pw}px;top:0;width:${pw}px;height:100%;display:flex;align-items:center;justify-content:center;font-size:${fs}px;z-index:3;white-space:nowrap`,each,b));
      await w0(n*45+500);beep(600,.08);},
    shade:async k=>{const pw=iw/parts,s0=sh,e0=sh+k;
      for(let i=Math.floor(s0);i<e0;i++){const l=Math.max(i,s0),r=Math.min(i+1,e0);
        const s=mk('',`left:${l*pw}px;top:0;width:${(r-l)*pw}px;height:100%;background:rgba(224,106,27,.5);z-index:1`,'',b);E.push(s);
        an(s,[{opacity:0},{opacity:1}],{duration:400});beep(640+i*30,.06);await w0(380);}
      sh=e0;}};}

Lesson.start(Object.assign({}, MATHS, {
  id:'m15', num:15, part:'Chapter 10', emoji:'💯', title:'Percentages, fractions and decimals',
  intro:`Hi! I'm <b>Pi the Robot</b> 🤖 Let's swap between percentages, fractions and decimals. Press <b>Start</b>!`,
  scenes:[
/* 0 */ {t:'Per cent means out of 100',run:async w=>{
  say(`Hi! I'm <b>Pi the Robot</b>. Today: <b>percentages</b>, <b>fractions</b> and <b>decimals</b>. Three ways to write the same amount!`);
  await w(2800);
  const S=hsq(40,40,34,2);point(S.box);
  const tg=mk('tag','left:40px;top:410px;background:#ffe6cf;color:#7a2e00;font-size:18px','100 small squares');pop(tg);
  say(`This big square is made of <b>100</b> small squares. <b>Per cent</b> means <b>out of 100</b>.`);
  await w(3000);
  const L0=mk('mx-step','left:440px;top:40px','💯 per cent = <b>out of 100</b>');pop(L0);point(L0);
  await w(1800);
  say(`Let's colour in <b>50</b> of the small squares.`);
  await S.shade(50);await w(1800);
  const L1=mk('mx-step','left:440px;top:110px','50 out of 100 = <b>50%</b>');pop(L1);point(L1);
  say(`50 out of 100 is <b>50 percent</b>.`);
  await w(2400);
  const L2=mk('mx-step','left:440px;top:180px',`Fraction: 50% = ${frac(50,100)} = <b>${frac(1,2)}</b>`);pop(L2);point(L2);
  say(`As a fraction, it's 50 over 100. That's the same as <b>one half</b>. Look: half the square is coloured.`);
  await w(3000);
  const L3=mk('mx-step','left:440px;top:270px','Decimal: 50 ÷ 100 = <b>0.5</b>');pop(L3);point(L3);
  say(`As a decimal, divide 50 by 100. You get <b>0.5</b>.`);
  await w(2800);
  const eq=mk('tag','left:440px;top:350px;background:#e6f7ee;color:#0f7a40;font-size:22px;border:3px solid #18a058',`50% = ${frac(1,2)} = 0.5`);pop(eq);point(eq);
  say(`50 percent, one half and 0.5 are the <b>same amount</b>, written three ways.`);
  await w(3000);
  clear();
  const B=[[30,'Fraction',frac(1,2),'#2c66cf'],[380,'Percentage','50%','#e06a1b'],[730,'Decimal','0.5','#18a058']].map(([x,t,v,c])=>{
    const b=mk('fbox',`left:${x}px;top:180px;background:${c}`,`<div class="t">${t}</div><div class="v">${v}</div>`);return b;});
  pop(B[1]);point(B[1]);
  say(`Here's your <b>map</b>. In the middle: the <b>percentage</b>.`);await w(2200);
  pop(B[0]);point(B[0]);say(`On the left: the <b>fraction</b>.`);await w(1800);
  pop(B[2]);point(B[2]);say(`On the right: the <b>decimal</b>.`);await w(1800);
  const A1=mk('marr','left:580px;top:150px','<span>÷ 100</span><b>➜</b>');pop(A1);point(A1);
  say(`Percentage to decimal: <b>divide by 100</b>.`);await w(2200);
  const A2=mk('marr','left:580px;top:270px','<b>⬅</b><span>× 100</span>');pop(A2);point(A2);
  say(`Decimal to percentage: <b>times by 100</b>.`);await w(2200);
  const A3=mk('marr','left:230px;top:150px','<span>over 100, simplify</span><b>⬅</b>');pop(A3);point(A3);
  say(`Percentage to fraction: write it <b>over 100</b>, then <b>simplify</b>.`);await w(2600);
  const A4=mk('marr','left:230px;top:270px','<b>➜</b><span>make it out of 100</span>');pop(A4);point(A4);
  say(`Fraction to percentage: make the bottom number <b>100</b>.`);await w(2600);
  const tip=mk('tag','left:230px;top:380px;width:500px;text-align:center;background:#ffe680;color:#7a2e00;font-size:20px','Keep this map in your head! 🗺️');pop(tip);
  say(`Keep this map in your head. Let's use it on the worksheet!`);
  await w(2600);}},

/* 1 */ {t:'Percentages to fractions',run:async w=>{
  say(`First: turning a percentage into a <b>fraction</b> in its <b>simplest form</b>. One question at a time.`);
  await w(2600);
  let S,L;
  await teachQ(w,{src:WS1+'Q2 a)',q:STEM2+'<br>a) 60%',read:'Write these percentages as fractions. Write your answers in the simplest form. a) 60%.',
    keys:[['fractions',`A <b>fraction</b> has a top number and a bottom number, like ${frac(3,5)}.`],
      ['simplest form',`<b>Simplest form</b> means divide the top and the bottom by the same number, until you can't any more.`]],
    workX:330,workY:272,
    before:[{act:async()=>{S=hsq(40,below(),24,2);await w0(400);await S.shade(50);},show:`Try 50%: ${frac(50,100)} = ${frac(1,2)} <i>÷ 50 top and bottom</i>`,
      say:`Let's try an easy one first. 50 percent is 50 out of 100. Divide the top and the bottom by 50, and you get one half.`,try:true,wait:2800}],
    steps:[{act:async()=>{S.clear();await S.shade(60);},say:`Now 60 percent. That's <b>60</b> small squares out of 100.`,wait:2200},
      {act:async()=>{L=ladder(330,below());await L.box('60%');},say:`Start with 60 percent.`,wait:1600},
      {act:async()=>{await L.arrow('over 100');await L.box(frac(60,100));},say:`Per cent means out of 100, so write it as <b>60 over 100</b>.`,wait:2400},
      {act:async()=>{await L.arrow('÷ 10','÷ 10');await L.box(frac(6,10));},say:`Both numbers end in zero. Divide the top <b>and</b> the bottom by <b>10</b>. That gives 6 over 10.`,wait:2800},
      {act:async()=>{await L.arrow('÷ 2','÷ 2');await L.box(frac(3,5),'#18a058');},say:`6 and 10 are both even. Divide the top and the bottom by <b>2</b>. That gives <b>3 over 5</b>.`,wait:2800},
      {say:`Can 3 and 5 both be divided by the same number? Only by 1. So we stop: it's in its simplest form.`,wait:2600}],
    answer:frac(3,5),why:'Check: one fifth of 100 is 20, so three fifths is 3 × 20 = 60. ✔'});
  await w(1200);clear();
  await teachQ(w,{src:WS1+'Q2 d)',q:STEM2+'<br>d) 64%',read:'Write these percentages as fractions. Write your answers in the simplest form. d) 64%.',
    keys:[['simplest form',`Remember: <b>simplest form</b> means keep dividing the top and the bottom until you can't.`]],
    workX:330,workY:272,
    before:[{act:async()=>{S=hsq(40,below(),24,2);await w0(400);await S.shade(20);},show:`Try 20%: ${frac(20,100)} = ${frac(1,5)} <i>÷ 20 top and bottom</i>`,
      say:`Try an easy one first. 20 percent is 20 over 100. Divide the top and the bottom by 20: <b>one fifth</b>.`,try:true,wait:2800}],
    steps:[{act:async()=>{S.clear();await S.shade(64);},say:`Now 64 percent: <b>64</b> small squares out of 100.`,wait:2200},
      {act:async()=>{L=ladder(330,below());await L.box('64%');await L.arrow('over 100');await L.box(frac(64,100));},say:`Write it out of 100: <b>64 over 100</b>.`,wait:2400},
      {act:async()=>{await L.arrow('÷ 2','÷ 2');await L.box(frac(32,50));},say:`Both numbers are even. Divide the top and the bottom by <b>2</b>: 32 over 50.`,wait:2800},
      {act:async()=>{await L.arrow('÷ 2','÷ 2');await L.box(frac(16,25),'#18a058');},say:`Still both even! Divide by <b>2</b> again: 32 ÷ 2 is 16, and 50 ÷ 2 is 25. <b>16 over 25</b>.`,wait:3000},
      {say:`25 is odd, so we can't halve it. And 16 is not in the 5 times table. So we stop.`,wait:2600}],
    answer:frac(16,25),why:`Check: times the top and the bottom by 4. 16 × 4 = 64 and 25 × 4 = 100. ✔`});
  await w(1500);}},

/* 2 */ {t:'Percentages to decimals',run:async w=>{
  say(`Now percentage to <b>decimal</b>: divide by 100. Every digit moves <b>two places</b> to the right.`);
  await w(3000);
  let P,L;
  await teachQ(w,{src:WS1+'Q4 b)',q:STEM4+'<br>b) 4%',read:'Write these percentages as a decimal and as a fraction. b) 4%.',
    keys:[['decimal',`A <b>decimal</b> has a decimal point, like 0.5. To get it, divide by 100.`],['fraction',`For the <b>fraction</b>, write it over 100, then simplify.`]],
    workX:470,
    before:[{act:async()=>{P=pvt(40,below());await w0(300);P.set('50');await w0(800);await P.shift();},show:'Try 50%: 50 ÷ 100 = 0.5',
      say:`Try an easy one first. 50 percent: divide 50 by 100. The digits jump <b>two places</b> right: 0.50, which is 0.5.`,try:true,wait:3000}],
    steps:[{act:async()=>{P.set('4');await w0(800);await P.shift();},show:'Decimal: 4 ÷ 100 = <b>0.04</b>',
        say:`Now 4 percent. Divide 4 by 100. The 4 jumps two places right, into the <b>hundredths</b>. Zeros fill the gaps: <b>0.04</b>.`,wait:3200},
      {act:async()=>{L=ladder(40,below()+136);await L.box(frac(4,100));},say:`Now the fraction. 4 percent is <b>4 out of 100</b>.`,wait:2200},
      {act:async()=>{await L.arrow('÷ 4','÷ 4');await L.box(frac(1,25),'#18a058');},show:`Fraction: ${frac(4,100)} = <b>${frac(1,25)}</b> <i>÷ 4</i>`,
        say:`Divide the top and the bottom by <b>4</b>. 4 ÷ 4 is 1, and 100 ÷ 4 is 25. So it's <b>1 over 25</b>.`,wait:3000}],
    answer:`0.04 and ${frac(1,25)}`,why:'Careful: 4% is 0.04, not 0.4. Check: 0.04 × 100 = 4. ✔'});
  await w(1200);clear();
  await teachQ(w,{src:WS1+'Q4 a)',q:STEM4+'<br>a) 40%',read:'Write these percentages as a decimal and as a fraction. a) 40%.',
    keys:[['decimal',`For the <b>decimal</b>, divide by 100.`],['fraction',`For the <b>fraction</b>, write it over 100, then simplify.`]],
    workX:470,
    before:[{act:async()=>{P=pvt(40,below());await w0(300);P.set('30');await w0(800);await P.shift();},show:'Try 30%: 30 ÷ 100 = 0.3',
      say:`Try an easy one first. 30 percent: divide by 100 and the digits move two places right. 0.30, which is 0.3.`,try:true,wait:3000}],
    steps:[{act:async()=>{P.set('40');await w0(800);await P.shift();},show:'Decimal: 40 ÷ 100 = <b>0.4</b>',
        say:`Now 40 percent. Divide by 100: 0.40. A zero at the end, after the point, changes nothing. So it's <b>0.4</b>.`,wait:3200},
      {act:async()=>{L=ladder(40,below()+136);await L.box(frac(40,100));},say:`Now the fraction: <b>40 over 100</b>.`,wait:2000},
      {act:async()=>{await L.arrow('÷ 10','÷ 10');await L.box(frac(4,10));},say:`Both end in zero. Divide the top and the bottom by <b>10</b>: 4 over 10.`,wait:2600},
      {act:async()=>{await L.arrow('÷ 2','÷ 2');await L.box(frac(2,5),'#18a058');},show:`Fraction: ${frac(40,100)} = <b>${frac(2,5)}</b> <i>÷ 10, then ÷ 2</i>`,
        say:`Both even. Divide by <b>2</b>: <b>2 over 5</b>. 2 and 5 share nothing else, so stop.`,wait:2800}],
    answer:`0.4 and ${frac(2,5)}`,why:'40% is ten times 4%, so 0.4 is ten times 0.04. ✔'});
  await w(1500);}},

/* 3 */ {t:'Fractions to percentages',run:async w=>{
  say(`Now the other way: <b>fraction to percentage</b>. The trick: make the bottom number <b>100</b>.`);
  await w(2800);
  let S;
  await teachQ(w,{src:WS1+'Q5 a)',q:STEM5+'<br>a) '+frac(1,4),read:'Write these fractions as percentages. a) 1 quarter.',
    keys:[['percentages',`A <b>percentage</b> is out of 100. So we want the bottom number to be <b>100</b>.`]],
    workX:340,
    before:[{act:async()=>{S=hsq(40,below(),24,2);await w0(400);await S.where(c=>c<5);},show:`Try ${frac(1,2)} = ${frac(50,100)} = 50% <i>× 50 top and bottom</i>`,
      say:`Try an easy one first: one half. 2 times 50 is 100, so times the top and the bottom by 50. 50 over 100 is 50 percent.`,try:true,wait:3000}],
    steps:[{act:async()=>{S.clear();await S.where((c,r)=>c<5&&r<5);},say:`Now one quarter. Cut the square into <b>4</b> equal parts. One part is <b>25</b> small squares.`,wait:2800},
      {show:`${frac(1,4)} = ${frac(25,100)} <i>× 25 top and bottom</i>`,say:`4 times 25 is 100. So times the top <b>and</b> the bottom by <b>25</b>: 25 over 100.`,wait:2800},
      {show:`${frac(25,100)} = <b>25%</b>`,say:`25 out of 100 is <b>25 percent</b>.`,wait:2000}],
    answer:'25%',why:'Check with a decimal: 1 ÷ 4 = 0.25, and 0.25 × 100 = 25. ✔'});
  await w(1200);clear();
  await teachQ(w,{src:WS1+'Q5 e)',q:STEM5+'<br>e) '+frac(7,20),read:'Write these fractions as percentages. e) 7 over 20.',

/* 9 */ {t:'Build the answer',run:async w=>{
  const R=[['Write 9% as a decimal.',`Write 9 percent as a decimal.`,['0','.','9','%'],[['0','.','0','9']],'0.09',`9 ÷ 100: the 9 moves two places right, so it's 0.09.`],
    [`Write ${frac(3,4)} as a percentage.`,`Write three quarters as a percentage.`,['7','5','3','4','%'],[['7','5','%']],'75%',`Times the top and the bottom by 25: 75 over 100, which is 75 percent.`],
    ['Write 1.5% as a decimal.',`Write 1.5 percent as a decimal.`,['0','.','1','5'],[['0','.','0','1','5']],'0.015',`1.5 ÷ 100: both digits move two places right, so it's 0.015.`],
    [`Write 2${frac(1,4)} as a percentage.`,`Write 2 and a quarter as a percentage.`,['2','5','1','4','%'],[['2','2','5','%']],'225%',`2 wholes are 200 percent, and a quarter is 25 percent: 225 percent.`]];
  say(`Your turn to build! Read each question, then tap the tiles <b>in order</b>. You can use a tile more than once. Press <b>Check</b> when you're done.`);
  await w(3600);
  let right=0;
  for(let i=0;i<R.length;i++){stage.innerHTML='';const [q,spoken,tiles,answer,model,why]=R[i];
    mk('ex-head','',`🧩 Build it · ${i+1} of ${R.length}`);
    say(spoken);
    const r=await buildExpr(w,{q,tiles,answer,top:44});
    if(r.ok){right++;say(`Yes! <b>${model}</b> is right. ${why}`);}
    else{const s=mk('stamp',`left:300px;top:${r.y+12}px`,'✔ '+model);pop(s);point(s);say(`Not quite. ${why}`);}
    await w(3000);}
  stage.innerHTML='';
  const s=mk('','left:180px;top:150px;width:600px;text-align:center',`<div style="font-size:70px">🧩</div><div style="font-size:30px;font-weight:800;color:#7a2e00;margin-top:6px">You built ${right} of ${R.length}!</div>`);pop(s);
  if(right===R.length){yay();confetti(100);}
  say(right===R.length?`All ${R.length} right! You're a conversion champion.`:`Good effort! Press Replay to build them again.`);
  await w(2500);}},
