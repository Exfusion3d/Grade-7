/* a row of terms; null = an empty box to fill. jump(i,j,label) draws an arc from term i to term j */
function seq(vals,y,{d=104,sz=64,col='#2c66cf',x}={}){const n=vals.length;x=x??480-((n-1)*d+sz)/2;
  const X=i=>x+i*d;
  const B=vals.map((v,i)=>mk('tb',`left:${X(i)}px;top:${y}px;width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px;`+
    (v==null?'background:#fff;border:3px dashed #e06a1b;color:#e06a1b':`background:${col};color:#fff`),v==null?'?':v));
  const show=(i,delay=0)=>{pop(B[i],delay);beep(480+i*50,.06);};
  const jump=async(i,j,lab,c='#18a058')=>{const a=X(Math.min(i,j))+sz/2,wd=Math.abs(j-i)*d;
    const arc=mk('arc',`left:${a}px;top:${y-26}px;width:${wd}px;height:22px;border-color:${c};transform-origin:${j>i?'0':'100%'} 100%`);
    const t=mk('mx',`left:${a+wd/2-40}px;top:${y-56}px;width:80px;text-align:center;font-size:21px;color:${c}`,lab);
    an(arc,[{transform:'scaleX(0)',opacity:0},{transform:'scaleX(1)',opacity:1}],{duration:700});await w0(500);pop(t);beep(640,.06);await w0(500);return[arc,t];};
  const set=(i,v,c='#18a058')=>{B[i].innerHTML=v;Object.assign(B[i].style,{background:c,color:'#fff',border:'none'});pop(B[i]);beep(720,.1);};
  const under=(i,txt,c='#5a5f70')=>{const e=mk('plab',`left:${X(i)-20}px;top:${y+sz+6}px;width:${sz+40}px;color:${c}`,txt);pop(e);return e;};
  return{B,X,show,jump,set,under,all:()=>vals.forEach((v,i)=>show(i,i*120))};}

/* dot pattern n: a chain of n diamonds (3n + 1 dots); the 3 newest dots are orange */
function dotPat(x,y,n,s=30,h=26){const g=mk('',`left:${x}px;top:${y}px;width:${n*s+14}px;height:${2*h+14}px`);
  const P=[];for(let k=0;k<=n;k++)P.push([k*s,h,k===n&&n>1]);
  for(let k=0;k<n;k++){P.push([(k+.5)*s,0,k===n-1&&n>1]);P.push([(k+.5)*s,2*h,k===n-1&&n>1]);}
  P.forEach(([px,py,nw])=>mk('',`left:${px}px;top:${py}px;width:14px;height:14px;border-radius:50%;background:${nw?'#e06a1b':'#2c66cf'}`,'',g));
  pop(g);return g;}
/* square pattern n: squares joined at their corners (3n + 2 squares); the 3 newest are orange */
function sqPat(x,y,n,c=18){const g=mk('',`left:${x}px;top:${y}px;width:${(2*n+1)*c}px;height:${3*c}px`);
  const C=[[0,0],[0,2],[1,1],[2,0],[2,2]].map(p=>[...p,false]);
  for(let m=2;m<=n;m++)[[2*m-1,1],[2*m,0],[2*m,2]].forEach(p=>C.push([...p,m===n]));
  C.forEach(([cx,cy,nw])=>mk('',`left:${cx*c}px;top:${cy*c}px;width:${c}px;height:${c}px;box-sizing:border-box;border:2px solid ${nw?'#a84a0c':'#1d4b9e'};background:${nw?'#f5a54a':'#9cc0f7'}`,'',g));
  pop(g);return g;}
const plab=(x,y,wd,txt)=>{const e=mk('plab',`left:${x}px;top:${y}px;width:${wd}px`,txt);pop(e);return e;};

/* 1 */ {t:'The term-to-term rule',run:async w=>{
  let S;
  await teachQ(w,{src:W1+'Q1 a)',q:S1+'<br>a) 7, 11, 15, 19, . . .',read:'Find the term-to-term rule and the next two terms. 7, 11, 15, 19, and so on.',workY:286,

    before:[{act:async()=>{S=seq(['7','11','15','19',null,null],196);S.all();await w(900);},say:`Here are the terms. The two boxes are the next two terms we need to find.`,wait:2200}],
    steps:[{act:async()=>{for(let i=0;i<3;i++)await S.jump(i,i+1,'+4');},show:'7 → 11 → 15 → 19: each jump is +4',say:`Find the jumps. 7 to 11 is <b>add 4</b>. 11 to 15, add 4. 15 to 19, add 4. Always the same!`,wait:2800},
      {show:'Term-to-term rule: <b>add 4</b>',say:`So the term-to-term rule is <b>add 4</b>.`},
      {act:async()=>{await S.jump(3,4,'+4');S.set(4,'23');await w(700);await S.jump(4,5,'+4');S.set(5,'27');},show:'19 + 4 = 23, 23 + 4 = 27',say:`Next two terms: 19 add 4 is <b>23</b>, and 23 add 4 is <b>27</b>.`,wait:2600}],

/* 2 */ {t:'Sequences that go down',run:async w=>{
  let S;
  await teachQ(w,{src:W1+'Q1 b)',q:S1+'<br>b) 40, 35, 30, 25, . . .',read:'Find the term-to-term rule and the next two terms. 40, 35, 30, 25, and so on.',workY:286,

    before:[{act:async()=>{S=seq(['40','35','30','25',null,null],196,{col:'#6a45d8'});S.all();await w(900);},say:`Here are the terms, getting smaller each time.`,wait:1800}],
    steps:[{act:async()=>{for(let i=0;i<3;i++)await S.jump(i,i+1,'−5','#e06a1b');},show:'Each jump is −5 → rule: <b>subtract 5</b>',say:`40 to 35 is <b>take away 5</b>. 35 to 30, take away 5. 30 to 25, take away 5. The rule is <b>subtract 5</b>.`,wait:3000},
      {act:async()=>{await S.jump(3,4,'−5','#e06a1b');S.set(4,'20');await w(700);await S.jump(4,5,'−5','#e06a1b');S.set(5,'15');},show:'25 − 5 = 20, 20 − 5 = 15',say:`Next two terms: 25 take away 5 is <b>20</b>, then 20 take away 5 is <b>15</b>.`,wait:2600}],

    before:[{act:async()=>{S=seq(['17','14','11','8',null,null],212,{col:'#6a45d8'});S.all();await w(900);},say:`Here are the terms. Find the jump first.`,wait:1800}],

/* 3 */ {t:'Using a rule to make a sequence',run:async w=>{

      {act:async()=>{await S.jump(1,2,'+5');S.set(2,'11');},show:'6 + 5 = 11 <i>3rd term</i>',say:`Third term: 6 add 5 is <b>11</b>.`}],

  await teachQ(w,{src:W1+'Q4 e)',q:S4+'<br>e) 8, '+BOX+', '+BOX+', 32, 40, '+BOX+', '+BOX,read:'Copy this finite sequence and fill in the missing terms. 8, blank, blank, 32, 40, blank, blank.',workY:290,

  await teachQ(w,{src:W1+'Q4 f)',q:S4+'<br>f) '+BOX+', '+BOX+', 28, 23, '+BOX+', '+BOX+', 8',read:'Copy this finite sequence and fill in the missing terms. Blank, blank, 28, 23, blank, blank, 8.',workY:290,

/* 8 */ {t:'Dot patterns',run:async w=>{

/* 9 */ {t:'Square patterns and tables',run:async w=>{
  const X=[40,130,262,430,640];let T=[];

    const r2=[mk('tc h',`left:${x0}px;top:${y+44}px;width:${hw}px;height:44px`,'Number of squares')];
    for(let i=0;i<5;i++){r1.push(mk('tc',`left:${x0+hw+i*cw}px;top:${y}px;width:${cw}px;height:44px`,i+1));

    steps:[{act:async()=>{put(T[1],'5');await w(500);put(T[2],'8');await w(500);put(T[3],'11');},show:'Count: 5, 8, 11 squares',say:`Count the squares: Pattern 1 has <b>5</b>, Pattern 2 has <b>8</b>, Pattern 3 has <b>11</b>.`,wait:2600},
      {act:async()=>{sqPat(X[3],150,4);plab(X[3]-20,210,202,'Pattern 4');sqPat(X[4],150,5);plab(X[4]-20,210,238,'Pattern 5');await w(500);put(T[4],'14');await w(500);put(T[5],'17');},show:'+3 each time: 14, 17',say:`Each pattern adds <b>3 squares</b>. So Pattern 4 has 11 add 3, which is <b>14</b>, and Pattern 5 has <b>17</b>.`,wait:2800}],

    keys:[['Pattern 6',`Pattern 6 comes <b>after</b> Pattern 5, which had 17 squares.`],['Pattern 8',`For Pattern 8, keep going with the rule.`]],
    before:[{act:async()=>{S=seq(['5','8','11','14','17',null,null,null],196);S.all();for(let i=0;i<8;i++)S.under(i,'P'+(i+1),i>4?'#e06a1b':'#5a5f70');await w(900);},
      say:`Here's the sequence with the pattern numbers underneath. P means pattern.`,wait:2200}],
    steps:[{act:async()=>{await S.jump(4,5,'+3');S.set(5,'20');},show:'Pattern 6: 17 + 3 = 20',say:`Pattern 6: 17 add 3 is <b>20</b>.`},
